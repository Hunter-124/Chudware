name: Feature request
description: Suggest a new capability or an improvement to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like Chudware to behave. Mockups or references to other CAD tools are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Part modeling
        - Sketching
        - Assemblies
        - Drawings
        - Simulation
        - Manufacturing / CAM
        - Electronics
        - AI agent
        - Import / export
        - User interface
        - Web app / self-hosting
        - Other
    validations:
      required: true
