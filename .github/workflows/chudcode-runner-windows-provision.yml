# Dispatch on the existing CAD Ryzen runner. Its NETWORK SERVICE account cannot
# install Windows services; a verified interactive administrator performs that
# work in a scheduled task after this runner's current job has exited.
name: chudcode-runner-windows-provision

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Schedule installation or inspect the last recorded outcome
        type: choice
        required: true
        default: provision
        options: [provision, inspect]

permissions:
  contents: read

concurrency:
  group: chudcode-runner-windows-provision
  cancel-in-progress: false

jobs:
  ryzen:
    name: ${{ inputs.mode }} Chudcode Windows runner
    runs-on: [self-hosted, Windows, X64, cloudcastle-ci, cc-win-ryzen]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Inspect sanitized task result and Chudcode service
        if: inputs.mode == 'inspect'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'ryzen-7900x3d' -or $env:COMPUTERNAME -ne 'GARRISONGAMINGP') {
            throw 'Unexpected runner identity; refusing to inspect another host'
          }
          $root = Join-Path $env:ProgramData 'ChudcodeRunnerProvision'
          $pointer = Join-Path $root 'last-run.txt'
          if (-not (Test-Path -LiteralPath $pointer)) { throw 'No provisioning task was scheduled yet' }
          $id = (Get-Content -LiteralPath $pointer -Raw).Trim()
          if ($id -notmatch '^[0-9]+$') { throw 'Invalid provisioning run identifier' }
          $dir = Join-Path $root $id
          $result = Join-Path $dir 'result.txt'
          if (-not (Test-Path -LiteralPath $result)) {
            Write-Host 'No task result yet; ensure the administrator is still logged in and inspect the scheduled task'
            $task = Get-ScheduledTask -TaskName 'ChudcodeRunnerBootstrap' -ErrorAction SilentlyContinue
            if ($task) {
              Write-Host ('Task state: ' + $task.State)
              Get-ScheduledTaskInfo -TaskName $task.TaskName |
                Select-Object LastRunTime, LastTaskResult, NextRunTime | Format-List | Out-String | Write-Host
            }
            # A registration token is valid for only one hour. If the login
            # session vanished and the task never ran, retire the stale task
            # and remove its protected token rather than leaving it on disk.
            $token = Join-Path $dir 'registration-token.txt'
            if ($task -and $task.State -ne 'Running' -and
                (Test-Path -LiteralPath $token) -and
                (Get-Date) -gt (Get-Item -LiteralPath $token).LastWriteTime.AddHours(1)) {
              Unregister-ScheduledTask -TaskName $task.TaskName -Confirm:$false -ErrorAction Stop
              Remove-Item -LiteralPath $token -Force
              throw 'Registration token expired before bootstrap ran; stale task/token removed. Mint a fresh token and dispatch provision again.'
            }
            throw 'Provisioning task has not recorded an outcome'
          }
          $state = (Get-Content -LiteralPath $result -Raw).Trim()
          Write-Host ('Provisioning result: ' + $state)
          if ($state -ne 'SUCCESS') { throw 'Provisioning was not successful; inspect the task outcome locally' }
          $name = 'actions.runner.Hunter-124-chudcode.ryzen-7900x3d-chudcode'
          $service = Get-Service -Name $name -ErrorAction SilentlyContinue
          if (-not $service -or $service.Status -ne 'Running') {
            throw 'Chudcode runner service is not running'
          }
          Write-Host 'Chudcode Windows runner service is running'

      - name: Schedule isolated runner registration under elevated administrator
        if: inputs.mode == 'provision'
        env:
          CHUDCODE_RUNNER_REG_TOKEN: ${{ secrets.CHUDCODE_RUNNER_REG_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'ryzen-7900x3d' -or $env:COMPUTERNAME -ne 'GARRISONGAMINGP') {
            throw 'Unexpected runner identity; refusing to provision another host'
          }
          if (-not $env:CHUDCODE_RUNNER_REG_TOKEN) {
            throw 'Set CAD secret CHUDCODE_RUNNER_REG_TOKEN to a fresh Chudcode repository registration token'
          }
          $user = (Get-CimInstance Win32_ComputerSystem).UserName
          if ($user -ne 'GARRISONGAMINGP\Garrison') {
            throw 'Interactive administrator GARRISONGAMINGP\Garrison is not logged in; refusing to schedule'
          }
          $taskName = 'ChudcodeRunnerBootstrap'
          if (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue) {
            throw 'A prior bootstrap task still exists; inspect it before scheduling another'
          }
          $source = 'C:\actions-runner-cad'
          if (-not (Test-Path -LiteralPath (Join-Path $source 'config.cmd'))) {
            throw 'CAD runner installation is unavailable'
          }
          $root = Join-Path $env:ProgramData 'ChudcodeRunnerProvision'
          if (Test-Path -LiteralPath $root) {
            if ((Get-Item -LiteralPath $root -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) {
              throw 'Provisioning state directory cannot be a reparse point'
            }
          } else {
            New-Item -ItemType Directory -Path $root | Out-Null
          }
          # Only the current runner account, SYSTEM and local administrators may
          # read this directory. No token is passed in task actions or job logs.
          $acl = Get-Acl -LiteralPath $root
          $acl.SetAccessRuleProtection($true, $false)
          foreach ($rule in @($acl.Access)) { $acl.RemoveAccessRuleAll($rule) }
          foreach ($entry in @(@('NT AUTHORITY\NETWORK SERVICE','Modify'),
                             @('BUILTIN\Administrators','FullControl'),
                             @('NT AUTHORITY\SYSTEM','FullControl'))) {
            $rights = [Enum]::Parse([Security.AccessControl.FileSystemRights], $entry[1])
            $inherit = [Security.AccessControl.InheritanceFlags]::ContainerInherit -bor [Security.AccessControl.InheritanceFlags]::ObjectInherit
            $rule = [Security.AccessControl.FileSystemAccessRule]::new(
              $entry[0], $rights, $inherit,
              [Security.AccessControl.PropagationFlags]::None,
              [Security.AccessControl.AccessControlType]::Allow)
            $acl.AddAccessRule($rule)
          }
          Set-Acl -LiteralPath $root -AclObject $acl
          $dir = Join-Path $root $env:GITHUB_RUN_ID
          if (Test-Path -LiteralPath $dir) { throw 'Provisioning run directory already exists' }
          New-Item -ItemType Directory -Path $dir | Out-Null
          $tokenPath = Join-Path $dir 'registration-token.txt'
          $script = Join-Path $dir 'bootstrap.ps1'
          # Windows PowerShell 5.1 script contents are ASCII-only. The here-string
          # is literal: the secret is written solely to an ACL-protected file.
          $body = @'
          $ErrorActionPreference = 'Stop'
          $taskName = 'ChudcodeRunnerBootstrap'
          $dir = Split-Path -Parent $MyInvocation.MyCommand.Path
          $tokenPath = Join-Path $dir 'registration-token.txt'
          $result = Join-Path $dir 'result.txt'
          $state = 'ERROR: bootstrap did not complete'
          try {
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            $principal = New-Object Security.Principal.WindowsPrincipal($identity)
            if ($env:COMPUTERNAME -ne 'GARRISONGAMINGP' -or
                $identity.Name -ne 'GARRISONGAMINGP\Garrison' -or
                -not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
              throw 'Not running as the verified elevated interactive administrator'
            }
            if ((Get-CimInstance Win32_ComputerSystem).UserName -ne $identity.Name) {
              throw 'The interactive administrator has signed out'
            }
            # Never interrupt a CAD or CloudCastle job. The scheduling job itself
            # owns a Runner.Worker until it exits; wait up to ten minutes.
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              if (-not (Get-Process -Name 'Runner.Worker' -ErrorAction SilentlyContinue)) { break }
              Start-Sleep -Seconds 5
            }
            if (Get-Process -Name 'Runner.Worker' -ErrorAction SilentlyContinue) {
              throw 'Runner workers are still active after ten minutes'
            }
            $source = 'C:\actions-runner-cad'
            $target = 'C:\actions-runner-chudcode'
            $name = 'ryzen-7900x3d-chudcode'
            $serviceName = 'actions.runner.Hunter-124-chudcode.ryzen-7900x3d-chudcode'
            if (-not (Test-Path -LiteralPath (Join-Path $source 'config.cmd'))) {
              throw 'CAD runner installation is unavailable'
            }
            if (Test-Path -LiteralPath $target) {
              if ((Get-Item -LiteralPath $target -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw 'Chudcode runner directory cannot be a reparse point'
              }
            }
            $settingsFile = Join-Path $target '.runner'
            if (-not (Test-Path -LiteralPath $settingsFile)) {
              if ((Test-Path -LiteralPath (Join-Path $target '.service')) -or
                  (Test-Path -LiteralPath (Join-Path $target '.credentials')) -or
                  (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) {
                throw 'Unconfigured target has partial runner/service state; inspect manually'
              }
              New-Item -ItemType Directory -Path $target -Force | Out-Null
              # /XJ skips junctions (including CAD's absolute bin/externals
              # updater links). Copy versioned directories, never job/credential
              # state, and preserve executable files without source ACLs.
              & robocopy.exe $source $target /E /XJ /COPY:DAT /DCOPY:DAT /R:1 /W:1 /NFL /NDL /NP `
                /XD (Join-Path $source '_work') (Join-Path $source '_diag') (Join-Path $source '_update') `
                /XF '.runner' '.runner_migrated' '.credentials*' '.service' '.path' '.env' '.agent' '.agent_migrated' | Out-Null
              if ($LASTEXITCODE -gt 7) { throw 'Runner binary clone failed' }
              foreach ($link in @('bin','externals')) {
                $from = Get-Item -LiteralPath (Join-Path $source $link) -Force
                $to = Join-Path $target $link
                if ($from.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                  $version = Split-Path -Leaf ($from.Target | Select-Object -First 1)
                  if ($version -notlike ($link + '.*') -or
                      -not (Test-Path -LiteralPath (Join-Path $target $version) -PathType Container) -or
                      (Test-Path -LiteralPath $to)) {
                    throw 'Versioned runner link did not clone safely'
                  }
                  New-Item -ItemType Junction -Path $to -Target (Join-Path $target $version) | Out-Null
                } elseif (-not (Test-Path -LiteralPath $to -PathType Container)) {
                  throw 'Runner binary directory did not clone'
                }
              }
              if (-not (Test-Path -LiteralPath (Join-Path $target 'bin\Runner.Listener.exe'))) {
                throw 'Cloned runner listener is missing'
              }
              $token = (Get-Content -LiteralPath $tokenPath -Raw).Trim()
              if (-not $token) { throw 'Registration token is absent' }
              Push-Location $target
              try {
                & .\config.cmd --unattended --url https://github.com/Hunter-124/chudcode `
                  --token $token --name $name --labels cloudcastle-ci,cc-win-ryzen `
                  --work _work --replace --runasservice *> $null
                if ($LASTEXITCODE -ne 0) { throw 'Runner registration or service installation failed' }
              } finally {
                Pop-Location
                Remove-Variable token -ErrorAction SilentlyContinue
                Remove-Item -LiteralPath $tokenPath -Force -ErrorAction SilentlyContinue
              }
            }
            $settings = Get-Content -LiteralPath $settingsFile -Raw | ConvertFrom-Json
            if ($settings.agentName -ne $name -or
                $settings.gitHubUrl.TrimEnd('/') -ne 'https://github.com/Hunter-124/chudcode') {
              throw 'Target is registered to an unexpected runner/repository'
            }
            foreach ($link in @('bin','externals')) {
              $path = Join-Path $target $link
              $item = Get-Item -LiteralPath $path -Force
              if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                $version = Split-Path -Leaf ($item.Target | Select-Object -First 1)
                if ($version -notlike ($link + '.*') -or
                    (Join-Path $target $version) -ne ($item.Target | Select-Object -First 1)) {
                  throw 'Configured runner links do not point into Chudcode installation'
                }
              }
            }
            $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
            if (-not $service -or (Get-Content -LiteralPath (Join-Path $target '.service') -Raw).Trim() -ne $serviceName) {
              throw 'Chudcode runner service is missing or belongs to another installation'
            }
            if ($service.Status -ne 'Running') {
              Start-Service -Name $serviceName -ErrorAction Stop
              (Get-Service -Name $serviceName).WaitForStatus('Running', [TimeSpan]::FromSeconds(60))
            }
            $state = 'SUCCESS'
          } catch {
            # Never put exception strings into logs: native registration errors
            # can contain token-bearing command arguments.
            $state = 'ERROR: bootstrap refused or failed; inspect this host locally'
          } finally {
            Remove-Item -LiteralPath $tokenPath -Force -ErrorAction SilentlyContinue
            Set-Content -LiteralPath $result -Value $state -Encoding Ascii
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $MyInvocation.MyCommand.Path -Force -ErrorAction SilentlyContinue
          }
          '@
          try {
            # WriteAllText avoids printing the token or putting it in a child
            # process command line. Child files inherit the restricted ACL.
            [IO.File]::WriteAllText($tokenPath, $env:CHUDCODE_RUNNER_REG_TOKEN)
            Set-Content -LiteralPath $script -Value $body -Encoding Ascii
            $action = New-ScheduledTaskAction `
              -Execute (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe') `
              -Argument "-NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File `"$script`""
            $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(2)
            $principal = New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Highest
            Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Principal $principal | Out-Null
            Set-Content -LiteralPath (Join-Path $root 'last-run.txt') -Value $env:GITHUB_RUN_ID -Encoding Ascii
            Write-Host 'Scheduled elevated runner installation after this job exits. Dispatch inspect mode after several minutes for sanitized outcome.'
          } catch {
            $reason = $_.Exception.Message.Replace($env:CHUDCODE_RUNNER_REG_TOKEN, '[redacted]')
            Remove-Item -LiteralPath $tokenPath -Force -ErrorAction SilentlyContinue
            throw "Unable to schedule secure runner installation; no token retained: $reason"
          }
