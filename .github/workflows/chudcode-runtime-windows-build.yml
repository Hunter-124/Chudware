# Manual build; publication requires the explicit publish input. No metered
# Actions artifact upload. Outputs survive checkout cleanup on the Windows host.
name: chudcode-runtime-windows-build

on:
  workflow_dispatch:
    inputs:
      source_archive_sha256:
        description: 'SHA-256 of exact-commit source archive on CAD chudcode-runtime-v<version> release'
        required: true
        type: string
      publish:
        description: 'Explicitly upload verified Windows executable to the existing CAD runtime mirror'
        required: true
        type: boolean
        default: false
      retention_directory:
        description: 'Optional existing local/UNC output directory; empty uses persistent runner tools'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: chudcode-runtime-windows-build
  cancel-in-progress: false

jobs:
  build:
    name: Build locked Chudcode Windows x86_64
    if: ${{ github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    environment: chudware-release-protected
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, Windows, X64, cloudcastle-ci, cc-win-ryzen]
    timeout-minutes: 180
    outputs:
      directory: ${{ steps.binary.outputs.directory }}
      sha256: ${{ steps.binary.outputs.sha256 }}
      version: ${{ steps.binary.outputs.version }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Fetch exact runtime source from CAD mirror
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARCHIVE_SHA256: ${{ inputs.source_archive_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_ARCHIVE_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid source archive SHA-256' }
          $lock = Get-Content -Raw vendor\chudcode\CHUDCODE_ARTIFACT.lock | ConvertFrom-Json
          if ($lock.repository -ne 'https://github.com/Hunter-124/chudcode.git' -or
              $lock.repository_commit -notmatch '^[0-9a-f]{40}$') {
            throw 'Unexpected locked runtime repository or commit'
          }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $tag = "chudcode-runtime-v$($lock.version)"
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $name = "chudcode-source-$($lock.repository_commit).tar.gz"
          $assets = @($release.assets | Where-Object { $_.name -eq $name })
          if ($assets.Count -ne 1) { throw "CAD mirror must contain exactly one $name" }
          $archive = Join-Path $env:RUNNER_TEMP $name
          # Never send the token to the release blob origin. Every redirect is
          # inspected explicitly; Authorization is applied only to api.github.com.
          $uri = [Uri]$assets[0].url
          $downloaded = $false
          for ($hop = 0; $hop -lt 6; $hop++) {
            if ($uri.Scheme -ne 'https' -or $uri.Host -notin @('api.github.com', 'release-assets.githubusercontent.com', 'objects.githubusercontent.com')) {
              throw 'Unexpected source archive redirect origin'
            }
            $request = [Net.HttpWebRequest]::Create($uri)
            $request.AllowAutoRedirect = $false
            $request.UserAgent = 'Chudware-runtime-build'
            $request.Accept = 'application/octet-stream'
            if ($uri.Host -eq 'api.github.com') { $request.Headers['Authorization'] = "Bearer $env:GH_TOKEN" }
            $response = $request.GetResponse()
            try {
              if ([int]$response.StatusCode -in @(301, 302, 303, 307, 308)) {
                $uri = [Uri]::new($uri, $response.Headers['Location'])
                continue
              }
              if ([int]$response.StatusCode -ne 200) { throw 'Source archive download failed' }
              $stream = $response.GetResponseStream()
              $file = [IO.File]::Create($archive)
              try { $stream.CopyTo($file) } finally { $file.Dispose(); $stream.Dispose() }
              $downloaded = $true
              break
            } finally { $response.Dispose() }
          }
          if (-not $downloaded) { throw 'Too many source archive redirects' }
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:SOURCE_ARCHIVE_SHA256) { throw "Source archive digest mismatch: $actual" }
          "CHUDCODE_SOURCE_ARCHIVE=$archive" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $toolchainText = & tar.exe -xOf $archive "Hunter-124-chudcode-$($lock.repository_commit)/rust-toolchain.toml"
          if ($LASTEXITCODE -ne 0 -or ($toolchainText -join "`n") -notmatch 'channel\s*=\s*"(nightly-\d{4}-\d{2}-\d{2})"') {
            throw 'Source archive has no pinned Rust toolchain'
          }
          "toolchain=$($Matches[1])" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      # Never run a cached Bun to ask it whether it is trusted.
      - name: Authenticate and install pinned Bun 1.4.0
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $archive = Join-Path $env:RUNNER_TEMP 'bun-windows-x64.zip'
          # Primary digest: https://api.github.com/repos/oven-sh/bun/releases/tags/bun-v1.4.0
          $sha256 = 'e6f093d39da486b20262ca8cdd5ed6a9e8bc9c2f275b78e6d3a0c5b28cc95901'
          if (-not (Test-Path $archive)) {
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-windows-x64.zip' -OutFile $archive
          }
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $sha256) {
            throw 'Bun archive SHA-256 mismatch; refusing extraction/execution'
          }
          $unpack = Join-Path $env:RUNNER_TEMP ("bun-authenticated-" + [Guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath $archive -DestinationPath $unpack
          $bin = Join-Path $unpack 'bun-windows-x64'
          "CHUDWARE_BOOTSTRAP_BIN=$bin" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          # Derived before execution from the authenticated archive; rechecked
          # by the build script rather than trusting a writable extracted cache.
          $binaryHash = (Get-FileHash -Algorithm SHA256 (Join-Path $bin 'bun.exe')).Hash.ToLowerInvariant()
          "CHUDWARE_BUN_BINARY_SHA256=$binaryHash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $version = ((& (Join-Path $bin 'bun.exe') --version) | Select-Object -First 1).ToString().Trim()
          if ($version -ne '1.4.0') { throw "Pinned Bun install failed (found '$version')" }
          $bin | Out-File $env:GITHUB_PATH -Encoding ascii -Append
      # dtolnay/rust-toolchain is a bash composite action, and `bash` on this
      # runner is an empty WSL shim ("bash: command not found"). Bootstrap
      # rustup natively instead; the toolchain is pinned by the source archive.
      - name: Authenticate rustup and install locked Rust toolchain
        env:
          RUST_TOOLCHAIN: ${{ steps.source.outputs.toolchain }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUST_TOOLCHAIN -notmatch '^nightly-\d{4}-\d{2}-\d{2}$') { throw 'Invalid pinned Rust toolchain' }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $init = Join-Path $env:RUNNER_TEMP 'rustup-init-1.28.2.exe'
          # Primary checksum: https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-pc-windows-msvc/rustup-init.exe.sha256
          $sha256 = '88d8258dcf6ae4f7a80c7d1088e1f36fa7025a1cfd1343731b4ee6f385121fc0'
          if (-not (Test-Path $init)) {
            Invoke-WebRequest -UseBasicParsing -Uri 'https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-pc-windows-msvc/rustup-init.exe' -OutFile $init
          }
          if ((Get-FileHash -Algorithm SHA256 $init).Hash.ToLowerInvariant() -ne $sha256) {
            throw 'rustup bootstrap SHA-256 mismatch; refusing execution'
          }
          $home = Join-Path $env:RUNNER_TEMP ("rust-authenticated-" + [Guid]::NewGuid().ToString('N'))
          $env:CARGO_HOME = Join-Path $home 'cargo'
          $env:RUSTUP_HOME = Join-Path $home 'rustup'
          $env:RUSTUP_UPDATE_ROOT = 'https://static.rust-lang.org/rustup'
          $env:RUSTUP_DIST_SERVER = 'https://static.rust-lang.org'
          $env:RUSTUP_AUTO_INSTALL = '0'
          & $init -y --no-modify-path --profile minimal --default-toolchain none --no-update-default-toolchain
          if ($LASTEXITCODE -ne 0) { throw "rustup-init failed ($LASTEXITCODE)" }
          $cargoBin = Join-Path $env:CARGO_HOME 'bin'
          $rustup = Join-Path $cargoBin 'rustup.exe'
          if ((Get-FileHash -Algorithm SHA256 $rustup).Hash.ToLowerInvariant() -ne $sha256) {
            throw 'Installed rustup differs from authenticated bootstrap bytes'
          }
          & $rustup set auto-self-update disable
          if ($LASTEXITCODE -ne 0) { throw 'Could not disable mutable rustup self-update' }
          "CARGO_HOME=$env:CARGO_HOME" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTUP_HOME=$env:RUSTUP_HOME" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTUP_DIST_SERVER=$env:RUSTUP_DIST_SERVER" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTUP_AUTO_INSTALL=0" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install failed ($LASTEXITCODE)" }
          & $rustup default $env:RUST_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { throw "rustup default failed ($LASTEXITCODE)" }
          $cargoBin | Out-File $env:GITHUB_PATH -Encoding ascii -Append
          & (Join-Path $cargoBin 'rustc.exe') --version --verbose
      - name: Build, smoke, verify and retain canonical runtime
        id: binary
        env:
          SOURCE_ARCHIVE_SHA256: ${{ inputs.source_archive_sha256 }}
          CHUDCODE_RETENTION_DIRECTORY: ${{ inputs.retention_directory }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\build_chudcode_windows.ps1 -SourceArchive $env:CHUDCODE_SOURCE_ARCHIVE -SourceArchiveSha256 $env:SOURCE_ARCHIVE_SHA256

  publish:
    name: Explicitly publish Windows runtime to CAD mirror
    needs: build
    if: ${{ (github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')) && (inputs.publish) }}
    environment: chudware-release-protected
    permissions:
      contents: write
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, Windows, X64, cloudcastle-ci, cc-win-ryzen]
    timeout-minutes: 15
    steps:
      - name: Upload verified retained executable only
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RETAINED_DIRECTORY: ${{ needs.build.outputs.directory }}
          BINARY_SHA256: ${{ needs.build.outputs.sha256 }}
          PRODUCT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PRODUCT_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or
              $env:BINARY_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid build output identity' }
          $binary = Join-Path $env:RETAINED_DIRECTORY 'chudcode-windows-x64.exe'
          if ((Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant() -ne $env:BINARY_SHA256) {
            throw 'Retained executable changed after build verification'
          }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $tag = "chudcode-runtime-v$env:PRODUCT_VERSION"
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          if (@($release.assets | Where-Object { $_.name -eq 'chudcode-windows-x64.exe' }).Count -ne 0) {
            throw 'Windows mirror asset already exists; refusing replacement'
          }
          $upload = $release.upload_url.Split('{')[0] + '?name=chudcode-windows-x64.exe'
          Invoke-WebRequest -UseBasicParsing -Method Post -Headers $headers -ContentType 'application/octet-stream' -InFile $binary -Uri $upload | Out-Null
          @("Published: $tag/chudcode-windows-x64.exe", "SHA-256: $env:BINARY_SHA256",
            'CAD lock remains unchanged; parent must download, verify and pin all targets atomically.') |
            Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
