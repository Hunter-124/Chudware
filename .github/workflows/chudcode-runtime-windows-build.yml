# Manual build; publication requires the explicit publish input. No metered
# Actions artifact upload. Outputs survive checkout cleanup on the Windows host.
name: chudcode-runtime-windows-build

on:
  workflow_dispatch:
    inputs:
      source_archive_sha256:
        description: 'SHA-256 of exact-commit source archive on CAD chudcode-runtime-v<version> release'
        required: true
        type: string
      publish:
        description: 'Explicitly upload verified Windows executable to the existing CAD runtime mirror'
        required: true
        type: boolean
        default: false
      retention_directory:
        description: 'Optional existing local/UNC output directory; empty uses persistent runner tools'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: chudcode-runtime-windows-build
  cancel-in-progress: false

jobs:
  build:
    name: Build locked Chudcode Windows x86_64
    runs-on: [self-hosted, Windows, X64, cloudcastle-ci, cc-win-ryzen]
    timeout-minutes: 180
    outputs:
      directory: ${{ steps.binary.outputs.directory }}
      sha256: ${{ steps.binary.outputs.sha256 }}
      version: ${{ steps.binary.outputs.version }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Fetch exact runtime source from CAD mirror
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARCHIVE_SHA256: ${{ inputs.source_archive_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_ARCHIVE_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid source archive SHA-256' }
          $lock = Get-Content -Raw vendor\chudcode\CHUDCODE_ARTIFACT.lock | ConvertFrom-Json
          if ($lock.repository -ne 'https://github.com/Hunter-124/chudcode.git' -or
              $lock.repository_commit -notmatch '^[0-9a-f]{40}$') {
            throw 'Unexpected locked runtime repository or commit'
          }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $tag = "chudcode-runtime-v$($lock.version)"
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $name = "chudcode-source-$($lock.repository_commit).tar.gz"
          $assets = @($release.assets | Where-Object { $_.name -eq $name })
          if ($assets.Count -ne 1) { throw "CAD mirror must contain exactly one $name" }
          $archive = Join-Path $env:RUNNER_TEMP $name
          # Never send the token to the release blob origin. Every redirect is
          # inspected explicitly; Authorization is applied only to api.github.com.
          $uri = [Uri]$assets[0].url
          $downloaded = $false
          for ($hop = 0; $hop -lt 6; $hop++) {
            if ($uri.Scheme -ne 'https' -or $uri.Host -notin @('api.github.com', 'release-assets.githubusercontent.com', 'objects.githubusercontent.com')) {
              throw 'Unexpected source archive redirect origin'
            }
            $request = [Net.HttpWebRequest]::Create($uri)
            $request.AllowAutoRedirect = $false
            $request.UserAgent = 'Chudware-runtime-build'
            $request.Accept = 'application/octet-stream'
            if ($uri.Host -eq 'api.github.com') { $request.Headers['Authorization'] = "Bearer $env:GH_TOKEN" }
            $response = $request.GetResponse()
            try {
              if ([int]$response.StatusCode -in @(301, 302, 303, 307, 308)) {
                $uri = [Uri]::new($uri, $response.Headers['Location'])
                continue
              }
              if ([int]$response.StatusCode -ne 200) { throw 'Source archive download failed' }
              $stream = $response.GetResponseStream()
              $file = [IO.File]::Create($archive)
              try { $stream.CopyTo($file) } finally { $file.Dispose(); $stream.Dispose() }
              $downloaded = $true
              break
            } finally { $response.Dispose() }
          }
          if (-not $downloaded) { throw 'Too many source archive redirects' }
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:SOURCE_ARCHIVE_SHA256) { throw "Source archive digest mismatch: $actual" }
          "CHUDCODE_SOURCE_ARCHIVE=$archive" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $toolchainText = & tar.exe -xOf $archive "Hunter-124-chudcode-$($lock.repository_commit)/rust-toolchain.toml"
          if ($LASTEXITCODE -ne 0 -or ($toolchainText -join "`n") -notmatch 'channel\s*=\s*"(nightly-\d{4}-\d{2}-\d{2})"') {
            throw 'Source archive has no pinned Rust toolchain'
          }
          "toolchain=$($Matches[1])" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install locked Rust toolchain and bootstrap rustup when absent
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ steps.source.outputs.toolchain }}
          targets: x86_64-pc-windows-msvc
      - name: Build, smoke, verify and retain canonical runtime
        id: binary
        env:
          SOURCE_ARCHIVE_SHA256: ${{ inputs.source_archive_sha256 }}
          CHUDCODE_RETENTION_DIRECTORY: ${{ inputs.retention_directory }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\build_chudcode_windows.ps1 -SourceArchive $env:CHUDCODE_SOURCE_ARCHIVE -SourceArchiveSha256 $env:SOURCE_ARCHIVE_SHA256

  publish:
    name: Explicitly publish Windows runtime to CAD mirror
    needs: build
    if: ${{ inputs.publish }}
    permissions:
      contents: write
    runs-on: [self-hosted, Windows, X64, cloudcastle-ci, cc-win-ryzen]
    timeout-minutes: 15
    steps:
      - name: Upload verified retained executable only
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RETAINED_DIRECTORY: ${{ needs.build.outputs.directory }}
          BINARY_SHA256: ${{ needs.build.outputs.sha256 }}
          PRODUCT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PRODUCT_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or
              $env:BINARY_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid build output identity' }
          $binary = Join-Path $env:RETAINED_DIRECTORY 'chudcode-windows-x64.exe'
          if ((Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant() -ne $env:BINARY_SHA256) {
            throw 'Retained executable changed after build verification'
          }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $tag = "chudcode-runtime-v$env:PRODUCT_VERSION"
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          if (@($release.assets | Where-Object { $_.name -eq 'chudcode-windows-x64.exe' }).Count -ne 0) {
            throw 'Windows mirror asset already exists; refusing replacement'
          }
          $upload = $release.upload_url.Split('{')[0] + '?name=chudcode-windows-x64.exe'
          Invoke-WebRequest -UseBasicParsing -Method Post -Headers $headers -ContentType 'application/octet-stream' -InFile $binary -Uri $upload | Out-Null
          @("Published: $tag/chudcode-windows-x64.exe", "SHA-256: $env:BINARY_SHA256",
            'CAD lock remains unchanged; parent must download, verify and pin all targets atomically.') |
            Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
