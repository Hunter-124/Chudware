# Gate for the CI configuration itself.
#
# Everything else under .github/workflows only gets validated once GitHub has
# already accepted the file and scheduled a job — which for this repository
# means after a self-hosted Windows or macOS builder has been claimed. A
# workflow that fails to parse, or that pins an action to a mutable tag, is
# therefore discovered late or not at all.
#
# The second thing this gate defends is the budget. Chudware's GitHub Actions
# spend is $0. On a private repository GitHub bills GitHub-hosted runner
# minutes while self-hosted minutes are free, and it bills artifact storage
# above the 500 MB shared with Packages, accrued hourly and non-refundable.
# One `runs-on: ubuntu-latest` added in a hurry, or one 500 MB installer left
# at the 90-day default retention, spends real money silently. Reviewer memory
# is not a control; scripts/verify-ci-workflows.py is.
#
# This job answers both questions from the workflow text alone, in about a
# minute, on the self-hosted Linux builder:
#
#   * actionlint (version-pinned, checksum-verified) parses and schema-checks
#     every workflow the way GitHub does.
#   * scripts/verify-ci-workflows.py enforces the CI contract actionlint has no
#     opinion about: the load-bearing workflow set exists, external actions are
#     pinned to full commit SHAs, permissions and concurrency are explicit,
#     jobs carry timeouts, every runner is provably self-hosted, uploads carry
#     a short retention, and permissions.administration — which GitHub rejects
#     at parse time — never appears.
#
# Both validators are proven able to fail, against seeded fixtures, before
# either is trusted to pass on the real tree.
name: ci-workflow-policy

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'scripts/verify-ci-workflows.py'
      - 'scripts/test_verify_ci_workflows.py'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/verify-ci-workflows.py'
      - 'scripts/test_verify_ci_workflows.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-workflow-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-policy:
    name: Workflow policy
    # PR-controlled Python executes only in a disposable Linux image, never
    # on a persistent interpreter/profile later used for release credentials.
    runs-on:
      group: chudware-untrusted-ephemeral
      labels: [self-hosted, Linux, X64, cc-linux-disposable]
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check runner capabilities
        shell: bash
        run: |
          set -euo pipefail

          # Named up front so a runner re-image that drops one of these fails
          # with the missing capability rather than a confusing download or
          # checksum error three steps later.
          missing=()
          for tool in curl tar sha256sum python3; do
            command -v "${tool}" >/dev/null 2>&1 || missing+=("${tool}")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::runner ${RUNNER_NAME:-unknown} is missing required tools: ${missing[*]}"
            exit 1
          fi

          kernel="$(uname -s)"
          arch="$(uname -m)"
          echo "runner: ${RUNNER_NAME:-unknown} ${kernel} ${arch}"
          if [ "${kernel}" != "Linux" ] || [ "${arch}" != "x86_64" ]; then
            echo "::error::this gate installs the actionlint linux_amd64 asset; runner reports ${kernel}/${arch}"
            exit 1
          fi

          test -n "${RUNNER_TEMP:-}" && test -d "${RUNNER_TEMP}"
          python3 --version

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install actionlint (pinned release, checksum verified)
        id: actionlint
        shell: bash
        run: |
          set -euo pipefail

          # Job-local tools; the surrounding VM and all writable state are
          # destroyed by the external runner controller after this one job.
          tools="$(mktemp -d "${RUNNER_TEMP}/actionlint.XXXXXXXX")"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --max-time 120 \
            --output "${tools}/actionlint.tar.gz" "${url}"

          # A tag can be re-pointed; this digest cannot. If upstream ever
          # republishes the asset, this gate stops rather than runs an
          # unreviewed binary.
          echo "${ACTIONLINT_SHA256}  ${tools}/actionlint.tar.gz" | sha256sum --check --strict -

          tar -xzf "${tools}/actionlint.tar.gz" -C "${tools}" actionlint
          chmod +x "${tools}/actionlint"
          "${tools}/actionlint" --version

          echo "bin=${tools}/actionlint" >> "$GITHUB_OUTPUT"

      - name: Negative controls - prove both validators can fail
        shell: bash
        env:
          ACTIONLINT: ${{ steps.actionlint.outputs.bin }}
        run: |
          set -euo pipefail

          control="$(mktemp -d "${RUNNER_TEMP}/policy-negative.XXXXXXXX")"
          mkdir -p "${control}/.github/workflows"

          # Fixture 1: unparseable. The flow sequence is never closed, so no
          # YAML parser - actionlint's or GitHub's - can read this file.
          cat > "${control}/.github/workflows/parse-invalid.yml" <<'FIXTURE'
          name: negative-control-parse-invalid
          on: workflow_dispatch
          permissions:
            contents: read
          jobs:
            broken:
              runs-on: [ubuntu-latest
              timeout-minutes: 5
              steps:
                - run: echo "unreachable"
          FIXTURE

          # Fixture 2: parses cleanly, but spends money three ways - a metered
          # hosted image, written as a bare string, and an artifact left at
          # GitHub's 90-day default. actionlint has no opinion on any of them.
          cat > "${control}/.github/workflows/spend-money.yml" <<'FIXTURE'
          name: negative-control-spend-money
          on: workflow_dispatch
          permissions:
            contents: read
          concurrency:
            group: negative-control-spend-money
            cancel-in-progress: false
          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - uses: actions/checkout@v4
                - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                  with:
                    name: installer
                    path: out/
          FIXTURE

          # Fixture 3: a PowerShell step whose body carries a UTF-8 em dash.
          # Windows PowerShell 5.1 reads the BOM-less script the runner writes
          # as the ANSI code page, turning that em dash into a curly quote that
          # terminates the string above it, so the step dies at parse time
          # before running. actionlint has no opinion on step-body encoding.
          cat > "${control}/.github/workflows/powershell-mojibake.yml" <<'FIXTURE'
          name: negative-control-powershell-mojibake
          on: workflow_dispatch
          permissions:
            contents: read
          concurrency:
            group: negative-control-powershell-mojibake
            cancel-in-progress: false
          jobs:
            probe:
              runs-on: [self-hosted, Windows, X64, cloudcastle-ci, cc-win-primary]
              timeout-minutes: 5
              steps:
                - name: Report
                  shell: powershell
                  run: |
                    # this em dash — is three CP1252 characters on the runner
                    Write-Host "hello"
          FIXTURE

          echo "--- control 1: actionlint must reject the unparseable workflow"
          status=0
          "$ACTIONLINT" -no-color "${control}/.github/workflows/parse-invalid.yml" \
            > "${control}/actionlint-invalid.log" 2>&1 || status=$?
          cat "${control}/actionlint-invalid.log"
          if [ "${status}" -eq 0 ]; then
            echo "::error::actionlint accepted a workflow that cannot be parsed; the linter is not enforcing anything"
            exit 1
          fi

          echo "--- control 2: the policy checker must reject every seeded defect"
          status=0
          python3 scripts/verify-ci-workflows.py \
            --root "${control}" \
            --scope-all \
            --skip-required-set \
            --no-annotations \
            > "${control}/policy.log" 2>&1 || status=$?
          cat "${control}/policy.log"
          if [ "${status}" -eq 0 ]; then
            echo "::error::the workflow policy checker accepted a hosted runner, a mutable action ref, an unbounded artifact and a non-ASCII PowerShell body"
            exit 1
          fi
          # Named individually: a checker that fails for one reason while a
          # money rule has quietly stopped firing is the failure mode this list
          # exists to catch.
          for rule in workflow-parse-error unpinned-action-ref hosted-runner \
                      string-form-runs-on billable-artifact-retention \
                      powershell-non-ascii; do
            if ! grep -q "${rule}" "${control}/policy.log"; then
              echo "::error::the policy checker failed, but never reported ${rule}; the rule is not wired up"
              exit 1
            fi
          done

          echo "--- control 3: the required-set check must name every contract workflow"
          # Same seeded root, but without --skip-required-set. It contains none
          # of the contract workflows, so every required name must be reported
          # missing.
          status=0
          python3 scripts/verify-ci-workflows.py \
            --root "${control}" \
            --no-annotations \
            > "${control}/required-set.log" 2>&1 || status=$?
          cat "${control}/required-set.log"
          if [ "${status}" -eq 0 ]; then
            echo "::error::the policy checker found no missing workflows in a root that contains none of them; the required-set check is not running"
            exit 1
          fi
          for wf in fast-gate.yml linux-gate.yml native-build.yml runner-smoke.yml; do
            if ! grep -q "\[missing-workflow\] .github/workflows/${wf}" "${control}/required-set.log"; then
              echo "::error::${wf} is not in the enforced workflow set; losing it would not fail this gate"
              exit 1
            fi
          done

          echo "both validators fire on seeded defects and pass clean input"

      - name: Check runner routing and YAML alias policy boundaries
        shell: bash
        run: python3 scripts/test_verify_ci_workflows.py

      - name: Lint every workflow with actionlint
        shell: bash
        env:
          ACTIONLINT: ${{ steps.actionlint.outputs.bin }}
        run: |
          set -euo pipefail

          # -shellcheck= / -pyflakes= keep this reproducible: the verdict must
          # depend only on the checksum-pinned actionlint binary, not on
          # whichever shellcheck the build host happens to have installed.
          #
          # The self-hosted label vocabulary (cloudcastle-ci, cc-win-*) is
          # defined by the runner fleet, not by this repository, so actionlint
          # cannot know it and its guess is noise.
          "$ACTIONLINT" -color -shellcheck= -pyflakes= -ignore 'label .+ is unknown'

          echo "actionlint: all workflows parse and match the Actions schema"

      - name: Enforce repository workflow policy
        shell: bash
        run: |
          set -euo pipefail

          log="${RUNNER_TEMP}/workflow-policy.log"
          status=0
          python3 scripts/verify-ci-workflows.py > "${log}" 2>&1 || status=$?
          cat "${log}"

          # Step summaries are not metered; artifacts are. Diagnostics go here.
          {
            echo '## Workflow policy'
            echo '```text'
            cat "${log}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "${status}"
