# Automatic master activation is suspended while independent release prerequisites
# remain unqualified. Source policy is not evidence of installed/live authority.
# A protected manual dispatch still requires exact-SHA qualification, all CI gates,
# protected configuration and independent rollback authority. No force bypass.
name: deploy-prod
on:
  workflow_dispatch:
    inputs:
      first_cutover_ack:
        description: 'Optional explicit root registry ack path binding this exact commit and verified manual recovery prerequisites; never auto-created'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  stripe-gate:
    name: Gate — live Stripe sandbox
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_protected && github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/stripe-sandbox.yml
    with:
      require_credentials: true
    secrets:
      STRIPE_SANDBOX_ENV: ${{ secrets.STRIPE_SANDBOX_ENV }}

  deploy:
    name: Explicit qualified production promotion
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_protected && github.ref == 'refs/heads/master' }}
    needs: stripe-gate
    environment: chudware-control-protected
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, Linux, X64, cloudcastle-ci, cc-linux-livingroom]
    timeout-minutes: 180
    env:
      CANONICAL: /home/liveuser/Repositories/CAD
      WEB_ROOT: /home/liveuser/chudware-web
      TARGET_SHA: ${{ github.sha }}
      QUALIFIED_SHA: ${{ vars.CHUDWARE_PRODUCTION_QUALIFIED_SHA }}
      FIRST_CUTOVER_ACK: ${{ inputs.first_cutover_ack }}
      GH_TOKEN: ${{ github.token }}
      CHUDWARE_DEPLOY_TARGET_SHA: ${{ github.sha }}
      CHUDWARE_DEPLOY_HEALTH_BASE_URL: http://127.0.0.1:8300
      CHUDWARE_CHUD_BIN: /home/liveuser/chudware-web-data/chud
      CHUDWARE_BASE_PYTHON: /usr/bin/python3
      CHUDWARE_WHEELHOUSE: /var/lib/chudware-release/wheelhouse
    steps:
      # No checkout or pre-gate sync on the production host. The canonical source
      # must already be the independently prepared, clean qualified snapshot.
      - name: Enforce independent qualification and protected host identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${QUALIFIED_SHA}" = "${TARGET_SHA}" && "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Independent release prerequisites are not qualified for this exact SHA. Protected environment approval and CHUDWARE_PRODUCTION_QUALIFIED_SHA must follow the external release evidence review.'
            exit 4
          }
          [[ "$(hostname -s)" = livingroom-pc && "$(id -un)" = liveuser && "${RUNNER_OS}" = Linux ]] || exit 4
          runtime_dir="/run/user/$(id -u)"
          [[ -d "${runtime_dir}" && -S "${runtime_dir}/bus" && -d "${RUNNER_TEMP}" && -w "${RUNNER_TEMP}" ]] || exit 4
          {
            echo "XDG_RUNTIME_DIR=${runtime_dir}"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=${runtime_dir}/bus"
            echo "TMPDIR=${RUNNER_TEMP}"
            echo "CHUDWARE_WEBD_WASM_LOG=${RUNNER_TEMP}/webd-wasm.log"
          } >> "$GITHUB_ENV"
          [[ "$(git -C "${CANONICAL}" rev-parse HEAD)" = "${TARGET_SHA}" ]] || {
            echo '::error::Canonical gateway checkout is not the qualified snapshot; prepare and review it independently. Native rollback cannot restore this checkout.'
            exit 4
          }
          [[ -z "$(git -C "${CANONICAL}" status --porcelain)" ]] || exit 4
          for command in git gh python3; do command -v "$command" >/dev/null || exit 4; done

      - name: Require successful CI and unchanged protected master
        shell: bash
        run: |
          set -euo pipefail
          for workflow in linux-gate.yml native-build.yml fast-gate.yml; do
            # Only the newest run for this exact commit counts. Missing, skipped,
            # cancelled, queued, failed and unreadable results all refuse.
            verdict="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${TARGET_SHA}&per_page=1" --jq '.workflow_runs[0] | if .status == "completed" then .conclusion else .status end')"
            [[ "$verdict" = success ]] || {
              echo "::error::${workflow} is not successful for the qualified SHA"
              exit 4
            }
          done
          git -C "${CANONICAL}" fetch --quiet origin master
          [[ "$(git -C "${CANONICAL}" rev-parse FETCH_HEAD)" = "${TARGET_SHA}" ]] || {
            echo '::error::Master advanced; qualify and explicitly dispatch the new exact commit instead.'
            exit 4
          }

      - name: Run source and protected-configuration gates
        working-directory: /home/liveuser/Repositories/CAD
        shell: bash
        run: |
          set -euo pipefail
          runtime="${HOME}/.local/share/Chudware/mcp-venv/bin/python"
          [[ -x "$runtime" ]] || exit 4
          "$runtime" scripts/check.py
          Webservice/gateway/.venv/bin/python Webservice/deploy/gateway_preflight.py validate --env-file "${HOME}/chudware-web-data/gateway.env" --environment prod
          # First cutover is allowed only with an explicitly selected independent
          # root record for this exact SHA and each manual-recovery prerequisite.
          authority=(promotion-preflight --web-home "${WEB_ROOT}" --environment prod --target-commit "${TARGET_SHA}")
          [[ -z "${FIRST_CUTOVER_ACK}" ]] || authority+=(--first-cutover-ack "${FIRST_CUTOVER_ACK}")
          env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -S Webservice/deploy/deployment_release.py "${authority[@]}"

      - name: Promote the exact qualified snapshot
        id: deploy
        working-directory: /home/liveuser/Repositories/CAD
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          args=(prod --continuous --no-pull)
          [[ -z "${FIRST_CUTOVER_ACK}" ]] || args+=(--first-cutover-ack "${FIRST_CUTOVER_ACK}")
          bash Webservice/deploy/update.sh "${args[@]}" || rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) echo 'deployed=true' >> "$GITHUB_OUTPUT" ;;
            2) echo '::error::Updater usage refusal before live mutation; no rollback will run.'; exit 2 ;;
            3) echo '::notice::Another deployment holds the lock; no operation attempted.' ;;
            4) echo '::error::Precondition refusal before live mutation; no rollback will run.'; exit 4 ;;
            *) echo '::error::Deployment may have changed gateway/dependencies/schema; operator recovery is required, not blind database restore.'; exit 1 ;;
          esac

      - name: Verify promoted bundle
        id: verify
        if: steps.deploy.outputs.deployed == 'true'
        working-directory: /home/liveuser/Repositories/CAD
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" = "${TARGET_SHA}" ]]
          Webservice/gateway/.venv/bin/python scripts/check_web_parity.py --bundle "${WEB_ROOT}/app"
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8300/healthz >/dev/null

      - name: Classify recovery without bypassing drain or schema safety
        if: failure() && ((steps.deploy.outcome == 'failure' && steps.deploy.outputs.rc != '4' && steps.deploy.outputs.rc != '2') || steps.verify.outcome == 'failure')
        working-directory: /home/liveuser/Repositories/CAD
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          bash Webservice/deploy/rollback.sh --automatic || rc=$?
          case "$rc" in
            0) result='Only the retained native/cell payload was restored. Gateway checkout/dependencies and database schema/data were NOT restored.' ;;
            5) result='Automatic rollback refused: gateway/dependencies/schema are changed or unknown. Operator must preserve current customer data, reconcile schema/source compatibility and use the independently drilled manual recovery plan. Never blindly restore an old database.' ;;
            *) result="Native/cell rollback refused or failed (exit ${rc}); operator recovery is required. No force retry, gateway-source rollback or database restore was attempted." ;;
          esac
          printf '%s\n' "$result"
          printf '### Production recovery required\n\n%s\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          gh issue create --repo "$GITHUB_REPOSITORY" --title '[deploy-prod] Explicit production promotion needs operator recovery' --body "Qualified commit ${TARGET_SHA}. ${result} Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
          exit 1

      - name: Record source-policy scope
        if: always()
        shell: bash
        run: |
          {
            echo '### Explicit production promotion'
            echo "* Target: ${TARGET_SHA}"
            echo "* Updater exit: ${{ steps.deploy.outputs.rc || 'not run' }}"
            echo '* Master pushes do not activate production. There is no force gate bypass.'
            echo '* Workflow/configuration source is not live authority, deliverability or installed-host attestation.'
            echo '* Retained rollback covers native/cell payloads only; gateway checkout/dependencies and database recovery require the operator plan.'
          } >> "$GITHUB_STEP_SUMMARY"
