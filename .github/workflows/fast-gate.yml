# Source-level audits on every pull request and every push to master.
#
# scripts/check.py runs ten deterministic audits: icon atlas coverage,
# ribbon-command-to-handler routing, SW_PARITY_SPEC drift, the agent event-kind
# and role-prompt catalogs, the services thin-client ratchet, the Settings
# tool-panel tables, cross-platform path portability, advertised-tool
# reachability, and the shared-UI manifest and assets. Most of them need only
# the standard library; advertised_tool_audit imports the live MCP registry and
# therefore needs PyYAML, the MCP SDK, NumPy, SciPy, LangGraph and its SQLite
# checkpointer. Those pins are read from requirements.txt so CI never tests a
# different version than the product declares.
#
# The matrix covers all three desktop platforms because these audits walk paths
# and compare text; separator and encoding assumptions that only break on one
# OS are exactly what this catches.
name: fast-gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check.py (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    env:
      # check.py prints non-ASCII audit names and findings; UTF-8 mode keeps
      # redirected output identical on all three platforms.
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the check.py import surface
        shell: bash
        run: |
          set -euo pipefail
          req="${RUNNER_TEMP}/check-requirements.txt"
          grep -iE '^(pyyaml|mcp|numpy|scipy|langgraph|langgraph-checkpoint-sqlite)[ =<>~!;]' requirements.txt > "${req}"
          cat "${req}"
          python -m pip install --disable-pip-version-check -r "${req}"
          python -c 'import yaml, mcp, numpy, scipy, langgraph, langgraph.checkpoint.sqlite'

      - name: Run scripts/check.py
        shell: bash
        run: python scripts/check.py
