# The full Linux gate: everything scripts/gate.sh runs, plus the two suites it
# has never run itself.
#
# gate.sh is the repository's real build+test gate — check.py, the OCCT core
# build, the host GUI build, the WASM smoke, ctest, the hostd daemon smoke, the
# web-parity probe, the Python service suites, and the headless shot smoke.
# Locally it is deliberately lenient: a box without OCCT, emsdk, or the service
# venv reports SKIP and stays green, because a developer should not have to
# provision the world to run it.
#
# That leniency is a false green in CI. A runner that lost its toolchain would
# report PASS having compiled and tested nothing, and nobody would look again
# until a release failed. So this job sets CHUDWARE_GATE_STRICT=1, which turns
# every environment SKIP — no cmake, no OCCT, no emsdk, no venv, no collected
# tests — into a hard failure. Opt-in stages (the AppImage build, the
# openEMS/Renode benches) stay opt-in; they are off by choice, not by fault.
# Consequence: cc-linux-build must stay provisioned with cmake+ninja, system
# OCCT, emsdk, and the service venv, and a red gate naming a missing capability
# is a provisioning ticket, not a code defect.
#
# Two suites gate.sh has never invoked run here explicitly:
#   * ctest --test-dir host/build-linux — the host GUI tree's own tests. gate.sh
#     builds the native default targets, including these test binaries, but only
#     ctests the core tree; this step runs the host suite.
#   * pytest Webservice/gateway/tests — the FastAPI gateway suite. It lives
#     outside the paths gate.sh sweeps and needs the gateway's own venv.
#
# master only. Pull requests get fast-gate; this one is expensive and holds the
# Linux builder for the better part of an hour.
name: linux-gate

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: this gate is the merge signal for master, and a cancelled run
# is indistinguishable from an unrun one.
concurrency:
  group: linux-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Full Linux gate (strict)
    # Named capacity label, not the bare pool: gate.sh saturates the machine for
    # tens of minutes and must never land on the production gateway host. Hosted
    # runners are billed on this private repository; the fleet is free.
    runs-on: [self-hosted, Linux, X64, cloudcastle-ci, cc-linux-build]
    # The strict gate alone now takes ~2 h on livingroom-pc (host test binaries are built and
    # run since 2026-10-01); 120 min cancelled the trailing Webservice pytest step.
    timeout-minutes: 180
    env:
      # The whole point of this job. See the header block above.
      CHUDWARE_GATE_STRICT: '1'
    steps:
      - name: Check runner capabilities
        shell: bash
        run: |
          set -euo pipefail

          # Named up front. Under CHUDWARE_GATE_STRICT=1 a missing tool fails the
          # gate anyway, but it fails 20 minutes in with a stage label; here it
          # fails in two seconds with the tool name.
          missing=()
          for tool in python3 cmake ninja ctest git tar xvfb-run; do
            command -v "${tool}" >/dev/null 2>&1 || missing+=("${tool}")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::runner ${RUNNER_NAME:-unknown} is missing required tools: ${missing[*]}"
            exit 1
          fi

          if ! python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'; then
            echo "::error::python3 must be >= 3.11; the pinned NumPy and SciPy needed by check.py do not support older interpreters"
            exit 1
          fi

          # The SDK is runner provisioning, not repository content. Resolve it
          # outside _work and export the absolute directory; gate.sh passes it
          # to CMake explicitly, so a fresh checkout cannot remove the SDK path.
          shopt -s nullglob
          cef_candidates=("$HOME"/chudware-cef-sdk/cef_binary_*_linux64*)
          if [ "${#cef_candidates[@]}" -ne 1 ]; then
            echo "::error::expected exactly one Linux CEF SDK under $HOME/chudware-cef-sdk, found ${#cef_candidates[@]}"
            exit 1
          fi
          echo "CEF_ROOT=${cef_candidates[0]}" >> "$GITHUB_ENV"
          echo "cef-root=${cef_candidates[0]}"

          echo "runner=${RUNNER_NAME:-unknown} host=$(hostname -s)"
          uname -a
          python3 --version
          cmake --version | head -n 1
          ninja --version
          df -h "${RUNNER_TEMP:-/tmp}" "$HOME"
          # Keep gate logs and subprocess scratch on the per-job disk-backed
          # runner temp; the shared /tmp user quota is already full of old
          # simulation caches and must not make this gate fail silently.
          echo "TMPDIR=${RUNNER_TEMP}" >> "$GITHUB_ENV"
          echo "GATE_TMPDIR=${RUNNER_TEMP}/chudware-gate" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # gate.sh generates the version header from `git describe --tags`, so
          # a shallow clone without tags would silently produce 0.0.0.
          fetch-depth: 0

      # Eight check.py audits use only the standard library; advertised_tool_audit
      # imports the live MCP registry and needs exactly these six packages (langgraph
      # gates every family services/mcp/server.py registers after services.dag).
      # Keep this identical to fast-gate and read pins from the product requirements.
      - name: Provision the check.py import surface
        shell: bash
        run: |
          set -euo pipefail

          req="${RUNNER_TEMP}/check-requirements.txt"
          grep -E '^(pyyaml|mcp|numpy|scipy)==|^(langgraph|langgraph-checkpoint-sqlite)>=' requirements.txt > "${req}"
          found="$(wc -l < "${req}" | tr -d ' ')"
          if [ "${found}" -ne 6 ]; then
            echo "::error::expected pinned pyyaml, mcp, numpy, scipy, langgraph and langgraph-checkpoint-sqlite in requirements.txt, found ${found}"
            exit 1
          fi

          if python3 -c 'import yaml, mcp, numpy, scipy, langgraph, langgraph.checkpoint.sqlite' 2>/dev/null; then
            check_python="$(command -v python3)"
            echo "import surface already present in ${check_python}"
          else
            venv="${RUNNER_TEMP}/check-venv"
            python3 -m venv "${venv}"
            "${venv}/bin/python" -m pip install --quiet --disable-pip-version-check --upgrade pip
            "${venv}/bin/python" -m pip install --quiet --disable-pip-version-check -r "${req}"
            "${venv}/bin/python" -c 'import yaml, mcp, numpy, scipy, langgraph, langgraph.checkpoint.sqlite; print("import surface OK")'
            check_python="${venv}/bin/python"
          fi
          echo "CHECK_PYTHON=${check_python}" >> "$GITHUB_ENV"

      - name: Refresh the service runtime and gate dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A persistent runner's venv is not a dependency lock. Refresh it from
          # the product manifest before sweeping every service (including civil).
          venv="$HOME/.local/share/Chudware/mcp-venv"
          # The typed SDK is private, not on PyPI. Its pinned source is already
          # published with Chudware's runtime release, accessible to this repo token.
          read -r release source_commit <<< "$(python3 -c 'import json; p=json.load(open("vendor/chudcode/CHUDCODE_ARTIFACT.lock")); print("chudcode-runtime-v" + p["version"], p["repository_commit"])')"
          source_dir="$(mktemp -d "${RUNNER_TEMP}/gate-rpc.XXXXXX")"
          archive="chudcode-source-${source_commit}.tar.gz"
          python3 - "${source_dir}/${archive}" "${release}" <<'PY'
          import os, shutil, sys
          from pathlib import Path
          from scripts.pin_chudcode import _github_asset_response
          destination = Path(sys.argv[1])
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{sys.argv[2]}/{destination.name}"
          with _github_asset_response(url, os.environ["GH_TOKEN"]) as response, destination.open("wb") as output:
              shutil.copyfileobj(response, output)
          PY
          mkdir "${source_dir}/sdk"
          tar -xzf "${source_dir}/${archive}" -C "${source_dir}/sdk" \
            --strip-components=3 --wildcards '*/python/chudcode-rpc/*'
          VENV_DIR="${venv}" CHUDCODE_RPC_SRC="${source_dir}/sdk" bash scripts/provision_venv.sh
          # DVC is a subprocess-only training-data tool, not a shipped runtime import.
          "${venv}/bin/python" -m pip install --quiet --disable-pip-version-check pytest dvc==3.67.1
          "${venv}/bin/python" -c 'import pyproj, dvc, pytest; print("gate runtime imports OK")'
          echo "CHUDWARE_GATE_PYTHON=${venv}/bin/python" >> "$GITHUB_ENV"

      - name: Run scripts/gate.sh (CHUDWARE_GATE_STRICT=1)
        shell: bash
        run: |
          set -euo pipefail

          log="${RUNNER_TEMP}/gate.log"
          status=0
          bash scripts/gate.sh 2>&1 | tee "${log}" || status=${PIPESTATUS[0]}

          # The summary block gate.sh prints is the whole verdict, one line per
          # stage. Job logs and step summaries are not metered; artifacts are.
          {
            echo '## scripts/gate.sh (strict)'
            echo '```text'
            sed -n '/Chudware Linux gate — summary/,$p' "${log}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "${status}"

      - name: ctest — host GUI tree
        shell: bash
        run: |
          set -euo pipefail

          # gate.sh builds the native default targets (GUI + test binaries), but
          # only ctests the core tree. Run the host suite in that same build tree.
          if [ ! -f host/build-linux/CTestTestfile.cmake ]; then
            echo "::error::host/build-linux has no CTest configuration; the host build stage did not complete"
            exit 1
          fi

          log="${RUNNER_TEMP}/host-ctest.log"
          status=0
          ctest --test-dir host/build-linux --output-on-failure 2>&1 | tee "${log}" || status=${PIPESTATUS[0]}

          # Zero tests is a harness break, not a pass: this suite exists.
          if grep -qE 'No tests were found' "${log}"; then
            echo "::error::ctest found no tests in host/build-linux; the suite did not run"
            exit 1
          fi

          {
            echo '## ctest — host/build-linux'
            echo '```text'
            tail -n 30 "${log}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "${status}"

      - name: pytest — Webservice gateway
        shell: bash
        run: |
          set -euo pipefail

          # The gateway has its own venv with FastAPI and its test deps; the
          # service venv gate.sh uses does not carry them. The venv is
          # gitignored, so on a fresh CI checkout it never exists -- it is a
          # build artifact, not a provisioning capability, and treating its
          # absence as a provisioning failure would make this gate red on every
          # clean runner forever. Build it, and be strict about the build
          # FAILING: a venv that cannot be created is a real defect.
          venv_py="Webservice/gateway/.venv/bin/python"
          if [ ! -x "${venv_py}" ]; then
            echo "creating Webservice/gateway/.venv"
            python3 -m venv Webservice/gateway/.venv
          fi
          "${venv_py}" -m pip install --quiet --upgrade pip
          "${venv_py}" -m pip install --quiet -r Webservice/gateway/requirements.txt
          if ! "${venv_py}" -c 'import pytest' 2>/dev/null; then
            # pytest is a test-only dep and is deliberately absent from the
            # pinned runtime requirements, which the deployment venv installs.
            "${venv_py}" -m pip install --quiet pytest
          fi

          log="${RUNNER_TEMP}/gateway-pytest.log"
          status=0
          (cd Webservice/gateway && .venv/bin/python -m pytest tests -q) 2>&1 | tee "${log}" || status=${PIPESTATUS[0]}

          # pytest exits 5 on "no tests collected". That is a harness break here.
          if [ "${status}" -eq 5 ]; then
            echo "::error::pytest collected zero tests under Webservice/gateway/tests; the suite did not run"
            exit 1
          fi

          {
            echo '## pytest — Webservice/gateway/tests'
            echo '```text'
            tail -n 30 "${log}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "${status}"
