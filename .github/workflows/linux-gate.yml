# The full Linux gate: everything scripts/gate.sh runs (check.py, the OCCT core
# build, the host GUI build, the WASM smoke, ctest, the hostd smoke, the Python
# service suites and the headless screenshot smoke), plus the host GUI ctest
# suite and the web/gateway and web/deploy tests, which gate.sh does not run itself.
#
# Locally gate.sh reports a missing toolchain as SKIP so developers do not have
# to provision everything. CHUDWARE_GATE_STRICT=1 turns every such SKIP into a
# failure here, so a broken CI environment can never pass by testing nothing.
#
# The job runs in a fedora:44 container because the core needs OCCT 7.9.x
# (Fedora's opencascade-devel); .github/scripts/install-fedora-deps.sh lists
# every system package.
name: linux-gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Full Linux gate (strict)
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
      # Large preinstalled SDKs on the host that this job never uses. They are
      # mounted only so the first step can delete them and free disk space.
      volumes:
        - /usr/local/lib/android:/host/android
        - /usr/share/dotnet:/host/dotnet
        - /opt/ghc:/host/ghc
    timeout-minutes: 345
    env:
      CHUDWARE_GATE_STRICT: '1'
      EMSDK_VERSION: 6.0.3
    steps:
      - name: Free disk space on the host
        run: rm -rf /host/android/* /host/dotnet/* /host/ghc/*

      - name: Install git
        run: dnf -y install git

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gate.sh generates the version header from `git describe --tags`.
          fetch-depth: 0

      - name: Install system dependencies
        run: bash .github/scripts/install-fedora-deps.sh gate

      - name: Fetch the pinned CEF SDK
        shell: bash
        run: |
          set -euo pipefail
          cef_root="$(bash scripts/fetch_cef_posix.sh --destination-root "${RUNNER_TEMP}/cef")"
          echo "CEF_ROOT=${cef_root}" >> "$GITHUB_ENV"

      - name: Install emsdk ${{ env.EMSDK_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          emsdk="${RUNNER_TEMP}/emsdk"
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "${emsdk}"
          "${emsdk}/emsdk" install "${EMSDK_VERSION}"
          "${emsdk}/emsdk" activate "${EMSDK_VERSION}"
          echo "EMSDK=${emsdk}" >> "$GITHUB_ENV"

      - name: Provision the service virtualenv
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/gate-venv"
          VENV_DIR="${venv}" PYTHON=python3.13 bash scripts/provision_venv.sh pytest==9.1.1
          {
            echo "CHUDWARE_GATE_PYTHON=${venv}/bin/python"
            echo "CHECK_PYTHON=${venv}/bin/python"
            echo "GATE_TMPDIR=${RUNNER_TEMP}/chudware-gate"
          } >> "$GITHUB_ENV"
          echo "${venv}/bin" >> "$GITHUB_PATH"

      - name: Run scripts/gate.sh
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/gate.log"
          status=0
          bash scripts/gate.sh 2>&1 | tee "${log}" || status=${PIPESTATUS[0]}
          {
            echo '## scripts/gate.sh (strict)'
            echo '```text'
            sed -n '/Chudware Linux gate — summary/,$p' "${log}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: ctest host GUI tree
        shell: bash
        run: |
          set -euo pipefail
          # gate.sh builds the host test binaries but only runs the core suite.
          ctest --test-dir host/build-linux --output-on-failure --no-tests=error

      - name: pytest web/gateway and web/deploy
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/gateway-venv"
          python3.13 -m venv "${venv}"
          "${venv}/bin/python" -m pip install --disable-pip-version-check -r web/gateway/requirements.txt pytest==9.1.1
          cd web/gateway
          "${venv}/bin/python" -m pytest tests -q
          # The real-kernel quota cases skip unless CHUDWARE_TEST_QUOTA_PLAN is set.
          "${venv}/bin/python" -m pytest ../deploy/tests -q
