# Release-time per-platform configure + build + ctest. Ordinary master pushes
# use fast-gate + linux-gate only; Windows and macOS runners are reserved for a
# `v*` release tag (or an explicit manual dispatch).
#
# Each row configures through the CMake preset that platform actually ships
# with, builds it, and then runs that tree's ctest. The presets are the same
# ones a developer uses by hand, so a green release row means the documented
# build command works on a clean checkout, not that a CI-only incantation does.
#
# Rows are independent (fail-fast: false): a broken macOS toolchain must not
# hide a Windows regression.
#
# Nothing is uploaded. Build outputs are about 500 MB per platform and Actions
# artifact storage is metered above the 500 MB shared with Packages, accrued
# hourly and never refunded. Release artifacts go through release.yml's
# authenticated handoff; diagnostics stay in the job log and step summary.
name: native-build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel. This is a coherent multi-platform build of one commit; a
# half-cancelled matrix leaves two platforms reporting on different trees, and
# the whole value of the workflow is that the four rows describe one commit.
concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    # Self-hosted fleet only — hosted minutes are billed on this private
    # repository, and a compile matrix is the most expensive thing that could
    # land on one. Each row names its own capacity label so legs run in
    # parallel and never contend for a single endpoint.
    runs-on: [self-hosted, "${{ matrix.runner_os }}", "${{ matrix.runner_arch }}", cloudcastle-ci, "${{ matrix.runner_label }}"]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner_os: Linux
            runner_arch: X64
            runner_label: cc-linux-build
            preset: linux-core
            build_host: true
            host_build_dir: host/build-linux
          - label: Windows x86_64
            runner_os: Windows
            runner_arch: X64
            runner_label: cc-win-package
            # windows-core, not windows-occt: OCCT off is the self-contained
            # fast per-push compile gate; the full geometry/FEA package builds separately.
            preset: windows-core
            build_host: true
            host_build_dir: host/build-windows
          - label: macOS arm64
            runner_os: macOS
            runner_arch: ARM64
            runner_label: cc-mac-arm
            preset: macos-arm64
            # Core only. The macOS host GUI is not a phase-1 target: the macOS
            # presets build with CHUDWARE_ENABLE_CEF=OFF, and CEF's offscreen
            # render path has no WKWebView equivalent. Bringing up the core
            # tree is the whole macOS goal for now, so a host row here would be
            # a known-red leg that trains everyone to ignore this workflow.
            build_host: false
            host_build_dir: ''
          - label: macOS x86_64
            runner_os: macOS
            runner_arch: X64
            runner_label: cc-mac-intel
            preset: macos-x86_64
            build_host: false
            host_build_dir: ''
    steps:
      # Before checkout: a missing compiler or an old CMake otherwise surfaces
      # as a confusing configure error with no runner-state evidence attached.
      - name: Check runner capabilities (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown} os=$RUNNER_OS arch=$RUNNER_ARCH host=$(hostname -s)"
          uname -a

          missing=()
          for tool in cmake ninja ctest git python3; do
            command -v "${tool}" >/dev/null 2>&1 || missing+=("${tool}")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::runner ${RUNNER_NAME:-unknown} is missing required tools: ${missing[*]}"
            exit 1
          fi

          # CMakePresets.json requires 3.24 — core/CMakeLists.txt uses
          # $<LINK_GROUP:RESCAN,...>, which older CMake silently mis-generates.
          cmake_version="$(cmake --version | head -n 1 | awk '{print $3}')"
          echo "cmake=${cmake_version} ninja=$(ninja --version)"
          if [ "$(printf '%s\n3.24.0\n' "${cmake_version}" | sort -V | head -n 1)" != "3.24.0" ]; then
            echo "::error::cmake ${cmake_version} is older than the 3.24 the presets require"
            exit 1
          fi

          if [ "$RUNNER_OS" = "macOS" ]; then
            # These hosts carry Command Line Tools only — no full Xcode — so
            # nothing here may reach for xcodebuild.
            sw_vers
            xcode-select -p
            echo "sdk=$(xcrun --show-sdk-version) clang=$(xcrun --find clang)"
            clang --version | head -n 1

            # On everything except Windows, ProvisionOCCT.cmake does not
            # download anything — it goes straight to
            # find_package(OpenCASCADE REQUIRED) against a system install, and
            # the preset's CMAKE_PREFIX_PATH (/opt/homebrew on arm64,
            # /usr/local on Intel) is what lets it see the keg. Without the
            # formula the configure dies on "Could not find a package
            # configuration file provided by OpenCASCADE", which reads like a
            # code defect and is not one. Named here instead, with the fix.
            #
            # Checked, not installed: `brew install opencascade` on a shared
            # runner is a long, host-mutating operation that two concurrent
            # jobs would race through brew's lock. A missing formula is a
            # provisioning ticket, and runner-smoke reports it daily.
            if ! brew list --versions opencascade >/dev/null 2>&1; then
              echo "::error::${RUNNER_NAME:-unknown} has no Homebrew opencascade; the ${{ matrix.preset }} preset configures with CHUDWARE_WITH_OCCT=ON and will fail at find_package. Fix with: brew install opencascade"
              exit 1
            fi
            echo "opencascade=$(brew list --versions opencascade)"
            echo "brew-prefix=$(brew --prefix)"
          fi
          df -h "${RUNNER_TEMP:-/tmp}" "$HOME"

      - name: Check runner capabilities and enter the MSVC environment (Windows)
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1 — these hosts have no pwsh.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "runner=$env:RUNNER_NAME os=$env:RUNNER_OS arch=$env:RUNNER_ARCH host=$env:COMPUTERNAME"
          Write-Host "powershell=$($PSVersionTable.PSVersion)"

          # The Windows runner service runs as NT AUTHORITY\NETWORK SERVICE.
          # It cannot write Program Files, cannot edit the machine PATH, and
          # cannot restart itself to pick a new one up, so runner-smoke's
          # provisioning job installs ninja and Python into a runner-local
          # directory and every Windows job puts that directory on PATH here.
          # Done before the vswhere snapshot below so the dev-shell diff
          # carries it into the build steps. See docs/reference/CI_RUNNERS.md.
          $tools = Join-Path $env:USERPROFILE 'chudware-ci-tools'
          foreach ($dir in @((Join-Path $tools 'bin'), (Join-Path $tools 'python'), (Join-Path $tools 'python\Scripts'))) {
            if (Test-Path $dir) {
              $env:PATH = "$dir;$env:PATH"
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "  path+ $dir"
            }
          }

          foreach ($tool in @('cmake', 'ninja', 'ctest', 'git')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              Write-Host "::error::runner $env:RUNNER_NAME is missing required tool: $tool"
              exit 1
            }
          }
          $cmakeVersion = [version](((cmake --version) -split "`n")[0] -split ' ')[2]
          Write-Host "cmake=$cmakeVersion"
          if ($cmakeVersion -lt [version]'3.24.0') {
            Write-Host "::error::cmake $cmakeVersion is older than the 3.24 the presets require"
            exit 1
          }

          # The windows-core preset builds with MSVC + Ninja, which needs cl and
          # link on PATH. Prefer vswhere when the Visual Studio Installer payload
          # is present. Some Build Tools-only hosts retain a complete VC tree
          # after the Installer directory is removed, so fall back to the
          # authoritative vcvars64.bat location under the VS root.
          $vsPath = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          }
          if (-not $vsPath) {
            $searchRoots = @(
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio'),
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio')
            ) | Where-Object { Test-Path $_ }
            $vcvars = $searchRoots |
              ForEach-Object {
                Get-ChildItem -Path $_ -Filter vcvars64.bat -File -Recurse `
                  -ErrorAction SilentlyContinue
              } |
              Select-Object -First 1
            if ($vcvars) {
              $vsPath = $vcvars.Directory.Parent.Parent.Parent.FullName
              Write-Host "::notice::vswhere unavailable or returned no x64 toolset; found vcvars64.bat at $($vcvars.FullName)"
            }
          }
          if (-not $vsPath) {
            Write-Host "::error::no Visual Studio installation with vcvars64.bat and the x64 C++ toolset on $env:RUNNER_NAME"
            exit 1
          }
          Write-Host "visual-studio=$vsPath"

          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $devShellModule = Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          if (Test-Path $devShellModule) {
            Import-Module $devShellModule
            Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation `
              -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          } else {
            $vcvarsPath = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
            if (-not (Test-Path $vcvarsPath)) {
              Write-Host "::error::Visual Studio root $vsPath has neither DevShell nor vcvars64.bat"
              exit 1
            }
            & cmd.exe /d /s /c "`"$vcvarsPath`" >nul && set" |
              ForEach-Object {
                if ($_ -match '^([^=]+)=(.*)$') {
                  [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
                }
              }
          }

          # Persist only what the dev shell actually changed, so later steps in
          # this job compile with the same toolchain without re-entering it.
          Get-ChildItem env: | ForEach-Object {
            if ($before[$_.Name] -ne $_.Value) {
              "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          # PowerShell 5.1 promotes native stderr merged into its pipeline to a
          # NativeCommandError under Stop. cl writes its healthy banner to
          # stderr, so let cmd merge it before PowerShell sees it, then judge
          # the probe by cl's exit status rather than by which stream it used.
          $compilerOutput = & cmd.exe /d /c 'cl.exe 2>&1'
          $compilerStatus = $LASTEXITCODE
          $compilerOutput | Select-Object -First 1
          if ($compilerStatus -ne 0) { exit $compilerStatus }

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # chudware_version.h is generated at configure time from
          # `git describe --tags`; a shallow clone without tags yields 0.0.0.
          fetch-depth: 0


      # `shell:` must name a literal interpreter — actionlint rejects an
      # expression there, and on these Windows hosts `bash` resolves to an
      # empty WSL shim that exits 0 without running anything. CloudCastle
      # learned that the expensive way (rmm-agent-packages.yml: "every push
      # built a release that reached no endpoint"). So every step that runs on
      # more than one OS is split in two, guarded by `if:`.
      - name: Configure and build core (${{ matrix.preset }}) (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      - name: Configure and build core (${{ matrix.preset }}) (Windows)
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1 — these hosts have no pwsh.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # $ErrorActionPreference does not apply to native exit codes, so each
          # cmake invocation is checked; otherwise a failed configure would run
          # the build and report the build's status.
          cmake --preset ${{ matrix.preset }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset ${{ matrix.preset }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ctest core (${{ matrix.preset }}) (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          # The root dispatcher adds core/ as a subdirectory. enable_testing()
          # lives there, so its CTestTestfile.cmake and registered suite are in
          # build/<preset>/core rather than the dispatcher build directory.
          tree="build/${{ matrix.preset }}/core"
          log="${RUNNER_TEMP}/ctest-core.log"
          status=0
          ctest --test-dir "${tree}" --output-on-failure 2>&1 | tee "${log}" || status=${PIPESTATUS[0]}

          # A configure that registered no tests would otherwise pass silently.
          if grep -qE 'No tests were found' "${log}"; then
            echo "::error::ctest found no tests in ${tree}; the configure did not register the suite"
            exit 1
          fi

          {
            echo '## ctest — ${{ matrix.label }} (${{ matrix.preset }})'
            echo '```text'
            tail -n 40 "${log}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "${status}"

      - name: ctest core (${{ matrix.preset }}) (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          # The root dispatcher adds core/ as a subdirectory; its registered
          # CTest suite is therefore rooted at build/<preset>/core.
          $tree = 'build/${{ matrix.preset }}/core'
          $log = Join-Path $env:RUNNER_TEMP 'ctest-core.log'
          ctest --test-dir $tree --output-on-failure 2>&1 | Tee-Object -FilePath $log
          $status = $LASTEXITCODE

          if (Select-String -Path $log -Pattern 'No tests were found' -Quiet) {
            Write-Host "::error::ctest found no tests in $tree; the configure did not register the suite"
            exit 1
          }

          $tail = (Get-Content $log -Tail 40) -join "`n"
          @(
            '## ctest -- ${{ matrix.label }} (${{ matrix.preset }})'
            '```text'
            $tail
            '```'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          exit $status

      # This compile-and-test gate deliberately disables the 1.5 GB gitignored
      # CEF SDK on every host configure; makeWebView then uses NullWebView.
      # Consequence: native-build does not compile the CEF backend, so a
      # CEF-only break surfaces at release time. release.yml intentionally
      # remains CEF-enabled and must build against a provisioned SDK.
      - name: Configure and build host GUI (POSIX)
        if: matrix.build_host && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S host -B ${{ matrix.host_build_dir }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHUDWARE_ENABLE_CEF=OFF
          cmake --build ${{ matrix.host_build_dir }}

      - name: Configure and build host GUI (Windows)
        if: matrix.build_host && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S host -B ${{ matrix.host_build_dir }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHUDWARE_ENABLE_CEF=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build ${{ matrix.host_build_dir }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ctest host GUI (POSIX)
        if: matrix.build_host && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          tree="${{ matrix.host_build_dir }}"
          if [ ! -f "${tree}/CTestTestfile.cmake" ]; then
            echo "::error::${tree} has no CTest configuration; the host configure did not complete"
            exit 1
          fi

          log="${RUNNER_TEMP}/ctest-host.log"
          status=0
          ctest --test-dir "${tree}" --output-on-failure 2>&1 | tee "${log}" || status=${PIPESTATUS[0]}

          {
            echo '## ctest — host GUI (${{ matrix.label }})'
            echo '```text'
            tail -n 40 "${log}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "${status}"

      - name: clang-tidy first-party Linux sources
        if: matrix.preset == 'linux-core'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for tool in clang-tidy run-clang-tidy; do
            command -v "${tool}" >/dev/null || {
              echo "::error::${tool} is missing from the Linux build runner"
              exit 1
            }
          done
          clang-tidy --version | head -n 1
          run-clang-tidy -p build/linux-core -j 0 --quiet \
            -source-filter='.*[/\\]core[/\\]'
          run-clang-tidy -p ${{ matrix.host_build_dir }} -j 0 --quiet \
            -source-filter='.*[/\\](host|core|platform)[/\\]'

      - name: ctest host GUI (Windows)
        if: matrix.build_host && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $tree = '${{ matrix.host_build_dir }}'
          if (-not (Test-Path (Join-Path $tree 'CTestTestfile.cmake'))) {
            Write-Host "::error::$tree has no CTest configuration; the host configure did not complete"
            exit 1
          }

          $log = Join-Path $env:RUNNER_TEMP 'ctest-host.log'
          ctest --test-dir $tree --output-on-failure 2>&1 | Tee-Object -FilePath $log
          $status = $LASTEXITCODE

          $tail = (Get-Content $log -Tail 40) -join "`n"
          @(
            '## ctest -- host GUI (${{ matrix.label }})'
            '```text'
            $tail
            '```'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          exit $status

      - name: Headless host GUI smoke (Windows)
        if: matrix.build_host && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          # Force the managed worker to fail immediately, then point the
          # cross-platform C++ fallback at the DLL built by this same matrix
          # row. This exercises AppState::tryStartWorker's Windows fallback,
          # not a pre-provisioned runtime left behind on the persistent runner.
          $env:CHUDWARE_WORKER_BIN = Join-Path $env:RUNNER_TEMP 'missing-chudware-worker.exe'
          $env:CHUDWARE_LIBCHUDWARE = (Resolve-Path 'build\${{ matrix.preset }}\bin\libchudware.dll').Path
          $env:CHUDWARE_ENGINE_DAEMON = '0'
          $env:CHUDWARE_SHOT = 'chat'

          $shot = Join-Path $env:RUNNER_TEMP 'chudware-native-smoke.png'
          $log = Join-Path $env:RUNNER_TEMP 'chudware-native-smoke.log'
          Remove-Item -Force -ErrorAction SilentlyContinue $shot, $log

          & '.\${{ matrix.host_build_dir }}\bin\chudware.exe' --ui-screenshot $shot 2>&1 |
            Tee-Object -FilePath $log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Host "::error::headless host capture exited with status $status"
            exit $status
          }
          if (-not (Test-Path $shot -PathType Leaf)) {
            Write-Host "::error::headless host capture wrote no PNG"
            exit 1
          }

          $bytes = [IO.File]::ReadAllBytes($shot)
          $png = @(137, 80, 78, 71, 13, 10, 26, 10)
          if ($bytes.Length -lt 8) {
            Write-Host "::error::headless host capture is only $($bytes.Length) bytes"
            exit 1
          }
          for ($i = 0; $i -lt $png.Count; $i++) {
            if ($bytes[$i] -ne $png[$i]) {
              Write-Host "::error::headless host capture does not have a PNG signature"
              exit 1
            }
          }
          if (-not (Select-String -Path $log -SimpleMatch '[cpp_core] loaded libchudware' -Quiet)) {
            Write-Host "::error::Windows headless capture did not exercise the in-process C++ fallback"
            exit 1
          }

          @(
            '## Headless GUI smoke -- Windows x86_64'
            ''
            "PNG: $($bytes.Length) bytes"
            "Core: $env:CHUDWARE_LIBCHUDWARE"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

