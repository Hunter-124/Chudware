# Per-platform configure, build and ctest through the same CMake presets a
# developer uses by hand, so a green row means the documented build command
# works on a clean checkout.
#
#   Linux x86_64    fedora:44 container (system OCCT 7.9), core + host GUI
#   Windows x86_64  windows-occt preset (pinned OCCT 7.9.3 SDK), core + host GUI
#   macOS arm64     macos-arm64 preset (Homebrew OCCT), core only
#
# The host GUI is built with CEF disabled; the CEF backend is compiled by
# release.yml, which builds against the pinned SDK. Nothing is uploaded.
# Ninja reports independent compiler failures in one run; -k 0 still fails the build.
name: native-build

on:
  push:
    branches: [master]
    paths:
      - 'core/**'
      - 'host/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/native-build.yml'
      - '.github/scripts/install-fedora-deps.sh'
      - '.github/scripts/prepare-linux-ci.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
      options: --init
    timeout-minutes: 240
    steps:
      - name: Install git
        run: dnf -y install git

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # chudware_version.h is generated from `git describe --tags`.
          fetch-depth: 0

      - name: Initialize private state and checkout trust
        run: bash .github/scripts/prepare-linux-ci.sh

      - name: Install build dependencies
        run: bash .github/scripts/install-fedora-deps.sh

      - name: Configure and build core (linux-core)
        run: |
          cmake --preset linux-core
          cmake --build --preset linux-core -- -k 0

      - name: ctest core
        run: ctest --test-dir build/linux-core/core --output-on-failure --no-tests=error

      - name: Configure and build host GUI
        run: |
          cmake -S host -B host/build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHUDWARE_ENABLE_CEF=OFF
          cmake --build host/build-linux -- -k 0

      - name: ctest host GUI
        run: ctest --test-dir host/build-linux --output-on-failure --no-tests=error

  windows:
    name: Windows x86_64
    runs-on: windows-2025
    # Full MSVC Release/LTO links can exceed four hours on hosted runners.
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Enter the MSVC x64 developer environment
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'No Visual Studio installation with the x64 C++ toolset' }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          # Persist only what the developer shell changed so later steps use the same toolchain.
          Get-ChildItem env: | Where-Object { $before[$_.Name] -ne $_.Value } |
            ForEach-Object { "$($_.Name)=$($_.Value)" } | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Refresh Windows source junctions
        run: |
          powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts\setup_windows_links.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure and build core (windows-occt)
        run: |
          cmake --preset windows-occt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-occt -- -k 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ctest core
        run: ctest --test-dir build/windows-occt/core --output-on-failure --no-tests=error

      - name: Configure and build host GUI
        run: |
          cmake -S host -B host/build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHUDWARE_ENABLE_CEF=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build host/build-windows -- -k 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: ctest host GUI
        run: ctest --test-dir host/build-windows --output-on-failure --no-tests=error

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install build dependencies
        run: brew install ninja opencascade

      - name: Configure and build core (macos-arm64)
        run: |
          cmake --preset macos-arm64
          cmake --build --preset macos-arm64 -- -k 0

      - name: ctest core
        run: ctest --test-dir build/macos-arm64/core --output-on-failure --no-tests=error
