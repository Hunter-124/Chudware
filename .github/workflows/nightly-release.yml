# Automatic nightly beta releases, signed in CI.
#
# release.yml is the offline-ceremony pipeline: it prepares bounded signing
# requests and STOPS, because a stable release must be signed on the owner
# workstation with the age-encrypted release-v1 key. This workflow is the other
# half Hunter approved: a fully automatic BETA build, signed in CI with a second
# key (release-ci-v1, GitHub secret CHUDWARE_RELEASE_CI_KEY), published to the
# beta channel every night when the commit changed. Promotion to stable stays a
# human click in /admin, which is why every build signs the artifact twice: once
# under the beta version it publishes now, once under the stable version the
# promote button will publish later without rebuilding a byte.
#
# Trust boundaries that shape every step below:
#   * The gateway release token is used two different ways, because the runners
#     are not on one network. `plan` and `linux-beta` run ON the gateway host:
#     they read the token from /home/liveuser/chudware-web-data/gateway.env at
#     the point of use and talk to http://127.0.0.1:8300, so the token never
#     leaves the box. The Windows and macOS builders cannot route to that host
#     at all (192.168.1.x and 192.168.0.x do not talk to each other, proven by
#     diagnostic), so they hold the same token as the GitHub secret
#     CHUDWARE_GATEWAY_RELEASE_TOKEN and reach the gateway over TLS on
#     https://app.chudware.com: artifacts stream in through
#     PUT /api/releases/ci/upload/<name>, then the ordinary ci/publish and
#     ci/status calls follow. Those runners need nothing but outbound 443.
#   * On every host the token reaches curl through a 0600 --config file, never
#     argv (a shared runner's process list is readable), never a log.
#   * The CI signing seed is only in the environment of the steps that sign.
#   * No actions/upload-artifact anywhere: artifact storage is metered and the
#     installers are ~500 MB. Diagnostics go to the (unmetered) step summary.
#
# `bash` on the Windows builders is an empty WSL shim that exits 0 without
# running anything (see native-build.yml), so every Windows step is Windows
# PowerShell 5.1 with an ASCII-only body. The Macs are the mirror image: they
# have a real bash, but it is Apple's bash 3.2, so every macOS step body stays
# within 3.2 (no associative arrays, no mapfile, no ${var^^}) and uses string
# accumulators rather than arrays, because `"${array[@]}"` on an empty array
# under `set -u` is an unbound-variable error before bash 4.4.
name: nightly-release

on:
  schedule:
    # 09:17 UTC. Off the hour: GitHub delays scheduled runs at popular minutes.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One nightly at a time. A fresh dispatch SUPERSEDES a stale one: an always-
  # offline runner (the cc-mac-arm laptop sleeps most days) would otherwise hold
  # this group hostage for GitHub's 24h queued-job timeout and stop every later
  # build. ci/publish is idempotent by run identity and the gateway re-digests
  # anything staged, so a cancelled leg leaves nothing trusted behind.
  group: nightly-release
  cancel-in-progress: true

env:
  CHUDWARE_RELEASE_KEY_ID: release-ci-v1
  # Public half of release-ci-v1. Passed to every ci_sign.py call so a rotated or
  # mistyped secret fails before anything is signed, and to the payload/AppImage
  # verifiers so they check the same key the shipped keyring trusts.
  CHUDWARE_RELEASE_CI_PUBLIC_KEY: d7434dc67f4d6e11cd4c8ced9b5ebbccf2e1477b5949d52d7685b6ca43a010f6
  CHUDWARE_GATEWAY_LOOPBACK: http://127.0.0.1:8300
  CHUDWARE_GATEWAY_ENV_FILE: /home/liveuser/chudware-web-data/gateway.env
  # Anonymous, rate-limited, read-only: the public URL is correct here. Only
  # publishing is restricted to loopback.
  CHUDWARE_BASE_VERSION_URL: https://app.chudware.com/api/releases/base-version
  # Nightly betas have no per-version notes page yet; the portal is the honest
  # destination and satisfies the gateway's absolute-HTTP(S) requirement.
  CHUDWARE_RELEASE_NOTES_URL: https://app.chudware.com/
  # A beta publish must never advance the supported-version floor: the gateway
  # refuses to move it backward, so a nightly that raised it would strand every
  # installed client. Raising the floor is a deliberate stable-release decision
  # made through packaging/publish.py register --min-supported.
  CHUDWARE_RELEASE_MIN_SUPPORTED: 0.1.0
  # The Windows and macOS builders cannot route to the gateway's LAN address, so
  # they use the public origin. Uploading is authenticated with the release
  # token; /api/releases/ci is a public pass-through in auth.py precisely so
  # these three endpoints can be reached from off-LAN with the Bearer enforced
  # in the handler.
  CHUDWARE_GATEWAY_PUBLIC_BASE: https://app.chudware.com
  # Shared by both off-LAN legs. The CI endpoints have their own per-IP budget
  # (_ci_by_ip, 240/min) rather than the 20/min manual publish limiter, so a
  # normal night is nowhere near it; these retries are belt-and-suspenders for a
  # throttle, a 5xx or a dropped connection part-way through a 500 MB upload.
  # curl has retried 429 as well as 5xx since 7.51.
  CHUDWARE_GATEWAY_CURL_RETRY: --retry 5 --retry-delay 15 --retry-max-time 600

jobs:
  plan:
    name: Plan nightly version
    # The gateway host: this job reads gateway.env and talks to loopback.
    runs-on: [self-hosted, Linux, X64, cloudcastle-ci, cc-linux-build]
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      stable_version: ${{ steps.plan.outputs.stable_version }}
      commit: ${{ steps.plan.outputs.commit }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - name: Resolve the nightly version and decide whether this commit needs a build
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          for tool in curl python3; do
            command -v "${tool}" >/dev/null 2>&1 || {
              echo "::error::runner ${RUNNER_NAME:-unknown} is missing ${tool}"; exit 1; }
          done
          test -r "${CHUDWARE_GATEWAY_ENV_FILE}" || {
            echo "::error::${CHUDWARE_GATEWAY_ENV_FILE} is not readable; this job must run on the gateway host so publishing stays on loopback"
            exit 1
          }

          # Token to a 0600 curl config: never in argv (ps), never echoed.
          curlrc="${RUNNER_TEMP}/gw.curlrc"
          umask 077
          python3 - "${CHUDWARE_GATEWAY_ENV_FILE}" > "${curlrc}" <<'PY'
          import sys
          token = ""
          with open(sys.argv[1], encoding="utf-8") as stream:
              for line in stream:
                  line = line.strip()
                  if line.startswith("CHUDWARE_GATEWAY_RELEASE_TOKEN="):
                      token = line.split("=", 1)[1].strip().strip("'\"")
          if not token:
              raise SystemExit("gateway.env has no CHUDWARE_GATEWAY_RELEASE_TOKEN")
          print('header = "Authorization: Bearer %s"' % token)
          PY

          # Stable base the promote button will publish: highest stable patch + 1,
          # floor 0.1.0. Anonymous read, so the public URL is fine.
          base_json="${RUNNER_TEMP}/base-version.json"
          curl --fail-with-body --silent --show-error --location --max-time 30 \
            --output "${base_json}" "${CHUDWARE_BASE_VERSION_URL}"
          stable_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["base"])' "${base_json}")"
          [[ "${stable_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::gateway returned a non-canonical base version: ${stable_version}"; exit 1; }

          version="${stable_version}-beta.${GITHUB_RUN_NUMBER}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::computed version ${version} is not a valid semver"; exit 1; }

          # Nightly-if-changed: a scheduled run whose HEAD already published is a
          # rebuild of identical bytes under a new beta number. A manual dispatch
          # always builds (that is what dispatch is for).
          skip=false
          if [ "${GITHUB_EVENT_NAME}" = schedule ]; then
            builds="${RUNNER_TEMP}/ci-builds.json"
            if curl --config "${curlrc}" --fail-with-body --silent --show-error --max-time 30 \
                 --output "${builds}" \
                 "${CHUDWARE_GATEWAY_LOOPBACK}/api/releases/ci/builds?commit_sha=${GITHUB_SHA}&status=published"; then
              published="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["builds"]))' "${builds}")"
              if [ "${published}" -gt 0 ]; then
                skip=true
                echo "::notice::${GITHUB_SHA} already has ${published} published CI build(s); skipping tonight"
              fi
            else
              echo "::warning::could not read ci_builds from the gateway; building rather than skipping"
            fi
          fi

          {
            echo "version=${version}"
            echo "stable_version=${stable_version}"
            echo "commit=${GITHUB_SHA}"
            echo "skip=${skip}"
          } >> "$GITHUB_OUTPUT"

          {
            echo '## Nightly plan'
            echo ''
            echo "* beta version: \`${version}\`"
            echo "* stable pair: \`${stable_version}\`"
            echo "* commit: \`${GITHUB_SHA}\`"
            echo "* skip: \`${skip}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record every platform and architecture as queued
        if: steps.plan.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/queued.json"
          # One row per build leg, keyed the way ci_builds is: (run_id, platform,
          # arch). The macOS rows matter most: cc-mac-arm is often asleep, and a
          # queued row is the only honest record that a leg was expected at all.
          for target in linux:x86_64 windows:x86_64 macos:arm64 macos:x86_64; do
            platform="${target%%:*}"
            arch="${target##*:}"
            python3 - "${platform}" "${arch}" "${{ steps.plan.outputs.version }}" > "${body}" <<'PY'
          import json, os, sys
          json.dump({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "channel": "beta",
              "platform": sys.argv[1],
              "arch": sys.argv[2],
              "version": sys.argv[3],
              "status": "queued",
              "detail": "nightly-release run %s" % os.environ["GITHUB_RUN_NUMBER"],
          }, sys.stdout)
          PY
            curl --config "${RUNNER_TEMP}/gw.curlrc" --fail-with-body --silent --show-error \
              --max-time 60 -H 'Content-Type: application/json' \
              --data-binary "@${body}" "${CHUDWARE_GATEWAY_LOOPBACK}/api/releases/ci/status" \
              > /dev/null || echo "::warning::could not record queued status for ${platform} ${arch}"
          done

  linux-beta:
    name: Linux beta AppImage
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: [self-hosted, Linux, X64, cloudcastle-ci, cc-linux-build]
    timeout-minutes: 300
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_STABLE_VERSION: ${{ needs.plan.outputs.stable_version }}
      RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
      RELEASE_PLATFORM: linux
      RELEASE_ARCH: x86_64
      CORE_PRESET: linux-core
      HOST_BUILD_DIR: host/build-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The version override replaces `git describe`, but packaging still
          # reads tags for provenance and the gate expects a full history.
          fetch-depth: 0

      - name: Check runner capabilities and open the gateway loopback
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for tool in cmake ninja ctest python3 curl tar file ldd sha256sum strip rsync xvfb-run bun patchelf; do
            command -v "${tool}" >/dev/null 2>&1 || missing+=("${tool}")
          done
          # The AppImage compiles the Python sidecars with Nuitka, which the
          # system interpreter does not carry (PEP 668). runner-provision's
          # provision-linux job creates this venv.
          release_python="${HOME}/chudware-ci-tools/release-python/bin/python3"
          if [ -x "${release_python}" ] && "${release_python}" -c 'import nuitka, cryptography, yaml' >/dev/null 2>&1; then
            echo "CHUDWARE_RELEASE_PYTHON=${release_python}" >> "$GITHUB_ENV"
            echo "release python: $("${release_python}" --version) with nuitka"
          else
            missing+=("release-python-with-packaging/requirements-release.txt")
          fi
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::runner ${RUNNER_NAME:-unknown} is missing required tools: ${missing[*]}. Run runner-provision (provision-linux) against this label and re-dispatch."
            exit 1
          fi

          test -r "${CHUDWARE_GATEWAY_ENV_FILE}" || {
            echo "::error::${CHUDWARE_GATEWAY_ENV_FILE} is not readable. This job publishes over loopback, so it must run ON the gateway host; the alternative is the scp+ssh path windows-beta uses."
            exit 1
          }

          curlrc="${RUNNER_TEMP}/gw.curlrc"
          umask 077
          python3 - "${CHUDWARE_GATEWAY_ENV_FILE}" "${curlrc}" "${RUNNER_TEMP}/releases-dir.txt" <<'PY'
          import os, sys

          wanted = {"CHUDWARE_GATEWAY_RELEASE_TOKEN": "", "CHUDWARE_RELEASES_DIR": ""}
          with open(sys.argv[1], encoding="utf-8") as stream:
              for line in stream:
                  key, _, value = line.strip().partition("=")
                  if key in wanted:
                      wanted[key] = value.strip().strip("'\"")
          token = wanted["CHUDWARE_GATEWAY_RELEASE_TOKEN"]
          if not token:
              raise SystemExit("gateway.env has no CHUDWARE_GATEWAY_RELEASE_TOKEN")
          with open(sys.argv[2], "w", encoding="ascii") as config:
              config.write('header = "Authorization: Bearer %s"\n' % token)
          with open(sys.argv[3], "w", encoding="utf-8") as out:
              out.write((wanted["CHUDWARE_RELEASES_DIR"] or os.path.expanduser("~/chudware-releases")) + "\n")
          PY
          releases_dir="$(cat "${RUNNER_TEMP}/releases-dir.txt")"
          mkdir -p "${releases_dir}/incoming"
          test -w "${releases_dir}/incoming" || {
            echo "::error::${releases_dir}/incoming is not writable by this runner"; exit 1; }
          echo "RELEASES_DIR=${releases_dir}" >> "$GITHUB_ENV"

          # One helper, sourced by every later step: loopback only, token only
          # from the config file.
          cat > "${RUNNER_TEMP}/gw.sh" <<'SH'
          gw_post() {  # gw_post <path> <json file>
            curl --config "${RUNNER_TEMP}/gw.curlrc" --fail-with-body --silent --show-error \
              --max-time 300 -H 'Content-Type: application/json' \
              --data-binary "@$2" "${CHUDWARE_GATEWAY_LOOPBACK}$1"
          }
          ci_status() {  # ci_status <status> <detail>
            local body="${RUNNER_TEMP}/ci-status.json"
            python3 - "$1" "$2" > "${body}" <<'PY'
          import json, os, sys
          json.dump({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "commit_sha": os.environ["RELEASE_COMMIT"],
              "channel": "beta",
              "platform": os.environ["RELEASE_PLATFORM"],
              "arch": os.environ["RELEASE_ARCH"],
              "version": os.environ["RELEASE_VERSION"],
              "status": sys.argv[1],
              "detail": sys.argv[2],
          }, sys.stdout)
          PY
            gw_post /api/releases/ci/status "${body}" > /dev/null \
              || echo "::warning::ci/status ${1} was not recorded"
          }
          SH
          . "${RUNNER_TEMP}/gw.sh"
          ci_status building "configuring core + host for ${RELEASE_VERSION}"

      - name: Generate protected assets and build core + host at the pinned version
        shell: bash
        run: |
          set -euo pipefail
          protected_assets="${HOST_BUILD_DIR}/generated/protected-assets"
          python3 packaging/embed_protected_assets.py --source-root . --output-dir "${protected_assets}"

          cmake --preset "${CORE_PRESET}" \
            -DCHUDWARE_DEVELOPER_BUILD=OFF \
            -DCHUDWARE_VERSION_OVERRIDE="${RELEASE_VERSION}" \
            -DCHUDWARE_PROTECTED_ASSETS_DIR="${GITHUB_WORKSPACE}/${protected_assets}"
          cmake --build --preset "${CORE_PRESET}"

          # The shipped build has the CEF webview on; the SDK is provisioned on
          # the runner outside the repo (fresh checkouts carry no extern/cef).
          cef_root="$(ls -d "${HOME}"/chudware-cef-sdk/cef_binary_* 2>/dev/null | sort | tail -1 || true)"
          [ -n "${cef_root}" ] || {
            echo "::error::no CEF SDK under ${HOME}/chudware-cef-sdk — the release build needs CHUDWARE_ENABLE_CEF=ON and cef.cmake only searches extern/cef without CEF_ROOT"; exit 1; }

          cmake -S host -B "${HOST_BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHUDWARE_DEVELOPER_BUILD=OFF \
            -DCHUDWARE_VERSION_OVERRIDE="${RELEASE_VERSION}" \
            -DCHUDWARE_PROTECTED_ASSETS_DIR="${GITHUB_WORKSPACE}/${protected_assets}" \
            -DCEF_ROOT="${cef_root}"
          cmake --build "${HOST_BUILD_DIR}"

          # Prove both caches carry the release identity rather than a git-derived
          # 0.0.0-dirty, and that neither tree is a developer build.
          for cache in "build/${CORE_PRESET}/CMakeCache.txt" "${HOST_BUILD_DIR}/CMakeCache.txt"; do
            grep -Fqx "CHUDWARE_VERSION_OVERRIDE:STRING=${RELEASE_VERSION}" "${cache}" || {
              echo "::error::${cache} does not carry CHUDWARE_VERSION_OVERRIDE=${RELEASE_VERSION}"; exit 1; }
            grep -Fqx 'CHUDWARE_DEVELOPER_BUILD:BOOL=OFF' "${cache}" || {
              echo "::error::${cache} is not an explicit production configure"; exit 1; }
          done
          grep -Fq "\"${RELEASE_VERSION}\"" "${HOST_BUILD_DIR}/generated/api/chudware_version.h" || {
            echo "::error::generated version header does not contain ${RELEASE_VERSION}"; exit 1; }

      - name: Run the core and host test suites
        shell: bash
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/gw.sh"
          ci_status testing "ctest core + host"

          log="${RUNNER_TEMP}/ctest.log"
          ctest --test-dir "build/${CORE_PRESET}/core" --timeout 900 --output-on-failure 2>&1 | tee "${log}"
          ctest --test-dir "${HOST_BUILD_DIR}" --timeout 900 --output-on-failure 2>&1 | tee -a "${log}"
          if grep -qE 'No tests were found' "${log}"; then
            echo "::error::a configure registered no tests; the platform-test evidence would be a lie"
            exit 1
          fi
          {
            echo '## ctest -- linux beta'
            echo '```text'
            tail -n 30 "${log}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Headless GUI smoke capture (advisory)
        shell: bash
        run: |
          # The runner invokes bash with -e on the command line; an in-script
          # `set -uo pipefail` does NOT clear it, which is why the advisory step
          # still failed the job. Turn -e off explicitly.
          set +e
          set -uo pipefail
          mkdir -p scratch
          rm -f scratch/smoke.png
          # ADVISORY, not a gate. The production (CEF-on) build reliably
          # deadlocks inside exit handlers in this scenario — the tracked
          # T-RF23 Chromium exit hang, reproduced here at rc=137 with
          # CHUDWARE_CEF_LAZY=1 as well, so it is not merely eager CEF init.
          # The hard artifact gates are ctest (above) and the extracted-AppImage
          # verification (below: ldd clean, hostd --status loads, signed payload
          # manifest verifies), which prove the shipped bytes without depending
          # on a GUI teardown bug. Turn this back into a gate when T-RF23 lands.
          timeout --signal=KILL 180 \
            xvfb-run -a --server-args='-screen 0 1920x1080x24' \
            env CHUDWARE_SHOT=m1 CHUDWARE_CEF_LAZY=1 "./${HOST_BUILD_DIR}/bin/chudware" \
              --ui-screenshot "${GITHUB_WORKSPACE}/scratch/smoke.png"
          rc=$?
          if [ "${rc}" -ne 0 ]; then
            echo "::warning::headless capture did not exit cleanly (rc=${rc}); T-RF23 exit hang — artifact gates still apply"
          elif [ ! -s scratch/smoke.png ]; then
            echo "::warning::headless capture exited cleanly but wrote no screenshot"
          else
            python3 -c 'import sys; sys.exit(0 if open("scratch/smoke.png","rb").read(8) == b"\x89PNG\r\n\x1a\n" else "smoke capture is not a PNG")' \
              && echo "smoke capture: $(stat -c %s scratch/smoke.png) bytes"
          fi

      - name: Stage the immutable payload and sign it
        env:
          CHUDWARE_RELEASE_CI_KEY: ${{ secrets.CHUDWARE_RELEASE_CI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/gw.sh"
          ci_status packaging "staging AppDir and signing the payload manifest"

          out="${RUNNER_TEMP}/prepared"
          rm -rf "${out}"
          mkdir -p "${out}"
          packaging/linux/build_appimage.sh --prepare-signing \
            --key-id "${CHUDWARE_RELEASE_KEY_ID}" --out "${out}" \
            --protected-assets-dir "${HOST_BUILD_DIR}/generated/protected-assets" \
            --host-bin "${HOST_BUILD_DIR}/bin/chudware" \
            --hostd-bin "build/${CORE_PRESET}/bin/chudware-hostd" \
            --libchudware-bin "build/${CORE_PRESET}/bin/libchudware.so"

          # The finalizer re-verifies the prepared tree against exactly these
          # locked inputs and commands, so record them the way release.yml does.
          printf '%s\n' 'ctest core' 'ctest host' > "${out}/test-commands.txt"
          mkdir -p "${out}/packaging" "${out}/vendor/omp"
          cp CMakePresets.json "${out}/CMakePresets.json"
          cp packaging/requirements-release.txt "${out}/packaging/requirements-release.txt"
          cp vendor/omp/bun.lock "${out}/vendor/omp/bun.lock"
          python3 - "${out}" <<'PY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          names = ('CMakePresets.json', 'packaging/requirements-release.txt', 'vendor/omp/bun.lock')
          handoff = {
              'schema': 'chudware-offline-handoff-v1',
              'commit': os.environ['RELEASE_COMMIT'],
              'version': os.environ['RELEASE_VERSION'],
              'channel': 'beta',
              'platform': os.environ['RELEASE_PLATFORM'],
              'arch': os.environ['RELEASE_ARCH'],
              'locked_inputs': [
                  {'path': name, 'sha256': hashlib.sha256((root / name).read_bytes()).hexdigest()}
                  for name in names
              ],
          }
          (root / 'handoff.json').write_bytes(
              json.dumps(handoff, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode('ascii') + b'\n')
          PY

          tar -C "${out}" -cf "${RUNNER_TEMP}/prepared.tar" .

          request="$(find "${out}" -type f -name '*payload-signing-request.bin' -print -quit)"
          test -s "${request}" || { echo '::error::payload signing request missing'; exit 1; }
          "${CHUDWARE_RELEASE_PYTHON}" packaging/ci_sign.py \
            --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
            --output "${RUNNER_TEMP}/payload.sig" \
            sign payload "${request}" > /dev/null
          echo "payload manifest signed with ${CHUDWARE_RELEASE_KEY_ID}"

      - name: Finalize the AppImage and sign the artifact and evidence
        env:
          CHUDWARE_RELEASE_CI_KEY: ${{ secrets.CHUDWARE_RELEASE_CI_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          public_key_b64="$(python3 -c 'import base64,os,sys; sys.stdout.write(base64.b64encode(bytes.fromhex(os.environ["CHUDWARE_RELEASE_CI_PUBLIC_KEY"])).decode())')"
          echo "RELEASE_PUBLIC_KEY_B64=${public_key_b64}" >> "$GITHUB_ENV"
          final="${RUNNER_TEMP}/final"
          rm -rf "${final}"

          # finalize_release.py embeds the payload signature, builds the AppImage,
          # then generates SBOM/provenance/platform-test evidence and every
          # remaining signing request. Evidence generation is the LAST stage, so a
          # failure there still leaves a complete, signed AppImage: a beta may ship
          # without an evidence bundle (promotion to stable may not), and that is a
          # loud warning rather than a silent omission.
          status=0
          "${CHUDWARE_RELEASE_PYTHON}" packaging/finalize_release.py "${RUNNER_TEMP}/prepared.tar" \
            --payload-signature "${RUNNER_TEMP}/payload.sig" \
            --release-public-key "${public_key_b64}" \
            --platform "${RELEASE_PLATFORM}" --arch "${RELEASE_ARCH}" \
            --version "${RELEASE_VERSION}" --commit "${RELEASE_COMMIT}" --channel beta \
            --locked-input CMakePresets.json \
            --locked-input packaging/requirements-release.txt \
            --locked-input vendor/omp/bun.lock \
            --command 'ctest core' --command 'ctest host' \
            --out "${final}" || status=$?

          artifact="$(find "${final}" -type f -name "Chudware-${RELEASE_VERSION}-linux-x86_64.AppImage" -print -quit || true)"
          if [ -z "${artifact}" ]; then
            echo "::error::finalize_release.py failed before producing the AppImage (exit ${status})"
            exit 1
          fi
          evidence=1
          if [ "${status}" -ne 0 ]; then
            echo "::warning::release evidence generation failed (finalize exit ${status}); publishing this beta WITHOUT an evidence bundle, so it cannot be promoted to stable until a later build succeeds"
            evidence=0
          fi
          echo "ARTIFACT=${artifact}" >> "$GITHUB_ENV"
          echo "HAS_EVIDENCE=${evidence}" >> "$GITHUB_ENV"

          # Sign the artifact identity twice over the same bytes: the beta version
          # published now, and the stable version /admin will promote to.
          "${CHUDWARE_RELEASE_PYTHON}" packaging/ci_sign.py --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
            --output "${RUNNER_TEMP}/artifact.sig" \
            artifact --key-id "${CHUDWARE_RELEASE_KEY_ID}" --version "${RELEASE_VERSION}" \
            --platform "${RELEASE_PLATFORM}" --arch "${RELEASE_ARCH}" --artifact "${artifact}" \
            --request-out "${RUNNER_TEMP}/artifact-request.bin" > /dev/null
          "${CHUDWARE_RELEASE_PYTHON}" packaging/ci_sign.py --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
            --output "${RUNNER_TEMP}/artifact-stable.sig" \
            artifact --key-id "${CHUDWARE_RELEASE_KEY_ID}" --version "${RELEASE_STABLE_VERSION}" \
            --platform "${RELEASE_PLATFORM}" --arch "${RELEASE_ARCH}" --artifact "${artifact}" > /dev/null

          # The finalizer bound its own copy of the beta preimage; if the two ever
          # disagreed the gateway would reject one of them, so compare them here.
          emitted="${artifact}.artifact-signing-request.bin"
          if [ -f "${emitted}" ]; then
            cmp -s "${emitted}" "${RUNNER_TEMP}/artifact-request.bin" || {
              echo '::error::finalizer and ci_sign disagree about the artifact preimage'; exit 1; }
          fi

          if [ "${evidence}" = 1 ]; then
            dir="${final}/evidence"
            for pair in 'sbom.cdx.json:sbom' 'provenance.slsa.json:provenance' 'platform-test.v1.json:platform-test'; do
              name="${pair%%:*}"
              kind="${pair##*:}"
              "${CHUDWARE_RELEASE_PYTHON}" packaging/ci_sign.py --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
                --output "${dir}/${name}.sig" \
                sign "${kind}" "${dir}/${name}.signing-request.bin" > /dev/null
            done
            # The platform-test document is only honest if it names the suites that
            # actually ran in this job.
            python3 - "${dir}/platform-test.v1.json" <<'PY'
          import json, sys
          document = json.load(open(sys.argv[1], encoding="utf-8"))
          missing = {"ctest core", "ctest host"} - set(document.get("commands", []))
          if missing or document.get("passed") is not True:
              raise SystemExit("platform-test evidence does not record the executed suites: %s" % sorted(missing))
          PY
            echo "evidence signed: sbom, provenance, platform-test"
          fi

      - name: Verify the built AppImage before it is offered to anyone
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/verify"
          rm -rf "${work}"
          mkdir -p "${work}"
          cp "${ARTIFACT}" "${work}/artifact.AppImage"
          chmod +x "${work}/artifact.AppImage"
          ( cd "${work}" && ./artifact.AppImage --appimage-extract > extract.log 2>&1 )
          root="${work}/squashfs-root"
          test -x "${root}/usr/bin/chudware" || {
            echo '::error::extracted AppImage has no executable GUI binary'; exit 1; }

          # 1. Nothing in the shipped tree may need a library the AppImage does not
          #    carry. `ldd` prints "not found" per unresolved DT_NEEDED entry.
          targets=()
          while IFS= read -r -d '' candidate; do
            if file -b "${candidate}" | grep -q 'ELF'; then targets+=("${candidate}"); fi
          done < <(find "${root}/usr/bin" "${root}/usr/lib" -type f -print0)
          [ "${#targets[@]}" -gt 0 ] || { echo '::error::extracted payload has no ELF binaries'; exit 1; }
          unresolved="$(LD_LIBRARY_PATH="${root}/usr/lib" ldd "${targets[@]}" 2>/dev/null | awk '/not found/{print}' || true)"
          if [ -n "${unresolved}" ]; then
            echo '::error::extracted AppImage has unresolved libraries'
            printf '%s\n' "${unresolved}" >&2
            exit 1
          fi
          echo "ldd: ${#targets[@]} ELF files, zero 'not found'"

          # 2. The daemon must load and report THIS release. --status verifies the
          #    installed payload at startup, prints "chudware <version>" on stderr
          #    and then exits nonzero because no daemon is running: the banner is
          #    the assertion, the exit status is not.
          banner="$(LD_LIBRARY_PATH="${root}/usr/lib" \
            CHUDWARE_LIBCHUDWARE="${root}/usr/lib/libchudware.so" \
            "${root}/usr/bin/chudware-hostd" --status 2>&1 >/dev/null || true)"
          printf '%s\n' "${banner}"
          printf '%s' "${banner}" | grep -Fq "${RELEASE_VERSION}" || {
            echo "::error::chudware-hostd did not load and report ${RELEASE_VERSION}"; exit 1; }

          # 3. The signed payload manifest must describe the extracted bytes, and
          #    its signature must verify against release-ci-v1.
          # The release Python, not the system one: verify_signature needs
          # `cryptography`, which only the release venv carries.
          PYTHONPATH="${GITHUB_WORKSPACE}" "${CHUDWARE_RELEASE_PYTHON}" - "${root}" "${RELEASE_PUBLIC_KEY_B64}" <<'PY'
          import sys
          from pathlib import Path
          from services.installer.payload_manifest import read_manifest, verify_manifest_payload, verify_signature
          root = Path(sys.argv[1])
          manifest, canonical = read_manifest(root)
          verify_manifest_payload(root, canonical)
          verify_signature(key_id=str(manifest["key_id"]), canonical_json=canonical,
                           signature_path=root / "payload-manifest.v1.sig", public_key=sys.argv[2])
          print("payload manifest verified: %d files, key_id %s, version %s"
                % (len(manifest["files"]), manifest["key_id"], manifest["version"]))
          PY

          # The manifest and its signature ride beside the artifact as sidecars;
          # the finalizer deleted the AppDir, so take them from the verified tree.
          cp "${root}/payload-manifest.v1.json" "${work}/payload-manifest.v1.json"
          cp "${root}/payload-manifest.v1.sig" "${work}/payload-manifest.v1.sig"

      - name: Stage the artifact and sidecars for the gateway
        shell: bash
        run: |
          set -euo pipefail
          name="Chudware-${RELEASE_VERSION}-linux-x86_64.AppImage"
          incoming="${RELEASES_DIR}/incoming"
          install -m 0644 "${ARTIFACT}" "${incoming}/${name}"
          install -m 0644 "${RUNNER_TEMP}/verify/payload-manifest.v1.json" "${incoming}/${name}.payload-manifest.v1.json"
          install -m 0644 "${RUNNER_TEMP}/verify/payload-manifest.v1.sig" "${incoming}/${name}.payload-manifest.v1.sig"
          if [ "${HAS_EVIDENCE}" = 1 ]; then
            for evidence in sbom.cdx.json provenance.slsa.json platform-test.v1.json; do
              install -m 0644 "${RUNNER_TEMP}/final/evidence/${evidence}" "${incoming}/${name}.${evidence}"
              install -m 0644 "${RUNNER_TEMP}/final/evidence/${evidence}.sig" "${incoming}/${name}.${evidence}.sig"
            done
          fi
          echo "ARTIFACT_NAME=${name}" >> "$GITHUB_ENV"
          ls -l "${incoming}/${name}"*

      - name: Publish the beta release over the gateway loopback
        shell: bash
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/gw.sh"
          ci_status publishing "posting ci/publish for ${ARTIFACT_NAME}"

          body="${RUNNER_TEMP}/publish.json"
          # Digests are computed from the STAGED bytes, which is what the gateway
          # recomputes and rejects on mismatch.
          python3 - "${RELEASES_DIR}/incoming/${ARTIFACT_NAME}" \
            "${RUNNER_TEMP}/artifact.sig" "${RUNNER_TEMP}/artifact-stable.sig" > "${body}" <<'PY'
          import hashlib, json, os, pathlib, sys

          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          artifact = pathlib.Path(sys.argv[1])
          body = {
              "version": os.environ["RELEASE_VERSION"],
              "stable_version": os.environ["RELEASE_STABLE_VERSION"],
              "platform": os.environ["RELEASE_PLATFORM"],
              "arch": os.environ["RELEASE_ARCH"],
              "channel": "beta",
              "key_id": os.environ["CHUDWARE_RELEASE_KEY_ID"],
              "min_supported": os.environ["CHUDWARE_RELEASE_MIN_SUPPORTED"],
              "sha256": digest(artifact),
              "size": artifact.stat().st_size,
              "signature": pathlib.Path(sys.argv[2]).read_text(encoding="ascii").strip(),
              "stable_signature": pathlib.Path(sys.argv[3]).read_text(encoding="ascii").strip(),
              "notes_url": os.environ["CHUDWARE_RELEASE_NOTES_URL"],
              "commit_sha": os.environ["RELEASE_COMMIT"],
          }
          if os.environ.get("HAS_EVIDENCE") == "1":
              fields = (
                  ("sbom", "sbom.cdx.json"),
                  ("provenance", "provenance.slsa.json"),
                  ("platform_test", "platform-test.v1.json"),
              )
              evidence = {}
              for field, suffix in fields:
                  document = artifact.with_name(artifact.name + "." + suffix)
                  evidence[field + "_sha256"] = digest(document)
                  evidence[field + "_signature_sha256"] = digest(document.with_name(document.name + ".sig"))
              body["evidence"] = evidence
          json.dump(body, sys.stdout)
          PY

          # A 422 for a digest/size mismatch makes the gateway DELETE the staged
          # artifact (sidecars survive), so a retry must re-stage it. Re-running
          # this job does exactly that: it rebuilds and re-copies before publishing.
          response="${RUNNER_TEMP}/publish-response.json"
          gw_post /api/releases/ci/publish "${body}" > "${response}"
          python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), indent=2, sort_keys=True))' "${response}"
          ci_status published "${ARTIFACT_NAME} published to beta"
          {
            echo '## Linux beta published'
            echo ''
            echo "* artifact: \`${ARTIFACT_NAME}\`"
            echo "* stable pair signed for: \`${RELEASE_STABLE_VERSION}\`"
            echo "* evidence bundle: \`${HAS_EVIDENCE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure to the gateway
        if: always() && job.status != 'success'
        env:
          GATEWAY_TOKEN: ${{ secrets.CHUDWARE_GATEWAY_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          detail="linux-beta ${{ job.status }} in run ${GITHUB_RUN_NUMBER}"
          if [ -r "${RUNNER_TEMP}/gw.sh" ]; then
            . "${RUNNER_TEMP}/gw.sh"
            ci_status failed "${detail}"
            exit 0
          fi
          # The capability step failed before gw.sh existed. Without this the
          # queued row the plan job wrote stays "queued" in /admin forever,
          # which reads as a hung runner instead of a failed leg. Public origin
          # and the secret token: the loopback credential lives in a file this
          # runner may not have been able to read.
          [ -n "${GATEWAY_TOKEN:-}" ] || exit 0
          umask 077
          curlrc="${RUNNER_TEMP}/gw-fallback.curlrc"
          printf 'header = "Authorization: Bearer %s"\n' "${GATEWAY_TOKEN}" > "${curlrc}"
          body="${RUNNER_TEMP}/ci-status-fallback.json"
          python3 - failed "${detail}" > "${body}" <<'PY'
          import json, os, sys
          json.dump({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "commit_sha": os.environ["RELEASE_COMMIT"],
              "channel": "beta",
              "platform": os.environ["RELEASE_PLATFORM"],
              "arch": os.environ["RELEASE_ARCH"],
              "version": os.environ["RELEASE_VERSION"],
              "status": sys.argv[1],
              "detail": sys.argv[2],
          }, sys.stdout)
          PY
          curl --config "${curlrc}" --fail-with-body --silent --show-error --max-time 60 \
            -H 'Content-Type: application/json' --data-binary "@${body}" \
            "${CHUDWARE_GATEWAY_PUBLIC_BASE}/api/releases/ci/status" > /dev/null \
            || echo "::warning::fallback ci/status was not recorded"

  windows-beta:
    name: Windows beta installer
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: [self-hosted, Windows, X64, cloudcastle-ci, cc-win-package]
    timeout-minutes: 360
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_STABLE_VERSION: ${{ needs.plan.outputs.stable_version }}
      RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
      RELEASE_PLATFORM: windows
      RELEASE_ARCH: x86_64
      CORE_PRESET: windows-occt
      HOST_BUILD_DIR: host/build-win
      # This runner cannot route to the gateway host's LAN address, so it holds
      # the release token itself and publishes over TLS to the public origin.
      GATEWAY_TOKEN: ${{ secrets.CHUDWARE_GATEWAY_RELEASE_TOKEN }}
    steps:
      - name: Check runner capabilities and enter the MSVC environment
        # Windows PowerShell 5.1 - these hosts have no pwsh and their `bash` is an
        # empty WSL shim. ASCII only: 5.1 reads the runner's BOM-less UTF-8 script
        # as the ANSI code page.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "runner=$env:RUNNER_NAME os=$env:RUNNER_OS host=$env:COMPUTERNAME"

          $tools = Join-Path $env:USERPROFILE 'chudware-ci-tools'
          foreach ($dir in @((Join-Path $tools 'bin'), (Join-Path $tools 'python'), (Join-Path $tools 'python\Scripts'))) {
            if (Test-Path $dir) {
              $env:PATH = "$dir;$env:PATH"
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          # curl.exe, not ssh/scp: this runner reaches the gateway over TLS on
          # the public origin because the two LANs do not route to each other.
          foreach ($tool in @('cmake', 'ninja', 'ctest', 'git', 'python', 'bun', 'curl')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              Write-Host "::error::runner $env:RUNNER_NAME is missing required tool: $tool"
              exit 1
            }
          }

          # Inno Setup is REQUIRED: the product ships an .exe installer, and a zip
          # is not a substitute. Fail here rather than after an hour of building.
          $iscc = $env:ISCC
          if (-not $iscc) {
            $candidates = @(
              (Join-Path $tools 'innosetup\ISCC.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $iscc) {
              $onPath = Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue
              if ($onPath) { $iscc = $onPath.Source }
            }
          }
          if (-not $iscc -or -not (Test-Path $iscc)) {
            Write-Host "::error::ISCC.exe (Inno Setup 6) is not installed on $env:RUNNER_NAME. The Windows release is an Inno installer; install Inno Setup 6 or set the ISCC environment variable. This job will NOT fall back to a zip."
            exit 1
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "iscc=$iscc"

          $vsPath = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          }
          if (-not $vsPath) {
            $searchRoots = @(
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio'),
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio')
            ) | Where-Object { Test-Path $_ }
            $vcvars = $searchRoots |
              ForEach-Object { Get-ChildItem -Path $_ -Filter vcvars64.bat -File -Recurse -ErrorAction SilentlyContinue } |
              Select-Object -First 1
            if ($vcvars) { $vsPath = $vcvars.Directory.Parent.Parent.Parent.FullName }
          }
          if (-not $vsPath) {
            Write-Host "::error::no Visual Studio with vcvars64.bat and the x64 C++ toolset on $env:RUNNER_NAME"
            exit 1
          }
          Write-Host "visual-studio=$vsPath"

          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $devShell = Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          if (Test-Path $devShell) {
            Import-Module $devShell
            Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          } else {
            $vcvarsPath = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
            if (-not (Test-Path $vcvarsPath)) {
              Write-Host "::error::Visual Studio root $vsPath has neither DevShell nor vcvars64.bat"
              exit 1
            }
            & cmd.exe /d /s /c "`"$vcvarsPath`" >nul && set" |
              ForEach-Object {
                if ($_ -match '^([^=]+)=(.*)$') {
                  [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
                }
              }
          }
          Get-ChildItem env: | ForEach-Object {
            if ($before[$_.Name] -ne $_.Value) {
              "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          $compilerOutput = & cmd.exe /d /c 'cl.exe 2>&1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compilerOutput | Select-Object -First 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the release Python requirements
        # The chudware-ci-tools python ships bare; embed_protected_assets and the
        # sidecar compilers need pyyaml/Nuitka and friends. pip is near-instant
        # when the pinned set is already satisfied.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --quiet --disable-pip-version-check -r packaging\requirements-release.txt
          python -c "import yaml" 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::release requirements did not install (pyyaml still missing)'; exit 1 }

      - name: Open the authenticated channel to the gateway
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GATEWAY_TOKEN) {
            Write-Host '::error::CHUDWARE_GATEWAY_RELEASE_TOKEN is not set; this runner publishes over TLS and has no other credential'
            exit 1
          }
          if (-not $env:CHUDWARE_GATEWAY_PUBLIC_BASE) {
            Write-Host '::error::CHUDWARE_GATEWAY_PUBLIC_BASE is not set'
            exit 1
          }

          # Run-scoped: RUNNER_TEMP is wiped between jobs. The token goes to a
          # curl --config file, never to argv: another process on this runner can
          # read a command line, and GitHub's log masking does not help there.
          $curlrc = Join-Path $env:RUNNER_TEMP 'gw.curlrc'
          [IO.File]::WriteAllText($curlrc, "header = `"Authorization: Bearer $env:GATEWAY_TOKEN`"`n", (New-Object Text.ASCIIEncoding))
          # The runner account must be the config file's only reader. Grant by
          # SID: under a service account $env:USERNAME is the machine account
          # (HOST$), which icacls cannot resolve.
          $meSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls $curlrc /inheritance:r /grant:r "*${meSid}:(R)" | Out-Null
          "GATEWAY_CURLRC=$curlrc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # GITHUB_ENV only reaches LATER steps; this step uses the value too.
          $env:GATEWAY_CURLRC = $curlrc

          # Reachability is proven before an hour of building depends on it. This
          # endpoint is anonymous and read-only, so a 200 here means DNS, TLS and
          # routing all work; the token itself is proven by the first ci/status.
          # No 2>&1 on any native command in this step: with 'Stop' in effect,
          # PowerShell 5.1 promotes redirected stderr to a terminating error.
          $probe = & curl.exe --fail-with-body -sS --max-time 30 "$env:CHUDWARE_GATEWAY_PUBLIC_BASE/api/releases/base-version"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::cannot reach $env:CHUDWARE_GATEWAY_PUBLIC_BASE from this runner: $probe"
            exit 1
          }
          Write-Host "gateway reachable: $probe"

          # Status reporting from this job goes through the same channel.
          $reporter = Join-Path $env:RUNNER_TEMP 'ci_status.ps1'
          $reporterBody = @'
          param([Parameter(Mandatory=$true)][string]$Status, [string]$Detail = '')
          $ErrorActionPreference = 'Continue'
          $body = Join-Path $env:RUNNER_TEMP 'ci-status.json'
          $payload = [ordered]@{
            run_id     = $env:GITHUB_RUN_ID
            commit_sha = $env:RELEASE_COMMIT
            channel    = 'beta'
            platform   = $env:RELEASE_PLATFORM
            arch       = $env:RELEASE_ARCH
            version    = $env:RELEASE_VERSION
            status     = $Status
            detail     = $Detail
          }
          [IO.File]::WriteAllText($body, ($payload | ConvertTo-Json -Compress), (New-Object Text.ASCIIEncoding))
          $retry = $env:CHUDWARE_GATEWAY_CURL_RETRY -split ' '
          & curl.exe --config $env:GATEWAY_CURLRC --fail-with-body -sS --max-time 120 @retry `
            -H 'Content-Type: application/json' --data-binary "@$body" `
            "$env:CHUDWARE_GATEWAY_PUBLIC_BASE/api/releases/ci/status" | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::ci/status $Status was not recorded" }
          '@
          [IO.File]::WriteAllText($reporter, ($reporterBody -replace "`r`n", "`n"), (New-Object Text.ASCIIEncoding))
          & $reporter -Status 'building' -Detail "configuring core + host for $env:RELEASE_VERSION"

      - name: Refresh junctions, generate protected assets, and build at the pinned version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # scripts/build_windows.ps1 is the interactive one-shot build: it hard-codes
          # developer defaults and takes no cmake arguments, so a release build cannot
          # go through it without flipping CHUDWARE_DEVELOPER_BUILD back on. Its two
          # prerequisites are reused directly instead: the junction setup it calls
          # first, and the same windows-occt preset it builds.
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup_windows_links.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $protected = "$env:HOST_BUILD_DIR/generated/protected-assets"
          & python packaging\embed_protected_assets.py --source-root . --output-dir $protected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & cmake --preset $env:CORE_PRESET -DCHUDWARE_DEVELOPER_BUILD=OFF `
            "-DCHUDWARE_VERSION_OVERRIDE=$env:RELEASE_VERSION" `
            "-DCHUDWARE_PROTECTED_ASSETS_DIR=$env:GITHUB_WORKSPACE/$protected"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build --preset $env:CORE_PRESET --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # CEF is NOT disabled here, unlike scripts/build_windows.ps1 and the
          # native-build compile gate: this job produces the installer customers
          # run, and it must carry the same feature set release.yml ships. A runner
          # without the provisioned CEF SDK fails this configure loudly instead of
          # quietly shipping a Chudware with no web view. Fresh checkouts carry no
          # extern/cef, so fetch the pinned SDK first (idempotent).
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\fetch_cef_windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake -S host -B $env:HOST_BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCHUDWARE_DEVELOPER_BUILD=OFF `
            "-DCHUDWARE_VERSION_OVERRIDE=$env:RELEASE_VERSION" `
            "-DCHUDWARE_PROTECTED_ASSETS_DIR=$env:GITHUB_WORKSPACE/$protected"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build $env:HOST_BUILD_DIR --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\stage_windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($cache in @("build/$env:CORE_PRESET/CMakeCache.txt", "$env:HOST_BUILD_DIR/CMakeCache.txt")) {
            $lines = Get-Content $cache
            if ($lines -notcontains "CHUDWARE_VERSION_OVERRIDE:STRING=$env:RELEASE_VERSION") {
              Write-Host "::error::$cache does not carry CHUDWARE_VERSION_OVERRIDE=$env:RELEASE_VERSION"
              exit 1
            }
            if ($lines -notcontains 'CHUDWARE_DEVELOPER_BUILD:BOOL=OFF') {
              Write-Host "::error::$cache is not an explicit production configure"
              exit 1
            }
          }

      - name: Run the core and host test suites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & (Join-Path $env:RUNNER_TEMP 'ci_status.ps1') -Status 'testing' -Detail 'ctest core + host'

          $log = Join-Path $env:RUNNER_TEMP 'ctest.log'
          ctest --test-dir "build/$env:CORE_PRESET/core" --timeout 900 --output-on-failure 2>&1 | Tee-Object -FilePath $log
          $core = $LASTEXITCODE
          ctest --test-dir $env:HOST_BUILD_DIR --timeout 900 --output-on-failure 2>&1 | Tee-Object -FilePath $log -Append
          $host_status = $LASTEXITCODE
          if (Select-String -Path $log -Pattern 'No tests were found' -Quiet) {
            Write-Host '::error::a configure registered no tests; the platform-test evidence would be a lie'
            exit 1
          }
          $tail = (Get-Content $log -Tail 30) -join "`n"
          @('## ctest -- windows beta', '```text', $tail, '```') |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if ($core -ne 0) { exit $core }
          if ($host_status -ne 0) { exit $host_status }

      - name: Build sidecars, sign the payload, and compile the Inno installer
        env:
          CHUDWARE_RELEASE_CI_KEY: ${{ secrets.CHUDWARE_RELEASE_CI_KEY }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:RUNNER_TEMP 'ci_status.ps1') -Status 'packaging' -Detail 'sidecars, payload signature, Inno installer'

          $out = Join-Path $env:RUNNER_TEMP 'installer'
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $sidecars = Join-Path $env:RUNNER_TEMP 'sidecars'
          if (Test-Path $sidecars) { Remove-Item -Recurse -Force $sidecars }

          $hostBin = "$env:HOST_BUILD_DIR/bin/chudware.exe"
          $hostdBin = "build/$env:CORE_PRESET/bin/chudware-hostd.exe"
          & powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build_sidecars.ps1 `
            -OutputDir $sidecars -HostBinary $hostBin -HostdBinary $hostdBin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & python -m services.installer.build_release --prepare-signing --payload-only `
            --key-id $env:CHUDWARE_RELEASE_KEY_ID --version $env:RELEASE_VERSION --out $out `
            --host-bin $hostBin --hostd-bin $hostdBin `
            --worker-bin "$sidecars/chudware-worker.exe" `
            --mcp-bin "$sidecars/chudware-mcp.exe" `
            --omp-bridge-bin "$sidecars/chudware-omp-bridge.exe" `
            --uninstall-helper-bin "$env:HOST_BUILD_DIR/bin/chudware-uninstall-helper.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # build_release names the preimage payload-manifest.v1.preimage (the
          # *.payload-signing-request.bin name is the shell builders'), so take
          # the path the builder itself reports rather than guessing a glob.
          $request = Get-ChildItem -Path $out -Recurse -Filter 'payload-manifest.v1.preimage' |
            Select-Object -First 1
          if (-not $request) { Write-Host '::error::payload signing preimage missing'; exit 1 }
          $payloadSig = Join-Path $env:RUNNER_TEMP 'payload.sig'
          & python packaging\ci_sign.py --expect-public-key $env:CHUDWARE_RELEASE_CI_PUBLIC_KEY `
            --output $payloadSig sign payload $request.FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $publicKeyB64 = & python -c "import base64,os;print(base64.b64encode(bytes.fromhex(os.environ['CHUDWARE_RELEASE_CI_PUBLIC_KEY'])).decode())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RELEASE_PUBLIC_KEY_B64=$publicKeyB64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Embeds the signature, re-verifies every payload byte, then runs ISCC.
          # No --payload-only: the installer IS the release artifact here.
          & python -m services.installer.build_release --finalize-signing $payloadSig `
            --release-public-key $publicKeyB64 --version $env:RELEASE_VERSION --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $name = "Chudware-Setup-$env:RELEASE_VERSION-x86_64.exe"
          $installer = Join-Path $out $name
          if (-not (Test-Path $installer)) {
            Write-Host "::error::Inno Setup did not produce $installer"
            exit 1
          }
          "ARTIFACT=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PAYLOAD_DIR=$out\Chudware" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "installer=$installer ($((Get-Item $installer).Length) bytes)"

      - name: Sign the artifact pair and generate evidence
        env:
          CHUDWARE_RELEASE_CI_KEY: ${{ secrets.CHUDWARE_RELEASE_CI_KEY }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Beta identity now, stable identity for the one-click promote later.
          & python packaging\ci_sign.py --expect-public-key $env:CHUDWARE_RELEASE_CI_PUBLIC_KEY `
            --output (Join-Path $env:RUNNER_TEMP 'artifact.sig') `
            artifact --key-id $env:CHUDWARE_RELEASE_KEY_ID --version $env:RELEASE_VERSION `
            --platform windows --arch x86_64 --artifact $env:ARTIFACT | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python packaging\ci_sign.py --expect-public-key $env:CHUDWARE_RELEASE_CI_PUBLIC_KEY `
            --output (Join-Path $env:RUNNER_TEMP 'artifact-stable.sig') `
            artifact --key-id $env:CHUDWARE_RELEASE_KEY_ID --version $env:RELEASE_STABLE_VERSION `
            --platform windows --arch x86_64 --artifact $env:ARTIFACT | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Evidence is required for promotion to stable but not for a beta publish.
          # A failure here is a loud warning and an evidence-less beta, never a
          # silently incomplete bundle.
          $evidence = Join-Path $env:RUNNER_TEMP 'evidence'
          $env:EVIDENCE_DIR = $evidence
          $sha = (& python -c "import hashlib,os;h=hashlib.sha256();f=open(os.environ['ARTIFACT'],'rb');[h.update(c) for c in iter(lambda: f.read(1048576), b'')];print(h.hexdigest())")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ARTIFACT_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $ok = $true
          & python packaging\generate_release_evidence.py $env:ARTIFACT --artifact-sha256 $sha `
            --version $env:RELEASE_VERSION --platform windows --arch x86_64 --commit $env:RELEASE_COMMIT `
            --locked-input CMakePresets.json --locked-input packaging/requirements-release.txt `
            --locked-input vendor/omp/bun.lock --command 'ctest core' --command 'ctest host' `
            --passed --out $evidence
          if ($LASTEXITCODE -ne 0) { $ok = $false }

          if ($ok) {
            # A request is the evidence domain plus the exact canonical bytes. The
            # domain table lives in packaging/sign_release.py and is imported, never
            # retyped here. The same script also proves the platform-test document
            # names the suites this job actually ran.
            $builder = Join-Path $env:RUNNER_TEMP 'evidence_requests.py'
            $builderBody = @'
          import json
          import os
          import pathlib
          import sys

          sys.path.insert(0, os.getcwd())
          from packaging.sign_release import DOMAINS

          directory = pathlib.Path(os.environ["EVIDENCE_DIR"])
          for name, kind in (("sbom.cdx.json", "sbom"),
                             ("provenance.slsa.json", "provenance"),
                             ("platform-test.v1.json", "platform-test")):
              body = (directory / name).read_bytes()
              (directory / (name + ".signing-request.bin")).write_bytes(DOMAINS[kind] + body)

          document = json.loads((directory / "platform-test.v1.json").read_text(encoding="utf-8"))
          missing = {"ctest core", "ctest host"} - set(document.get("commands", []))
          if missing or document.get("passed") is not True:
              raise SystemExit("platform-test evidence does not record the executed suites: %s" % sorted(missing))
          '@
            [IO.File]::WriteAllText($builder, ($builderBody -replace "`r`n", "`n"), (New-Object Text.ASCIIEncoding))
            & python $builder
            if ($LASTEXITCODE -ne 0) { $ok = $false }
          }
          if ($ok) {
            foreach ($pair in @(@('sbom.cdx.json', 'sbom'), @('provenance.slsa.json', 'provenance'), @('platform-test.v1.json', 'platform-test'))) {
              & python packaging\ci_sign.py --expect-public-key $env:CHUDWARE_RELEASE_CI_PUBLIC_KEY `
                --output (Join-Path $evidence ($pair[0] + '.sig')) `
                sign $pair[1] (Join-Path $evidence ($pair[0] + '.signing-request.bin')) | Out-Null
              if ($LASTEXITCODE -ne 0) { $ok = $false; break }
            }
          }
          if (-not $ok) {
            Write-Host '::warning::release evidence generation or signing failed; publishing this beta WITHOUT an evidence bundle, so it cannot be promoted to stable until a later build succeeds'
          }
          "HAS_EVIDENCE=$(if ($ok) { '1' } else { '0' })" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload the installer and publish over the gateway API
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = $env:ARTIFACT_NAME
          $evidence = Join-Path $env:RUNNER_TEMP 'evidence'
          $base = $env:CHUDWARE_GATEWAY_PUBLIC_BASE
          $retry = $env:CHUDWARE_GATEWAY_CURL_RETRY -split ' '

          # Sidecars carry the artifact's own name plus a suffix; the payload
          # signature REPLACES the .json (payload-manifest.v1.sig), while evidence
          # signatures append .sig to the full evidence file name.
          $uploads = @(
            @{ Local = $env:ARTIFACT; Remote = $name },
            @{ Local = "$env:PAYLOAD_DIR\payload-manifest.v1.json"; Remote = "$name.payload-manifest.v1.json" },
            @{ Local = "$env:PAYLOAD_DIR\payload-manifest.v1.sig"; Remote = "$name.payload-manifest.v1.sig" }
          )
          if ($env:HAS_EVIDENCE -eq '1') {
            foreach ($doc in @('sbom.cdx.json', 'provenance.slsa.json', 'platform-test.v1.json')) {
              $uploads += @{ Local = (Join-Path $evidence $doc); Remote = "$name.$doc" }
              $uploads += @{ Local = (Join-Path $evidence "$doc.sig"); Remote = "$name.$doc.sig" }
            }
          }
          foreach ($item in $uploads) {
            if (-not (Test-Path $item.Local)) { Write-Host "::error::missing upload $($item.Local)"; exit 1 }
            $expected = (Get-FileHash -Path $item.Local -Algorithm SHA256).Hash.ToLower()
            # --upload-file streams from disk; --data-binary would read a ~500 MB
            # installer into memory first, and the handler wants a raw body either
            # way. The gateway writes to <name>.part and renames, so ci/publish
            # never sees a torn upload.
            # No 2>&1: under $ErrorActionPreference = 'Stop', PowerShell 5.1 turns
            # a native command's redirected stderr into a terminating
            # NativeCommandError, which would abort before the check below and
            # report the wrong cause. --fail-with-body puts the gateway's reply on
            # stdout; its diagnostics stay in the step log where they belong.
            #
            # Anything over the edge's 100 MB body cap goes up in chunks: the
            # installer is ~300 MB and a single PUT is answered 413 by the proxy
            # in front of the public origin. Each chunk names the offset it
            # continues, and the last one finalizes and returns the digest.
            $size = (Get-Item $item.Local).Length
            if ($size -gt 67108864) {
              $chunkFile = Join-Path $env:RUNNER_TEMP 'upload.chunk'
              $chunkSize = 67108864
              $stream = [IO.File]::OpenRead($item.Local)
              $buffer = New-Object byte[] $chunkSize
              $offset = 0
              $response = ''
              try {
                while ($offset -lt $size) {
                  $read = $stream.Read($buffer, 0, $chunkSize)
                  if ($read -le 0) { break }
                  $out = [IO.File]::Open($chunkFile, 'Create', 'Write')
                  $out.Write($buffer, 0, $read)
                  $out.Close()
                  $query = "offset=$offset"
                  if (($offset + $read) -ge $size) { $query = "offset=$offset&complete=1" }
                  $response = & curl.exe --config $env:GATEWAY_CURLRC --fail-with-body -sS `
                    --max-time 3600 @retry --upload-file $chunkFile `
                    "$base/api/releases/ci/upload/$($item.Remote)?$query"
                  if ($LASTEXITCODE -ne 0) {
                    Write-Host "::error::chunk upload failed for $($item.Remote) at offset $offset : $response"
                    exit 1
                  }
                  $offset += $read
                }
              } finally {
                $stream.Close()
                Remove-Item -Force -ErrorAction SilentlyContinue $chunkFile
              }
            } else {
              $response = & curl.exe --config $env:GATEWAY_CURLRC --fail-with-body -sS `
                --max-time 3600 @retry --upload-file $item.Local `
                "$base/api/releases/ci/upload/$($item.Remote)"
            }
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::upload failed for $($item.Remote): $response"
              exit 1
            }
            # The gateway re-digests these bytes again at publish time; comparing
            # here names transport corruption at the file that caused it instead
            # of as a 422 an hour later. A chunked upload reports its digest only
            # on the finalizing call, which is the response still in $response.
            $reported = ''
            try { $reported = (($response -join '') | ConvertFrom-Json).sha256 } catch { $reported = '' }
            if ($reported -ne $expected) {
              Write-Host "::error::the gateway stored a different digest for $($item.Remote): expected $expected, got '$reported'"
              exit 1
            }
            Write-Host "uploaded $($item.Remote) sha256=$reported"
          }
          Write-Host "uploaded $($uploads.Count) files into the gateway staging directory"

          & (Join-Path $env:RUNNER_TEMP 'ci_status.ps1') -Status 'publishing' -Detail "posting ci/publish for $name"

          $body = Join-Path $env:RUNNER_TEMP 'publish.json'
          $env:PUBLISH_BODY = $body
          $env:EVIDENCE_DIR = $evidence
          # The gateway recomputes every digest from the staged files and rejects a
          # mismatch, so the body is built from the exact bytes that were uploaded.
          $builder = Join-Path $env:RUNNER_TEMP 'publish_body.py'
          $builderBody = @'
          import hashlib
          import json
          import os
          import pathlib


          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()


          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          artifact = pathlib.Path(os.environ["ARTIFACT"])
          body = {
              "version": os.environ["RELEASE_VERSION"],
              "stable_version": os.environ["RELEASE_STABLE_VERSION"],
              "platform": "windows",
              "arch": "x86_64",
              "channel": "beta",
              "key_id": os.environ["CHUDWARE_RELEASE_KEY_ID"],
              "min_supported": os.environ["CHUDWARE_RELEASE_MIN_SUPPORTED"],
              "sha256": os.environ["ARTIFACT_SHA256"],
              "size": artifact.stat().st_size,
              "signature": (temp / "artifact.sig").read_text(encoding="ascii").strip(),
              "stable_signature": (temp / "artifact-stable.sig").read_text(encoding="ascii").strip(),
              "notes_url": os.environ["CHUDWARE_RELEASE_NOTES_URL"],
              "commit_sha": os.environ["RELEASE_COMMIT"],
          }
          if os.environ.get("HAS_EVIDENCE") == "1":
              directory = pathlib.Path(os.environ["EVIDENCE_DIR"])
              evidence = {}
              for field, name in (("sbom", "sbom.cdx.json"),
                                  ("provenance", "provenance.slsa.json"),
                                  ("platform_test", "platform-test.v1.json")):
                  evidence[field + "_sha256"] = digest(directory / name)
                  evidence[field + "_signature_sha256"] = digest(directory / (name + ".sig"))
              body["evidence"] = evidence
          pathlib.Path(os.environ["PUBLISH_BODY"]).write_text(json.dumps(body), encoding="ascii")
          '@
          [IO.File]::WriteAllText($builder, ($builderBody -replace "`r`n", "`n"), (New-Object Text.ASCIIEncoding))
          & python $builder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $response = & curl.exe --config $env:GATEWAY_CURLRC --fail-with-body -sS `
            --max-time 300 @retry -H 'Content-Type: application/json' `
            --data-binary "@$body" "$base/api/releases/ci/publish"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::ci/publish rejected the Windows installer: $response"
            exit 1
          }
          Write-Host ($response -join '')

          & (Join-Path $env:RUNNER_TEMP 'ci_status.ps1') -Status 'published' -Detail "$name published to beta"
          @(
            '## Windows beta published',
            '',
            "* artifact: ``$name``",
            "* stable pair signed for: ``$env:RELEASE_STABLE_VERSION``",
            "* evidence bundle: ``$env:HAS_EVIDENCE``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Report failure to the gateway
        if: always() && job.status != 'success'
        env:
          GATEWAY_TOKEN: ${{ secrets.CHUDWARE_GATEWAY_RELEASE_TOKEN }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $detail = "windows-beta ${{ job.status }} in run $env:GITHUB_RUN_NUMBER"
          $reporter = Join-Path $env:RUNNER_TEMP 'ci_status.ps1'
          if (Test-Path $reporter) {
            & $reporter -Status 'failed' -Detail $detail
            exit 0
          }
          # The capability step failed before ci_status.ps1 existed. Without
          # this the queued row the plan job wrote stays 'queued' in /admin
          # forever, which reads as a hung runner instead of a failed leg.
          if (-not $env:GATEWAY_TOKEN) { exit 0 }
          $body = @{
            run_id      = $env:GITHUB_RUN_ID
            commit_sha  = $env:RELEASE_COMMIT
            channel     = 'beta'
            platform    = $env:RELEASE_PLATFORM
            arch        = $env:RELEASE_ARCH
            version     = $env:RELEASE_VERSION
            status      = 'failed'
            detail      = $detail
          } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Method Post -TimeoutSec 60 `
              -Uri ($env:CHUDWARE_GATEWAY_PUBLIC_BASE + '/api/releases/ci/status') `
              -Headers @{ Authorization = 'Bearer ' + $env:GATEWAY_TOKEN } `
              -ContentType 'application/json' -Body $body | Out-Null
          } catch {
            Write-Host ('::warning::fallback ci/status was not recorded: ' + $_.Exception.Message)
          }

  macos-beta:
    name: macOS beta app (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: [self-hosted, macOS, "${{ matrix.runner_arch }}", cloudcastle-ci, "${{ matrix.runner_label }}"]
    # Longer than the other two legs: the macOS core carries OCCT plus a
    # source-built Netgen, and the two Nuitka sidecars are compiled per arch.
    timeout-minutes: 420
    strategy:
      # macbook-air-m2 (cc-mac-arm) is a laptop and is regularly asleep. GitHub
      # queues its row until the runner comes back and auto-fails it after 24
      # hours queued; that is accepted. imac-intel must publish regardless, so
      # the rows are independent.
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner_arch: ARM64, runner_label: cc-mac-arm, preset: macos-arm64, host_build_dir: host/build-macos-arm64}
          - {arch: x86_64, runner_arch: X64, runner_label: cc-mac-intel, preset: macos-x86_64, host_build_dir: host/build-macos-x86_64}
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_STABLE_VERSION: ${{ needs.plan.outputs.stable_version }}
      RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
      RELEASE_PLATFORM: macos
      RELEASE_ARCH: ${{ matrix.arch }}
      CORE_PRESET: ${{ matrix.preset }}
      HOST_BUILD_DIR: ${{ matrix.host_build_dir }}
      # Neither Mac can route to the gateway host's LAN address, so each holds
      # the release token itself and publishes over TLS to the public origin.
      GATEWAY_TOKEN: ${{ secrets.CHUDWARE_GATEWAY_RELEASE_TOKEN }}
    steps:
      - name: Check runner capabilities and select the release Python
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown} $(uname -s) $(uname -m)"
          sw_vers

          # The runner service starts with a minimal PATH: Homebrew and a bun
          # installed under $HOME are invisible until this job puts them there
          # itself, exactly as the Windows leg prepends its chudware-ci-tools dir.
          for dir in /opt/homebrew/bin /usr/local/bin "${HOME}/.bun/bin"; do
            if [ -d "${dir}" ]; then
              case ":${PATH}:" in
                *":${dir}:"*) ;;
                *) PATH="${dir}:${PATH}"; echo "${dir}" >> "$GITHUB_PATH" ;;
              esac
            fi
          done
          export PATH

          # String accumulator, not an array: bash 3.2 treats an empty array
          # expansion under `set -u` as an unbound variable.
          missing=""
          # curl, not ssh/scp: this runner reaches the gateway over TLS on the
          # public origin because the two LANs do not route to each other.
          for tool in cmake ninja ctest python3 git curl tar zip rsync bun \
            clang xcrun xcode-select ditto otool install_name_tool plutil codesign; do
            command -v "${tool}" >/dev/null 2>&1 || missing="${missing} ${tool}"
          done

          # Both Macs carry the Command Line Tools only, by design: nothing in
          # this repository may reach for xcodebuild, so the compiler itself is
          # the assertion.
          if xcode-select -p >/dev/null 2>&1; then
            echo "clt=$(xcode-select -p)"
            clang --version | head -n 1
            echo "sdk=$(xcrun --show-sdk-version 2>/dev/null || echo unknown)"
          else
            missing="${missing} xcode-command-line-tools"
          fi

          # The macos-* presets configure with CHUDWARE_WITH_OCCT=ON and, off
          # Windows, ProvisionOCCT.cmake downloads nothing: it find_package()s a
          # system OCCT from the preset's brew CMAKE_PREFIX_PATH.
          if command -v brew >/dev/null 2>&1; then
            echo "brew=$(brew --prefix)"
            brew list --versions opencascade >/dev/null 2>&1 \
              || missing="${missing} opencascade(brew-install-opencascade)"
          else
            missing="${missing} brew"
          fi

          # macOS ships python 3.9.6, which cannot even install the pinned
          # Nuitka. packaging/macos/build_app.sh compiles the worker and MCP
          # sidecars with Nuitka and every signature here needs cryptography, so
          # the interpreter is chosen by capability rather than by name.
          release_python=""
          for candidate in "${HOME}/chudware-ci-tools/release-python/bin/python3" \
            python3.14 python3.13 python3.12 python3.11 python3; do
            resolved=""
            case "${candidate}" in
              /*) if [ -x "${candidate}" ]; then resolved="${candidate}"; fi ;;
              *) resolved="$(command -v "${candidate}" 2>/dev/null || true)" ;;
            esac
            [ -n "${resolved}" ] || continue
            "${resolved}" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)' \
              >/dev/null 2>&1 || continue
            "${resolved}" -c 'import cryptography, nuitka' >/dev/null 2>&1 || continue
            release_python="${resolved}"
            break
          done
          if [ -n "${release_python}" ]; then
            echo "release-python=${release_python} ($("${release_python}" --version 2>&1))"
          else
            missing="${missing} python>=3.11-with-packaging/requirements-release.txt"
          fi

          if [ -n "${missing}" ]; then
            echo "::error::runner ${RUNNER_NAME:-unknown} is missing required tools:${missing}. Run the runner-provision workflow against this runner label (provision-macos) and re-dispatch."
            exit 1
          fi

          # A row labelled cc-mac-intel that answers arm64 would publish bytes
          # under the wrong canonical name; build_app.sh names the zip from
          # `uname -m`, so the two must agree before anything is built.
          if [ "$(uname -m)" != "${RELEASE_ARCH}" ]; then
            echo "::error::this runner is $(uname -m) but the matrix row is ${RELEASE_ARCH}; the runner labels and the matrix disagree"
            exit 1
          fi

          {
            echo "RELEASE_PYTHON=${release_python}"
            echo "CHUDWARE_RELEASE_PYTHON=${release_python}"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The version override replaces `git describe`, but packaging still
          # reads tags for provenance and build_app.sh sources build.sh.
          fetch-depth: 0

      - name: Open the authenticated channel to the gateway
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${GATEWAY_TOKEN:-}" ] || {
            echo '::error::CHUDWARE_GATEWAY_RELEASE_TOKEN is not set; this runner publishes over TLS and has no other credential'
            exit 1
          }
          [ -n "${CHUDWARE_GATEWAY_PUBLIC_BASE:-}" ] || {
            echo '::error::CHUDWARE_GATEWAY_PUBLIC_BASE is not set'; exit 1; }

          # Run-scoped: RUNNER_TEMP is wiped between jobs. The token goes to a
          # 0600 curl --config file, never to argv: another process on this Mac
          # can read a command line, and GitHub's log masking does not help there.
          curlrc="${RUNNER_TEMP}/gw.curlrc"
          umask 077
          printf 'header = "Authorization: Bearer %s"\n' "${GATEWAY_TOKEN}" > "${curlrc}"
          chmod 600 "${curlrc}"

          # Reachability is proven before hours of building depend on it. This
          # endpoint is anonymous and read-only, so a 200 here means DNS, TLS and
          # routing all work; the token itself is proven by the first ci/status.
          probe="$(curl --fail-with-body --silent --show-error --max-time 30 \
            "${CHUDWARE_GATEWAY_PUBLIC_BASE}/api/releases/base-version")" || {
            echo "::error::cannot reach ${CHUDWARE_GATEWAY_PUBLIC_BASE} from this runner"
            exit 1
          }
          echo "gateway reachable: ${probe}"

          # One helper, sourced by every later step: public origin, token only
          # from the config file, and the shared retry budget on every call.
          cat > "${RUNNER_TEMP}/gw.sh" <<'SH'
          gw_post() {  # gw_post <path> <json file>
            curl --config "${RUNNER_TEMP}/gw.curlrc" --fail-with-body --silent --show-error \
              --max-time 300 ${CHUDWARE_GATEWAY_CURL_RETRY} \
              -H 'Content-Type: application/json' --data-binary "@$2" \
              "${CHUDWARE_GATEWAY_PUBLIC_BASE}$1"
          }
          gw_upload() {  # gw_upload <local file> <remote name>; echoes the gateway's json
            # --upload-file streams from disk; --data-binary would read a ~500 MB
            # zip into memory first, and the handler wants a raw body either way.
            # The gateway writes <name>.part and renames, so ci/publish never
            # sees a torn upload.
            #
            # Over the edge's 100 MB body cap the artifact goes up in chunks (a
            # single PUT of the ~300 MB zip is answered 413 by the proxy in front
            # of the public origin). Each chunk names the offset it continues and
            # the last one finalizes, so only that reply carries a digest.
            size="$(wc -c < "$1" | tr -d ' ')"
            if [ "${size}" -le 67108864 ]; then
              curl --config "${RUNNER_TEMP}/gw.curlrc" --fail-with-body --silent --show-error \
                --max-time 3600 ${CHUDWARE_GATEWAY_CURL_RETRY} --upload-file "$1" \
                "${CHUDWARE_GATEWAY_PUBLIC_BASE}/api/releases/ci/upload/$2"
              return $?
            fi
            chunk="${RUNNER_TEMP}/upload.chunk"
            offset=0
            while [ "${offset}" -lt "${size}" ]; do
              dd if="$1" of="${chunk}" bs=1048576 skip="$((offset / 1048576))" count=64 \
                 status=none || return 1
              read_bytes="$(wc -c < "${chunk}" | tr -d ' ')"
              [ "${read_bytes}" -gt 0 ] || return 1
              query="offset=${offset}"
              if [ "$((offset + read_bytes))" -ge "${size}" ]; then
                query="offset=${offset}&complete=1"
              fi
              response="$(curl --config "${RUNNER_TEMP}/gw.curlrc" --fail-with-body --silent \
                --show-error --max-time 3600 ${CHUDWARE_GATEWAY_CURL_RETRY} \
                --upload-file "${chunk}" \
                "${CHUDWARE_GATEWAY_PUBLIC_BASE}/api/releases/ci/upload/$2?${query}")" || {
                  rm -f "${chunk}"; printf '%s' "${response}"; return 1; }
              offset="$((offset + read_bytes))"
            done
            rm -f "${chunk}"
            printf '%s' "${response}"
          }
          ci_status() {  # ci_status <status> <detail>
            body="${RUNNER_TEMP}/ci-status.json"
            "${RELEASE_PYTHON}" - "$1" "$2" > "${body}" <<'PY'
          import json, os, sys
          json.dump({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "commit_sha": os.environ["RELEASE_COMMIT"],
              "channel": "beta",
              "platform": os.environ["RELEASE_PLATFORM"],
              "arch": os.environ["RELEASE_ARCH"],
              "version": os.environ["RELEASE_VERSION"],
              "status": sys.argv[1],
              "detail": sys.argv[2],
          }, sys.stdout)
          PY
            gw_post /api/releases/ci/status "${body}" > /dev/null \
              || echo "::warning::ci/status $1 was not recorded"
          }
          SH
          . "${RUNNER_TEMP}/gw.sh"
          ci_status building "configuring core + host for ${RELEASE_VERSION}"

      - name: Generate protected assets and build core + host at the pinned version
        shell: bash
        run: |
          set -euo pipefail
          protected_assets="${HOST_BUILD_DIR}/generated/protected-assets"
          "${RELEASE_PYTHON}" packaging/embed_protected_assets.py --source-root . \
            --output-dir "${protected_assets}"

          cmake --preset "${CORE_PRESET}" \
            -DCHUDWARE_DEVELOPER_BUILD=OFF \
            -DCHUDWARE_VERSION_OVERRIDE="${RELEASE_VERSION}" \
            -DCHUDWARE_PROTECTED_ASSETS_DIR="${GITHUB_WORKSPACE}/${protected_assets}"
          cmake --build --preset "${CORE_PRESET}"

          # The shipped build has the CEF webview on; the SDK is provisioned on
          # the runner outside the repo (fresh checkouts carry no extern/cef).
          cef_root="$(ls -d "${HOME}"/chudware-cef-sdk/cef_binary_* 2>/dev/null | sort | tail -1 || true)"
          [ -n "${cef_root}" ] || {
            echo "::error::no CEF SDK under ${HOME}/chudware-cef-sdk — the release build needs CHUDWARE_ENABLE_CEF=ON and cef.cmake only searches extern/cef without CEF_ROOT"; exit 1; }

          cmake -S host -B "${HOST_BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHUDWARE_DEVELOPER_BUILD=OFF \
            -DCHUDWARE_VERSION_OVERRIDE="${RELEASE_VERSION}" \
            -DCHUDWARE_PROTECTED_ASSETS_DIR="${GITHUB_WORKSPACE}/${protected_assets}" \
            -DCEF_ROOT="${cef_root}"
          cmake --build "${HOST_BUILD_DIR}"

          # Prove both caches carry the release identity rather than a
          # git-derived 0.0.0-dirty, and that neither tree is a developer build.
          # build_app.sh re-checks the second property and reads the version from
          # the generated header, so a mismatch here would name the wrong zip.
          for cache in "build/${CORE_PRESET}/CMakeCache.txt" "${HOST_BUILD_DIR}/CMakeCache.txt"; do
            grep -Fqx "CHUDWARE_VERSION_OVERRIDE:STRING=${RELEASE_VERSION}" "${cache}" || {
              echo "::error::${cache} does not carry CHUDWARE_VERSION_OVERRIDE=${RELEASE_VERSION}"; exit 1; }
            grep -Fqx 'CHUDWARE_DEVELOPER_BUILD:BOOL=OFF' "${cache}" || {
              echo "::error::${cache} is not an explicit production configure"; exit 1; }
          done
          grep -Fq "\"${RELEASE_VERSION}\"" "${HOST_BUILD_DIR}/generated/api/chudware_version.h" || {
            echo "::error::generated version header does not contain ${RELEASE_VERSION}"; exit 1; }

      - name: Run the core and host test suites
        shell: bash
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/gw.sh"
          ci_status testing "ctest core + host"

          log="${RUNNER_TEMP}/ctest.log"
          # mesher_advanced asserts a mesh+solve wall-clock ceiling meant to catch
          # an -O0 or DOF-blowup regression. The 2017 Intel iMac needs 114s for the
          # boss+pocket part with identical element counts and physics, so scale the
          # ceiling on this runner instead of raising it for every developer.
          export CHUDWARE_TEST_WALL_SCALE=3
          # --timeout per test: a stalled test used to sit here until the job's
          # own 6-hour budget expired (and, with cancel-in-progress, blocked
          # every later nightly). 900s is ~20x the slowest suite on this Mac.
          ctest --test-dir "build/${CORE_PRESET}/core" --timeout 900 --output-on-failure 2>&1 | tee "${log}"
          ctest --test-dir "${HOST_BUILD_DIR}" --timeout 900 --output-on-failure 2>&1 | tee -a "${log}"
          if grep -qE 'No tests were found' "${log}"; then
            echo "::error::a configure registered no tests; the platform-test evidence would be a lie"
            exit 1
          fi
          {
            echo "## ctest -- macOS ${RELEASE_ARCH} beta"
            echo '```text'
            tail -n 30 "${log}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the immutable Chudware.app and sign its payload manifest
        env:
          CHUDWARE_RELEASE_CI_KEY: ${{ secrets.CHUDWARE_RELEASE_CI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/gw.sh"
          ci_status packaging "staging Chudware.app and signing the payload manifest"

          # --prepare-signing retains the immutable .app under --out and emits the
          # payload preimage; --finalize-signing seals that exact bundle. Both
          # calls must therefore name the same --out.
          out="${RUNNER_TEMP}/prepared"
          rm -rf "${out}"
          mkdir -p "${out}"
          packaging/macos/build_app.sh --prepare-signing \
            --key-id "${CHUDWARE_RELEASE_KEY_ID}" --out "${out}"

          request="$(find "${out}" -type f -name '*payload-signing-request.bin' -print -quit)"
          test -s "${request}" || { echo '::error::payload signing request missing'; exit 1; }
          "${RELEASE_PYTHON}" packaging/ci_sign.py \
            --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
            --output "${RUNNER_TEMP}/payload.sig" \
            sign payload "${request}" > /dev/null
          echo "payload manifest signed with ${CHUDWARE_RELEASE_KEY_ID}"

      - name: Seal the app into a zip, then sign the artifact pair and evidence
        env:
          CHUDWARE_RELEASE_CI_KEY: ${{ secrets.CHUDWARE_RELEASE_CI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/prepared"
          public_key_b64="$("${RELEASE_PYTHON}" -c 'import base64,os,sys; sys.stdout.write(base64.b64encode(bytes.fromhex(os.environ["CHUDWARE_RELEASE_CI_PUBLIC_KEY"])).decode())')"
          echo "RELEASE_PUBLIC_KEY_B64=${public_key_b64}" >> "$GITHUB_ENV"

          # Embeds the signature, re-verifies every manifest-owned byte of the
          # retained bundle, then archives it with ditto.
          packaging/macos/build_app.sh --finalize-signing "${RUNNER_TEMP}/payload.sig" \
            --release-public-key "${public_key_b64}" --out "${out}"

          artifact="${out}/Chudware-${RELEASE_VERSION}-macos-${RELEASE_ARCH}.zip"
          test -s "${artifact}" || {
            echo "::error::build_app.sh did not produce ${artifact}"; exit 1; }
          echo "ARTIFACT=${artifact}" >> "$GITHUB_ENV"

          sha="$("${RELEASE_PYTHON}" - "${artifact}" <<'PY'
          import hashlib, sys
          value = hashlib.sha256()
          with open(sys.argv[1], "rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  value.update(chunk)
          print(value.hexdigest())
          PY
          )"
          echo "ARTIFACT_SHA256=${sha}" >> "$GITHUB_ENV"
          echo "artifact=${artifact} sha256=${sha}"

          # Sign the artifact identity twice over the same bytes: the beta
          # version published now, and the stable version /admin will promote to.
          "${RELEASE_PYTHON}" packaging/ci_sign.py --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
            --output "${RUNNER_TEMP}/artifact.sig" \
            artifact --key-id "${CHUDWARE_RELEASE_KEY_ID}" --version "${RELEASE_VERSION}" \
            --platform "${RELEASE_PLATFORM}" --arch "${RELEASE_ARCH}" --artifact "${artifact}" \
            --request-out "${RUNNER_TEMP}/artifact-request.bin" > /dev/null
          "${RELEASE_PYTHON}" packaging/ci_sign.py --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
            --output "${RUNNER_TEMP}/artifact-stable.sig" \
            artifact --key-id "${CHUDWARE_RELEASE_KEY_ID}" --version "${RELEASE_STABLE_VERSION}" \
            --platform "${RELEASE_PLATFORM}" --arch "${RELEASE_ARCH}" --artifact "${artifact}" > /dev/null

          # build_app.sh bound its own copy of the beta preimage; if the two ever
          # disagreed the gateway would reject one of them.
          emitted="${artifact}.artifact-signing-request.bin"
          if [ -f "${emitted}" ]; then
            cmp -s "${emitted}" "${RUNNER_TEMP}/artifact-request.bin" || {
              echo '::error::build_app.sh and ci_sign disagree about the artifact preimage'; exit 1; }
          fi

          # Evidence is required for promotion to stable but not for a beta
          # publish. A failure here is a loud warning and an evidence-less beta,
          # never a silently incomplete bundle.
          evidence="${RUNNER_TEMP}/evidence"
          rm -rf "${evidence}"
          status=0
          "${RELEASE_PYTHON}" packaging/generate_release_evidence.py "${artifact}" \
            --artifact-sha256 "${sha}" --version "${RELEASE_VERSION}" \
            --platform "${RELEASE_PLATFORM}" --arch "${RELEASE_ARCH}" --commit "${RELEASE_COMMIT}" \
            --locked-input CMakePresets.json --locked-input packaging/requirements-release.txt \
            --locked-input vendor/omp/bun.lock --command 'ctest core' --command 'ctest host' \
            --passed --out "${evidence}" || status=$?

          if [ "${status}" -eq 0 ]; then
            # A request is the evidence domain plus the exact canonical bytes.
            # The domain table lives in packaging/sign_release.py and is
            # imported, never retyped. The same script proves the platform-test
            # document names the suites this job actually ran.
            EVIDENCE_DIR="${evidence}" "${RELEASE_PYTHON}" - <<'PY' || status=$?
          import json
          import os
          import pathlib
          import sys

          sys.path.insert(0, os.getcwd())
          try:
              from packaging.sign_release import DOMAINS
          except ImportError:
              # An installed distribution named `packaging` shadows the repository
              # directory, which has no __init__.py. Import the module directly.
              sys.path.insert(0, os.path.join(os.getcwd(), "packaging"))
              from sign_release import DOMAINS

          directory = pathlib.Path(os.environ["EVIDENCE_DIR"])
          for name, kind in (("sbom.cdx.json", "sbom"),
                             ("provenance.slsa.json", "provenance"),
                             ("platform-test.v1.json", "platform-test")):
              body = (directory / name).read_bytes()
              (directory / (name + ".signing-request.bin")).write_bytes(DOMAINS[kind] + body)

          document = json.loads((directory / "platform-test.v1.json").read_text(encoding="utf-8"))
          missing = {"ctest core", "ctest host"} - set(document.get("commands", []))
          if missing or document.get("passed") is not True:
              raise SystemExit("platform-test evidence does not record the executed suites: %s" % sorted(missing))
          PY
          fi

          if [ "${status}" -eq 0 ]; then
            for pair in 'sbom.cdx.json:sbom' 'provenance.slsa.json:provenance' 'platform-test.v1.json:platform-test'; do
              name="${pair%%:*}"
              kind="${pair##*:}"
              "${RELEASE_PYTHON}" packaging/ci_sign.py --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
                --output "${evidence}/${name}.sig" \
                sign "${kind}" "${evidence}/${name}.signing-request.bin" > /dev/null || { status=1; break; }
            done
          fi

          if [ "${status}" -eq 0 ]; then
            echo 'HAS_EVIDENCE=1' >> "$GITHUB_ENV"
            echo "evidence signed: sbom, provenance, platform-test"
          else
            echo "::warning::release evidence generation or signing failed (exit ${status}); publishing this beta WITHOUT an evidence bundle, so it cannot be promoted to stable until a later build succeeds"
            echo 'HAS_EVIDENCE=0' >> "$GITHUB_ENV"
          fi

      - name: Verify the built app before it is offered to anyone
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/verify"
          rm -rf "${work}"
          mkdir -p "${work}"
          # ditto -c -k --keepParent produced the zip, so Chudware.app sits at
          # the archive root; unpacking with ditto keeps resource forks intact.
          ditto -x -k "${ARTIFACT}" "${work}"
          app="${work}/Chudware.app"
          test -d "${app}" || {
            echo '::error::the published zip does not contain Chudware.app'; exit 1; }
          for required in Contents/MacOS/Chudware Contents/MacOS/Chudware-bin \
            Contents/MacOS/chudware-hostd Contents/Frameworks/libchudware.dylib; do
            test -e "${app}/${required}" || {
              echo "::error::Chudware.app is missing ${required}"; exit 1; }
          done
          test -s "${app}/payload-manifest.v1.json" || {
            echo '::error::Chudware.app carries no payload-manifest.v1.json'; exit 1; }
          test -s "${app}/payload-manifest.v1.sig" || {
            echo '::error::Chudware.app carries no payload-manifest.v1.sig'; exit 1; }

          # 1. Nothing in the shipped bundle may load a library the bundle does
          #    not carry. The macOS equivalent of the AppImage ldd sweep: any
          #    absolute path outside /System or /usr/lib is a Homebrew or build
          #    tree leak that only fails on a customer's Mac.
          leaked=""
          checked=0
          for binary in "${app}/Contents/MacOS/Chudware-bin" "${app}/Contents/MacOS/chudware-hostd" \
            "${app}/Contents/MacOS/chudware-worker" "${app}/Contents/MacOS/chudware-mcp" \
            "${app}/Contents/MacOS/chudware-omp-bridge" "${app}/Contents/Frameworks"/*.dylib; do
            [ -f "${binary}" ] || continue
            checked=$((checked + 1))
            outside="$(otool -L "${binary}" | sed -n '2,$p' | awk '{print $1}' \
              | grep -v '^@' | grep -v '^/System/' | grep -v '^/usr/lib/' || true)"
            if [ -n "${outside}" ]; then
              leaked="${leaked} $(basename "${binary}")"
              printf '%s: %s\n' "${binary}" "${outside}" >&2
            fi
          done
          [ "${checked}" -gt 0 ] || {
            echo '::error::the extracted bundle has no Mach-O payload to check'; exit 1; }
          [ -z "${leaked}" ] || {
            echo "::error::shipped Mach-O files still load libraries from outside the bundle:${leaked}"
            exit 1
          }
          echo "otool: ${checked} Mach-O files, zero external absolute dependencies"

          # 2. The daemon must load and report THIS release. --status verifies the
          #    installed payload at startup, prints "chudware <version>" on stderr
          #    and then exits nonzero because no daemon is running: the banner is
          #    the assertion, the exit status is not.
          banner="$(CHUDWARE_LIBCHUDWARE="${app}/Contents/Frameworks/libchudware.dylib" \
            "${app}/Contents/MacOS/chudware-hostd" --status 2>&1 >/dev/null || true)"
          printf '%s\n' "${banner}"
          printf '%s' "${banner}" | grep -Fq "${RELEASE_VERSION}" || {
            echo "::error::chudware-hostd did not load and report ${RELEASE_VERSION}"; exit 1; }

          # 3. The signed payload manifest must describe the extracted bytes, and
          #    its signature must verify against release-ci-v1.
          PYTHONPATH="${GITHUB_WORKSPACE}" "${RELEASE_PYTHON}" - "${app}" "${RELEASE_PUBLIC_KEY_B64}" <<'PY'
          import sys
          from pathlib import Path
          from services.installer.payload_manifest import read_manifest, verify_manifest_payload, verify_signature
          root = Path(sys.argv[1])
          manifest, canonical = read_manifest(root)
          verify_manifest_payload(root, canonical)
          verify_signature(key_id=str(manifest["key_id"]), canonical_json=canonical,
                           signature_path=root / "payload-manifest.v1.sig", public_key=sys.argv[2])
          if manifest["platform"] != "macos":
              raise SystemExit("payload manifest claims platform %r" % manifest["platform"])
          print("payload manifest verified: %d files, key_id %s, version %s"
                % (len(manifest["files"]), manifest["key_id"], manifest["version"]))
          PY

          # The manifest and its signature ride beside the artifact as sidecars;
          # they live inside the bundle, so take them from the verified tree.
          cp "${app}/payload-manifest.v1.json" "${work}/payload-manifest.v1.json"
          cp "${app}/payload-manifest.v1.sig" "${work}/payload-manifest.v1.sig"

      - name: Upload the app and publish over the gateway API
        shell: bash
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/gw.sh"
          name="Chudware-${RELEASE_VERSION}-macos-${RELEASE_ARCH}.zip"

          upload_one() {  # upload_one <local file> <remote name>
            local file="$1" remote="$2" expected reported response
            test -f "${file}" || { echo "::error::missing upload ${file}"; exit 1; }
            expected="$("${RELEASE_PYTHON}" - "${file}" <<'PY'
          import hashlib, sys
          value = hashlib.sha256()
          with open(sys.argv[1], "rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  value.update(chunk)
          print(value.hexdigest())
          PY
          )"
            response="$(gw_upload "${file}" "${remote}")" || {
              echo "::error::upload failed for ${remote}"; exit 1; }
            # The gateway re-digests these bytes again at publish time; comparing
            # here names transport corruption at the file that caused it instead
            # of as a 422 an hour later.
            reported="$(printf '%s' "${response}" | "${RELEASE_PYTHON}" -c \
              'import json,sys; print(json.load(sys.stdin).get("sha256",""))')" || reported=""
            if [ "${reported}" != "${expected}" ]; then
              echo "::error::the gateway stored a different digest for ${remote}: expected ${expected}, got '${reported}'"
              exit 1
            fi
            echo "uploaded ${remote} sha256=${reported}"
            uploaded=$((uploaded + 1))
          }

          # Sidecars carry the artifact's own name plus a suffix; the payload
          # signature REPLACES the .json (payload-manifest.v1.sig), while
          # evidence signatures append .sig to the full evidence file name.
          uploaded=0
          upload_one "${ARTIFACT}" "${name}"
          upload_one "${RUNNER_TEMP}/verify/payload-manifest.v1.json" "${name}.payload-manifest.v1.json"
          upload_one "${RUNNER_TEMP}/verify/payload-manifest.v1.sig" "${name}.payload-manifest.v1.sig"
          if [ "${HAS_EVIDENCE}" = 1 ]; then
            for document in sbom.cdx.json provenance.slsa.json platform-test.v1.json; do
              for suffix in '' '.sig'; do
                upload_one "${RUNNER_TEMP}/evidence/${document}${suffix}" "${name}.${document}${suffix}"
              done
            done
          fi
          echo "ARTIFACT_NAME=${name}" >> "$GITHUB_ENV"
          echo "uploaded ${uploaded} files into the gateway staging directory"

          ci_status publishing "posting ci/publish for ${name}"

          body="${RUNNER_TEMP}/publish.json"
          # The gateway recomputes every digest from the staged files and rejects
          # a mismatch, so the body is built from the exact bytes that were
          # uploaded.
          EVIDENCE_DIR="${RUNNER_TEMP}/evidence" "${RELEASE_PYTHON}" - "${ARTIFACT}" \
            "${RUNNER_TEMP}/artifact.sig" "${RUNNER_TEMP}/artifact-stable.sig" > "${body}" <<'PY'
          import hashlib, json, os, pathlib, sys

          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          artifact = pathlib.Path(sys.argv[1])
          body = {
              "version": os.environ["RELEASE_VERSION"],
              "stable_version": os.environ["RELEASE_STABLE_VERSION"],
              "platform": os.environ["RELEASE_PLATFORM"],
              "arch": os.environ["RELEASE_ARCH"],
              "channel": "beta",
              "key_id": os.environ["CHUDWARE_RELEASE_KEY_ID"],
              "min_supported": os.environ["CHUDWARE_RELEASE_MIN_SUPPORTED"],
              "sha256": os.environ["ARTIFACT_SHA256"],
              "size": artifact.stat().st_size,
              "signature": pathlib.Path(sys.argv[2]).read_text(encoding="ascii").strip(),
              "stable_signature": pathlib.Path(sys.argv[3]).read_text(encoding="ascii").strip(),
              "notes_url": os.environ["CHUDWARE_RELEASE_NOTES_URL"],
              "commit_sha": os.environ["RELEASE_COMMIT"],
          }
          if os.environ.get("HAS_EVIDENCE") == "1":
              directory = pathlib.Path(os.environ["EVIDENCE_DIR"])
              evidence = {}
              for field, name in (("sbom", "sbom.cdx.json"),
                                  ("provenance", "provenance.slsa.json"),
                                  ("platform_test", "platform-test.v1.json")):
                  evidence[field + "_sha256"] = digest(directory / name)
                  evidence[field + "_signature_sha256"] = digest(directory / (name + ".sig"))
              body["evidence"] = evidence
          json.dump(body, sys.stdout)
          PY

          # A 422 for a digest/size mismatch makes the gateway DELETE the staged
          # artifact (sidecars survive), so a retry must re-upload it. Re-running
          # this job does exactly that: it rebuilds and re-uploads before
          # publishing.
          response="$(gw_post /api/releases/ci/publish "${body}")" || {
            echo '::error::ci/publish rejected the macOS app'; exit 1; }
          printf '%s\n' "${response}" | "${RELEASE_PYTHON}" -c \
            'import json,sys; print(json.dumps(json.load(sys.stdin), indent=2, sort_keys=True))' \
            || printf '%s\n' "${response}"

          ci_status published "${name} published to beta"
          {
            echo "## macOS ${RELEASE_ARCH} beta published"
            echo ''
            echo "* artifact: \`${name}\`"
            echo "* stable pair signed for: \`${RELEASE_STABLE_VERSION}\`"
            echo "* evidence bundle: \`${HAS_EVIDENCE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure to the gateway
        if: always() && job.status != 'success'
        env:
          GATEWAY_TOKEN: ${{ secrets.CHUDWARE_GATEWAY_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          detail="macos-beta ${RELEASE_ARCH} ${{ job.status }} in run ${GITHUB_RUN_NUMBER}"
          if [ -r "${RUNNER_TEMP}/gw.sh" ]; then
            . "${RUNNER_TEMP}/gw.sh"
            ci_status failed "${detail}"
            exit 0
          fi
          # The capability step failed before gw.sh existed; without this the
          # queued row the plan job wrote stays "queued" in /admin forever.
          [ -n "${GATEWAY_TOKEN:-}" ] || exit 0
          umask 077
          curlrc="${RUNNER_TEMP}/gw-fallback.curlrc"
          printf 'header = "Authorization: Bearer %s"\n' "${GATEWAY_TOKEN}" > "${curlrc}"
          body="${RUNNER_TEMP}/ci-status-fallback.json"
          python3 - failed "${detail}" > "${body}" <<'PY'
          import json, os, sys
          json.dump({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "commit_sha": os.environ["RELEASE_COMMIT"],
              "channel": "beta",
              "platform": os.environ["RELEASE_PLATFORM"],
              "arch": os.environ["RELEASE_ARCH"],
              "version": os.environ["RELEASE_VERSION"],
              "status": sys.argv[1],
              "detail": sys.argv[2],
          }, sys.stdout)
          PY
          curl --config "${curlrc}" --fail-with-body --silent --show-error --max-time 60 \
            -H 'Content-Type: application/json' --data-binary "@${body}" \
            "${CHUDWARE_GATEWAY_PUBLIC_BASE}/api/releases/ci/status" > /dev/null \
            || echo "::warning::fallback ci/status was not recorded"
