# Automatic nightly beta releases, signed in CI.
#
# release.yml is the offline-ceremony pipeline: it prepares bounded signing
# requests and STOPS, because a stable release must be signed on the owner
# workstation with the age-encrypted release-v1 key. This workflow is the other
# half Hunter approved: a fully automatic BETA build, signed in CI with a second
# key (release-ci-v1, GitHub secret CHUDWARE_RELEASE_CI_KEY), published to the
# beta channel every night when the commit changed. Promotion to stable stays a
# human click in /admin, which is why every build signs the artifact twice: once
# under the beta version it publishes now, once under the stable version the
# promote button will publish later without rebuilding a byte.
#
# Trust boundaries that shape every step below:
#   * Serving and building are different machines. `plan` is metadata/API work
#     only and runs ON the gateway host (`cc-linux-livingroom`, the serving
#     SSD): it reads the release token from
#     /home/liveuser/chudware-web-data/gateway.env at the point of use and talks
#     to http://127.0.0.1:8300, so that copy of the token never leaves the box,
#     and it compiles nothing. Every build leg runs on a builder that has no
#     gateway.env, no production SSH credential and no path into the gateway's
#     release directory: linux-beta on the qualified `cc-linux-build` pool (the
#     private NVMe guest), windows-beta and macos-beta on their own hosts.
#     The builders hold the token as the GitHub secret
#     CHUDWARE_GATEWAY_RELEASE_TOKEN and reach the gateway over TLS on
#     https://app.chudware.com: artifacts and every sidecar stream in through
#     PUT /api/releases/ci/upload/<name>, then the ordinary ci/publish and
#     ci/status calls follow, and the gateway re-digests every staged byte
#     against the signed body. Those runners need nothing but outbound 443.
#     The bash legs share packaging/ci_gateway.sh; Windows uses
#     packaging/windows/publish_release.ps1.
#   * On every host the token reaches curl through a 0600 --config file, never
#     argv (a shared runner's process list is readable), never a log.
#   * The CI signing seed is only in the environment of the steps that sign.
#   * No actions/upload-artifact anywhere: artifact storage is metered and the
#     installers are ~500 MB. Diagnostics go to the (unmetered) step summary.
#
# `bash` on the Windows builders is an empty WSL shim that exits 0 without
# running anything (see native-build.yml), so every Windows step is Windows
# PowerShell 5.1 with an ASCII-only body. The Macs are the mirror image: they
# have a real bash, but it is Apple's bash 3.2, so every macOS step body stays
# within 3.2 (no associative arrays, no mapfile, no ${var^^}) and uses string
# accumulators rather than arrays, because `"${array[@]}"` on an empty array
# under `set -u` is an unbound-variable error before bash 4.4.
name: nightly-release

on:
  schedule:
    # 09:17 UTC. Off the hour: GitHub delays scheduled runs at popular minutes.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep every platform leg of an in-flight release together. New scheduled or
  # manual runs queue rather than cancelling a partially published release.
  group: nightly-release
  cancel-in-progress: false

env:
  CHUDWARE_RELEASE_KEY_ID: release-ci-v1
  # Public half of release-ci-v1. Passed to every ci_sign.py call so a rotated or
  # mistyped secret fails before anything is signed, and to the payload/AppImage
  # verifiers so they check the same key the shipped keyring trusts.
  CHUDWARE_RELEASE_CI_PUBLIC_KEY: d7434dc67f4d6e11cd4c8ced9b5ebbccf2e1477b5949d52d7685b6ca43a010f6
  # Anonymous, rate-limited, read-only: the public URL is correct here.
  CHUDWARE_BASE_VERSION_URL: https://app.chudware.com/api/releases/base-version
  # Nightly betas have no per-version notes page yet; the portal is the honest
  # destination and satisfies the gateway's absolute-HTTP(S) requirement.
  CHUDWARE_RELEASE_NOTES_URL: https://app.chudware.com/
  # A beta publish must never advance the supported-version floor: the gateway
  # refuses to move it backward, so a nightly that raised it would strand every
  # installed client. Raising the floor is a deliberate stable-release decision
  # made through packaging/publish.py register --min-supported.
  CHUDWARE_RELEASE_MIN_SUPPORTED: 0.1.0
  # Every build leg publishes through the public origin: no builder can (or
  # may) reach the gateway's loopback or its release directory. Uploading is
  # authenticated with the release token; /api/releases/ci is a public
  # pass-through in auth.py precisely so these endpoints can be reached from
  # off the gateway host with the Bearer enforced in the handler.
  CHUDWARE_GATEWAY_PUBLIC_BASE: https://app.chudware.com
  # Shared by every build leg. The CI endpoints have their own per-IP budget
  # (_ci_by_ip, 240/min) rather than the 20/min manual publish limiter, so a
  # normal night is nowhere near it; these retries are belt-and-suspenders for a
  # throttle, a 5xx or a dropped connection part-way through a 500 MB upload.
  # curl has retried 429 as well as 5xx since 7.51.
  CHUDWARE_GATEWAY_CURL_RETRY: --retry 5 --retry-delay 15 --retry-max-time 600

jobs:
  plan:
    name: Plan nightly version
    if: ${{ github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    environment: chudware-control-protected
    # The gateway host (serving SSD): this job reads gateway.env and talks to
    # loopback. Metadata and API calls only; it never compiles anything, and
    # no other nightly job may route here.
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, Linux, X64, cloudcastle-ci, cc-linux-livingroom]
    timeout-minutes: 10
    env:
      # Scoped to this job: no build leg sees the gateway's loopback or env file.
      CHUDWARE_GATEWAY_LOOPBACK: http://127.0.0.1:8300
      CHUDWARE_GATEWAY_ENV_FILE: /home/liveuser/chudware-web-data/gateway.env
    outputs:
      version: ${{ steps.plan.outputs.version }}
      stable_version: ${{ steps.plan.outputs.stable_version }}
      commit: ${{ steps.plan.outputs.commit }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - name: Resolve the nightly version and decide whether this commit needs a build
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          for tool in curl python3; do
            command -v "${tool}" >/dev/null 2>&1 || {
              echo "::error::runner ${RUNNER_NAME:-unknown} is missing ${tool}"; exit 1; }
          done
          test -r "${CHUDWARE_GATEWAY_ENV_FILE}" || {
            echo "::error::${CHUDWARE_GATEWAY_ENV_FILE} is not readable; this job must run on the gateway host (cc-linux-livingroom), the only place that file exists"
            exit 1
          }

          # Token to a 0600 curl config: never in argv (ps), never echoed.
          curlrc="${RUNNER_TEMP}/gw.curlrc"
          umask 077
          python3 - "${CHUDWARE_GATEWAY_ENV_FILE}" > "${curlrc}" <<'PY'
          import sys
          token = ""
          with open(sys.argv[1], encoding="utf-8") as stream:
              for line in stream:
                  line = line.strip()
                  if line.startswith("CHUDWARE_GATEWAY_RELEASE_TOKEN="):
                      token = line.split("=", 1)[1].strip().strip("'\"")
          if not token:
              raise SystemExit("gateway.env has no CHUDWARE_GATEWAY_RELEASE_TOKEN")
          print('header = "Authorization: Bearer %s"' % token)
          PY

          # Stable base the promote button will publish: highest stable patch + 1,
          # floor 0.1.0. Anonymous read, so the public URL is fine.
          base_json="${RUNNER_TEMP}/base-version.json"
          curl --fail-with-body --silent --show-error --location --max-time 30 \
            --output "${base_json}" "${CHUDWARE_BASE_VERSION_URL}"
          stable_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["base"])' "${base_json}")"
          [[ "${stable_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::gateway returned a non-canonical base version: ${stable_version}"; exit 1; }

          version="${stable_version}-beta.${GITHUB_RUN_NUMBER}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::computed version ${version} is not a valid semver"; exit 1; }

          # Nightly-if-changed: a scheduled run whose HEAD already published is a
          # rebuild of identical bytes under a new beta number. A manual dispatch
          # always builds (that is what dispatch is for).
          skip=false
          if [ "${GITHUB_EVENT_NAME}" = schedule ]; then
            builds="${RUNNER_TEMP}/ci-builds.json"
            if curl --config "${curlrc}" --fail-with-body --silent --show-error --max-time 30 \
                 --output "${builds}" \
                 "${CHUDWARE_GATEWAY_LOOPBACK}/api/releases/ci/builds?commit_sha=${GITHUB_SHA}&status=published"; then
              published="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["builds"]))' "${builds}")"
              if [ "${published}" -gt 0 ]; then
                skip=true
                echo "::notice::${GITHUB_SHA} already has ${published} published CI build(s); skipping tonight"
              fi
            else
              echo "::warning::could not read ci_builds from the gateway; building rather than skipping"
            fi
          fi

          {
            echo "version=${version}"
            echo "stable_version=${stable_version}"
            echo "commit=${GITHUB_SHA}"
            echo "skip=${skip}"
          } >> "$GITHUB_OUTPUT"

          {
            echo '## Nightly plan'
            echo ''
            echo "* beta version: \`${version}\`"
            echo "* stable pair: \`${stable_version}\`"
            echo "* commit: \`${GITHUB_SHA}\`"
            echo "* skip: \`${skip}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record every platform and architecture as queued
        if: steps.plan.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/queued.json"
          # One row per supported release target, keyed the way ci_builds is:
          # (run_id, platform, arch).
          for target in linux:x86_64 windows:x86_64 macos:x86_64; do
            platform="${target%%:*}"
            arch="${target##*:}"
            python3 - "${platform}" "${arch}" "${{ steps.plan.outputs.version }}" > "${body}" <<'PY'
          import json, os, sys
          json.dump({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "channel": "beta",
              "platform": sys.argv[1],
              "arch": sys.argv[2],
              "version": sys.argv[3],
              "status": "queued",
              "detail": "nightly-release run %s" % os.environ["GITHUB_RUN_NUMBER"],
          }, sys.stdout)
          PY
            curl --config "${RUNNER_TEMP}/gw.curlrc" --fail-with-body --silent --show-error \
              --max-time 60 -H 'Content-Type: application/json' \
              --data-binary "@${body}" "${CHUDWARE_GATEWAY_LOOPBACK}/api/releases/ci/status" \
              > /dev/null || echo "::warning::could not record queued status for ${platform} ${arch}"
          done

  linux-beta:
    name: Linux beta AppImage
    needs: plan
    if: ${{ (github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')) && (needs.plan.outputs.skip != 'true') }}
    environment: chudware-release-protected
    # Clean protected infrastructure only; never a recycled PR worker or its
    # home/interpreter/cache. Provisioning evidence is required before signing.
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, Linux, X64, cloudcastle-ci, cc-linux-build]
    timeout-minutes: 300
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_STABLE_VERSION: ${{ needs.plan.outputs.stable_version }}
      RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
      RELEASE_PLATFORM: linux
      RELEASE_ARCH: x86_64
      CORE_PRESET: linux-core
      HOST_BUILD_DIR: host/build-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The version override replaces `git describe`, but packaging still
          # reads tags for provenance and the gate expects a full history.
          fetch-depth: 0

      - name: Check runner capabilities and select the release Python
        env:
          CHUDWARE_RUNTIME_RELEASE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for tool in cmake ninja ctest python3 curl tar file ldd sha256sum strip rsync xvfb-run patchelf; do
            command -v "${tool}" >/dev/null 2>&1 || missing+=("${tool}")
          done
          # Only an image-qualified base interpreter may create the signing/
          # compiler runtime. Authenticate every wheel and compiler tool before
          # use; never sync public pip packages into persistent release Python.
          : "${CHUDWARE_CI_BASE_PYTHON:?qualify and export the protected image base Python}"
          : "${CHUDWARE_WHEELHOUSE:?provide the reviewed complete offline release wheelhouse}"
          case "${CHUDWARE_CI_BASE_PYTHON}" in
            /*) ;; *) echo '::error::base Python must be an absolute image-qualified path'; exit 1 ;;
          esac
          case "${CHUDWARE_WHEELHOUSE}" in
            /*) ;; *) echo '::error::wheelhouse must be an absolute reviewed path'; exit 1 ;;
          esac
          test -x "${CHUDWARE_CI_BASE_PYTHON}"
          for variable in $(compgen -e); do
            case "${variable}" in PYTHON*|LD_*|DYLD_*) unset "${variable}" ;; esac
          done
          venv="${RUNNER_TEMP}/release-python"
          VENV_DIR="${venv}" PYTHON="${CHUDWARE_CI_BASE_PYTHON}" \
            CHUDWARE_WHEELHOUSE="${CHUDWARE_WHEELHOUSE}" bash scripts/provision_venv.sh
          release_python="${venv}/bin/python3"
          "${CHUDWARE_CI_BASE_PYTHON}" -I -S -c \
            'import sys; sys.path.insert(0, sys.argv[1]); from services.installer.provision import main; sys.exit(main(sys.argv[2:]))' \
            "${PWD}" --check-inputs --venv-dir "${venv}" --base-python "${CHUDWARE_CI_BASE_PYTHON}" \
            --wheelhouse "${CHUDWARE_WHEELHOUSE}"
          "${release_python}" -c 'import nuitka, cryptography, yaml'
          echo "CHUDWARE_RELEASE_PYTHON=${release_python}" >> "$GITHUB_ENV"
          echo "${venv}/bin" >> "$GITHUB_PATH"
          set -- ensure --target linux-x86_64 \
            --cache-dir "${HOME}/chudware-ci-tools/chudcode" \
            --github-token-env CHUDWARE_RUNTIME_RELEASE_TOKEN \
            --github-mirror-repository "${GITHUB_REPOSITORY}"
          if [ -n "${CHUDWARE_CHUD_BIN:-}" ]; then
            set -- "$@" --input "${CHUDWARE_CHUD_BIN}"
          fi
          if [ -x "${release_python}" ] && "${release_python}" scripts/pin_chudcode.py \
              "$@" > "${RUNNER_TEMP}/chudcode.json"; then
            chud_bin="$("${release_python}" -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' "${RUNNER_TEMP}/chudcode.json")"
            echo "CHUDWARE_CHUD_BIN=${chud_bin}" >> "$GITHUB_ENV"
          else
            missing+=("verified-pinned-Chudcode-see-docs/reference/CI_RUNNERS.md")
          fi
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::runner ${RUNNER_NAME:-unknown} is missing required tools: ${missing[*]}. Run runner-provision (provision-linux) against this label and re-dispatch."
            exit 1
          fi

      - name: Open the authenticated channel to the gateway
        env:
          GATEWAY_TOKEN: ${{ secrets.CHUDWARE_GATEWAY_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Public origin, run-scoped 0600 curl config, and the shared retry
          # budget on every call; installs ${RUNNER_TEMP}/gw.sh for later steps.
          . packaging/ci_gateway.sh
          gw_open
          ci_status building "configuring core + host for ${RELEASE_VERSION}"

      - name: Generate protected assets and build core + host at the pinned version
        shell: bash
        run: |
          set -euo pipefail
          protected_assets="${HOST_BUILD_DIR}/generated/protected-assets"
          python3 packaging/embed_protected_assets.py --source-root . --output-dir "${protected_assets}"

          cmake --preset "${CORE_PRESET}" \
            -DCHUDWARE_DEVELOPER_BUILD=OFF \
            -DCHUDWARE_LTO=ON \
            -DCHUDWARE_VERSION_OVERRIDE="${RELEASE_VERSION}" \
            -DCHUDWARE_PROTECTED_ASSETS_DIR="${GITHUB_WORKSPACE}/${protected_assets}"
          cmake --build --preset "${CORE_PRESET}"

          # Reauthenticate the exact pinned SDK immediately before CMake;
          # never select the newest unchecked extracted cache directory.
          cef_root="$(bash scripts/fetch_cef_posix.sh \
            --destination-root "${RUNNER_TEMP}/cef-authenticated-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"

          cmake -S host -B "${HOST_BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHUDWARE_DEVELOPER_BUILD=OFF \
            -DCHUDWARE_LTO=ON \
            -DCHUDWARE_VERSION_OVERRIDE="${RELEASE_VERSION}" \
            -DCHUDWARE_PROTECTED_ASSETS_DIR="${GITHUB_WORKSPACE}/${protected_assets}" \
            -DCEF_ROOT="${cef_root}"
          cmake --build "${HOST_BUILD_DIR}"

          # Prove both caches carry the release identity rather than a git-derived
          # 0.0.0-dirty, and that neither tree is a developer build.
          for cache in "build/${CORE_PRESET}/CMakeCache.txt" "${HOST_BUILD_DIR}/CMakeCache.txt"; do
            grep -Fqx "CHUDWARE_VERSION_OVERRIDE:STRING=${RELEASE_VERSION}" "${cache}" || {
              echo "::error::${cache} does not carry CHUDWARE_VERSION_OVERRIDE=${RELEASE_VERSION}"; exit 1; }
            grep -Fqx 'CHUDWARE_DEVELOPER_BUILD:BOOL=OFF' "${cache}" || {
              echo "::error::${cache} is not an explicit production configure"; exit 1; }
          done
          grep -Fq "\"${RELEASE_VERSION}\"" "${HOST_BUILD_DIR}/generated/api/chudware_version.h" || {
            echo "::error::generated version header does not contain ${RELEASE_VERSION}"; exit 1; }

      - name: Run the core and host test suites
        shell: bash
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/gw.sh"
          ci_status testing "ctest core + host"

          "${CHUDWARE_RELEASE_PYTHON}" scripts/run_release_ctest.py \
            --core-dir "build/${CORE_PRESET}/core" --host-dir "${HOST_BUILD_DIR}" \
            --out "${RUNNER_TEMP}/test-results"
          cat "${RUNNER_TEMP}/test-results/test-results.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Headless GUI smoke capture (advisory)
        shell: bash
        run: |
          # The runner invokes bash with -e on the command line; an in-script
          # `set -uo pipefail` does NOT clear it, which is why the advisory step
          # still failed the job. Turn -e off explicitly.
          set +e
          set -uo pipefail
          mkdir -p scratch
          rm -f scratch/smoke.png
          # ADVISORY, not a gate. The production (CEF-on) build reliably
          # deadlocks inside exit handlers in this scenario — the tracked
          # T-RF23 Chromium exit hang, reproduced here at rc=137 with
          # CHUDWARE_CEF_LAZY=1 as well, so it is not merely eager CEF init.
          # The hard artifact gates are ctest (above) and the extracted-AppImage
          # verification (below: ldd clean, hostd --status loads, signed payload
          # manifest verifies), which prove the shipped bytes without depending
          # on a GUI teardown bug. Turn this back into a gate when T-RF23 lands.
          timeout --signal=KILL 180 \
            xvfb-run -a --server-args='-screen 0 1920x1080x24' \
            env CHUDWARE_SHOT=m1 CHUDWARE_CEF_LAZY=1 "./${HOST_BUILD_DIR}/bin/chudware" \
              --ui-screenshot "${GITHUB_WORKSPACE}/scratch/smoke.png"
          rc=$?
          if [ "${rc}" -ne 0 ]; then
            echo "::warning::headless capture did not exit cleanly (rc=${rc}); T-RF23 exit hang — artifact gates still apply"
          elif [ ! -s scratch/smoke.png ]; then
            echo "::warning::headless capture exited cleanly but wrote no screenshot"
          else
            python3 -c 'import sys; sys.exit(0 if open("scratch/smoke.png","rb").read(8) == b"\x89PNG\r\n\x1a\n" else "smoke capture is not a PNG")' \
              && echo "smoke capture: $(stat -c %s scratch/smoke.png) bytes"
          fi

      - name: Stage the immutable payload and sign it
        env:
          CHUDWARE_RELEASE_CI_KEY: ${{ secrets.CHUDWARE_RELEASE_CI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/gw.sh"
          ci_status packaging "staging AppDir and signing the payload manifest"

          out="${RUNNER_TEMP}/prepared"
          rm -rf "${out}"
          mkdir -p "${out}"
          packaging/linux/build_appimage.sh --prepare-signing \
            --key-id "${CHUDWARE_RELEASE_KEY_ID}" --out "${out}" \
            --protected-assets-dir "${HOST_BUILD_DIR}/generated/protected-assets" \
            --host-bin "${HOST_BUILD_DIR}/bin/chudware" \
            --hostd-bin "build/${CORE_PRESET}/bin/chudware-hostd" \
            --libchudware-bin "build/${CORE_PRESET}/bin/libchudware.so" \
            --chud-bin "${CHUDWARE_CHUD_BIN}"

          # Retain actual process results, JUnit counts and logs for independent
          # finalizer verification; command labels alone are not test evidence.
          cp "${RUNNER_TEMP}/test-results/"* "${out}/"
          mkdir -p "${out}/packaging" "${out}/vendor/chudcode"
          cp CMakePresets.json "${out}/CMakePresets.json"
          cp packaging/requirements-release.txt "${out}/packaging/requirements-release.txt"
          cp vendor/chudcode/CHUDCODE_ARTIFACT.lock "${out}/vendor/chudcode/CHUDCODE_ARTIFACT.lock"
          python3 - "${out}" <<'PY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          names = ('CMakePresets.json', 'packaging/requirements-release.txt', 'vendor/chudcode/CHUDCODE_ARTIFACT.lock',
                   'test-results.json', 'core-junit.xml', 'host-junit.xml', 'core-ctest.log', 'host-ctest.log')
          handoff = {
              'schema': 'chudware-offline-handoff-v1',
              'commit': os.environ['RELEASE_COMMIT'],
              'version': os.environ['RELEASE_VERSION'],
              'channel': 'beta',
              'platform': os.environ['RELEASE_PLATFORM'],
              'arch': os.environ['RELEASE_ARCH'],
              'locked_inputs': [
                  {'path': name, 'sha256': hashlib.sha256((root / name).read_bytes()).hexdigest()}
                  for name in names
              ],
          }
          (root / 'handoff.json').write_bytes(
              json.dumps(handoff, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode('ascii') + b'\n')
          PY

          tar -C "${out}" -cf "${RUNNER_TEMP}/prepared.tar" .

          request="$(find "${out}" -type f -name '*payload-signing-request.bin' -print -quit)"
          test -s "${request}" || { echo '::error::payload signing request missing'; exit 1; }
          "${CHUDWARE_RELEASE_PYTHON}" packaging/ci_sign.py \
            --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
            --output "${RUNNER_TEMP}/payload.sig" \
            sign payload "${request}" > /dev/null
          echo "payload manifest signed with ${CHUDWARE_RELEASE_KEY_ID}"

      - name: Finalize the AppImage with complete retained test evidence
        shell: bash
        run: |
          set -euo pipefail

          public_key_b64="$(python3 -c 'import base64,os,sys; sys.stdout.write(base64.b64encode(bytes.fromhex(os.environ["CHUDWARE_RELEASE_CI_PUBLIC_KEY"])).decode())')"
          echo "RELEASE_PUBLIC_KEY_B64=${public_key_b64}" >> "$GITHUB_ENV"
          final="${RUNNER_TEMP}/final"
          rm -rf "${final}"

          # finalize_release.py embeds the payload signature, builds the AppImage,
          # Any native packaging, verification or evidence failure stops signing
          # and publication, even if the builder left an AppImage behind.
          # Captured to a file and echoed back, because GitHub's log storage has dropped
          # this step's blob twice (BlobNotFound on download, and the runner's own page
          # log holds only the command template) -- leaving a 45-minute build with an
          # unreadable failure. The tail is reprinted inside the error path so the reason
          # survives even when the streamed log does not.
          status=0
          finalize_log="${RUNNER_TEMP}/finalize.log"
          "${CHUDWARE_RELEASE_PYTHON}" packaging/finalize_release.py "${RUNNER_TEMP}/prepared.tar" \
            --payload-signature "${RUNNER_TEMP}/payload.sig" \
            --release-public-key "${public_key_b64}" \
            --platform "${RELEASE_PLATFORM}" --arch "${RELEASE_ARCH}" \
            --version "${RELEASE_VERSION}" --commit "${RELEASE_COMMIT}" --channel beta \
            --handoff-metadata "${RUNNER_TEMP}/prepared/handoff.json" \
            --out "${final}" > "${finalize_log}" 2>&1 || status=$?
          cat "${finalize_log}"

          if [ "${status}" -ne 0 ]; then
            {
              echo "### finalize_release.py failed (exit ${status})"
              echo '```'
              tail -n 60 "${finalize_log}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::finalize_release.py failed (exit ${status}); retained output is not signable"
            exit "${status}"
          fi
          artifact="$(find "${final}" -type f -name "Chudware-${RELEASE_VERSION}-linux-x86_64.AppImage" -print -quit)"
          test -s "${artifact}" || { echo '::error::successful finalization did not produce the AppImage'; exit 1; }
          dir="${final}/evidence"
          for name in sbom.cdx.json provenance.slsa.json platform-test.v1.json; do
            test -s "${dir}/${name}" && test -s "${dir}/${name}.signing-request.bin" || {
              echo "::error::successful finalization omitted ${name} or its signing request"; exit 1; }
          done
          echo "ARTIFACT=${artifact}" >> "$GITHUB_ENV"


      - name: Verify the built AppImage before it is offered to anyone
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/verify"
          rm -rf "${work}"
          mkdir -p "${work}"
          cp "${ARTIFACT}" "${work}/artifact.AppImage"
          chmod +x "${work}/artifact.AppImage"
          ( cd "${work}" && ./artifact.AppImage --appimage-extract > extract.log 2>&1 )
          root="${work}/squashfs-root"
          test -x "${root}/usr/bin/chudware" || {
            echo '::error::extracted AppImage has no executable GUI binary'; exit 1; }

          # 1. Nothing in the shipped tree may need a library the AppImage does not
          #    carry. `ldd` prints "not found" per unresolved DT_NEEDED entry.
          targets=()
          while IFS= read -r -d '' candidate; do
            if file -b "${candidate}" | grep -q 'ELF'; then targets+=("${candidate}"); fi
          done < <(find "${root}/usr/bin" "${root}/usr/lib" -type f -print0)
          [ "${#targets[@]}" -gt 0 ] || { echo '::error::extracted payload has no ELF binaries'; exit 1; }
          unresolved="$(LD_LIBRARY_PATH="${root}/usr/lib" ldd "${targets[@]}" 2>/dev/null | awk '/not found/{print}' || true)"
          if [ -n "${unresolved}" ]; then
            echo '::error::extracted AppImage has unresolved libraries'
            printf '%s\n' "${unresolved}" >&2
            exit 1
          fi
          echo "ldd: ${#targets[@]} ELF files, zero 'not found'"

          # 2. The daemon must load and report THIS release. --status verifies the
          #    installed payload at startup, prints "chudware <version>" on stderr
          #    and then exits nonzero because no daemon is running: the banner is
          #    the assertion, the exit status is not.
          banner="$(LD_LIBRARY_PATH="${root}/usr/lib" \
            CHUDWARE_LIBCHUDWARE="${root}/usr/lib/libchudware.so" \
            "${root}/usr/bin/chudware-hostd" --status 2>&1 >/dev/null || true)"
          printf '%s\n' "${banner}"
          printf '%s' "${banner}" | grep -Fq "${RELEASE_VERSION}" || {
            echo "::error::chudware-hostd did not load and report ${RELEASE_VERSION}"; exit 1; }

          # 3. The signed payload manifest must describe the extracted bytes, and
          #    its signature must verify against release-ci-v1.
          # The release Python, not the system one: verify_signature needs
          # `cryptography`, which only the release venv carries.
          PYTHONPATH="${GITHUB_WORKSPACE}" "${CHUDWARE_RELEASE_PYTHON}" - "${root}" "${RELEASE_PUBLIC_KEY_B64}" <<'PY'
          import sys
          from pathlib import Path
          from services.installer.payload_manifest import read_manifest, verify_manifest_payload, verify_signature
          root = Path(sys.argv[1])
          manifest, canonical = read_manifest(root)
          verify_manifest_payload(root, canonical)
          verify_signature(key_id=str(manifest["key_id"]), canonical_json=canonical,
                           signature_path=root / "payload-manifest.v1.sig", public_key=sys.argv[2])
          print("payload manifest verified: %d files, key_id %s, version %s"
                % (len(manifest["files"]), manifest["key_id"], manifest["version"]))
          PY

          # The manifest and its signature ride beside the artifact as sidecars;
          # the finalizer deleted the AppDir, so take them from the verified tree.
          cp "${root}/payload-manifest.v1.json" "${work}/payload-manifest.v1.json"
          cp "${root}/payload-manifest.v1.sig" "${work}/payload-manifest.v1.sig"

      - name: Sign the verified AppImage artifact pair and evidence
        env:
          CHUDWARE_RELEASE_CI_KEY: ${{ secrets.CHUDWARE_RELEASE_CI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="${ARTIFACT}"
          dir="${RUNNER_TEMP}/final/evidence"
          "${CHUDWARE_RELEASE_PYTHON}" packaging/ci_sign.py --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
            --output "${RUNNER_TEMP}/artifact.sig" \
            artifact --key-id "${CHUDWARE_RELEASE_KEY_ID}" --version "${RELEASE_VERSION}" \
            --platform "${RELEASE_PLATFORM}" --arch "${RELEASE_ARCH}" --artifact "${artifact}" \
            --request-out "${RUNNER_TEMP}/artifact-request.bin" > /dev/null
          "${CHUDWARE_RELEASE_PYTHON}" packaging/ci_sign.py --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
            --output "${RUNNER_TEMP}/artifact-stable.sig" \
            artifact --key-id "${CHUDWARE_RELEASE_KEY_ID}" --version "${RELEASE_STABLE_VERSION}" \
            --platform "${RELEASE_PLATFORM}" --arch "${RELEASE_ARCH}" --artifact "${artifact}" > /dev/null
          emitted="${artifact}.artifact-signing-request.bin"
          test -s "${emitted}" || { echo '::error::finalizer omitted the artifact preimage'; exit 1; }
          cmp -s "${emitted}" "${RUNNER_TEMP}/artifact-request.bin" || {
            echo '::error::finalizer and ci_sign disagree about the artifact preimage'; exit 1; }
          for pair in 'sbom.cdx.json:sbom' 'provenance.slsa.json:provenance' 'platform-test.v1.json:platform-test'; do
            name="${pair%%:*}"
            kind="${pair##*:}"
            "${CHUDWARE_RELEASE_PYTHON}" packaging/ci_sign.py --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
              --output "${dir}/${name}.sig" \
              sign "${kind}" "${dir}/${name}.signing-request.bin" > /dev/null
          done

      - name: Package the verified tree as .deb and .rpm
        env:
          CHUDWARE_RELEASE_CI_KEY: ${{ secrets.CHUDWARE_RELEASE_CI_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          # ------------------------------------------------------------------
          # Shared publish path. Written FIRST and unconditionally: the AppImage
          # publish step below sources it too, so nothing here may be reachable
          # only when packaging succeeds.
          # ------------------------------------------------------------------
          cat > "${RUNNER_TEMP}/publish_body.py" <<'PY'
          """Build one ci/publish body. Used by the AppImage and by every package.

          `format` is a routing key, not an identity claim: the artifact signature
          preimage stays (key_id, version, platform, arch, sha256), and the digest
          already binds these exact bytes. Every format therefore signs its own
          digest, and shipped 0.1.1 clients keep verifying releases unchanged.
          """
          import hashlib, json, os, pathlib, sys

          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          artifact = pathlib.Path(sys.argv[1])
          body = {
              "version": os.environ["RELEASE_VERSION"],
              "stable_version": os.environ["RELEASE_STABLE_VERSION"],
              "platform": os.environ["RELEASE_PLATFORM"],
              "arch": os.environ["RELEASE_ARCH"],
              "channel": "beta",
              "format": sys.argv[4],
              "key_id": os.environ["CHUDWARE_RELEASE_KEY_ID"],
              "min_supported": os.environ["CHUDWARE_RELEASE_MIN_SUPPORTED"],
              "sha256": digest(artifact),
              "size": artifact.stat().st_size,
              "signature": pathlib.Path(sys.argv[2]).read_text(encoding="ascii").strip(),
              "stable_signature": pathlib.Path(sys.argv[3]).read_text(encoding="ascii").strip(),
              "notes_url": os.environ["CHUDWARE_RELEASE_NOTES_URL"],
              "commit_sha": os.environ["RELEASE_COMMIT"],
          }
          directory = pathlib.Path(sys.argv[5])
          evidence = {}
          for field, name in (
              ("sbom", "sbom.cdx.json"),
              ("provenance", "provenance.slsa.json"),
              ("platform_test", "platform-test.v1.json"),
          ):
              evidence[field + "_sha256"] = digest(directory / name)
              evidence[field + "_signature_sha256"] = digest(directory / (name + ".sig"))
          body["evidence"] = evidence
          json.dump(body, sys.stdout)
          PY

          cat > "${RUNNER_TEMP}/pkg.sh" <<'SH'
          # canonical_name <format>: ask the gateway's own naming module. The publish
          # endpoint looks for a staged file by exactly this name, so nothing in CI may
          # hand-format it (prereleases sanitise '-' differently per format).
          canonical_name() {
            python3 "${GITHUB_WORKSPACE}/Webservice/gateway/artifact_names.py" \
              --version "${RELEASE_VERSION}" --platform "${RELEASE_PLATFORM}" \
              --arch "${RELEASE_ARCH}" --format "$1"
          }
          # sign_artifact_identity <artifact> <version> <output>: one Ed25519 artifact
          # signature over these exact bytes. ci_sign.py writes with O_EXCL, so a retry
          # has to clear the target first.
          sign_artifact_identity() {
            rm -f "$3"
            "${CHUDWARE_RELEASE_PYTHON}" packaging/ci_sign.py \
              --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" --output "$3" \
              artifact --key-id "${CHUDWARE_RELEASE_KEY_ID}" --version "$2" \
              --platform "${RELEASE_PLATFORM}" --arch "${RELEASE_ARCH}" \
              --artifact "$1" > /dev/null
          }
          # sign_identities <artifact> <prefix>: the beta version published now, and the
          # stable version /admin will promote to without rebuilding a byte.
          sign_identities() {
            sign_artifact_identity "$1" "${RELEASE_VERSION}" "$2.sig"
            sign_artifact_identity "$1" "${RELEASE_STABLE_VERSION}" "$2-stable.sig"
          }
          # publish_release_file <local file> <canonical name> <format> <sig prefix>:
          # upload the artifact plus the SAME signed payload manifest and evidence
          # sidecars under the canonical name (which is how the gateway pairs them),
          # then post ci/publish. Every byte stays on this runner's RUNNER_TEMP until
          # it goes up over TLS; the body's digests and sizes come from exactly the
          # local files just uploaded, and the gateway recomputes them from what it
          # staged and rejects any mismatch. A 422 makes the gateway DELETE the staged
          # artifact (sidecars survive), so every publish uploads immediately before
          # it and never reuses an upload across a retry.
          #
          # Every command carries `|| return 1` and the helper ends in an explicit
          # `return 0`. That is not belt-and-braces: the package step below runs WITHOUT
          # -e (one format must not abort the other) and calls this in an `if` test,
          # and bash suppresses errexit for the whole subtree of an `if` condition —
          # including a nested subshell that sets `set -e` itself (measured: a subshell
          # guard reported success after a failed install). Without explicit returns a
          # format would be reported "published" from an upload that never happened.
          publish_release_file() {
            local source="$1" name="$2" format="$3" prefix="$4" evidence=""
            case "${format}" in
              default) evidence="${RUNNER_TEMP}/final/evidence" ;;
              deb|rpm) evidence="${RUNNER_TEMP}/evidence-${format}" ;;
              *) echo "::error::unsupported release format ${format}"; return 1 ;;
            esac
            local body="${RUNNER_TEMP}/publish-${format}.json"
            local response="${RUNNER_TEMP}/publish-response-${format}.json"
            gw_upload_release "${source}" "${name}" "${RUNNER_TEMP}/verify" "${evidence}" \
              || return 1
            python3 "${RUNNER_TEMP}/publish_body.py" "${source}" "${prefix}.sig" \
              "${prefix}-stable.sig" "${format}" "${evidence}" > "${body}" || return 1
            gw_post /api/releases/ci/publish "${body}" > "${response}" || return 1
            python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), indent=2, sort_keys=True))' \
              "${response}" || return 1
            return 0
          }
          SH
          . "${RUNNER_TEMP}/gw.sh"
          . "${RUNNER_TEMP}/pkg.sh"

          # All supported native formats and their artifact-specific evidence
          # must succeed before this job publishes anything.
          for tool in rpmbuild xz; do
            command -v "${tool}" >/dev/null 2>&1 || {
              echo "::error::required native package tool missing: ${tool}"; exit 1; }
          done
          ci_status packaging "building .deb and .rpm from the verified tree"
          root="${RUNNER_TEMP}/verify/squashfs-root"
          out="${RUNNER_TEMP}/packages"
          mkdir -p "${out}"
          for format in deb rpm; do
            name="$(canonical_name "${format}")"
            packaging/linux/build_linux_packages.sh --appdir "${root}" \
              --version "${RELEASE_VERSION}" --out "${out}" --format "${format}"
            test -s "${out}/${name}" || { echo "::error::native package output missing: ${name}"; exit 1; }
          done
          for format in deb rpm; do
            name="$(canonical_name "${format}")"
            artifact="${out}/${name}"
            evidence="${RUNNER_TEMP}/evidence-${format}"
            sha="$(sha256sum "${artifact}" | cut -d ' ' -f 1)"
            "${CHUDWARE_RELEASE_PYTHON}" packaging/generate_release_evidence.py "${artifact}" \
              --artifact-sha256 "${sha}" --version "${RELEASE_VERSION}" \
              --platform "${RELEASE_PLATFORM}" --arch "${RELEASE_ARCH}" --commit "${RELEASE_COMMIT}" \
              --locked-input CMakePresets.json --locked-input packaging/requirements-release.txt \
              --locked-input vendor/chudcode/CHUDCODE_ARTIFACT.lock \
              --test-results "${RUNNER_TEMP}/test-results/test-results.json" --out "${evidence}"
            "${CHUDWARE_RELEASE_PYTHON}" packaging/windows/prepare_evidence_requests.py "${evidence}"
          done
          for format in deb rpm; do
            name="$(canonical_name "${format}")"
            evidence="${RUNNER_TEMP}/evidence-${format}"
            sign_identities "${out}/${name}" "${RUNNER_TEMP}/artifact-${format}"
            for pair in 'sbom.cdx.json:sbom' 'provenance.slsa.json:provenance' 'platform-test.v1.json:platform-test'; do
              entry="${pair%%:*}"
              kind="${pair##*:}"
              "${CHUDWARE_RELEASE_PYTHON}" packaging/ci_sign.py --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
                --output "${evidence}/${entry}.sig" \
                sign "${kind}" "${evidence}/${entry}.signing-request.bin" > /dev/null
            done
          done

      - name: Upload and publish the beta release over the gateway API
        shell: bash
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/gw.sh"
          . "${RUNNER_TEMP}/pkg.sh"
          name="$(canonical_name default)"
          echo "ARTIFACT_NAME=${name}" >> "$GITHUB_ENV"
          ci_status publishing "uploading and posting ci/publish for ${name}"

          # A 422 for a digest/size mismatch makes the gateway DELETE the staged
          # artifact (sidecars survive), so a retry must re-upload it. Re-running
          # this job does exactly that: it rebuilds and re-uploads before publishing.
          publish_release_file "${ARTIFACT}" "${name}" default "${RUNNER_TEMP}/artifact"
          ci_status published "${name} published to beta"
          {
            echo '## Linux beta published'
            echo ''
            echo "* artifact: \`${name}\`"
            echo "* stable pair signed for: \`${RELEASE_STABLE_VERSION}\`"
            echo '* evidence bundle: complete and signed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload and publish the Linux packages
        shell: bash
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/gw.sh"
          . "${RUNNER_TEMP}/pkg.sh"

          # Each upload immediately precedes publication because failed gateway
          # validation can remove that staged artifact. Failure is a failed job,
          # never a successful row with an omitted native format.
          for format in deb rpm; do
            name="$(canonical_name "${format}")"
            source="${RUNNER_TEMP}/packages/${name}"
            test -s "${source}" || { echo "::error::native package disappeared: ${name}"; exit 1; }
            publish_release_file "${source}" "${name}" "${format}" "${RUNNER_TEMP}/artifact-${format}"
          done
          ci_status published "${ARTIFACT_NAME} published to beta; formats: default deb rpm"
          echo '* package formats published: default deb rpm' >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure to the gateway
        if: always() && job.status != 'success'
        env:
          GATEWAY_TOKEN: ${{ secrets.CHUDWARE_GATEWAY_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          detail="linux-beta ${{ job.status }} in run ${GITHUB_RUN_NUMBER}"
          if [ -r "${RUNNER_TEMP}/gw.sh" ]; then
            . "${RUNNER_TEMP}/gw.sh"
            ci_status failed "${detail}"
            exit 0
          fi
          # The capability step failed before gw.sh existed. Without this the
          # queued row the plan job wrote stays "queued" in /admin forever,
          # which reads as a hung runner instead of a failed leg. Same public
          # origin and secret token as gw.sh, in a run-scoped 0600 config.
          [ -n "${GATEWAY_TOKEN:-}" ] || exit 0
          umask 077
          curlrc="${RUNNER_TEMP}/gw-fallback.curlrc"
          printf 'header = "Authorization: Bearer %s"\n' "${GATEWAY_TOKEN}" > "${curlrc}"
          body="${RUNNER_TEMP}/ci-status-fallback.json"
          python3 - failed "${detail}" > "${body}" <<'PY'
          import json, os, sys
          json.dump({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "commit_sha": os.environ["RELEASE_COMMIT"],
              "channel": "beta",
              "platform": os.environ["RELEASE_PLATFORM"],
              "arch": os.environ["RELEASE_ARCH"],
              "version": os.environ["RELEASE_VERSION"],
              "status": sys.argv[1],
              "detail": sys.argv[2],
          }, sys.stdout)
          PY
          curl --config "${curlrc}" --fail-with-body --silent --show-error --max-time 60 \
            -H 'Content-Type: application/json' --data-binary "@${body}" \
            "${CHUDWARE_GATEWAY_PUBLIC_BASE}/api/releases/ci/status" > /dev/null \
            || echo "::warning::fallback ci/status was not recorded"

  windows-beta:
    name: Windows beta installer
    needs: plan
    if: ${{ (github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')) && (needs.plan.outputs.skip != 'true') }}
    environment: chudware-release-protected
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, Windows, X64, cloudcastle-ci, cc-win-package]
    timeout-minutes: 360
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_STABLE_VERSION: ${{ needs.plan.outputs.stable_version }}
      RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
      RELEASE_PLATFORM: windows
      RELEASE_ARCH: x86_64
      CORE_PRESET: windows-occt
      HOST_BUILD_DIR: host/build-win
      CHUDWARE_SIGN_IDENTITY: ${{ secrets.CHUDWARE_SIGN_IDENTITY }}
      # This runner cannot route to the gateway host's LAN address, so it holds
      # the release token itself and publishes over TLS to the public origin.
      GATEWAY_TOKEN: ${{ secrets.CHUDWARE_GATEWAY_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check runner capabilities and enter the MSVC environment
        env:
          CHUDWARE_RUNTIME_RELEASE_TOKEN: ${{ github.token }}
          # Per-process peak for the windows-occt LTO tree and the memory left
          # untouched for everything else on the shared host (budget below).
          CHUDWARE_BUILD_GB_PER_JOB: '2'
          CHUDWARE_BUILD_RESERVE_GB: '8'
        # Windows PowerShell 5.1 - these hosts have no pwsh and their `bash` is an
        # empty WSL shim. ASCII only: 5.1 reads the runner's BOM-less UTF-8 script
        # as the ANSI code page.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "runner=$env:RUNNER_NAME os=$env:RUNNER_OS host=$env:COMPUTERNAME"

          # The runner's private, non-administrator service profile
          # (D:\ChudwareCI\Windows\profile); see docs/reference/CI_RUNNERS.md.
          $tools = Join-Path $env:USERPROFILE 'chudware-ci-tools'
          foreach ($dir in @((Join-Path $tools 'bin'), (Join-Path $tools 'python'), (Join-Path $tools 'python\Scripts'))) {
            if (Test-Path $dir) {
              $env:PATH = "$dir;$env:PATH"
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          # curl.exe, not ssh/scp: this runner reaches the gateway over TLS on
          # the public origin because the two LANs do not route to each other.
          foreach ($tool in @('cmake', 'ninja', 'ctest', 'git', 'python', 'curl')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              Write-Host "::error::runner $env:RUNNER_NAME is missing required tool: $tool"
              exit 1
            }
          }
          # The lock row is checked first: while windows-x86_64 is unpinned no
          # chud.exe can verify, so "set CHUDWARE_CHUD_BIN" would be the wrong fix.
          $lock = Get-Content -Raw vendor\chudcode\CHUDCODE_ARTIFACT.lock | ConvertFrom-Json
          if (-not $lock.artifacts.'windows-x86_64'.sha256) {
            Write-Host '::error::vendor/chudcode/CHUDCODE_ARTIFACT.lock pins no windows-x86_64 Chudcode artifact; no Windows chud.exe exists yet (docs/RELEASING.md, Chudcode artifact pin). This leg cannot pass until that row is pinned.'
            exit 1
          }
          $chudArgs = @('scripts\pin_chudcode.py', 'ensure', '--target', 'windows-x86_64',
            '--cache-dir', (Join-Path $tools 'chudcode'), '--github-token-env', 'CHUDWARE_RUNTIME_RELEASE_TOKEN',
            '--github-mirror-repository', $env:GITHUB_REPOSITORY)
          if ($env:CHUDWARE_CHUD_BIN) { $chudArgs += @('--input', $env:CHUDWARE_CHUD_BIN) }
          $chudEvidence = & python @chudArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CHUDWARE_CHUD_BIN = ($chudEvidence | ConvertFrom-Json).path
          "CHUDWARE_CHUD_BIN=$env:CHUDWARE_CHUD_BIN" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Inno Setup is REQUIRED: the product ships an .exe installer, and a zip
          # is not a substitute. Fail here rather than after an hour of building.
          $iscc = $env:ISCC
          if (-not $iscc) {
            $candidates = @(
              (Join-Path $tools 'innosetup\ISCC.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $iscc) {
              $onPath = Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue
              if ($onPath) { $iscc = $onPath.Source }
            }
          }
          if (-not $iscc -or -not (Test-Path $iscc)) {
            Write-Host "::error::ISCC.exe (Inno Setup 6) is not installed on $env:RUNNER_NAME. The Windows release is an Inno installer; install Inno Setup 6 or set the ISCC environment variable. This job will NOT fall back to a zip."
            exit 1
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "iscc=$iscc"

          # MSI is additive to the required Inno installer. Probe WiX with the
          # same explicit candidates, but record an unavailable format as a
          # warning rather than failing the good .exe leg: ci_builds has no
          # format dimension and a red job would misreport that installer.
          $wix = $env:WIX
          if (-not $wix) {
            $candidates = @(
              (Join-Path $tools 'wix\wix.exe'),
              (Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe')
            )
            $wix = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $wix) {
              $onPath = Get-Command 'wix.exe' -ErrorAction SilentlyContinue
              if (-not $onPath) { $onPath = Get-Command 'wix' -ErrorAction SilentlyContinue }
              if ($onPath) { $wix = $onPath.Source }
            }
          }
          if (-not $wix -or -not (Test-Path $wix)) {
            throw "Modern WiX Toolset is required for the complete Windows native release; qualify the image or set WIX"
          }
          "WIX=$wix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "wix=$wix"

          $vsPath = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          }
          if (-not $vsPath) {
            $searchRoots = @(
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio'),
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio')
            ) | Where-Object { Test-Path $_ }
            $vcvars = $searchRoots |
              ForEach-Object { Get-ChildItem -Path $_ -Filter vcvars64.bat -File -Recurse -ErrorAction SilentlyContinue } |
              Select-Object -First 1
            if ($vcvars) { $vsPath = $vcvars.Directory.Parent.Parent.Parent.FullName }
          }
          if (-not $vsPath) {
            Write-Host "::error::no Visual Studio with vcvars64.bat and the x64 C++ toolset on $env:RUNNER_NAME"
            exit 1
          }
          Write-Host "visual-studio=$vsPath"

          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $devShell = Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          if (Test-Path $devShell) {
            Import-Module $devShell
            Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          } else {
            $vcvarsPath = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
            if (-not (Test-Path $vcvarsPath)) {
              Write-Host "::error::Visual Studio root $vsPath has neither DevShell nor vcvars64.bat"
              exit 1
            }
            & cmd.exe /d /s /c "`"$vcvarsPath`" >nul && set" |
              ForEach-Object {
                if ($_ -match '^([^=]+)=(.*)$') {
                  [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
                }
              }
          }
          Get-ChildItem env: | ForEach-Object {
            if ($before[$_.Name] -ne $_.Value) {
              "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          $compilerOutput = & cmd.exe /d /c 'cl.exe 2>&1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compilerOutput | Select-Object -First 1

          # This host also runs the CloudCastle and Chudcode runners and
          # customer inference. Ninja's default width (logical CPUs + 2)
          # starves them, so the build is held to half the logical processors
          # and to the physical memory free right now, less a reserve, at one
          # budgeted peak per job. The build steps pass this level explicitly
          # because a bare `cmake --build --parallel` ignores it.
          $logical = [Environment]::ProcessorCount
          $freeGiB = [math]::Floor((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB)
          $byMemory = [math]::Floor(($freeGiB - [int]$env:CHUDWARE_BUILD_RESERVE_GB) / [int]$env:CHUDWARE_BUILD_GB_PER_JOB)
          $jobs = [math]::Max(1, [math]::Min([math]::Floor($logical / 2), $byMemory))
          Write-Host "build budget: $logical logical CPUs, $freeGiB GiB free -> $jobs parallel jobs"
          "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # /Zi targets write PDBs through mspdbsrv; a run-unique endpoint gives
          # this run its own server instead of an account-wide shared one.
          "_MSPDBSRV_ENDPOINT_=chudware-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      - name: Provision authenticated release Python from offline wheels
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CHUDWARE_CI_BASE_PYTHON -or -not (Test-Path -LiteralPath $env:CHUDWARE_CI_BASE_PYTHON)) {
            throw 'Qualify and export the protected image CHUDWARE_CI_BASE_PYTHON executable'
          }
          if (-not $env:CHUDWARE_WHEELHOUSE) { throw 'Reviewed complete offline release wheelhouse required' }
          foreach ($inputPath in @($env:CHUDWARE_CI_BASE_PYTHON, $env:CHUDWARE_WHEELHOUSE)) {
            if ($inputPath -notmatch '^(?:[A-Za-z]:[\\/]|\\\\[^\\]+\\[^\\]+(?:\\|$))') {
              throw 'Base Python and wheelhouse must be absolute image-qualified paths'
            }
          }
          Get-ChildItem Env: | Where-Object { $_.Name -like 'PYTHON*' -or $_.Name -like 'LD_*' -or $_.Name -like 'DYLD_*' } |
            ForEach-Object { Remove-Item -LiteralPath ("Env:" + $_.Name) }
          $venv = Join-Path $env:RUNNER_TEMP 'release-python'
          & $env:CHUDWARE_CI_BASE_PYTHON -I -S -c "import sys; sys.path.insert(0, sys.argv[1]); from services.installer.provision import main; sys.exit(main(sys.argv[2:]))" `
            $env:GITHUB_WORKSPACE --base-python $env:CHUDWARE_CI_BASE_PYTHON --venv-dir $venv --wheelhouse $env:CHUDWARE_WHEELHOUSE
          if ($LASTEXITCODE -ne 0) { throw 'Authenticated release runtime provisioning failed' }
          $releasePython = Join-Path $venv 'Scripts\python.exe'
          & $env:CHUDWARE_CI_BASE_PYTHON -I -S -c "import sys; sys.path.insert(0, sys.argv[1]); from services.installer.provision import main; sys.exit(main(sys.argv[2:]))" `
            $env:GITHUB_WORKSPACE --check-inputs --venv-dir $venv --base-python $env:CHUDWARE_CI_BASE_PYTHON --wheelhouse $env:CHUDWARE_WHEELHOUSE
          if ($LASTEXITCODE -ne 0) { throw 'Compiler wheels do not match the approved release target' }
          & $releasePython -c "import yaml, nuitka, cryptography"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed compiler runtime is incomplete' }
          "CHUDWARE_RELEASE_PYTHON=$releasePython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $venv 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Open the authenticated channel to the gateway
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GATEWAY_TOKEN) {
            Write-Host '::error::CHUDWARE_GATEWAY_RELEASE_TOKEN is not set; this runner publishes over TLS and has no other credential'
            exit 1
          }
          if (-not $env:CHUDWARE_GATEWAY_PUBLIC_BASE) {
            Write-Host '::error::CHUDWARE_GATEWAY_PUBLIC_BASE is not set'
            exit 1
          }

          # Run-scoped: RUNNER_TEMP is wiped between jobs. The token goes to a
          # curl --config file, never to argv: another process on this runner can
          # read a command line, and GitHub's log masking does not help there.
          $curlrc = Join-Path $env:RUNNER_TEMP 'gw.curlrc'
          [IO.File]::WriteAllText($curlrc, "header = `"Authorization: Bearer $env:GATEWAY_TOKEN`"`n", (New-Object Text.ASCIIEncoding))
          # The runner account must be the config file's only reader. Grant by
          # SID: under a service account $env:USERNAME is the machine account
          # (HOST$), which icacls cannot resolve.
          $meSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls $curlrc /inheritance:r /grant:r "*${meSid}:(R)" | Out-Null
          "GATEWAY_CURLRC=$curlrc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # GITHUB_ENV only reaches LATER steps; this step uses the value too.
          $env:GATEWAY_CURLRC = $curlrc

          # Reachability is proven before an hour of building depends on it. This
          # endpoint is anonymous and read-only, so a 200 here means DNS, TLS and
          # routing all work; the token itself is proven by the first ci/status.
          # No 2>&1 on any native command in this step: with 'Stop' in effect,
          # PowerShell 5.1 promotes redirected stderr to a terminating error.
          $probe = & curl.exe --fail-with-body -sS --max-time 30 "$env:CHUDWARE_GATEWAY_PUBLIC_BASE/api/releases/base-version"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::cannot reach $env:CHUDWARE_GATEWAY_PUBLIC_BASE from this runner: $probe"
            exit 1
          }
          Write-Host "gateway reachable: $probe"

          # Status reporting from this job goes through the same channel.
          $reporter = Join-Path $env:RUNNER_TEMP 'ci_status.ps1'
          $reporterBody = @'
          param([Parameter(Mandatory=$true)][string]$Status, [string]$Detail = '')
          $ErrorActionPreference = 'Continue'
          $body = Join-Path $env:RUNNER_TEMP 'ci-status.json'
          $payload = [ordered]@{
            run_id     = $env:GITHUB_RUN_ID
            commit_sha = $env:RELEASE_COMMIT
            channel    = 'beta'
            platform   = $env:RELEASE_PLATFORM
            arch       = $env:RELEASE_ARCH
            version    = $env:RELEASE_VERSION
            status     = $Status
            detail     = $Detail
          }
          [IO.File]::WriteAllText($body, ($payload | ConvertTo-Json -Compress), (New-Object Text.ASCIIEncoding))
          $retry = $env:CHUDWARE_GATEWAY_CURL_RETRY -split ' '
          & curl.exe --config $env:GATEWAY_CURLRC --fail-with-body -sS --max-time 120 @retry `
            -H 'Content-Type: application/json' --data-binary "@$body" `
            "$env:CHUDWARE_GATEWAY_PUBLIC_BASE/api/releases/ci/status" | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::ci/status $Status was not recorded" }
          '@
          [IO.File]::WriteAllText($reporter, ($reporterBody -replace "`r`n", "`n"), (New-Object Text.ASCIIEncoding))
          & $reporter -Status 'building' -Detail "configuring core + host for $env:RELEASE_VERSION"

      - name: Refresh junctions, generate protected assets, and build at the pinned version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Below-normal priority is inherited by cmake, ninja, cl, link and the
          # helper scripts, so the release build yields to customer workloads.
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          # scripts/build_windows.ps1 is the interactive one-shot build: it hard-codes
          # developer defaults and takes no cmake arguments, so a release build cannot
          # go through it without flipping CHUDWARE_DEVELOPER_BUILD back on. Its two
          # prerequisites are reused directly instead: the junction setup it calls
          # first, and the same windows-occt preset it builds.
          & powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File scripts\setup_windows_links.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $protected = "$env:HOST_BUILD_DIR/generated/protected-assets"
          & python packaging\embed_protected_assets.py --source-root . --output-dir $protected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & cmake --preset $env:CORE_PRESET -DCHUDWARE_DEVELOPER_BUILD=OFF `
            -DCHUDWARE_LTO=ON `
            "-DCHUDWARE_VERSION_OVERRIDE=$env:RELEASE_VERSION" `
            "-DCHUDWARE_PROTECTED_ASSETS_DIR=$env:GITHUB_WORKSPACE/$protected"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build --preset $env:CORE_PRESET --parallel $env:CMAKE_BUILD_PARALLEL_LEVEL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # CEF is NOT disabled here, unlike scripts/build_windows.ps1 and the
          # native-build compile gate: this installer must carry the shipping
          # webview feature set rather than silently disabling CEF.
          # Reconstruct the authenticated pinned SDK in this run's private
          # directory; never let an older extern/cef candidate win discovery.
          $cefDestination = Join-Path $env:RUNNER_TEMP "cef-authenticated-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File scripts\fetch_cef_windows.ps1 -DestinationRoot $cefDestination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cefRoot = Join-Path $cefDestination 'cef_binary_149.0.6+g0d0eeb6+chromium-149.0.7827.201_windows64_minimal'
          & cmake -S host -B $env:HOST_BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCHUDWARE_DEVELOPER_BUILD=OFF `
            -DCHUDWARE_LTO=ON `
            "-DCHUDWARE_VERSION_OVERRIDE=$env:RELEASE_VERSION" `
            "-DCHUDWARE_PROTECTED_ASSETS_DIR=$env:GITHUB_WORKSPACE/$protected" `
            "-DCEF_ROOT=$cefRoot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build $env:HOST_BUILD_DIR --parallel $env:CMAKE_BUILD_PARALLEL_LEVEL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File scripts\stage_windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($cache in @("build/$env:CORE_PRESET/CMakeCache.txt", "$env:HOST_BUILD_DIR/CMakeCache.txt")) {
            $lines = Get-Content $cache
            if ($lines -notcontains "CHUDWARE_VERSION_OVERRIDE:STRING=$env:RELEASE_VERSION") {
              Write-Host "::error::$cache does not carry CHUDWARE_VERSION_OVERRIDE=$env:RELEASE_VERSION"
              exit 1
            }
            if ($lines -notcontains 'CHUDWARE_DEVELOPER_BUILD:BOOL=OFF') {
              Write-Host "::error::$cache is not an explicit production configure"
              exit 1
            }
          }

      - name: Run the core and host test suites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:RUNNER_TEMP 'ci_status.ps1') -Status 'testing' -Detail 'ctest core + host'
          $results = Join-Path $env:RUNNER_TEMP 'test-results'
          & $env:CHUDWARE_RELEASE_PYTHON scripts\run_release_ctest.py `
            --core-dir "build/$env:CORE_PRESET/core" --host-dir $env:HOST_BUILD_DIR --out $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content (Join-Path $results 'test-results.json') |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Build sidecars, sign the payload, and compile the Inno installer
        env:
          CHUDWARE_RELEASE_CI_KEY: ${{ secrets.CHUDWARE_RELEASE_CI_KEY }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Nuitka's C compile inherits below-normal priority from this shell.
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          & (Join-Path $env:RUNNER_TEMP 'ci_status.ps1') -Status 'packaging' -Detail 'sidecars, payload signature, Inno installer'

          $out = Join-Path $env:RUNNER_TEMP 'installer'
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $sidecars = Join-Path $env:RUNNER_TEMP 'sidecars'
          if (Test-Path $sidecars) { Remove-Item -Recurse -Force $sidecars }

          $hostBin = "$env:HOST_BUILD_DIR/bin/chudware.exe"
          $hostdBin = "build/$env:CORE_PRESET/bin/chudware-hostd.exe"
          # The canonical engine is the core build's: CMake stages its polymesh-advisor package
          # beside it, while the copy next to chudware.exe arrives without one.
          & powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File packaging\windows\build_sidecars.ps1 `
            -OutputDir $sidecars -HostBinary $hostBin -HostdBinary $hostdBin `
            -EngineBinary "build/$env:CORE_PRESET/bin/libchudware.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & python -m services.installer.build_release --prepare-signing --payload-only `
            --key-id $env:CHUDWARE_RELEASE_KEY_ID --version $env:RELEASE_VERSION --out $out `
            --host-bin $hostBin --hostd-bin $hostdBin `
            --worker-bin "$sidecars/chudware-worker.exe" `
            --mcp-bin "$sidecars/chudware-mcp.exe" `
            --chud-bin "$sidecars/chud.exe" `
            --uninstall-helper-bin "$env:HOST_BUILD_DIR/bin/chudware-uninstall-helper.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # build_release names the preimage payload-manifest.v1.preimage (the
          # *.payload-signing-request.bin name is the shell builders'), so take
          # the path the builder itself reports rather than guessing a glob.
          $request = Get-ChildItem -Path $out -Recurse -Filter 'payload-manifest.v1.preimage' |
            Select-Object -First 1
          if (-not $request) { Write-Host '::error::payload signing preimage missing'; exit 1 }
          $payloadSig = Join-Path $env:RUNNER_TEMP 'payload.sig'
          & python packaging\ci_sign.py --expect-public-key $env:CHUDWARE_RELEASE_CI_PUBLIC_KEY `
            --output $payloadSig sign payload $request.FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $publicKeyB64 = & python -c "import base64,os;print(base64.b64encode(bytes.fromhex(os.environ['CHUDWARE_RELEASE_CI_PUBLIC_KEY'])).decode())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RELEASE_PUBLIC_KEY_B64=$publicKeyB64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Embeds the signature, re-verifies every payload byte, then runs ISCC.
          # No --payload-only: the installer IS the release artifact here.
          & python -m services.installer.build_release --finalize-signing $payloadSig `
            --release-public-key $publicKeyB64 --version $env:RELEASE_VERSION --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $name = "Chudware-Setup-$env:RELEASE_VERSION-x86_64.exe"
          $installer = Join-Path $out $name
          if (-not (Test-Path $installer)) {
            Write-Host "::error::Inno Setup did not produce $installer"
            exit 1
          }
          "ARTIFACT=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PAYLOAD_DIR=$out\Chudware" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "installer=$installer ($((Get-Item $installer).Length) bytes)"

          # The MSI harvests THIS finalized directory. It never stages or
          # rewrites payload bytes; the builder snapshots the complete tree
          # before and after WiX and deletes the MSI on any mutation.
          $msiOut = Join-Path $env:RUNNER_TEMP 'msi'
          if (Test-Path $msiOut) { Remove-Item -Recurse -Force $msiOut }
          & python -m services.installer.build_msi `
            --payload (Join-Path $out 'Chudware') --out $msiOut `
            --version $env:RELEASE_VERSION --release-public-key $publicKeyB64 `
            --wix $env:WIX
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msiName = "Chudware-$env:RELEASE_VERSION-x86_64.msi"
          $msi = Join-Path $msiOut $msiName
          if (-not (Test-Path -LiteralPath $msi) -or (Get-Item -LiteralPath $msi).Length -eq 0) {
            throw 'Native MSI build did not produce its required output'
          }
          "MSI_ARTIFACT=$msi" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSI_ARTIFACT_NAME=$msiName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign the artifact pair and generate evidence
        env:
          CHUDWARE_RELEASE_CI_KEY: ${{ secrets.CHUDWARE_RELEASE_CI_KEY }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-Checked([string]$Program, [string[]]$Arguments) {
            & $Program @Arguments
            if ($LASTEXITCODE -ne 0) { throw "$Program failed with exit code $LASTEXITCODE" }
          }
          $results = Join-Path $env:RUNNER_TEMP 'test-results\test-results.json'
          $variants = @(
            @{ Artifact = $env:ARTIFACT; Prefix = 'artifact'; Evidence = 'evidence' },
            @{ Artifact = $env:MSI_ARTIFACT; Prefix = 'artifact-msi'; Evidence = 'evidence-msi' }
          )
          $hasPublisherPolicy = $env:CHUDWARE_PLATFORM_PUBLISHER_POLICY -and $env:CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE
          if (($env:CHUDWARE_PLATFORM_PUBLISHER_POLICY -or $env:CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE) -and -not $hasPublisherPolicy) {
            throw 'Native publisher policy and detached signature must be paired'
          }
          # Validate complete native test/evidence inputs for BOTH artifacts
          # before creating any beta/stable artifact identity signature.
          foreach ($variant in $variants) {
            $evidence = Join-Path $env:RUNNER_TEMP $variant.Evidence
            $sha = (Get-FileHash -LiteralPath $variant.Artifact -Algorithm SHA256).Hash.ToLower()
            $nativeArguments = @()
            if ($hasPublisherPolicy -and $env:CHUDWARE_SIGN_IDENTITY) {
              $nativeReport = Join-Path $env:RUNNER_TEMP ($variant.Evidence + '-platform-signing.v1.json')
              Invoke-Checked $env:CHUDWARE_RELEASE_PYTHON @(
                'packaging\finalize_release.py', 'platform-evidence', $variant.Artifact,
                '--platform', 'windows', '--kind', 'authenticode',
                '--platform-publisher-policy', $env:CHUDWARE_PLATFORM_PUBLISHER_POLICY,
                '--platform-publisher-policy-signature', $env:CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE,
                '--out', $nativeReport
              )
              $nativeArguments = @('--platform-signing-evidence', $nativeReport,
                '--platform-publisher-policy', $env:CHUDWARE_PLATFORM_PUBLISHER_POLICY,
                '--platform-publisher-policy-signature', $env:CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE)
            }
            $generateArguments = @(
              'packaging\generate_release_evidence.py', $variant.Artifact,
              '--artifact-sha256', $sha, '--version', $env:RELEASE_VERSION,
              '--platform', 'windows', '--arch', 'x86_64', '--commit', $env:RELEASE_COMMIT,
              '--locked-input', 'CMakePresets.json',
              '--locked-input', 'packaging/requirements-release.txt',
              '--locked-input', 'vendor/chudcode/CHUDCODE_ARTIFACT.lock',
              '--test-results', $results, '--out', $evidence
            ) + $nativeArguments
            Invoke-Checked $env:CHUDWARE_RELEASE_PYTHON $generateArguments
            Invoke-Checked $env:CHUDWARE_RELEASE_PYTHON @('packaging\windows\prepare_evidence_requests.py', $evidence)
          }
          foreach ($variant in $variants) {
            foreach ($identity in @(@($env:RELEASE_VERSION, '.sig'), @($env:RELEASE_STABLE_VERSION, '-stable.sig'))) {
              Invoke-Checked $env:CHUDWARE_RELEASE_PYTHON @(
                'packaging\ci_sign.py', '--expect-public-key', $env:CHUDWARE_RELEASE_CI_PUBLIC_KEY,
                '--output', (Join-Path $env:RUNNER_TEMP ($variant.Prefix + $identity[1])),
                'artifact', '--key-id', $env:CHUDWARE_RELEASE_KEY_ID, '--version', $identity[0],
                '--platform', 'windows', '--arch', 'x86_64', '--artifact', $variant.Artifact
              )
            }
            $evidence = Join-Path $env:RUNNER_TEMP $variant.Evidence
            foreach ($pair in @(@('sbom.cdx.json', 'sbom'), @('provenance.slsa.json', 'provenance'), @('platform-test.v1.json', 'platform-test'))) {
              Invoke-Checked $env:CHUDWARE_RELEASE_PYTHON @(
                'packaging\ci_sign.py', '--expect-public-key', $env:CHUDWARE_RELEASE_CI_PUBLIC_KEY,
                '--output', (Join-Path $evidence ($pair[0] + '.sig')),
                'sign', $pair[1], (Join-Path $evidence ($pair[0] + '.signing-request.bin'))
              )
            }
          }

      - name: Stage and publish the Windows release formats
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:RUNNER_TEMP 'ci_status.ps1') -Status 'publishing' `
            -Detail 'posting ci/publish for Windows formats'

          $default = @{
            Artifact = $env:ARTIFACT
            Format = 'default'
            Signature = (Join-Path $env:RUNNER_TEMP 'artifact.sig')
            StableSignature = (Join-Path $env:RUNNER_TEMP 'artifact-stable.sig')
            PayloadDir = $env:PAYLOAD_DIR
            EvidenceDir = (Join-Path $env:RUNNER_TEMP 'evidence')
          }
          $defaultName = & packaging\windows\publish_release.ps1 @default
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publishedFormats = @('default')

          $msi = @{
            Artifact = $env:MSI_ARTIFACT
            Format = 'msi'
            Signature = (Join-Path $env:RUNNER_TEMP 'artifact-msi.sig')
            StableSignature = (Join-Path $env:RUNNER_TEMP 'artifact-msi-stable.sig')
            PayloadDir = $env:PAYLOAD_DIR
            EvidenceDir = (Join-Path $env:RUNNER_TEMP 'evidence-msi')
          }
          $msiName = & packaging\windows\publish_release.ps1 @msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publishedFormats += 'msi'

          $namedFormats = (@('msi', 'default') | Where-Object { $publishedFormats -contains $_ }) -join ' '
          $detail = "Windows formats published: $namedFormats"
          Write-Host $detail
          & (Join-Path $env:RUNNER_TEMP 'ci_status.ps1') -Status 'published' `
            -Detail $detail
          @(
            '## Windows beta published',
            '',
            "* formats: ``$namedFormats``",
            '* formats NOT published: none',
            "* setup artifact: ``$($defaultName | Select-Object -Last 1)``",
            '* MSI: built and signed',
            "* stable pair signed for: ``$env:RELEASE_STABLE_VERSION``",
            '* setup evidence bundle: complete and signed',
            '* MSI evidence bundle: complete and signed'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Report failure to the gateway
        if: always() && job.status != 'success'
        env:
          GATEWAY_TOKEN: ${{ secrets.CHUDWARE_GATEWAY_RELEASE_TOKEN }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $detail = "windows-beta ${{ job.status }} in run $env:GITHUB_RUN_NUMBER"
          $reporter = Join-Path $env:RUNNER_TEMP 'ci_status.ps1'
          if (Test-Path $reporter) {
            & $reporter -Status 'failed' -Detail $detail
            exit 0
          }
          # The capability step failed before ci_status.ps1 existed. Without
          # this the queued row the plan job wrote stays 'queued' in /admin
          # forever, which reads as a hung runner instead of a failed leg.
          if (-not $env:GATEWAY_TOKEN) { exit 0 }
          $body = @{
            run_id      = $env:GITHUB_RUN_ID
            commit_sha  = $env:RELEASE_COMMIT
            channel     = 'beta'
            platform    = $env:RELEASE_PLATFORM
            arch        = $env:RELEASE_ARCH
            version     = $env:RELEASE_VERSION
            status      = 'failed'
            detail      = $detail
          } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Method Post -TimeoutSec 60 `
              -Uri ($env:CHUDWARE_GATEWAY_PUBLIC_BASE + '/api/releases/ci/status') `
              -Headers @{ Authorization = 'Bearer ' + $env:GATEWAY_TOKEN } `
              -ContentType 'application/json' -Body $body | Out-Null
          } catch {
            Write-Host ('::warning::fallback ci/status was not recorded: ' + $_.Exception.Message)
          }

  macos-beta:
    name: macOS x86_64 beta app
    needs: plan
    if: ${{ (github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')) && (needs.plan.outputs.skip != 'true') }}
    environment: chudware-release-protected
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, macOS, X64, cloudcastle-ci, cc-mac-intel]
    # The macOS core carries OCCT/Polyhedral-FEA, and the two Nuitka
    # sidecars are compiled on the Intel runner.
    timeout-minutes: 420
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_STABLE_VERSION: ${{ needs.plan.outputs.stable_version }}
      RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
      RELEASE_PLATFORM: macos
      RELEASE_ARCH: x86_64
      CORE_PRESET: macos-x86_64
      HOST_BUILD_DIR: host/build-macos-x86_64
      CHUDWARE_SIGN_IDENTITY: ${{ secrets.CHUDWARE_SIGN_IDENTITY }}
      CHUDWARE_NOTARIZE_PROFILE: ${{ secrets.CHUDWARE_NOTARIZE_PROFILE }}
      # The Mac cannot route to the gateway host's LAN address, so it holds
      # the release token itself and publishes over TLS to the public origin.
      GATEWAY_TOKEN: ${{ secrets.CHUDWARE_GATEWAY_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The version override replaces `git describe`, but packaging still
          # reads tags for provenance and build_app.sh sources build.sh.
          fetch-depth: 0
      - name: Check runner capabilities and select the release Python
        env:
          CHUDWARE_RUNTIME_RELEASE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-unknown} $(uname -s) $(uname -m)"
          sw_vers

          # The runner service starts with a minimal PATH. Add the Homebrew roots
          # explicitly, exactly as the Windows leg prepends its release tools.
          for dir in /opt/homebrew/bin /usr/local/bin; do
            if [ -d "${dir}" ]; then
              case ":${PATH}:" in
                *":${dir}:"*) ;;
                *) PATH="${dir}:${PATH}"; echo "${dir}" >> "$GITHUB_PATH" ;;
              esac
            fi
          done
          export PATH

          # String accumulator, not an array: bash 3.2 treats an empty array
          # expansion under `set -u` as an unbound variable.
          missing=""
          # curl, not ssh/scp: this runner reaches the gateway over TLS on the
          # public origin because the two LANs do not route to each other.
          for tool in cmake ninja ctest python3 git curl tar zip rsync \
            clang xcrun xcode-select ditto otool install_name_tool plutil codesign; do
            command -v "${tool}" >/dev/null 2>&1 || missing="${missing} ${tool}"
          done

          # The Mac carries the Command Line Tools only, by design: nothing in
          # this repository may reach for xcodebuild, so the compiler itself is
          # the assertion.
          if xcode-select -p >/dev/null 2>&1; then
            echo "clt=$(xcode-select -p)"
            clang --version | head -n 1
            echo "sdk=$(xcrun --show-sdk-version 2>/dev/null || echo unknown)"
          else
            missing="${missing} xcode-command-line-tools"
          fi

          # The macos-* presets configure with CHUDWARE_WITH_OCCT=ON and, off
          # Windows, ProvisionOCCT.cmake downloads nothing: it find_package()s a
          # system OCCT from the preset's brew CMAKE_PREFIX_PATH.
          if command -v brew >/dev/null 2>&1; then
            echo "brew=$(brew --prefix)"
            brew list --versions opencascade >/dev/null 2>&1 \
              || missing="${missing} opencascade(brew-install-opencascade)"
          else
            missing="${missing} brew"
          fi

          # The protected image supplies a qualified base interpreter and
          # reviewed complete wheelhouse, never a capability-based PATH guess.
          : "${CHUDWARE_CI_BASE_PYTHON:?qualify and export the protected image base Python}"
          : "${CHUDWARE_WHEELHOUSE:?provide the reviewed complete offline release wheelhouse}"
          case "${CHUDWARE_CI_BASE_PYTHON}" in
            /*) ;; *) echo '::error::base Python must be an absolute image-qualified path'; exit 1 ;;
          esac
          case "${CHUDWARE_WHEELHOUSE}" in
            /*) ;; *) echo '::error::wheelhouse must be an absolute reviewed path'; exit 1 ;;
          esac
          test -x "${CHUDWARE_CI_BASE_PYTHON}"
          for variable in $(compgen -e); do
            case "${variable}" in PYTHON*|LD_*|DYLD_*) unset "${variable}" ;; esac
          done
          venv="${RUNNER_TEMP}/release-python"
          VENV_DIR="${venv}" PYTHON="${CHUDWARE_CI_BASE_PYTHON}" \
            CHUDWARE_WHEELHOUSE="${CHUDWARE_WHEELHOUSE}" bash scripts/provision_venv.sh
          release_python="${venv}/bin/python3"
          "${CHUDWARE_CI_BASE_PYTHON}" -I -S -c \
            'import sys; sys.path.insert(0, sys.argv[1]); from services.installer.provision import main; sys.exit(main(sys.argv[2:]))' \
            "${PWD}" --check-inputs --venv-dir "${venv}" --base-python "${CHUDWARE_CI_BASE_PYTHON}" \
            --wheelhouse "${CHUDWARE_WHEELHOUSE}"
          "${release_python}" -c 'import cryptography, nuitka, yaml'
          echo "${venv}/bin" >> "$GITHUB_PATH"

          if [ -n "${missing}" ]; then
            echo "::error::runner ${RUNNER_NAME:-unknown} is missing required tools:${missing}. Run the runner-provision workflow against this runner label (provision-macos) and re-dispatch."
            exit 1
          fi

          # The Intel runner must publish x86_64 bytes under the x86_64 name;
          # build_app.sh names the zip from `uname -m`.
          if [ "$(uname -m)" != "${RELEASE_ARCH}" ]; then
            echo "::error::this runner is $(uname -m) but the release requires ${RELEASE_ARCH}; check cc-mac-intel runner labels"
            exit 1
          fi
          set -- ensure --target "macos-${RELEASE_ARCH}" \
            --cache-dir "${HOME}/chudware-ci-tools/chudcode" \
            --github-token-env CHUDWARE_RUNTIME_RELEASE_TOKEN \
            --github-mirror-repository "${GITHUB_REPOSITORY}"
          if [ -n "${CHUDWARE_CHUD_BIN:-}" ]; then
            set -- "$@" --input "${CHUDWARE_CHUD_BIN}"
          fi
          if ! "${release_python}" scripts/pin_chudcode.py "$@" \
              > "${RUNNER_TEMP}/chudcode.json"; then
            echo "::error::could not obtain the pinned Chudcode artifact from this repository's chudcode-runtime release mirror; verify the mirror assets or provide a verified CHUDWARE_CHUD_BIN"
            exit 1
          fi
          chud_bin="$("${release_python}" -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' "${RUNNER_TEMP}/chudcode.json")"
          echo "CHUDWARE_CHUD_BIN=${chud_bin}" >> "$GITHUB_ENV"

          {
            echo "RELEASE_PYTHON=${release_python}"
            echo "CHUDWARE_RELEASE_PYTHON=${release_python}"
          } >> "$GITHUB_ENV"


      - name: Open the authenticated channel to the gateway
        shell: bash
        run: |
          set -euo pipefail
          # Public origin, run-scoped 0600 curl config, and the shared retry
          # budget on every call; installs ${RUNNER_TEMP}/gw.sh for later steps.
          . packaging/ci_gateway.sh
          gw_open
          ci_status building "configuring core + host for ${RELEASE_VERSION}"

      - name: Generate protected assets and build core + host at the pinned version
        shell: bash
        run: |
          set -euo pipefail
          protected_assets="${HOST_BUILD_DIR}/generated/protected-assets"
          "${RELEASE_PYTHON}" packaging/embed_protected_assets.py --source-root . \
            --output-dir "${protected_assets}"

          cmake --preset "${CORE_PRESET}" \
            -DCHUDWARE_DEVELOPER_BUILD=OFF \
            -DCHUDWARE_LTO=ON \
            -DCHUDWARE_VERSION_OVERRIDE="${RELEASE_VERSION}" \
            -DCHUDWARE_PROTECTED_ASSETS_DIR="${GITHUB_WORKSPACE}/${protected_assets}"
          cmake --build --preset "${CORE_PRESET}"

          # Reauthenticate the exact pinned SDK immediately before CMake;
          # never select the newest unchecked extracted cache directory.
          cef_root="$(bash scripts/fetch_cef_posix.sh \
            --destination-root "${RUNNER_TEMP}/cef-authenticated-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"

          cmake -S host -B "${HOST_BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHUDWARE_DEVELOPER_BUILD=OFF \
            -DCHUDWARE_LTO=ON \
            -DCHUDWARE_VERSION_OVERRIDE="${RELEASE_VERSION}" \
            -DCHUDWARE_PROTECTED_ASSETS_DIR="${GITHUB_WORKSPACE}/${protected_assets}" \
            -DCEF_ROOT="${cef_root}"
          cmake --build "${HOST_BUILD_DIR}"

          # Prove both caches carry the release identity rather than a
          # git-derived 0.0.0-dirty, and that neither tree is a developer build.
          # build_app.sh re-checks the second property and reads the version from
          # the generated header, so a mismatch here would name the wrong zip.
          for cache in "build/${CORE_PRESET}/CMakeCache.txt" "${HOST_BUILD_DIR}/CMakeCache.txt"; do
            grep -Fqx "CHUDWARE_VERSION_OVERRIDE:STRING=${RELEASE_VERSION}" "${cache}" || {
              echo "::error::${cache} does not carry CHUDWARE_VERSION_OVERRIDE=${RELEASE_VERSION}"; exit 1; }
            grep -Fqx 'CHUDWARE_DEVELOPER_BUILD:BOOL=OFF' "${cache}" || {
              echo "::error::${cache} is not an explicit production configure"; exit 1; }
          done
          grep -Fq "\"${RELEASE_VERSION}\"" "${HOST_BUILD_DIR}/generated/api/chudware_version.h" || {
            echo "::error::generated version header does not contain ${RELEASE_VERSION}"; exit 1; }

      - name: Run the core and host test suites
        shell: bash
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/gw.sh"
          ci_status testing "ctest core + host"

          # mesher_advanced asserts a mesh+solve wall-clock ceiling meant to catch
          # an -O0 or DOF-blowup regression. The 2017 Intel iMac needs 114s for the
          # boss+pocket part with identical element counts and physics, so scale the
          # ceiling on this runner instead of raising it for every developer.
          export CHUDWARE_TEST_WALL_SCALE=3
          "${RELEASE_PYTHON}" scripts/run_release_ctest.py \
            --core-dir "build/${CORE_PRESET}/core" --host-dir "${HOST_BUILD_DIR}" \
            --out "${RUNNER_TEMP}/test-results"
          cat "${RUNNER_TEMP}/test-results/test-results.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the immutable Chudware.app and sign its payload manifest
        env:
          CHUDWARE_RELEASE_CI_KEY: ${{ secrets.CHUDWARE_RELEASE_CI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/gw.sh"
          ci_status packaging "staging Chudware.app and signing the payload manifest"

          # --prepare-signing retains the immutable .app under --out and emits the
          # payload preimage; --finalize-signing seals that exact bundle. Both
          # calls must therefore name the same --out.
          out="${RUNNER_TEMP}/prepared"
          rm -rf "${out}"
          mkdir -p "${out}"
          packaging/macos/build_app.sh --prepare-signing \
            --key-id "${CHUDWARE_RELEASE_KEY_ID}" --chud-bin "${CHUDWARE_CHUD_BIN}" --out "${out}"

          request="$(find "${out}" -type f -name '*payload-signing-request.bin' -print -quit)"
          test -s "${request}" || { echo '::error::payload signing request missing'; exit 1; }
          "${RELEASE_PYTHON}" packaging/ci_sign.py \
            --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
            --output "${RUNNER_TEMP}/payload.sig" \
            sign payload "${request}" > /dev/null
          echo "payload manifest signed with ${CHUDWARE_RELEASE_KEY_ID}"

      - name: Seal the immutable app into its native zip
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/prepared"
          public_key_b64="$("${RELEASE_PYTHON}" -c 'import base64,os,sys; sys.stdout.write(base64.b64encode(bytes.fromhex(os.environ["CHUDWARE_RELEASE_CI_PUBLIC_KEY"])).decode())')"
          echo "RELEASE_PUBLIC_KEY_B64=${public_key_b64}" >> "$GITHUB_ENV"

          # Embeds the signature, re-verifies every manifest-owned byte of the
          # retained bundle, then archives it with ditto.
          packaging/macos/build_app.sh --finalize-signing "${RUNNER_TEMP}/payload.sig" \
            --release-public-key "${public_key_b64}" --out "${out}"

          artifact="${out}/Chudware-${RELEASE_VERSION}-macos-${RELEASE_ARCH}.zip"
          test -s "${artifact}" || {
            echo "::error::build_app.sh did not produce ${artifact}"; exit 1; }
          echo "ARTIFACT=${artifact}" >> "$GITHUB_ENV"

          sha="$("${RELEASE_PYTHON}" - "${artifact}" <<'PY'
          import hashlib, sys
          value = hashlib.sha256()
          with open(sys.argv[1], "rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  value.update(chunk)
          print(value.hexdigest())
          PY
          )"
          echo "ARTIFACT_SHA256=${sha}" >> "$GITHUB_ENV"
          echo "artifact=${artifact} sha256=${sha}"


      - name: Verify the built app before it is offered to anyone
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/verify"
          rm -rf "${work}"
          mkdir -p "${work}"
          # ditto -c -k --keepParent produced the zip, so Chudware.app sits at
          # the archive root; unpacking with ditto keeps resource forks intact.
          ditto -x -k "${ARTIFACT}" "${work}"
          app="${work}/Chudware.app"
          test -d "${app}" || {
            echo '::error::the published zip does not contain Chudware.app'; exit 1; }
          for required in Contents/MacOS/Chudware Contents/MacOS/Chudware-bin \
            Contents/MacOS/chudware-hostd Contents/Frameworks/libchudware.dylib; do
            test -e "${app}/${required}" || {
              echo "::error::Chudware.app is missing ${required}"; exit 1; }
          done
          test -s "${app}/payload-manifest.v1.json" || {
            echo '::error::Chudware.app carries no payload-manifest.v1.json'; exit 1; }
          test -s "${app}/payload-manifest.v1.sig" || {
            echo '::error::Chudware.app carries no payload-manifest.v1.sig'; exit 1; }

          # 1. Nothing in the shipped bundle may load a library the bundle does
          #    not carry. The macOS equivalent of the AppImage ldd sweep: any
          #    absolute path outside /System or /usr/lib is a Homebrew or build
          #    tree leak that only fails on a customer's Mac.
          leaked=""
          checked=0
          for binary in "${app}/Contents/MacOS/Chudware-bin" "${app}/Contents/MacOS/chudware-hostd" \
            "${app}/Contents/MacOS/chudware-worker" "${app}/Contents/MacOS/chudware-mcp" \
            "${app}/Contents/MacOS/chud" "${app}/Contents/Frameworks"/*.dylib; do
            [ -f "${binary}" ] || continue
            checked=$((checked + 1))
            outside="$(otool -L "${binary}" | sed -n '2,$p' | awk '{print $1}' \
              | grep -v '^@' | grep -v '^/System/' | grep -v '^/usr/lib/' || true)"
            if [ -n "${outside}" ]; then
              leaked="${leaked} $(basename "${binary}")"
              printf '%s: %s\n' "${binary}" "${outside}" >&2
            fi
          done
          [ "${checked}" -gt 0 ] || {
            echo '::error::the extracted bundle has no Mach-O payload to check'; exit 1; }
          [ -z "${leaked}" ] || {
            echo "::error::shipped Mach-O files still load libraries from outside the bundle:${leaked}"
            exit 1
          }
          echo "otool: ${checked} Mach-O files, zero external absolute dependencies"

          # 2. The daemon must load and report THIS release. --status verifies the
          #    installed payload at startup, prints "chudware <version>" on stderr
          #    and then exits nonzero because no daemon is running: the banner is
          #    the assertion, the exit status is not.
          banner="$(CHUDWARE_LIBCHUDWARE="${app}/Contents/Frameworks/libchudware.dylib" \
            "${app}/Contents/MacOS/chudware-hostd" --status 2>&1 >/dev/null || true)"
          printf '%s\n' "${banner}"
          printf '%s' "${banner}" | grep -Fq "${RELEASE_VERSION}" || {
            echo "::error::chudware-hostd did not load and report ${RELEASE_VERSION}"; exit 1; }

          # 3. The signed payload manifest must describe the extracted bytes, and
          #    its signature must verify against release-ci-v1.
          PYTHONPATH="${GITHUB_WORKSPACE}" "${RELEASE_PYTHON}" - "${app}" "${RELEASE_PUBLIC_KEY_B64}" <<'PY'
          import sys
          from pathlib import Path
          from services.installer.payload_manifest import read_manifest, verify_manifest_payload, verify_signature
          root = Path(sys.argv[1])
          manifest, canonical = read_manifest(root)
          verify_manifest_payload(root, canonical)
          verify_signature(key_id=str(manifest["key_id"]), canonical_json=canonical,
                           signature_path=root / "payload-manifest.v1.sig", public_key=sys.argv[2])
          if manifest["platform"] != "macos":
              raise SystemExit("payload manifest claims platform %r" % manifest["platform"])
          print("payload manifest verified: %d files, key_id %s, version %s"
                % (len(manifest["files"]), manifest["key_id"], manifest["version"]))
          PY

          # The manifest and its signature ride beside the artifact as sidecars;
          # they live inside the bundle, so take them from the verified tree.
          cp "${app}/payload-manifest.v1.json" "${work}/payload-manifest.v1.json"
          cp "${app}/payload-manifest.v1.sig" "${work}/payload-manifest.v1.sig"

      - name: Sign the verified app artifact pair and complete evidence
        env:
          CHUDWARE_RELEASE_CI_KEY: ${{ secrets.CHUDWARE_RELEASE_CI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="${ARTIFACT}"
          evidence="${RUNNER_TEMP}/evidence"
          set -- "${artifact}" --artifact-sha256 "${ARTIFACT_SHA256}" --version "${RELEASE_VERSION}" \
            --platform "${RELEASE_PLATFORM}" --arch "${RELEASE_ARCH}" --commit "${RELEASE_COMMIT}" \
            --locked-input CMakePresets.json --locked-input packaging/requirements-release.txt \
            --locked-input vendor/chudcode/CHUDCODE_ARTIFACT.lock \
            --test-results "${RUNNER_TEMP}/test-results/test-results.json" --out "${evidence}"
          if [ -n "${CHUDWARE_PLATFORM_PUBLISHER_POLICY:-}" ] || [ -n "${CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE:-}" ]; then
            [ -n "${CHUDWARE_PLATFORM_PUBLISHER_POLICY:-}" ] && [ -n "${CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE:-}" ] || {
              echo '::error::native publisher policy and detached signature must be paired'; exit 1; }
            if [ -n "${CHUDWARE_SIGN_IDENTITY:-}" ] && [ -n "${CHUDWARE_NOTARIZE_PROFILE:-}" ]; then
              native_report="${RUNNER_TEMP}/platform-signing.v1.json"
              "${RELEASE_PYTHON}" packaging/finalize_release.py platform-evidence "${artifact}" \
                --platform macos --kind notarization \
                --platform-publisher-policy "${CHUDWARE_PLATFORM_PUBLISHER_POLICY}" \
                --platform-publisher-policy-signature "${CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE}" \
                --out "${native_report}"
              set -- "$@" --platform-signing-evidence "${native_report}" \
                --platform-publisher-policy "${CHUDWARE_PLATFORM_PUBLISHER_POLICY}" \
                --platform-publisher-policy-signature "${CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE}"
            fi
          fi
          "${RELEASE_PYTHON}" packaging/generate_release_evidence.py "$@"
          "${RELEASE_PYTHON}" packaging/windows/prepare_evidence_requests.py "${evidence}"
          "${RELEASE_PYTHON}" packaging/ci_sign.py --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
            --output "${RUNNER_TEMP}/artifact.sig" \
            artifact --key-id "${CHUDWARE_RELEASE_KEY_ID}" --version "${RELEASE_VERSION}" \
            --platform "${RELEASE_PLATFORM}" --arch "${RELEASE_ARCH}" --artifact "${artifact}" \
            --request-out "${RUNNER_TEMP}/artifact-request.bin" > /dev/null
          "${RELEASE_PYTHON}" packaging/ci_sign.py --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
            --output "${RUNNER_TEMP}/artifact-stable.sig" \
            artifact --key-id "${CHUDWARE_RELEASE_KEY_ID}" --version "${RELEASE_STABLE_VERSION}" \
            --platform "${RELEASE_PLATFORM}" --arch "${RELEASE_ARCH}" --artifact "${artifact}" > /dev/null
          emitted="${artifact}.artifact-signing-request.bin"
          test -s "${emitted}" || { echo '::error::native app builder omitted the artifact preimage'; exit 1; }
          cmp -s "${emitted}" "${RUNNER_TEMP}/artifact-request.bin" || {
            echo '::error::build_app.sh and ci_sign disagree about the artifact preimage'; exit 1; }
          for pair in 'sbom.cdx.json:sbom' 'provenance.slsa.json:provenance' 'platform-test.v1.json:platform-test'; do
            name="${pair%%:*}"
            kind="${pair##*:}"
            "${RELEASE_PYTHON}" packaging/ci_sign.py --expect-public-key "${CHUDWARE_RELEASE_CI_PUBLIC_KEY}" \
              --output "${evidence}/${name}.sig" \
              sign "${kind}" "${evidence}/${name}.signing-request.bin" > /dev/null
          done

      - name: Upload the app and publish over the gateway API
        shell: bash
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/gw.sh"
          name="Chudware-${RELEASE_VERSION}-macos-${RELEASE_ARCH}.zip"

          evidence="${RUNNER_TEMP}/evidence"
          gw_upload_release "${ARTIFACT}" "${name}" "${RUNNER_TEMP}/verify" "${evidence}"
          echo "ARTIFACT_NAME=${name}" >> "$GITHUB_ENV"

          ci_status publishing "posting ci/publish for ${name}"

          body="${RUNNER_TEMP}/publish.json"
          # The gateway recomputes every digest from the staged files and rejects
          # a mismatch, so the body is built from the exact bytes that were
          # uploaded.
          EVIDENCE_DIR="${RUNNER_TEMP}/evidence" "${RELEASE_PYTHON}" - "${ARTIFACT}" \
            "${RUNNER_TEMP}/artifact.sig" "${RUNNER_TEMP}/artifact-stable.sig" > "${body}" <<'PY'
          import hashlib, json, os, pathlib, sys

          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          artifact = pathlib.Path(sys.argv[1])
          body = {
              "version": os.environ["RELEASE_VERSION"],
              "stable_version": os.environ["RELEASE_STABLE_VERSION"],
              "platform": os.environ["RELEASE_PLATFORM"],
              "arch": os.environ["RELEASE_ARCH"],
              "channel": "beta",
              "key_id": os.environ["CHUDWARE_RELEASE_KEY_ID"],
              "min_supported": os.environ["CHUDWARE_RELEASE_MIN_SUPPORTED"],
              "sha256": os.environ["ARTIFACT_SHA256"],
              "size": artifact.stat().st_size,
              "signature": pathlib.Path(sys.argv[2]).read_text(encoding="ascii").strip(),
              "stable_signature": pathlib.Path(sys.argv[3]).read_text(encoding="ascii").strip(),
              "notes_url": os.environ["CHUDWARE_RELEASE_NOTES_URL"],
              "commit_sha": os.environ["RELEASE_COMMIT"],
          }
          directory = pathlib.Path(os.environ["EVIDENCE_DIR"])
          evidence = {}
          for field, name in (("sbom", "sbom.cdx.json"),
                              ("provenance", "provenance.slsa.json"),
                              ("platform_test", "platform-test.v1.json")):
              evidence[field + "_sha256"] = digest(directory / name)
              evidence[field + "_signature_sha256"] = digest(directory / (name + ".sig"))
          body["evidence"] = evidence
          json.dump(body, sys.stdout)
          PY

          # A 422 for a digest/size mismatch makes the gateway DELETE the staged
          # artifact (sidecars survive), so a retry must re-upload it. Re-running
          # this job does exactly that: it rebuilds and re-uploads before
          # publishing.
          response="$(gw_post /api/releases/ci/publish "${body}")" || {
            echo '::error::ci/publish rejected the macOS app'; exit 1; }
          printf '%s\n' "${response}" | "${RELEASE_PYTHON}" -c \
            'import json,sys; print(json.dumps(json.load(sys.stdin), indent=2, sort_keys=True))' \
            || printf '%s\n' "${response}"

          ci_status published "${name} published to beta"
          {
            echo "## macOS ${RELEASE_ARCH} beta published"
            echo ''
            echo "* artifact: \`${name}\`"
            echo "* stable pair signed for: \`${RELEASE_STABLE_VERSION}\`"
            echo '* evidence bundle: complete and signed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure to the gateway
        if: always() && job.status != 'success'
        env:
          GATEWAY_TOKEN: ${{ secrets.CHUDWARE_GATEWAY_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          detail="macos-beta ${RELEASE_ARCH} ${{ job.status }} in run ${GITHUB_RUN_NUMBER}"
          if [ -r "${RUNNER_TEMP}/gw.sh" ]; then
            . "${RUNNER_TEMP}/gw.sh"
            ci_status failed "${detail}"
            exit 0
          fi
          # The capability step failed before gw.sh existed; without this the
          # queued row the plan job wrote stays "queued" in /admin forever.
          [ -n "${GATEWAY_TOKEN:-}" ] || exit 0
          umask 077
          curlrc="${RUNNER_TEMP}/gw-fallback.curlrc"
          printf 'header = "Authorization: Bearer %s"\n' "${GATEWAY_TOKEN}" > "${curlrc}"
          body="${RUNNER_TEMP}/ci-status-fallback.json"
          python3 - failed "${detail}" > "${body}" <<'PY'
          import json, os, sys
          json.dump({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "commit_sha": os.environ["RELEASE_COMMIT"],
              "channel": "beta",
              "platform": os.environ["RELEASE_PLATFORM"],
              "arch": os.environ["RELEASE_ARCH"],
              "version": os.environ["RELEASE_VERSION"],
              "status": sys.argv[1],
              "detail": sys.argv[2],
          }, sys.stdout)
          PY
          curl --config "${curlrc}" --fail-with-body --silent --show-error --max-time 60 \
            -H 'Content-Type: application/json' --data-binary "@${body}" \
            "${CHUDWARE_GATEWAY_PUBLIC_BASE}/api/releases/ci/status" > /dev/null \
            || echo "::warning::fallback ci/status was not recorded"
