name: prod-external-watch

# This watcher deliberately runs off the production box. The local monitor can
# report a sick process, but it cannot report a dead host, tunnel, or WAN link.
# State lives on the dedicated, persistent self-hosted runner so three scheduled
# runs means approximately fifteen minutes, not three probes in one instant.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prod-external-watch
  cancel-in-progress: false

jobs:
  # Keep this id exactly `watch`: verify-ci-workflows.py grants the off-box
  # cc-artifact-host exception to this exact workflow/job pair only.
  watch:
    if: ${{ github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    environment: chudware-control-protected
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, linux, x64, cc-artifact-host]
    timeout-minutes: 4
    env:
      HEALTH_URL: https://app.chudware.com/healthz
      STATUS_URL: https://chudware.com/status.json
      ALERT_TITLE: "[prod-watch] Chudware production surface unavailable"
      # Asset parity gets its OWN title, and therefore its own dedup key. A
      # stale web bundle is a different class of event from "production is
      # unreachable": folding it into ALERT_TITLE would page for the wrong
      # thing and would let a parity result open, suppress, or close the
      # outage issue. Nothing below ever reads both titles.
      PARITY_URL: https://app.chudware.com
      PARITY_TITLE: "[prod-watch] Chudware web bundle is serving stale assets"
      # A third title, for "this gate is not running at all". It is a distinct
      # class of event again: PARITY_TITLE means we measured production and it
      # was wrong, this one means we never measured it. Sharing either existing
      # title would let "the gate is blind" masquerade as "the gate passed" or
      # silently close a real divergence.
      PARITY_INACTIVE_TITLE: "[prod-watch] Web parity gate is inactive (PROD_WATCH_PARITY_COOKIE unset)"
      RESEND_API_KEY: ${{ secrets.PROD_WATCH_RESEND_API_KEY }}
      ALERT_TO: ${{ secrets.PROD_WATCH_EMAIL }}
      ALERT_FROM: ${{ secrets.PROD_WATCH_FROM }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Assert the off-site artifact host
        run: |
          set -euo pipefail
          test "$(hostname -s)" = cloudcastle-server
          test "${RUNNER_NAME:?}" = cloudcastle-server
          test "${RUNNER_OS:?}" = Linux

      - name: Probe, debounce, deduplicate, and recover
        run: |
          set -euo pipefail
          state_dir="${HOME}/.local/state/chudware-prod-watch"
          state_file="${state_dir}/consecutive-failures"
          health_body="${state_dir}/health.json"
          status_body="${state_dir}/status.json"
          mkdir -p "$state_dir"

          find_open_issue() {
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == env.ALERT_TITLE) | .number' | sed -n '1p'
          }

          probe_failed=0
          health_code=$(curl -sS --http1.1 --max-time 20 -o "$health_body" \
            -w '%{http_code}' "$HEALTH_URL" || echo 000)
          if [ "$health_code" != 200 ] || ! python3 -c \
            'import json,sys; d=json.load(open(sys.argv[1])); assert d == {"ok": True}' \
            "$health_body" 2>/dev/null; then
            echo "FAIL gateway health: HTTP $health_code"
            probe_failed=1
          else
            echo "PASS gateway health"
          fi

          status_code=$(curl -sS --http1.1 --max-time 20 -o "$status_body" \
            -w '%{http_code}' "$STATUS_URL" || echo 000)
          if [ "$status_code" != 200 ] || ! python3 -c '
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert isinstance(d.get("updated_at"), str) and d["updated_at"]
          assert d.get("state") == "operational", d.get("state")
          assert len(d.get("services", [])) >= 3
          ' "$status_body" 2>/dev/null; then
            echo "FAIL Pages status blob: HTTP $status_code, malformed, or degraded"
            probe_failed=1
          else
            echo "PASS Pages status blob"
          fi

          previous=$(cat "$state_file" 2>/dev/null || echo 0)
          case "$previous" in (*[!0-9]*|'') previous=0;; esac

          if [ "$probe_failed" -eq 0 ]; then
            printf '0\n' > "$state_file"
            issue=$(find_open_issue)
            if [ -n "$issue" ]; then
              recovered_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
                --body "Recovered at ${recovered_at}. Both the gateway health endpoint and the fresh Pages status snapshot are healthy again."
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed
              echo "RECOVERED: commented on and closed issue #$issue"
            elif [ "$previous" -gt 0 ]; then
              echo "RECOVERED after $previous transient failure(s); no alert had opened"
            fi
            exit 0
          fi

          failures=$((previous + 1))
          printf '%s\n' "$failures" > "$state_file"
          if [ "$failures" -lt 3 ]; then
            echo "Failure $failures/3 recorded; waiting for another scheduled run"
            exit 0
          fi

          issue=$(find_open_issue)
          if [ -n "$issue" ]; then
            echo "ALREADY ALERTED: issue #$issue remains open; suppressing duplicate issue and email"
            exit 0
          fi

          detected_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          body="Three consecutive five-minute checks failed (approximately 15 minutes). Detected ${detected_at}. Gateway: ${HEALTH_URL}; Pages status: ${STATUS_URL}. Check the public DNS/tunnel first, then chudware-gateway.service, PostgreSQL, and the local Prometheus dashboard. Recovery is automatic: a healthy run comments on and closes this issue."
          issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$ALERT_TITLE" --body "$body")
          echo "OPENED: $issue_url"

          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_TO" ] || [ -z "$ALERT_FROM" ]; then
            echo "::error title=Production alert email not configured::Set PROD_WATCH_RESEND_API_KEY, PROD_WATCH_EMAIL, and PROD_WATCH_FROM repository secrets. Issue opened at $issue_url."
            exit 1
          fi
          export body issue_url detected_at
          payload=$(python3 -c '
          import json, os
          print(json.dumps({
              "from": os.environ["ALERT_FROM"],
              "to": [os.environ["ALERT_TO"]],
              "subject": "Chudware production unavailable",
              "text": os.environ["body"] + "\n\n" + os.environ["issue_url"],
          }))
          ')
          curl -fsS --max-time 20 https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null
          echo "EMAIL SENT: $ALERT_TO"
          echo "::error title=Production unavailable::Three consecutive checks failed; opened $issue_url and emailed $ALERT_TO"
          exit 1

      - name: Check out repository
        # The parity gate below compares the bytes production serves against
        # this repository's own asset files, so the runner needs the tree at
        # the commit being verified. Two deliberate placement decisions:
        #
        #   * It runs AFTER the probe, not before. A GitHub-side failure that
        #     breaks a checkout must never be able to stop the health watch
        #     above from running -- that watcher is the load-bearing one, and
        #     nothing added here is allowed to gate it.
        #   * `if: always()` so a failing probe step does not skip it either.
        #
        # actions/checkout cleans $GITHUB_WORKSPACE, but the probe's debounce
        # state lives under $HOME/.local/state/chudware-prod-watch, so no
        # checkout can reset the consecutive-failure counter.
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify production serves assets at parity with the repo
        # The web app bakes assets into Chudware.data at Emscripten LINK time
        # (the --preload-file flags in host/CMakeLists.txt), so a web bundle is
        # a derived artifact that silently goes stale the moment a preloaded
        # asset changes. Desktop reads assets/ off disk and picks changes up
        # immediately, which is exactly what hides the divergence: 69690e57
        # (2026-08-17) replaced every ribbon tool icon with an engine-rendered
        # 3D tile, and production kept serving a bundle linked 2026-08-07 until
        # 2026-08-22. Ten days of stale icons, found by hand-scanning
        # Chudware.data for PNG bytes, because no CI job built WASM and nothing
        # compared a served bundle against its sources.
        #
        # This is that comparison, and it lives here because this job is the
        # only thing in the repository that observes what production ACTUALLY
        # serves, from outside the box. The gate reads the Emscripten file
        # table from Chudware.js and then pulls only the ranges it needs, so it
        # is a few hundred KB per run, not the whole 2.9 MB pack.
        #
        # PROD_WATCH_PARITY_COOKIE does not exist yet: create it (a
        # `chudware_sid=...` value for an account that can reach the
        # auth-gated /app) and this step becomes active. Until then it warns
        # loudly and skips, because a gate that cannot fetch the bundle has
        # measured nothing and must not report a pass.
        #
        # Exit codes are the whole contract: 0 parity, 1 divergence, 2 cannot
        # evaluate. 2 is normal when production is unreachable -- that signal
        # belongs to the probe above, so it is surfaced and not alerted on
        # twice.
        #
        # Deliberately no Resend email: a stale bundle is a wrong-pixels bug
        # that keeps until working hours, not a customer-visible outage. It
        # files (and later closes) a GitHub issue and nothing else, so the
        # email path stays reserved for "production is down".
        if: always()
        env:
          CHUDWARE_PARITY_COOKIE: ${{ secrets.PROD_WATCH_PARITY_COOKIE }}
        run: |
          set -euo pipefail

          # Dedup by exact title, the same shape the outage alert uses. Each
          # title gets its own lookup so the three alerts can never see,
          # suppress, or close one another's issue.
          find_issue_titled() {
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
              --json number,title --jq ".[] | select(.title == \$ENV.$1) | .number" \
              | sed -n '1p'
          }
          find_open_issue() { find_issue_titled PARITY_TITLE; }

          if [ -z "${CHUDWARE_PARITY_COOKIE:-}" ]; then
            # A ::warning on a */5 cron is not an alert, it is 288 notices a day
            # that nobody opens -- the gate would sit blind indefinitely and the
            # run would still be green, which is the same "green but not
            # actually checked" failure that let production go fifteen days
            # stale. So the blindness itself gets tracked exactly once, as an
            # issue, and closes itself the moment the secret exists.
            echo "::warning title=Web parity gate inactive::SKIPPED, not passed: repository secret PROD_WATCH_PARITY_COOKIE is unset, so the auth-gated ${PARITY_URL}/app bundle cannot be read. Production asset parity is NOT being verified by this run."
            echo "SKIP web parity: PROD_WATCH_PARITY_COOKIE is not set"
            inactive=$(find_issue_titled PARITY_INACTIVE_TITLE)
            if [ -n "$inactive" ]; then
              echo "ALREADY TRACKED: issue #$inactive remains open; suppressing duplicate"
              exit 0
            fi
            body_file="${RUNNER_TEMP}/web-parity-inactive.md"
            {
              printf '%s\n' "The five-minute production asset-parity check has never run. \`PROD_WATCH_PARITY_COOKIE\` is not set, so this workflow cannot read the auth-gated ${PARITY_URL}/app bundle and skips the comparison on every scheduled run."
              printf '\n%s\n' "Consequence: production asset parity is currently verified **only at deploy time**, by \`install_webd.sh\`'s own \`--bundle\` gate. Nothing verifies what production actually serves afterwards. The stale-bundle alarm (\`${PARITY_TITLE}\`) therefore cannot fire."
              printf '\n%s\n' "To activate: create a repository secret named \`PROD_WATCH_PARITY_COOKIE\` whose value is a \`chudware_sid=...\` session cookie for an account that can load ${PARITY_URL}/app. The next scheduled run picks it up, starts comparing, and closes this issue automatically."
            } > "$body_file"
            issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$PARITY_INACTIVE_TITLE" --body-file "$body_file")
            echo "OPENED: $issue_url"
            exit 0
          fi

          # The secret exists, so the gate is live again -- retire the blindness
          # issue before measuring, independently of what the measurement says.
          inactive=$(find_issue_titled PARITY_INACTIVE_TITLE)
          if [ -n "$inactive" ]; then
            gh issue comment "$inactive" --repo "$GITHUB_REPOSITORY" \
              --body "PROD_WATCH_PARITY_COOKIE is now set; this run read the served bundle and the parity gate is active again."
            gh issue close "$inactive" --repo "$GITHUB_REPOSITORY" --reason completed
            echo "REACTIVATED: closed issue #$inactive"
          fi

          report="${RUNNER_TEMP}/web-parity.txt"
          rc=0
          python3 scripts/check_web_parity.py --url "$PARITY_URL" 2>&1 \
            | tee "$report" || rc=$?

          if [ "$rc" -eq 2 ]; then
            echo "::warning title=Web parity gate could not evaluate::SKIPPED, not passed: the gate could not read the served bundle at ${PARITY_URL} (exit 2). If production is down the probe above already owns that alert; otherwise check that /app is reachable with the PROD_WATCH_PARITY_COOKIE session."
            exit 0
          fi

          if [ "$rc" -eq 0 ]; then
            issue=$(find_open_issue)
            if [ -n "$issue" ]; then
              recovered_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
                --body "Back at parity as of ${recovered_at}. Every asset preloaded into the bundle ${PARITY_URL}/app serves now matches the repository at ${GITHUB_SHA}."
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed
              echo "RECOVERED: commented on and closed issue #$issue"
            fi
            exit 0
          fi

          # No debounce here, unlike the outage probe. A three-run debounce
          # exists there because a WAN blip is transient; a stale bundle is
          # not. Divergence is a deterministic byte comparison that stays true
          # until someone relinks, and a flaky read surfaces as exit 2 above,
          # never as exit 1. Issue dedup still matters: at */5 this would
          # otherwise file 288 issues a day.
          issue=$(find_open_issue)
          if [ -n "$issue" ]; then
            echo "ALREADY ALERTED: issue #$issue remains open; suppressing duplicate"
            echo "::error title=Production serving stale assets::Still diverged; see issue #$issue"
            exit 1
          fi

          detected_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          body_file="${RUNNER_TEMP}/web-parity-issue.md"
          {
            printf '%s\n' "Production is serving a web bundle whose baked-in assets do not match this repository at ${GITHUB_SHA}. Detected ${detected_at} against ${PARITY_URL}/app."
            printf '\n%s\n' "The web app preloads assets into Chudware.data at Emscripten LINK time, so the served bundle only changes when it is relinked -- desktop picks the same asset change up off disk immediately, which is why this can sit unnoticed (it did for ten days from 69690e57 on 2026-08-17). Fix: relink with ./build.sh wasm, then restage and deploy. Recovery is automatic: the next passing five-minute check comments on and closes this issue."
            printf '\n%s\n' 'Gate output:'
            printf '\n```\n'
            cat "$report"
            printf '```\n'
          } > "$body_file"
          issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$PARITY_TITLE" --body-file "$body_file")
          echo "OPENED: $issue_url"
          echo "::error title=Production serving stale assets::The served web bundle diverges from the repo; opened $issue_url"
          exit 1
