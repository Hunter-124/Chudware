name: prod-external-watch

# This watcher deliberately runs off the production box. The local monitor can
# report a sick process, but it cannot report a dead host, tunnel, or WAN link.
# State lives on the dedicated, persistent self-hosted runner so three scheduled
# runs means approximately fifteen minutes, not three probes in one instant.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prod-external-watch
  cancel-in-progress: false

jobs:
  # Keep this id exactly `watch`: verify-ci-workflows.py grants the off-box
  # cc-artifact-host exception to this exact workflow/job pair only.
  watch:
    runs-on: [self-hosted, linux, x64, cc-artifact-host]
    timeout-minutes: 4
    env:
      HEALTH_URL: https://app.chudware.com/healthz
      STATUS_URL: https://chudware.com/status.json
      ALERT_TITLE: "[prod-watch] Chudware production surface unavailable"
      RESEND_API_KEY: ${{ secrets.PROD_WATCH_RESEND_API_KEY }}
      ALERT_TO: ${{ secrets.PROD_WATCH_EMAIL }}
      ALERT_FROM: ${{ secrets.PROD_WATCH_FROM }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Assert the off-site artifact host
        run: |
          set -euo pipefail
          test "$(hostname -s)" = cloudcastle-server
          test "${RUNNER_NAME:?}" = cloudcastle-server
          test "${RUNNER_OS:?}" = Linux

      - name: Probe, debounce, deduplicate, and recover
        run: |
          set -euo pipefail
          state_dir="${HOME}/.local/state/chudware-prod-watch"
          state_file="${state_dir}/consecutive-failures"
          health_body="${state_dir}/health.json"
          status_body="${state_dir}/status.json"
          mkdir -p "$state_dir"

          find_open_issue() {
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == env.ALERT_TITLE) | .number' | sed -n '1p'
          }

          probe_failed=0
          health_code=$(curl -sS --http1.1 --max-time 20 -o "$health_body" \
            -w '%{http_code}' "$HEALTH_URL" || echo 000)
          if [ "$health_code" != 200 ] || ! python3 -c \
            'import json,sys; d=json.load(open(sys.argv[1])); assert d == {"ok": True}' \
            "$health_body" 2>/dev/null; then
            echo "FAIL gateway health: HTTP $health_code"
            probe_failed=1
          else
            echo "PASS gateway health"
          fi

          status_code=$(curl -sS --http1.1 --max-time 20 -o "$status_body" \
            -w '%{http_code}' "$STATUS_URL" || echo 000)
          if [ "$status_code" != 200 ] || ! python3 -c '
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert isinstance(d.get("updated_at"), str) and d["updated_at"]
          assert d.get("state") == "operational", d.get("state")
          assert len(d.get("services", [])) >= 3
          ' "$status_body" 2>/dev/null; then
            echo "FAIL Pages status blob: HTTP $status_code, malformed, or degraded"
            probe_failed=1
          else
            echo "PASS Pages status blob"
          fi

          previous=$(cat "$state_file" 2>/dev/null || echo 0)
          case "$previous" in (*[!0-9]*|'') previous=0;; esac

          if [ "$probe_failed" -eq 0 ]; then
            printf '0\n' > "$state_file"
            issue=$(find_open_issue)
            if [ -n "$issue" ]; then
              recovered_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
                --body "Recovered at ${recovered_at}. Both the gateway health endpoint and the fresh Pages status snapshot are healthy again."
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed
              echo "RECOVERED: commented on and closed issue #$issue"
            elif [ "$previous" -gt 0 ]; then
              echo "RECOVERED after $previous transient failure(s); no alert had opened"
            fi
            exit 0
          fi

          failures=$((previous + 1))
          printf '%s\n' "$failures" > "$state_file"
          if [ "$failures" -lt 3 ]; then
            echo "Failure $failures/3 recorded; waiting for another scheduled run"
            exit 0
          fi

          issue=$(find_open_issue)
          if [ -n "$issue" ]; then
            echo "ALREADY ALERTED: issue #$issue remains open; suppressing duplicate issue and email"
            exit 0
          fi

          detected_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          body="Three consecutive five-minute checks failed (approximately 15 minutes). Detected ${detected_at}. Gateway: ${HEALTH_URL}; Pages status: ${STATUS_URL}. Check the public DNS/tunnel first, then chudware-gateway.service, PostgreSQL, and the local Prometheus dashboard. Recovery is automatic: a healthy run comments on and closes this issue."
          issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$ALERT_TITLE" --body "$body")
          echo "OPENED: $issue_url"

          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_TO" ] || [ -z "$ALERT_FROM" ]; then
            echo "::error title=Production alert email not configured::Set PROD_WATCH_RESEND_API_KEY, PROD_WATCH_EMAIL, and PROD_WATCH_FROM repository secrets. Issue opened at $issue_url."
            exit 1
          fi
          export body issue_url detected_at
          payload=$(python3 -c '
          import json, os
          print(json.dumps({
              "from": os.environ["ALERT_FROM"],
              "to": [os.environ["ALERT_TO"]],
              "subject": "Chudware production unavailable",
              "text": os.environ["body"] + "\n\n" + os.environ["issue_url"],
          }))
          ')
          curl -fsS --max-time 20 https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null
          echo "EMAIL SENT: $ALERT_TO"
          echo "::error title=Production unavailable::Three consecutive checks failed; opened $issue_url and emailed $ALERT_TO"
          exit 1
