# Protected reusable release builder. The tag/dispatch caller owns concurrency;
# runner-group authorization must name this defining workflow at its exact ref.
name: release-prepare

on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: ''
    secrets:
      STRIPE_SANDBOX_ENV:
        required: false

permissions:
  contents: read

env:
  CHUDWARE_RELEASE_KEY_ID: release-v1
  CHUDWARE_RELEASE_CHANNEL: ${{ inputs.channel || (contains(github.ref_name, '-') && 'beta' || 'stable') }}

jobs:
  # Live Stripe verification before a release is built.
  #
  # A desktop release is not obviously a billing artifact, so the reason this
  # gates it is worth stating: the installers carry the entitlement client, and
  # entitlements are minted from plan state that Stripe owns. Shipping a build
  # against a catalog whose price ids no longer resolve produces desktop clients
  # that cannot verify a paid plan, and the failure appears on customers'
  # machines rather than in CI.
  #
  # It also costs ~40s against a 240-minute three-platform matrix, so gating is
  # close to free. Reports NOT RUN without secrets.STRIPE_SANDBOX_ENV; see
  # .github/workflows/stripe-sandbox.yml.
  stripe-gate:
    name: Gate — live Stripe sandbox
    if: ${{ github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    uses: ./.github/workflows/stripe-sandbox.yml
    secrets:
      STRIPE_SANDBOX_ENV: ${{ secrets.STRIPE_SANDBOX_ENV }}

  prepare:
    name: Prepare immutable ${{ matrix.platform }}-${{ matrix.arch }} payload
    if: ${{ github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    environment: chudware-release-protected
    # Three platforms burn hours of runner time; find out the catalog is broken
    # before committing any of it.
    needs: stripe-gate
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, "${{ matrix.runner_os }}", "${{ matrix.runner_arch }}", cloudcastle-ci, "${{ matrix.runner_label }}"]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, arch: x86_64, runner_os: Linux, runner_arch: X64, runner_label: cc-linux-build, preset: linux-core, host_build_dir: host/build-linux}
          - {platform: windows, arch: x86_64, runner_os: Windows, runner_arch: X64, runner_label: cc-win-package, preset: windows-occt, host_build_dir: host/build-windows}
          - {platform: macos, arch: x86_64, runner_os: macOS, runner_arch: X64, runner_label: cc-mac-intel, preset: macos-x86_64, host_build_dir: host/build-macos-x86_64}
    env:
      CHUDWARE_SIGN_IDENTITY: ${{ secrets.CHUDWARE_SIGN_IDENTITY }}
      CHUDWARE_NOTARIZE_PROFILE: ${{ secrets.CHUDWARE_NOTARIZE_PROFILE }}
      # /Zi targets on the Windows row write PDBs through mspdbsrv. A run-unique
      # endpoint gives this job its own server instead of attaching to (or
      # leaving behind) one shared with any other build on the host, as in
      # native-build.yml. Ignored off Windows.
      _MSPDBSRV_ENDPOINT_: chudware-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Provision authenticated release Python (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          : "${CHUDWARE_CI_BASE_PYTHON:?qualify and export the protected image base Python}"
          : "${CHUDWARE_WHEELHOUSE:?provide the reviewed complete offline release wheelhouse}"
          case "${CHUDWARE_CI_BASE_PYTHON}" in
            /*) ;; *) echo '::error::base Python must be an absolute image-qualified path'; exit 1 ;;
          esac
          case "${CHUDWARE_WHEELHOUSE}" in
            /*) ;; *) echo '::error::wheelhouse must be an absolute reviewed path'; exit 1 ;;
          esac
          test -x "${CHUDWARE_CI_BASE_PYTHON}"
          for variable in $(compgen -e); do
            case "${variable}" in PYTHON*|LD_*|DYLD_*) unset "${variable}" ;; esac
          done
          venv="${RUNNER_TEMP}/release-python"
          VENV_DIR="${venv}" PYTHON="${CHUDWARE_CI_BASE_PYTHON}" \
            CHUDWARE_WHEELHOUSE="${CHUDWARE_WHEELHOUSE}" bash scripts/provision_venv.sh
          "${CHUDWARE_CI_BASE_PYTHON}" -I -S -c \
            'import sys; sys.path.insert(0, sys.argv[1]); from services.installer.provision import main; sys.exit(main(sys.argv[2:]))' \
            "${PWD}" --check-inputs --venv-dir "${venv}" --base-python "${CHUDWARE_CI_BASE_PYTHON}" \
            --wheelhouse "${CHUDWARE_WHEELHOUSE}"
          echo "CHUDWARE_RELEASE_PYTHON=${venv}/bin/python" >> "$GITHUB_ENV"
          echo "${venv}/bin" >> "$GITHUB_PATH"

      - name: Provision authenticated release Python (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CHUDWARE_CI_BASE_PYTHON -or -not (Test-Path -LiteralPath $env:CHUDWARE_CI_BASE_PYTHON)) {
            throw 'Qualify and export the protected image CHUDWARE_CI_BASE_PYTHON executable'
          }
          if (-not $env:CHUDWARE_WHEELHOUSE) { throw 'Reviewed complete offline release wheelhouse required' }
          foreach ($inputPath in @($env:CHUDWARE_CI_BASE_PYTHON, $env:CHUDWARE_WHEELHOUSE)) {
            if ($inputPath -notmatch '^(?:[A-Za-z]:[\\/]|\\\\[^\\]+\\[^\\]+(?:\\|$))') {
              throw 'Base Python and wheelhouse must be absolute image-qualified paths'
            }
          }
          Get-ChildItem Env: | Where-Object { $_.Name -like 'PYTHON*' -or $_.Name -like 'LD_*' -or $_.Name -like 'DYLD_*' } |
            ForEach-Object { Remove-Item -LiteralPath ("Env:" + $_.Name) }
          $venv = Join-Path $env:RUNNER_TEMP 'release-python'
          & $env:CHUDWARE_CI_BASE_PYTHON -I -S -c "import sys; sys.path.insert(0, sys.argv[1]); from services.installer.provision import main; sys.exit(main(sys.argv[2:]))" `
            $env:GITHUB_WORKSPACE --base-python $env:CHUDWARE_CI_BASE_PYTHON --venv-dir $venv --wheelhouse $env:CHUDWARE_WHEELHOUSE
          if ($LASTEXITCODE -ne 0) { throw 'Authenticated release runtime provisioning failed' }
          $releasePython = Join-Path $venv 'Scripts\python.exe'
          & $env:CHUDWARE_CI_BASE_PYTHON -I -S -c "import sys; sys.path.insert(0, sys.argv[1]); from services.installer.provision import main; sys.exit(main(sys.argv[2:]))" `
            $env:GITHUB_WORKSPACE --check-inputs --venv-dir $venv --base-python $env:CHUDWARE_CI_BASE_PYTHON --wheelhouse $env:CHUDWARE_WHEELHOUSE
          if ($LASTEXITCODE -ne 0) { throw 'Compiler wheels do not match the approved release target' }
          "CHUDWARE_RELEASE_PYTHON=$releasePython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $venv 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Enter the native MSVC build environment
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'Qualified Visual Studio x64 C++ tools are required' }
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Visual Studio x64 C++ tools were not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $developerEnvironment = & $env:COMSPEC /d /s /c ('"' + $vcvars + '" >nul && set')
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment initialization failed' }
          foreach ($line in $developerEnvironment) {
            $split = $line.IndexOf('=')
            if ($split -gt 0) { [Environment]::SetEnvironmentVariable($line.Substring(0, $split), $line.Substring($split + 1), 'Process') }
          }
          Get-ChildItem Env: | ForEach-Object {
            if ($before[$_.Name] -ne $_.Value) {
              "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          foreach ($tool in @('cl', 'cmake', 'ninja', 'ctest', 'tar.exe')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Qualified build tool missing: $tool" }
          }
          $logical = [Environment]::ProcessorCount
          $freeGiB = [math]::Floor((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB)
          $jobs = [math]::Max(1, [math]::Min([math]::Floor($logical / 2), [math]::Floor(($freeGiB - 8) / 2)))
          "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve honest release identity (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::invalid release version ${version}"; exit 1;
          }
          channel="${CHUDWARE_RELEASE_CHANNEL}"
          if [ "${{ matrix.platform }}" = macos ]; then
            if [ "${channel}" = stable ]; then
              [ -n "${CHUDWARE_SIGN_IDENTITY:-}" ] && [ -n "${CHUDWARE_NOTARIZE_PROFILE:-}" ] || {
                echo '::error::stable macOS requires platform signing/notarization inputs'; exit 1; }
              test -s "${CHUDWARE_PLATFORM_PUBLISHER_POLICY:-}" && test -s "${CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE:-}" || {
                echo '::error::stable macOS requires the owner-authenticated publisher policy pair'; exit 1; }
            elif [ -z "${CHUDWARE_SIGN_IDENTITY:-}" ] || [ -z "${CHUDWARE_NOTARIZE_PROFILE:-}" ]; then
              channel=beta
              echo '::warning::unsigned platform build forced to beta; no Gatekeeper claim is made'
            fi
          fi
          {
            echo "CHUDWARE_VERSION=${version}"
            echo "CHUDWARE_EFFECTIVE_CHANNEL=${channel}"
          } >> "$GITHUB_ENV"

      - name: Resolve honest release identity (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') { throw 'Invalid release version' }
          $channel = $env:CHUDWARE_RELEASE_CHANNEL
          if ($channel -eq 'stable' -and -not $env:CHUDWARE_SIGN_IDENTITY) { throw 'Stable Windows requires platform signing inputs' }
          if ($channel -eq 'stable' -and (-not $env:CHUDWARE_PLATFORM_PUBLISHER_POLICY -or -not $env:CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE)) {
            throw 'Stable Windows requires the owner-authenticated publisher policy pair'
          }
          if (-not $env:CHUDWARE_SIGN_IDENTITY) {
            $channel = 'beta'
            Write-Host '::warning::unsigned platform build forced to beta; no SmartScreen claim is made'
          }
          "CHUDWARE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHUDWARE_EFFECTIVE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate protected assets, configure production core and host (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          protected_assets="${{ matrix.host_build_dir }}/generated/protected-assets"
          python3 packaging/embed_protected_assets.py --source-root . --output-dir "$protected_assets"
          cmake --preset "${{ matrix.preset }}" -DCHUDWARE_DEVELOPER_BUILD=OFF \
            -DCHUDWARE_LTO=ON \
            -DCHUDWARE_PROTECTED_ASSETS_DIR="$GITHUB_WORKSPACE/$protected_assets"
          cmake --build --preset "${{ matrix.preset }}"
          cmake -S host -B "${{ matrix.host_build_dir }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCHUDWARE_DEVELOPER_BUILD=OFF \
            -DCHUDWARE_LTO=ON \
            -DCHUDWARE_PROTECTED_ASSETS_DIR="$GITHUB_WORKSPACE/$protected_assets"
          cmake --build "${{ matrix.host_build_dir }}"
          grep -Fqx 'CHUDWARE_DEVELOPER_BUILD:BOOL=OFF' "build/${{ matrix.preset }}/CMakeCache.txt"
          grep -Fqx 'CHUDWARE_DEVELOPER_BUILD:BOOL=OFF' "${{ matrix.host_build_dir }}/CMakeCache.txt"

      - name: Generate protected assets, configure production core and host (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          function Invoke-Checked([string]$Program, [string[]]$Arguments) {
            & $Program @Arguments
            if ($LASTEXITCODE -ne 0) { throw "$Program failed with exit code $LASTEXITCODE" }
          }
          $hostBuild = '${{ matrix.host_build_dir }}'
          $protectedAssets = Join-Path $env:GITHUB_WORKSPACE "$hostBuild/generated/protected-assets"
          Invoke-Checked $env:CHUDWARE_RELEASE_PYTHON @('packaging\embed_protected_assets.py', '--source-root', '.', '--output-dir', $protectedAssets)
          & scripts\fetch_cef_windows.ps1 -DestinationRoot (Join-Path $env:RUNNER_TEMP 'cef')
          if ($LASTEXITCODE -ne 0) { throw 'Authenticated CEF provisioning failed' }
          $cef = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'cef') -Directory -Filter 'cef_binary_*_windows64_minimal')
          if ($cef.Count -ne 1) { throw 'Authenticated CEF root must be unambiguous' }
          Invoke-Checked cmake @('--preset', '${{ matrix.preset }}', '-DCHUDWARE_DEVELOPER_BUILD=OFF',
            '-DCHUDWARE_LTO=ON', "-DCHUDWARE_PROTECTED_ASSETS_DIR=$protectedAssets")
          Invoke-Checked cmake @('--build', '--preset', '${{ matrix.preset }}', '--parallel', $env:CMAKE_BUILD_PARALLEL_LEVEL)
          Invoke-Checked cmake @('-S', 'host', '-B', $hostBuild, '-G', 'Ninja', '-DCMAKE_BUILD_TYPE=Release',
            '-DCHUDWARE_DEVELOPER_BUILD=OFF', '-DCHUDWARE_LTO=ON', "-DCEF_ROOT=$($cef[0].FullName)",
            "-DCHUDWARE_PROTECTED_ASSETS_DIR=$protectedAssets")
          Invoke-Checked cmake @('--build', $hostBuild, '--parallel', $env:CMAKE_BUILD_PARALLEL_LEVEL)
          foreach ($cache in @('build/${{ matrix.preset }}/CMakeCache.txt', "$hostBuild/CMakeCache.txt")) {
            $matches = @(Select-String -LiteralPath $cache -Pattern '^CHUDWARE_DEVELOPER_BUILD:BOOL=OFF$')
            if ($matches.Count -ne 1) { throw "Production mode not established: $cache" }
          }

      - name: Exercise release tests and retain actual native results (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          "${CHUDWARE_RELEASE_PYTHON}" scripts/run_release_ctest.py \
            --core-dir "build/${{ matrix.preset }}/core" --host-dir "${{ matrix.host_build_dir }}" \
            --out "$RUNNER_TEMP/release-request"

      - name: Exercise release tests and retain actual native results (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:CHUDWARE_RELEASE_PYTHON scripts\run_release_ctest.py `
            --core-dir 'build/${{ matrix.preset }}/core' --host-dir '${{ matrix.host_build_dir }}' `
            --out (Join-Path $env:RUNNER_TEMP 'release-request')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare immutable payload and signing request (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/prepared/${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$out" "$RUNNER_TEMP/release-request"
          case "${{ matrix.platform }}" in
            linux)
              packaging/linux/build_appimage.sh --prepare-signing \
                --key-id "$CHUDWARE_RELEASE_KEY_ID" --out "$out" \
                --protected-assets-dir "${{ matrix.host_build_dir }}/generated/protected-assets" \
                --host-bin "${{ matrix.host_build_dir }}/bin/chudware" \
                --hostd-bin "build/${{ matrix.preset }}/bin/chudware-hostd" \
                --libchudware-bin "build/${{ matrix.preset }}/bin/libchudware.so" \
                --chud-bin "$CHUDWARE_CHUD_BIN"
              ;;
            macos)
              packaging/macos/build_app.sh --prepare-signing --key-id "$CHUDWARE_RELEASE_KEY_ID" \
                --chud-bin "$CHUDWARE_CHUD_BIN" --out "$out"
              ;;
          esac
          request="$(find "$out" -type f -name '*payload-signing-request.bin' -print -quit)"
          test -s "$request" || { echo '::error::payload signing request missing'; exit 1; }
          cp "$request" "$RUNNER_TEMP/release-request/payload-signing-request.bin"
          manifest="$(find "$out" -type f -name 'payload-manifest.v1.json' -print -quit)"
          test -s "$manifest" || { echo '::error::payload manifest missing'; exit 1; }
          cp "$manifest" "$RUNNER_TEMP/release-request/payload-manifest.v1.json"
          for name in test-results.json core-junit.xml host-junit.xml core-ctest.log host-ctest.log; do
            cp "$RUNNER_TEMP/release-request/$name" "$out/$name"
          done
          mkdir -p "$out/packaging" "$out/vendor/chudcode"
          cp CMakePresets.json "$out/CMakePresets.json"
          cp packaging/requirements-release.txt "$out/packaging/requirements-release.txt"
          cp vendor/chudcode/CHUDCODE_ARTIFACT.lock "$out/vendor/chudcode/CHUDCODE_ARTIFACT.lock"
          if [ -n "${CHUDWARE_PLATFORM_PUBLISHER_POLICY:-}" ] || [ -n "${CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE:-}" ]; then
            test -s "${CHUDWARE_PLATFORM_PUBLISHER_POLICY:-}" && test -s "${CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE:-}" || {
              echo '::error::publisher policy and signature must both exist'; exit 1; }
            cp "${CHUDWARE_PLATFORM_PUBLISHER_POLICY}" "$out/platform-publishers.v1.json"
            cp "${CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE}" "$out/platform-publishers.v1.json.sig"
            cp "$out/platform-publishers.v1.json" "$out/platform-publishers.v1.json.sig" "$RUNNER_TEMP/release-request/"
          fi

      - name: Prepare immutable payload and signing request (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          $out = Join-Path $env:RUNNER_TEMP 'prepared\windows-x86_64'
          $request = Join-Path $env:RUNNER_TEMP 'release-request'
          $sidecars = Join-Path $env:RUNNER_TEMP 'release-sidecars'
          New-Item -ItemType Directory -Path $out, $request -Force | Out-Null
          & packaging\windows\build_sidecars.ps1 -OutputDir $sidecars -Python $env:CHUDWARE_RELEASE_PYTHON `
            -HostBinary '${{ matrix.host_build_dir }}/bin/chudware.exe' `
            -HostdBinary 'build/${{ matrix.preset }}/bin/chudware-hostd.exe' `
            -EngineBinary 'build/${{ matrix.preset }}/bin/libchudware.dll'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CHUDWARE_RELEASE_PYTHON -m services.installer.build_release --prepare-signing --payload-only `
            --key-id $env:CHUDWARE_RELEASE_KEY_ID --version $env:CHUDWARE_VERSION --out $out `
            --host-bin '${{ matrix.host_build_dir }}/bin/chudware.exe' `
            --hostd-bin 'build/${{ matrix.preset }}/bin/chudware-hostd.exe' `
            --worker-bin (Join-Path $sidecars 'chudware-worker.exe') --mcp-bin (Join-Path $sidecars 'chudware-mcp.exe') `
            --chud-bin (Join-Path $sidecars 'chud.exe') `
            --uninstall-helper-bin '${{ matrix.host_build_dir }}/bin/chudware-uninstall-helper.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $preimage = Join-Path $out 'payload-manifest.v1.preimage'
          $manifest = Join-Path $out 'Chudware\payload-manifest.v1.json'
          foreach ($path in @($preimage, $manifest)) {
            if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -eq 0) { throw "Prepared payload input missing: $path" }
          }
          Copy-Item $preimage (Join-Path $request 'payload-signing-request.bin')
          Copy-Item $manifest (Join-Path $request 'payload-manifest.v1.json')
          foreach ($name in @('test-results.json', 'core-junit.xml', 'host-junit.xml', 'core-ctest.log', 'host-ctest.log')) {
            Copy-Item (Join-Path $request $name) (Join-Path $out $name)
          }
          New-Item -ItemType Directory -Path (Join-Path $out 'packaging'), (Join-Path $out 'vendor\chudcode') -Force | Out-Null
          Copy-Item CMakePresets.json (Join-Path $out 'CMakePresets.json')
          Copy-Item packaging\requirements-release.txt (Join-Path $out 'packaging\requirements-release.txt')
          Copy-Item vendor\chudcode\CHUDCODE_ARTIFACT.lock (Join-Path $out 'vendor\chudcode\CHUDCODE_ARTIFACT.lock')
          if ($env:CHUDWARE_PLATFORM_PUBLISHER_POLICY -or $env:CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE) {
            if (-not (Test-Path -LiteralPath $env:CHUDWARE_PLATFORM_PUBLISHER_POLICY) -or -not (Test-Path -LiteralPath $env:CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE)) {
              throw 'Publisher policy and signature must both exist'
            }
            Copy-Item $env:CHUDWARE_PLATFORM_PUBLISHER_POLICY (Join-Path $out 'platform-publishers.v1.json')
            Copy-Item $env:CHUDWARE_PLATFORM_PUBLISHER_POLICY_SIGNATURE (Join-Path $out 'platform-publishers.v1.json.sig')
            Copy-Item (Join-Path $out 'platform-publishers.v1.json'), (Join-Path $out 'platform-publishers.v1.json.sig') $request
          }

      - name: Stage authenticated handoff outside Actions (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/prepared/${{ matrix.platform }}-${{ matrix.arch }}"
          python3 - "$out" "$RUNNER_TEMP/release-request/handoff.json" <<'PY'
          import hashlib, json, os, pathlib, sys
          root, handoff_path = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          lock_names = ['CMakePresets.json', 'packaging/requirements-release.txt', 'vendor/chudcode/CHUDCODE_ARTIFACT.lock',
                        'test-results.json', 'core-junit.xml', 'host-junit.xml', 'core-ctest.log', 'host-ctest.log']
          if (root / 'platform-publishers.v1.json').is_file():
              lock_names += ['platform-publishers.v1.json', 'platform-publishers.v1.json.sig']
          locks = [{'path': name, 'sha256': hashlib.sha256((root / name).read_bytes()).hexdigest()} for name in lock_names]
          handoff = {
              'schema': 'chudware-offline-handoff-v1',
              'commit': os.environ['GITHUB_SHA'],
              'version': os.environ['CHUDWARE_VERSION'],
              'channel': os.environ['CHUDWARE_EFFECTIVE_CHANNEL'],
              'platform': '${{ matrix.platform }}',
              'arch': '${{ matrix.arch }}',
              'locked_inputs': locks,
          }
          canonical = json.dumps(handoff, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode('ascii') + b'\n'
          handoff_path.write_bytes(canonical)
          (root / 'handoff.json').write_bytes(canonical)
          PY
          tar -C "$out" -cf "$RUNNER_TEMP/${{ matrix.platform }}-${{ matrix.arch }}.prepared.tar" .
          key="prepared/${GITHUB_RUN_ID}/${{ matrix.platform }}-${{ matrix.arch }}.tar"
          python3 - "$RUNNER_TEMP/${{ matrix.platform }}-${{ matrix.arch }}.prepared.tar" "$key" <<'PY'
          import os, pathlib, sys
          import boto3
          archive, key = pathlib.Path(sys.argv[1]), sys.argv[2]
          boto3.client('s3', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']).upload_file(str(archive), 'chudware-releases', key)
          PY
          bytes="$(python3 - "$RUNNER_TEMP/release-request" <<'PY'
          import os, sys
          print(sum(os.path.getsize(os.path.join(root, name)) for root, _, names in os.walk(sys.argv[1]) for name in names))
          PY
          )"
          [ "$bytes" -le 10485760 ] || { echo "::error::authenticated handoff bundle exceeds 10 MiB: $bytes"; exit 1; }

      - name: Stage authenticated handoff outside Actions (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'prepared\windows-x86_64'
          $request = Join-Path $env:RUNNER_TEMP 'release-request'
          $metadata = @'
          import hashlib, json, os, pathlib, sys
          root, handoff_path = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          names = ['CMakePresets.json', 'packaging/requirements-release.txt', 'vendor/chudcode/CHUDCODE_ARTIFACT.lock',
                   'test-results.json', 'core-junit.xml', 'host-junit.xml', 'core-ctest.log', 'host-ctest.log']
          if (root / 'platform-publishers.v1.json').is_file():
              names += ['platform-publishers.v1.json', 'platform-publishers.v1.json.sig']
          handoff = {
              'schema': 'chudware-offline-handoff-v1', 'commit': os.environ['GITHUB_SHA'],
              'version': os.environ['CHUDWARE_VERSION'], 'channel': os.environ['CHUDWARE_EFFECTIVE_CHANNEL'],
              'platform': 'windows', 'arch': 'x86_64',
              'locked_inputs': [{'path': name, 'sha256': hashlib.sha256((root / name).read_bytes()).hexdigest()} for name in names],
          }
          canonical = json.dumps(handoff, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode('ascii') + b'\n'
          handoff_path.write_bytes(canonical)
          (root / 'handoff.json').write_bytes(canonical)
          '@
          & $env:CHUDWARE_RELEASE_PYTHON -c $metadata $out (Join-Path $request 'handoff.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bytes = (Get-ChildItem -LiteralPath $request -File -Recurse | Measure-Object Length -Sum).Sum
          if ($bytes -gt 10485760) { throw "Authenticated handoff request exceeds 10 MiB: $bytes" }
          $archive = Join-Path $env:RUNNER_TEMP 'windows-x86_64.prepared.tar'
          & tar.exe -C $out -cf $archive .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $upload = @'
          import os, pathlib, sys
          import boto3
          archive = pathlib.Path(sys.argv[1])
          key = "prepared/" + os.environ["GITHUB_RUN_ID"] + "/windows-x86_64.tar"
          boto3.client('s3', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']).upload_file(str(archive), 'chudware-releases', key)
          '@
          & $env:CHUDWARE_RELEASE_PYTHON -c $upload $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Upload bounded offline signing request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-signing-request-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-request
          if-no-files-found: error
          retention-days: 1

  offline-signing-boundary:
    name: Owner signs requests offline; CI has no release private key
    needs: prepare
    if: ${{ github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    environment: chudware-release-protected
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, Linux, X64, cloudcastle-ci, cc-linux-build]
    timeout-minutes: 5
    steps:
      - name: Stop at protected manual boundary
        shell: bash
        run: |
          cat <<'EOF'
          Download only the bounded offline-signing-request-* artifacts and the matching
          prepared archive from R2. Verify that the archive contains the exact canonical
          handoff.json from the bounded artifact, then verify its commit, channel, platform,
          architecture, and locked-input digests before signing the payload request. On the
          owner workstation:

            python packaging/sign_release.py payload payload-signing-request.bin \
              --encrypted-key release.key.age --identity AGE_ID --output payload.sig
            python packaging/finalize_release.py HANDOFF.tar --payload-signature payload.sig \
              --release-public-key PUB --platform PLATFORM --arch ARCH --version VERSION \
              --commit COMMIT --channel CHANNEL --handoff-metadata HANDOFF_JSON --out FINAL
          HANDOFF_JSON must be the independently reviewed canonical metadata
          from the bounded Actions request; finalization requires it to match
          the prepared archive and verifies every retained lock/result digest.
          Stable Windows/macOS additionally authenticate the retained publisher
          policy pair against the fixed release-v1 owner root.
          CHUDWARE_SIGN_IDENTITY is only a selector, never that authority.

          Linux emits FINAL/publish-bundle.v1.json and exact artifact/SBOM/provenance/
          platform-test signing requests. macOS emits an executable host-native finalize
          script and exits platform-host-required; run it on the named platform. Windows
          emits the host-native script too; it hard-requires WiX, finalizes the identical
          signed payload into both the Inno .exe and per-machine MSI, and emits
          publish-bundle.v1.json plus publish-bundle-msi.v1.json (format msi). Sign every
          request with packaging/sign_release.py using kind artifact, sbom, provenance,
          or platform-test. Upload each artifact, the shared payload sidecars, its own
          evidence JSON, and all detached signatures; register the MSI with gateway format
          msi. Stable registration and min_supported changes remain impossible in CI: this
          workflow stops here and never receives the age-encrypted release private key.
          EOF
