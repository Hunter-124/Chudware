# Commercial release pipeline with an explicit offline owner-signing boundary.
# Builders upload installer bytes only to the release staging store. GitHub Actions
# artifacts contain bounded signing requests, manifests, and evidence only.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      phase:
        description: prepare bounded requests and stop for offline owner signing
        required: true
        type: choice
        options: [prepare]
      channel:
        description: stable requires real platform credentials; unsigned targets are forced to beta
        required: true
        type: choice
        options: [beta, stable]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.phase || 'prepare' }}
  cancel-in-progress: false

jobs:
  prepare:
    # Only jobs defined in the reusable workflow are group-authorized.
    if: ${{ github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    uses: ./.github/workflows/release-prepare.yml
    with:
      channel: ${{ inputs.channel || '' }}
    secrets:
      STRIPE_SANDBOX_ENV: ${{ secrets.STRIPE_SANDBOX_ENV }}
