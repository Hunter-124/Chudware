# Commercial release pipeline with an explicit offline owner-signing boundary.
# Builders upload installer bytes only to the release staging store. GitHub Actions
# artifacts contain bounded signing requests, manifests, and evidence only.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      phase:
        description: prepare bounded requests and stop for offline owner signing
        required: true
        type: choice
        options: [prepare]
      channel:
        description: stable requires real platform credentials; unsigned targets are forced to beta
        required: true
        type: choice
        options: [beta, stable]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.phase || 'prepare' }}
  cancel-in-progress: false

env:
  CHUDWARE_RELEASE_KEY_ID: release-v1
  CHUDWARE_RELEASE_CHANNEL: ${{ inputs.channel || (contains(github.ref_name, '-') && 'beta' || 'stable') }}

jobs:
  # Live Stripe verification before a release is built.
  #
  # A desktop release is not obviously a billing artifact, so the reason this
  # gates it is worth stating: the installers carry the entitlement client, and
  # entitlements are minted from plan state that Stripe owns. Shipping a build
  # against a catalog whose price ids no longer resolve produces desktop clients
  # that cannot verify a paid plan, and the failure appears on customers'
  # machines rather than in CI.
  #
  # It also costs ~40s against a 240-minute three-platform matrix, so gating is
  # close to free. Reports NOT RUN without secrets.STRIPE_SANDBOX_ENV; see
  # .github/workflows/stripe-sandbox.yml.
  stripe-gate:
    name: Gate — live Stripe sandbox
    if: ${{ github.event_name == 'push' || inputs.phase == 'prepare' }}
    uses: ./.github/workflows/stripe-sandbox.yml
    secrets: inherit

  prepare:
    name: Prepare immutable ${{ matrix.platform }}-${{ matrix.arch }} payload
    if: ${{ github.event_name == 'push' || inputs.phase == 'prepare' }}
    # Three platforms burn hours of runner time; find out the catalog is broken
    # before committing any of it.
    needs: stripe-gate
    runs-on: [self-hosted, "${{ matrix.runner_os }}", "${{ matrix.runner_arch }}", cloudcastle-ci, "${{ matrix.runner_label }}"]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, arch: x86_64, runner_os: Linux, runner_arch: X64, runner_label: cc-linux-build, preset: linux-core, host_build_dir: host/build-linux}
          - {platform: windows, arch: x86_64, runner_os: Windows, runner_arch: X64, runner_label: cc-win-package, preset: windows-occt, host_build_dir: host/build-windows}
          - {platform: macos, arch: x86_64, runner_os: macOS, runner_arch: X64, runner_label: cc-mac-intel, preset: macos-x86_64, host_build_dir: host/build-macos-x86_64}
    env:
      CHUDWARE_SIGN_IDENTITY: ${{ secrets.CHUDWARE_SIGN_IDENTITY }}
      CHUDWARE_NOTARIZE_PROFILE: ${{ secrets.CHUDWARE_NOTARIZE_PROFILE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve honest release identity
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::invalid release version ${version}"; exit 1;
          }
          channel="${CHUDWARE_RELEASE_CHANNEL}"
          if [ "${channel}" = stable ]; then
            case "${{ matrix.platform }}" in
              windows) [ -n "${CHUDWARE_SIGN_IDENTITY:-}" ] || { echo "::error::stable Windows requires Authenticode credentials"; exit 1; } ;;
              macos) [ -n "${CHUDWARE_SIGN_IDENTITY:-}" ] && [ -n "${CHUDWARE_NOTARIZE_PROFILE:-}" ] || { echo "::error::stable macOS requires Developer ID signing and notarization credentials"; exit 1; } ;;
            esac
          fi
          if { [ "${{ matrix.platform }}" = windows ] && [ -z "${CHUDWARE_SIGN_IDENTITY:-}" ]; } || \
             { [ "${{ matrix.platform }}" = macos ] && { [ -z "${CHUDWARE_SIGN_IDENTITY:-}" ] || [ -z "${CHUDWARE_NOTARIZE_PROFILE:-}" ]; }; }; then
            channel=beta
            echo "::warning::unsigned platform build forced to beta; no SmartScreen or Gatekeeper claim is made"
          fi
          {
            echo "CHUDWARE_VERSION=${version}"
            echo "CHUDWARE_EFFECTIVE_CHANNEL=${channel}"
          } >> "$GITHUB_ENV"

      - name: Generate protected assets, configure production core and host
        shell: bash
        run: |
          set -euo pipefail
          protected_assets="${{ matrix.host_build_dir }}/generated/protected-assets"
          python3 packaging/embed_protected_assets.py --source-root . --output-dir "$protected_assets"
          cmake --preset "${{ matrix.preset }}" -DCHUDWARE_DEVELOPER_BUILD=OFF \
            -DCHUDWARE_LTO=ON \
            -DCHUDWARE_PROTECTED_ASSETS_DIR="$GITHUB_WORKSPACE/$protected_assets"
          cmake --build --preset "${{ matrix.preset }}"
          cmake -S host -B "${{ matrix.host_build_dir }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCHUDWARE_DEVELOPER_BUILD=OFF \
            -DCHUDWARE_LTO=ON \
            -DCHUDWARE_PROTECTED_ASSETS_DIR="$GITHUB_WORKSPACE/$protected_assets"
          cmake --build "${{ matrix.host_build_dir }}"
          grep -Fqx 'CHUDWARE_DEVELOPER_BUILD:BOOL=OFF' "build/${{ matrix.preset }}/CMakeCache.txt"
          grep -Fqx 'CHUDWARE_DEVELOPER_BUILD:BOOL=OFF' "${{ matrix.host_build_dir }}/CMakeCache.txt"

      - name: Exercise release tests and capture platform result
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "build/${{ matrix.preset }}/core" --output-on-failure
          ctest --test-dir "${{ matrix.host_build_dir }}" --output-on-failure
          mkdir -p "$RUNNER_TEMP/release-request"
          printf '%s\n' 'ctest core' 'ctest host' > "$RUNNER_TEMP/release-request/test-commands.txt"

      - name: Prepare immutable payload and signing request
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/prepared/${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$out" "$RUNNER_TEMP/release-request"
          case "${{ matrix.platform }}" in
            linux)
              packaging/linux/build_appimage.sh --prepare-signing \
                --key-id "$CHUDWARE_RELEASE_KEY_ID" --out "$out" \
                --protected-assets-dir "${{ matrix.host_build_dir }}/generated/protected-assets" \
                --host-bin "${{ matrix.host_build_dir }}/bin/chudware" \
                --hostd-bin "build/${{ matrix.preset }}/bin/chudware-hostd" \
                --libchudware-bin "build/${{ matrix.preset }}/bin/libchudware.so" \
                --chud-bin "$CHUDWARE_CHUD_BIN"
              ;;
            macos)
              packaging/macos/build_app.sh --prepare-signing --key-id "$CHUDWARE_RELEASE_KEY_ID" \
                --chud-bin "$CHUDWARE_CHUD_BIN" --out "$out"
              ;;
            windows)
              sidecars="$RUNNER_TEMP/release-sidecars"
              powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build_sidecars.ps1 \
                -OutputDir "$sidecars" \
                -HostBinary "${{ matrix.host_build_dir }}/bin/chudware.exe" \
                -HostdBinary "build/${{ matrix.preset }}/bin/chudware-hostd.exe"
              python -m services.installer.build_release --prepare-signing --payload-only \
                --key-id "$CHUDWARE_RELEASE_KEY_ID" --version "$CHUDWARE_VERSION" --out "$out" \
                --host-bin "${{ matrix.host_build_dir }}/bin/chudware.exe" \
                --hostd-bin "build/${{ matrix.preset }}/bin/chudware-hostd.exe" \
                --worker-bin "$sidecars/chudware-worker.exe" \
                --mcp-bin "$sidecars/chudware-mcp.exe" \
                --chud-bin "$sidecars/chud.exe" \
                --uninstall-helper-bin "${{ matrix.host_build_dir }}/bin/chudware-uninstall-helper.exe"
              ;;
          esac
          # Windows build_release emits payload-manifest.v1.preimage; the shell
          # packagers emit *.payload-signing-request.bin. This distinction was
          # accidentally lost when the Windows path was added in dbea21d0.
          if [ "${{ matrix.platform }}" = windows ]; then
            request="$out/payload-manifest.v1.preimage"
          else
            request="$(find "$out" -type f -name '*payload-signing-request.bin' -print -quit)"
          fi
          test -s "$request" || { echo '::error::payload signing request missing'; exit 1; }
          cp "$request" "$RUNNER_TEMP/release-request/payload-signing-request.bin"
          manifest="$(find "$out" -type f -name 'payload-manifest.v1.json' -print -quit)"
          test -s "$manifest" || { echo '::error::payload manifest missing'; exit 1; }
          cp "$manifest" "$RUNNER_TEMP/release-request/payload-manifest.v1.json"
          cp "$RUNNER_TEMP/release-request/test-commands.txt" "$out/test-commands.txt"
          mkdir -p "$out/packaging" "$out/vendor/chudcode"
          cp CMakePresets.json "$out/CMakePresets.json"
          cp packaging/requirements-release.txt "$out/packaging/requirements-release.txt"
          cp vendor/chudcode/CHUDCODE_ARTIFACT.lock "$out/vendor/chudcode/CHUDCODE_ARTIFACT.lock"

      - name: Stage authenticated handoff outside Actions
        shell: bash
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/prepared/${{ matrix.platform }}-${{ matrix.arch }}"
          python3 - "$out" "$RUNNER_TEMP/release-request/handoff.json" <<'PY'
          import hashlib, json, os, pathlib, sys
          root, handoff_path = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          lock_names = ('CMakePresets.json', 'packaging/requirements-release.txt', 'vendor/chudcode/CHUDCODE_ARTIFACT.lock')
          locks = [{'path': name, 'sha256': hashlib.sha256((root / name).read_bytes()).hexdigest()} for name in lock_names]
          handoff = {
              'schema': 'chudware-offline-handoff-v1',
              'commit': os.environ['GITHUB_SHA'],
              'version': os.environ['CHUDWARE_VERSION'],
              'channel': os.environ['CHUDWARE_EFFECTIVE_CHANNEL'],
              'platform': '${{ matrix.platform }}',
              'arch': '${{ matrix.arch }}',
              'locked_inputs': locks,
          }
          canonical = json.dumps(handoff, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode('ascii') + b'\n'
          handoff_path.write_bytes(canonical)
          (root / 'handoff.json').write_bytes(canonical)
          PY
          tar -C "$out" -cf "$RUNNER_TEMP/${{ matrix.platform }}-${{ matrix.arch }}.prepared.tar" .
          key="prepared/${GITHUB_RUN_ID}/${{ matrix.platform }}-${{ matrix.arch }}.tar"
          python3 - "$RUNNER_TEMP/${{ matrix.platform }}-${{ matrix.arch }}.prepared.tar" "$key" <<'PY'
          import os, pathlib, sys
          import boto3
          archive, key = pathlib.Path(sys.argv[1]), sys.argv[2]
          boto3.client('s3', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']).upload_file(str(archive), 'chudware-releases', key)
          PY
          bytes="$(python3 - "$RUNNER_TEMP/release-request" <<'PY'
          import os, sys
          print(sum(os.path.getsize(os.path.join(root, name)) for root, _, names in os.walk(sys.argv[1]) for name in names))
          PY
          )"
          [ "$bytes" -le 10485760 ] || { echo "::error::authenticated handoff bundle exceeds 10 MiB: $bytes"; exit 1; }


      - name: Upload bounded offline signing request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-signing-request-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-request
          if-no-files-found: error
          retention-days: 1

  offline-signing-boundary:
    name: Owner signs requests offline; CI has no release private key
    needs: prepare
    if: ${{ github.event_name == 'push' || inputs.phase == 'prepare' }}
    runs-on: [self-hosted, Linux, X64, cloudcastle-ci, cc-linux-build]
    timeout-minutes: 5
    steps:
      - name: Stop at protected manual boundary
        shell: bash
        run: |
          cat <<'EOF'
          Download only the bounded offline-signing-request-* artifacts and the matching
          prepared archive from R2. Verify that the archive contains the exact canonical
          handoff.json from the bounded artifact, then verify its commit, channel, platform,
          architecture, and locked-input digests before signing the payload request. On the
          owner workstation:

            python packaging/sign_release.py payload payload-signing-request.bin \
              --encrypted-key release.key.age --identity AGE_ID --output payload.sig
            python packaging/finalize_release.py HANDOFF.tar --payload-signature payload.sig \
              --release-public-key PUB --platform PLATFORM --arch ARCH --version VERSION \
              --commit COMMIT --channel CHANNEL --locked-input CMakePresets.json \
              --locked-input packaging/requirements-release.txt \
              --locked-input vendor/chudcode/CHUDCODE_ARTIFACT.lock --command 'ctest core' \
              --command 'ctest host' --out FINAL

          Linux emits FINAL/publish-bundle.v1.json and exact artifact/SBOM/provenance/
          platform-test signing requests. macOS emits an executable host-native finalize
          script and exits platform-host-required; run it on the named platform. Windows
          emits the host-native script too; it hard-requires WiX, finalizes the identical
          signed payload into both the Inno .exe and per-machine MSI, and emits
          publish-bundle.v1.json plus publish-bundle-msi.v1.json (format msi). Sign every
          request with packaging/sign_release.py using kind artifact, sbom, provenance,
          or platform-test. Upload each artifact, the shared payload sidecars, its own
          evidence JSON, and all detached signatures; register the MSI with gateway format
          msi. Stable registration and min_supported changes remain impossible in CI: this
          workflow stops here and never receives the age-encrypted release private key.
          EOF
