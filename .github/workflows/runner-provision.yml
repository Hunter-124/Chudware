# One-shot / on-demand provisioning for the self-hosted Windows packaging runner.
# The nightly windows-beta job fails loudly when a prerequisite is missing; this
# workflow installs them (user-level, no system-wide changes beyond Inno Setup)
# and prints a capability report at the end. Safe to re-run: every step is
# idempotent and skips anything already present.
# NOTE: steps run under Windows PowerShell 5.1 — ASCII only, no ternary.
name: runner-provision

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: windows runner label set to provision
        required: true
        type: choice
        options: [cc-win-package]

permissions:
  contents: read

jobs:
  provision-windows:
    name: Provision Windows packaging runner
    runs-on: [self-hosted, Windows, X64, cloudcastle-ci, "${{ inputs.runner_label }}"]
    timeout-minutes: 60
    steps:
      - name: Install Bun if missing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = Get-Command bun -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "bun already present: $(bun --version)"
          } else {
            Write-Host "installing bun user-level..."
            powershell -NoProfile -ExecutionPolicy Bypass -Command "irm bun.sh/install.ps1 | iex"
            $bunBin = Join-Path $env:USERPROFILE '.bun\bin'
            $bunExe = Join-Path $bunBin 'bun.exe'
            if (-not (Test-Path $bunExe)) { throw "bun install completed but $bunExe is missing" }
            # Persist for future runs: the runner service reads its PATH at
            # service start, so write the user PATH durably.
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            if ($userPath -notlike "*$bunBin*") {
              [Environment]::SetEnvironmentVariable('Path', "$userPath;$bunBin", 'User')
            }
            Add-Content $env:GITHUB_PATH $bunBin
            Write-Host "bun installed to $bunBin and persisted to user PATH"
          }

      - name: Install Inno Setup 6 if missing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $isccPath = Join-Path $pf86 'Inno Setup 6\ISCC.exe'
          if ((Get-Command iscc -ErrorAction SilentlyContinue) -or (Test-Path $isccPath)) {
            Write-Host "Inno Setup already present"
          } else {
            $done = $false
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              Write-Host "installing Inno Setup via winget..."
              winget install --id JRSoftware.InnoSetup -e --accept-source-agreements --accept-package-agreements --silent
              if (Test-Path $isccPath) { $done = $true }
            }
            if (-not $done) {
              Write-Host "winget unavailable or failed; downloading installer..."
              $tmp = Join-Path $env:TEMP 'innosetup-6.exe'
              Invoke-WebRequest -Uri 'https://jrsoftware.org/download.php/is.exe' -OutFile $tmp
              & $tmp /VERYSILENT /NORESTART | Out-Null
            }
            if (-not (Test-Path $isccPath)) { throw "Inno Setup install failed: $isccPath missing" }
            Add-Content $env:GITHUB_PATH (Split-Path $isccPath)
            Write-Host "Inno Setup installed at $isccPath"
          }

      - name: Capability report
        shell: powershell
        run: |
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $isccPath = Join-Path $pf86 'Inno Setup 6\ISCC.exe'
          $vswhere = Join-Path $pf86 'Microsoft Visual Studio\Installer\vswhere.exe'
          $bunCmd = Get-Command bun -ErrorAction SilentlyContinue
          if ($bunCmd) { $bunVer = bun --version } else { $bunVer = 'MISSING' }
          $hasIscc = Test-Path $isccPath
          if (Test-Path $vswhere) { $vsName = (& $vswhere -latest -property displayName) -join ', ' } else { $vsName = 'MISSING' }
          Write-Host "bun: $bunVer"
          Write-Host "Inno Setup 6 present: $hasIscc"
          Write-Host "Visual Studio: $vsName"
          if ($bunVer -eq 'MISSING' -or -not $hasIscc -or $vsName -eq 'MISSING') { exit 1 }
