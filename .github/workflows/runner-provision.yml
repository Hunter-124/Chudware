# One-shot / on-demand provisioning for the self-hosted packaging runners.
# The nightly windows-beta and macos-beta jobs fail loudly when a prerequisite
# is missing; this workflow installs them and prints a capability report at the
# end. Safe to re-run: every step is idempotent and skips anything already
# present.
#
# Runner realities: the Windows service runs as its own non-administrator
# virtual account (NT SERVICE\actions.runner.Hunter-124-CAD.ryzen-7900x3d), so
# Program Files is off-limits. Everything lands under %USERPROFILE%\chudware-ci-tools,
# which is that account's private D:\ChudwareCI\Windows\profile (the nightly
# prepends its bin\ dir to PATH itself, so no service restart is
# needed). Inno Setup's installer needs admin, so we unpack it with innounp
# instead of executing it. Steps run under Windows PowerShell 5.1: ASCII only,
# no ternary.
#
# The Macs (imac-intel, macbook-air-m2) carry the Command Line Tools only, no
# full Xcode, so nothing here may reach for xcodebuild. Their step bodies are
# bash 3.2: no associative arrays, no mapfile, no ${var^^}, and string
# accumulators instead of arrays, because expanding an empty array under
# `set -u` is an unbound-variable error before bash 4.4. Homebrew is the only
# unattended install path on macOS and it cannot install itself in CI (its
# installer needs an interactive sudo), so a Mac without brew is reported as a
# manual job rather than silently half-provisioned.
name: runner-provision

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: runner label set to provision (cc-win-*, cc-mac-* or cc-linux-build)
        required: true
        type: choice
        options: [cc-win-package, cc-mac-intel, cc-mac-arm, cc-linux-build]

permissions:
  contents: read

concurrency:
  # Per label: provisioning imac-intel must not queue behind ryzen-7900x3d, but
  # two dispatches at the same runner would fight over the same tools dir.
  group: runner-provision-${{ inputs.runner_label }}
  cancel-in-progress: false

jobs:
  provision-windows:
    name: Provision Windows packaging runner
    # The label choice selects the platform; the other job would otherwise queue
    # against a runner set that can never match and sit there until GitHub
    # fails it 24 hours later.
    if: ${{ (github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')) && (startsWith(inputs.runner_label, 'cc-win-')) }}
    environment: chudware-release-protected
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, Windows, X64, cloudcastle-ci, "${{ inputs.runner_label }}"]
    timeout-minutes: 60
    steps:

      - name: Unpack Inno Setup 6 (no admin needed)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:USERPROFILE 'chudware-ci-tools'
          $innoDir = Join-Path $tools 'innosetup'
          $iscc = Join-Path $innoDir 'ISCC.exe'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $cache = Join-Path $tools 'bootstrap-archives'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $isexe = Join-Path $cache 'innosetup-6.7.3.exe'
          $innounpZip = Join-Path $cache 'innounp-ui_2_2_13.zip'
          # Primary digests: GitHub release APIs for jrsoftware/issrc is-6_7_3
          # and jrathlev/InnoUnpacker-Windows-GUI ui_2_2_13.
          if (-not (Test-Path $isexe)) {
            Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $isexe
          }
          if ((Get-FileHash -Algorithm SHA256 $isexe).Hash.ToLowerInvariant() -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Inno Setup archive SHA-256 mismatch; refusing extraction'
          }
          if (-not (Test-Path $innounpZip)) {
            Invoke-WebRequest -Uri 'https://github.com/jrathlev/InnoUnpacker-Windows-GUI/releases/download/ui_2_2_13/innounp-2.zip' -OutFile $innounpZip
          }
          if ((Get-FileHash -Algorithm SHA256 $innounpZip).Hash.ToLowerInvariant() -ne 'f2f037fdbc63de31248efae9ccb294398d160dc0cbad5f36d14c2f159e17bbf5') {
            throw 'innounp archive SHA-256 mismatch; refusing extraction/execution'
          }
          $work = Join-Path $env:RUNNER_TEMP ("inno-authenticated-" + [Guid]::NewGuid().ToString('N'))
          $innounpDir = Join-Path $work 'innounp'
          $payload = Join-Path $work 'payload'
          Expand-Archive $innounpZip $innounpDir
          $extractors = @(Get-ChildItem $innounpDir -Recurse -Filter innounp.exe)
          if ($extractors.Count -ne 1) { throw 'Expected exactly one authenticated innounp.exe' }
          & $extractors[0].FullName -x -y -d"$payload" $isexe | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "innounp extraction failed ($LASTEXITCODE)" }
          $compilers = @(Get-ChildItem $payload -Recurse -Filter ISCC.exe)
          if ($compilers.Count -ne 1) { throw 'Expected exactly one authenticated ISCC.exe' }
          # Do not retain unchecked files from an earlier tool installation.
          if (Test-Path $innoDir) { Remove-Item $innoDir -Recurse -Force }
          Copy-Item (Split-Path $compilers[0].FullName) $innoDir -Recurse
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe missing after authenticated provisioning' }
          Remove-Item $work -Recurse -Force
          Write-Host "Authenticated Inno Setup unpacked to $innoDir"

      - name: Capability report
        shell: powershell
        run: |
          $tools = Join-Path $env:USERPROFILE 'chudware-ci-tools'
          $iscc = Join-Path $tools 'innosetup\ISCC.exe'
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $hasIscc = Test-Path $iscc
          if (Test-Path $vswhere) { $vsName = (& $vswhere -latest -property displayName) -join ', ' } else { $vsName = 'MISSING' }
          Write-Host "Inno Setup 6 (portable): $hasIscc"
          Write-Host "Visual Studio: $vsName"
          if (-not $hasIscc -or $vsName -eq 'MISSING') { exit 1 }

  provision-macos:
    name: Provision macOS packaging runner
    if: ${{ (github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')) && (startsWith(inputs.runner_label, 'cc-mac-')) }}
    environment: chudware-release-protected
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, macOS, cloudcastle-ci, "${{ inputs.runner_label }}"]
    timeout-minutes: 90
    env:
      # cmake/ninja because the macos-* presets build with Ninja; python@3.13
      # because macOS ships 3.9.6 and Nuitka needs 3.11+; opencascade because
      # ProvisionOCCT.cmake downloads nothing off Windows and find_package()s a
      # system OCCT from the preset's brew CMAKE_PREFIX_PATH.
      MACOS_FORMULAE: cmake ninja python@3.13 opencascade
      # Same convention as the Windows runners: a runner-owned tools directory,
      # because the release Python is a venv (Homebrew's interpreter is
      # externally managed and refuses a direct pip install), and macos-beta
      # looks here first when it picks its release interpreter.
      RELEASE_VENV_SUBDIR: chudware-ci-tools/release-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false


      - name: Install the Homebrew formulae the release build needs
        shell: bash
        run: |
          set -euo pipefail
          for dir in /opt/homebrew/bin /usr/local/bin; do
            if [ -d "${dir}" ]; then PATH="${dir}:${PATH}"; fi
          done
          export PATH

          if ! command -v brew >/dev/null 2>&1; then
            echo "::error::this Mac has no Homebrew, and CI cannot install it unattended: the installer needs an interactive sudo. Install it by hand from https://brew.sh as the login user, then re-run this workflow. cmake, ninja, python@3.13 and opencascade all come from brew, and the macos-* presets find OCCT through the brew prefix."
            exit 1
          fi
          prefix="$(brew --prefix)"
          echo "brew=$(brew --version | head -n 1) prefix=${prefix}"

          # Idempotent by construction: an already-installed formula is left
          # exactly as it is. This job repairs a gap, it does not upgrade a
          # working builder underneath a running release.
          for formula in ${MACOS_FORMULAE}; do
            if brew list --versions "${formula}" >/dev/null 2>&1; then
              echo "present: $(brew list --versions "${formula}")"
            else
              echo "installing: ${formula}"
              brew install "${formula}"
            fi
          done

      - name: Provision authenticated complete release Python
        shell: bash
        run: |
          set -euo pipefail
          # These nonsecret inputs come from the attested runner image, not an
          # existing venv or a public package-index resolver.
          : "${CHUDWARE_CI_BASE_PYTHON:?image-qualified base Python is required}"
          : "${CHUDWARE_WHEELHOUSE:?reviewed complete offline wheelhouse is required}"
          case "${CHUDWARE_CI_BASE_PYTHON}" in
            /*) ;; *) echo '::error::base Python must be an absolute image-qualified path'; exit 1 ;;
          esac
          case "${CHUDWARE_WHEELHOUSE}" in
            /*) ;; *) echo '::error::wheelhouse must be an absolute reviewed path'; exit 1 ;;
          esac
          while IFS= read -r variable; do
            case "${variable}" in PYTHON*|LD_*|DYLD_*) unset "${variable}" ;; esac
          done < <(compgen -e)
          venv="${HOME}/${RELEASE_VENV_SUBDIR}"
          VENV_DIR="${venv}" PYTHON="${CHUDWARE_CI_BASE_PYTHON}" \
            bash scripts/provision_venv.sh
          # The complete reviewed target must include applicable packaging
          # requirements as authenticated wheels before sidecar compilation.
          "${CHUDWARE_CI_BASE_PYTHON}" -I -S -c \
            'import sys; sys.path.insert(0, sys.argv[1]); from services.installer.provision import main; sys.exit(main(sys.argv[2:]))' \
            "${PWD}" --check-inputs --venv-dir "${venv}" \
            --base-python "${CHUDWARE_CI_BASE_PYTHON}" --wheelhouse "${CHUDWARE_WHEELHOUSE}"
          echo "authenticated release python: ${venv}/bin/python"

      - name: Provision the CEF SDK
        shell: bash
        run: |
          set -euo pipefail
          # The release consumer reauthenticates the same exact pinned archive
          # into its own run directory immediately before CMake.
          bash scripts/fetch_cef_posix.sh

      - name: Capability report
        shell: bash
        run: |
          set -uo pipefail
          for dir in /opt/homebrew/bin /usr/local/bin; do
            if [ -d "${dir}" ]; then PATH="${dir}:${PATH}"; fi
          done
          export PATH

          # String accumulator, not an array: bash 3.2 treats an empty array
          # expansion under `set -u` as an unbound variable.
          missing=""
          report() {  # report <label> <value-or-MISSING>
            printf '%-22s %s\n' "$1" "$2"
            if [ "$2" = MISSING ]; then missing="${missing} $1"; fi
          }

          sw_vers
          for tool in cmake ninja ctest git curl tar zip rsync scp ssh \
            clang xcrun xcode-select ditto otool install_name_tool plutil codesign; do
            if command -v "${tool}" >/dev/null 2>&1; then
              report "${tool}" "$(command -v "${tool}")"
            else
              report "${tool}" MISSING
            fi
          done

          if xcode-select -p >/dev/null 2>&1; then
            report command-line-tools "$(xcode-select -p)"
            clang --version | head -n 1
          else
            report command-line-tools MISSING
          fi

          if command -v brew >/dev/null 2>&1; then
            report homebrew "$(brew --prefix)"
            if brew list --versions opencascade >/dev/null 2>&1; then
              report opencascade "$(brew list --versions opencascade)"
            else
              report opencascade MISSING
            fi
          else
            report homebrew MISSING
            report opencascade MISSING
          fi

          venv="${HOME}/${RELEASE_VENV_SUBDIR}"
          if [ -x "${venv}/bin/python3" ] \
            && "${venv}/bin/python3" -c 'import cryptography, nuitka' >/dev/null 2>&1; then
            report release-python "${venv}/bin/python3 ($("${venv}/bin/python3" --version 2>&1))"
          else
            report release-python MISSING
          fi

          if [ -n "${missing}" ]; then
            echo "::error::${RUNNER_NAME:-unknown} is still missing:${missing}"
            exit 1
          fi
          echo "capability report: complete for macos-beta"

  provision-linux:
    name: Provision Linux release runner
    if: ${{ (github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')) && (inputs.runner_label == 'cc-linux-build') }}
    environment: chudware-release-protected
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, Linux, X64, cloudcastle-ci, cc-linux-build]
    timeout-minutes: 60
    env:
      # nightly-release's linux-beta job packages the verified AppDir as a .deb and an
      # .rpm (packaging/linux/build_linux_packages.sh). rpmbuild builds the .rpm; xz
      # compresses the deb's data.tar.xz. The .deb needs no dpkg tooling at all — the ar
      # archive and its control tarball are written directly — which is why this list is
      # two entries and not a Debian toolchain.
      #
      # Package names differ by distribution: Fedora/RHEL call them rpm-build and xz,
      # Debian/Ubuntu call them rpm and xz-utils. Both are listed and the step installs
      # whichever set matches the package manager it finds.
      LINUX_PACKAGES_DNF: rpm-build xz
      LINUX_PACKAGES_APT: rpm xz-utils
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install the distro packages the release packaging needs
        shell: bash
        run: |
          set -euo pipefail
          # Idempotent by construction: if both binaries already resolve, this step does
          # nothing and never touches a working builder underneath a running release.
          if command -v rpmbuild >/dev/null 2>&1 && command -v xz >/dev/null 2>&1; then
            echo "rpmbuild: $(command -v rpmbuild) ($(rpmbuild --version))"
            echo "xz:       $(command -v xz) ($(xz --version | head -n 1))"
            exit 0
          fi

          manager=""
          packages=""
          if command -v dnf >/dev/null 2>&1; then
            manager=dnf
            packages="${LINUX_PACKAGES_DNF}"
          elif command -v apt-get >/dev/null 2>&1; then
            manager=apt-get
            packages="${LINUX_PACKAGES_APT}"
          else
            echo "::error::${RUNNER_NAME:-unknown} has neither dnf nor apt-get, so CI cannot install rpmbuild and xz unattended. Install them by hand with this host's package manager and re-run this workflow."
            exit 1
          fi

          # A system package install needs root. Passwordless sudo is the only
          # unattended path, and this is the same call the job would make anyway, so ask
          # before installing rather than half-way through: `sudo -n true` fails
          # immediately when sudo would prompt.
          if ! sudo -n true >/dev/null 2>&1; then
            echo "::error::${RUNNER_NAME:-unknown} has no passwordless sudo, so CI cannot install ${packages} unattended. Run 'sudo ${manager} install -y ${packages}' on the qualified protected host, then re-run this workflow. Nightly release requires .deb and .rpm tools and fails before publication when they are missing."
            exit 1
          fi

          echo "installing with ${manager}: ${packages}"
          if [ "${manager}" = dnf ]; then
            sudo -n dnf install -y ${packages}
          else
            sudo -n apt-get update
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y ${packages}
          fi

          for tool in rpmbuild xz; do
            command -v "${tool}" >/dev/null 2>&1 || {
              echo "::error::${manager} reported success but ${tool} is still not on PATH"; exit 1; }
          done
          echo "rpmbuild: $(rpmbuild --version)"
          echo "xz:       $(xz --version | head -n 1)"

      - name: Provision authenticated complete release Python
        shell: bash
        run: |
          set -euo pipefail
          : "${CHUDWARE_CI_BASE_PYTHON:?image-qualified base Python is required}"
          : "${CHUDWARE_WHEELHOUSE:?reviewed complete offline wheelhouse is required}"
          case "${CHUDWARE_CI_BASE_PYTHON}" in
            /*) ;; *) echo '::error::base Python must be an absolute image-qualified path'; exit 1 ;;
          esac
          case "${CHUDWARE_WHEELHOUSE}" in
            /*) ;; *) echo '::error::wheelhouse must be an absolute reviewed path'; exit 1 ;;
          esac
          while IFS= read -r variable; do
            case "${variable}" in PYTHON*|LD_*|DYLD_*) unset "${variable}" ;; esac
          done < <(compgen -e)
          venv="${HOME}/chudware-ci-tools/release-python"
          # Authenticate every wheel before any venv mutation. An unverified
          # existing venv is preserved and requires explicit approved replacement.
          VENV_DIR="${venv}" PYTHON="${CHUDWARE_CI_BASE_PYTHON}" \
            bash scripts/provision_venv.sh
          "${CHUDWARE_CI_BASE_PYTHON}" -I -S -c \
            'import sys; sys.path.insert(0, sys.argv[1]); from services.installer.provision import main; sys.exit(main(sys.argv[2:]))' \
            "${PWD}" --check-inputs --venv-dir "${venv}" \
            --base-python "${CHUDWARE_CI_BASE_PYTHON}" --wheelhouse "${CHUDWARE_WHEELHOUSE}"
          echo "authenticated release python: ${venv}/bin/python"

      - name: Capability report
        shell: bash
        run: |
          set -uo pipefail
          venv="${HOME}/chudware-ci-tools/release-python/bin/python3"
          missing=0
          # Native .deb/.rpm outputs are required, not best-effort omissions.
          # Report missing capabilities during qualification, before a long
          # release job reaches its mandatory package/evidence/signature gates.
          for tool in cmake ninja ctest xvfb-run rsync strip rpmbuild xz; do
            if command -v "${tool}" >/dev/null 2>&1; then
              printf '%-22s %s\n' "${tool}" "$(command -v "${tool}")"
            else
              printf '%-22s %s\n' "${tool}" MISSING; missing=1
            fi
          done
          if [ -x "${venv}" ]; then
            printf '%-22s %s\n' release-python "$("${venv}" --version)"
          else
            printf '%-22s %s\n' release-python MISSING; missing=1
          fi
          if ls -d "${HOME}"/chudware-cef-sdk/cef_binary_* >/dev/null 2>&1; then
            printf '%-22s %s\n' cef-sdk "$(ls -d "${HOME}"/chudware-cef-sdk/cef_binary_* | head -1)"
          else
            printf '%-22s %s\n' cef-sdk MISSING; missing=1
          fi
          [ "${missing}" -eq 0 ] || { echo "::error::provisioning incomplete"; exit 1; }
          echo "capability report: complete for linux-beta"
