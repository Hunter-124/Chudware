# Daily capability probe over the whole self-hosted fleet, plus the unattended
# provisioning path that repairs what it finds.
#
# Every other workflow assumes its runner still has a toolchain. When that stops
# being true — a re-image, an OS upgrade that resets xcode-select, a full disk,
# a service that never came back after a reboot — nothing notices until a gate
# or a release fails, hours or weeks later, with an error that names a compile
# step rather than the machine. This runs once a day and names the machine.
#
# The probe publishes nothing and uploads nothing. On a builder it compiles,
# links, runs and ctests a one-file C++ project in RUNNER_TEMP, because a
# toolchain that answers --version but cannot link is the failure that matters.
# A control endpoint is never asked to compile, so the probe stays safe on
# cloudcastle-server, which is simultaneously the artifact host and the
# production control box and is therefore the endpoint whose disappearance
# costs the most.
#
# Expectations are ROLE-AWARE, because a uniform one was permanently red. A
# builder must have a compiler, cmake, ninja, ctest, a Python new enough for
# scripts/check.py, and room to link. A control/publish endpoint
# (cc-prod-control, cc-artifact-host, cc-infra-webservice) needs git and python
# and nothing else — demanding cmake there does not describe a fault, it
# describes a machine doing its job.
#
# Endpoints that share hardware with another product's CI declare an isolation
# contract in their fleet row, and the probe asserts it against the live job:
# ryzen-7900x3d's private non-admin service identity and D:\ChudwareCI\Windows
# profile/work/temp/cache namespace, chudware-ryzen-linux's dedicated WSL
# utility VM, runner account and ext4 root, and the private Mac test accounts'
# (imac-intel-chudware-test, macbook-air-m2-chudware-test) hidden
# ccci-chudware account, native (non-Rosetta, non-VM) architecture, 0700
# /Library/CloudCastleCI home, exported lane identity and compiler caps, and
# read-only use of the operator-owned Homebrew prefix. A contract the job does
# not satisfy is a red row, never a warning.
#
# The provisioning job runs on workflow_dispatch only, never on the cron. It
# installs, unelevated and idempotently, exactly what the probe is allowed to
# demand, and the probe then runs behind it in the same dispatch — so one
# manual run repairs the fleet and proves the repair in its own log. A private
# Mac test account is never provisioned here: it only CHECKS the Homebrew
# formulae the operator lane (cc-mac-intel, the Homebrew owner) installs.
#
# The matrix is resolved at run time from the runners API, mirroring
# CloudCastle's macOS smoke: an endpoint that is asleep is reported as
# unscheduled in the summary instead of queueing a row that hangs until its
# timeout. Provisioning rows come from the same inventory, so an offline
# endpoint is never queued for provisioning either. This repository has no
# CI_RUNNER_ADMIN_TOKEN secret, so the inventory step degrades to scheduling
# the registered fleet and saying so — a missing PAT must never turn the daily
# smoke into a failed run. That fallback list is the REGISTERED fleet and
# nothing else: dell-optiplex-7040 was de-registered (docs/reference/
# CI_RUNNERS.md) and listing it here queued a row that no runner could ever
# claim, so every fallback run hung in the queue. For the same reason the
# fallback also leaves out rows marked `may_be_offline` (the M2, usually
# offline), whose queued row would otherwise hold every daily run open for
# GitHub's 24-hour queue limit; dispatching its runner_label probes it.
#
# A dispatch can name one runner_label instead of `all`. Only that endpoint is
# provisioned and probed, so a newly isolated runner is qualified without
# queueing rows for unrelated (or offline) hardware. A targeted row also omits
# the cloudcastle-ci pool label: a runner is promoted into that pool only AFTER
# this run qualifies it, so requiring the pool label would make qualification
# impossible. The unique runner label still pins the row to exactly one
# endpoint. A runner registered with only its `-bootstrap` label (the private
# Mac test accounts, before the operator adds their routing labels) is
# qualified by dispatching that bootstrap label; its row keeps the literal
# self-hosted, platform and architecture labels. A row marked
# `registered:false` (macbook-air-m2-chudware-test until the account is
# provisioned natively on the physical M2) is reachable only by such a targeted
# dispatch: a fleet run reports it as pending instead of queueing a row no
# runner can claim. Drop the marker once the runner has registered.
#
# Rows are self-hosted by construction: every runs-on array carries a literal
# self-hosted label, so no computed row can ever land on a metered
# GitHub-hosted runner. Fleet rows (cron, or a dispatch for `all`) also carry
# cloudcastle-ci through matrix.pool_label.
name: runner-smoke

on:
  schedule:
    # 09:17 UTC daily. Off the hour so it does not collide with every other
    # cron on the fleet.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      runner_label:
        description: Endpoint to provision and probe (all = the registered fleet)
        type: choice
        required: true
        default: all
        options:
          - all
          - cc-linux-livingroom
          - cc-linux-hunter
          - cc-prod-control
          - cc-linux-chudware
          - cc-win-ryzen
          - cc-mac-intel
          - cc-mac-chudware-intel
          - cc-mac-chudware-intel-bootstrap
          - cc-mac-chudware-gate-intel
          - cc-mac-chudware-gate-intel-bootstrap
          - cc-mac-arm
          - cc-mac-chudware-arm
          - cc-mac-chudware-arm-bootstrap

permissions:
  contents: read

# Never cancel a smoke: an operator is usually watching this exact run, and the
# provisioning job mutates hosts — a half-killed brew or MSI is worse than a
# slow queue.
concurrency:
  group: runner-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runner-inventory:
    name: Resolve online fleet capacity
    if: ${{ github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    environment: chudware-control-protected
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, Linux, X64, cloudcastle-ci, cc-linux-livingroom]
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
      provision_matrix: ${{ steps.inventory.outputs.provision_matrix }}
      provision_count: ${{ steps.inventory.outputs.provision_count }}
    steps:
      - id: inventory
        name: Schedule only endpoints the runners API reports online
        shell: bash
        env:
          # Absent on this repository today. The step below is written so that
          # absence is a documented degradation, not a failure.
          RUNNER_ADMIN_TOKEN: ${{ secrets.CI_RUNNER_ADMIN_TOKEN }}
          # Empty on the cron, which therefore always probes the whole fleet.
          TARGET: ${{ inputs.runner_label }}
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::runner ${RUNNER_NAME:-unknown} has no jq; the inventory cannot be built"
            exit 1
          fi

          # The registered fleet, one row per endpoint, keyed by the
          # runner-unique label so two endpoints never contend for one row.
          # `role` decides what the probe is entitled to demand: a builder
          # compiles, a control endpoint publishes and operates. `provision`
          # marks the endpoints the dispatch-only provision job knows how to
          # repair. The isolation fields are the contract the probe asserts on
          # hardware shared with another product's CI. This list must stay
          # identical to the table in docs/reference/CI_RUNNERS.md —
          # de-registered hardware here queues a row nothing can claim.
          fleet=$(jq -cn '[
            {label:"livingroom-pc",        runner_os:"Linux",  runner_arch:"X64",   runner_label:"cc-linux-livingroom", role:"control", provision:false},
            {label:"hunter-workstation",   runner_os:"Linux",  runner_arch:"X64",   runner_label:"cc-linux-hunter",     role:"builder", provision:false},
            {label:"cloudcastle-server",   runner_os:"Linux",  runner_arch:"X64",   runner_label:"cc-prod-control",     role:"control", provision:false},
            {label:"chudware-ryzen-linux", runner_os:"Linux",  runner_arch:"X64",   runner_label:"cc-linux-chudware",   role:"builder", provision:false,
             linux_user:"ccci-chudware", runner_root:"/opt/actions-runner-chudware", product:"Chudware"},
            {label:"ryzen-7900x3d",        runner_os:"Windows",runner_arch:"X64",   runner_label:"cc-win-ryzen",        role:"builder", provision:true,
             service_account:"NT SERVICE\\actions.runner.Hunter-124-CAD.ryzen-7900x3d",
             service_sid:"S-1-5-80-1193026161-3971065153-2732555818-2173988348-3783229323",
             ci_root:"D:\\ChudwareCI\\Windows",
             sibling_namespaces:"D:\\CloudCastleCI\\Windows\\cc;D:\\ChudcodeCI\\Windows"},
            {label:"imac-intel",           runner_os:"macOS",  runner_arch:"X64",   runner_label:"cc-mac-intel",        role:"builder", provision:true},
            {label:"imac-intel-chudware-test", runner_os:"macOS", runner_arch:"X64", runner_label:"cc-mac-chudware-intel", role:"builder", provision:false,
             bootstrap_label:"cc-mac-chudware-intel-bootstrap",
             mac_user:"ccci-chudware", ci_home:"/Library/CloudCastleCI/ccci-chudware",
             runner_root:"/Library/CloudCastleCI/ccci-chudware/actions-runner", product:"Chudware"},
            {label:"imac-intel-chudware-gate-test", runner_os:"macOS", runner_arch:"X64", runner_label:"cc-mac-chudware-gate-intel", role:"builder", provision:false,
             bootstrap_label:"cc-mac-chudware-gate-intel-bootstrap",
             mac_user:"ccci-chudware-gate", ci_home:"/Library/CloudCastleCI/ccci-chudware-gate",
             runner_root:"/Library/CloudCastleCI/ccci-chudware-gate/actions-runner-gate", product:"Chudware"},
            {label:"macbook-air-m2",       runner_os:"macOS",  runner_arch:"ARM64", runner_label:"cc-mac-arm",          role:"builder", provision:true, may_be_offline:true},
            {label:"macbook-air-m2-chudware-test", runner_os:"macOS", runner_arch:"ARM64", runner_label:"cc-mac-chudware-arm", role:"builder", provision:false,
             bootstrap_label:"cc-mac-chudware-arm-bootstrap", registered:false,
             mac_user:"ccci-chudware", ci_home:"/Library/CloudCastleCI/ccci-chudware",
             runner_root:"/Library/CloudCastleCI/ccci-chudware/actions-runner", product:"Chudware"}
          ] | map(. + {pool_label:"cloudcastle-ci"})')

          target="${TARGET:-all}"
          if [ "${target}" != all ]; then
            # Qualification of one endpoint: drop every other row, and route by
            # the unique label alone (see the header for why the pool label is
            # omitted here). A row's bootstrap label targets the same endpoint
            # before its routing labels exist.
            fleet=$(printf '%s' "$fleet" | jq -c --arg t "${target}" '[.[] | select(.runner_label == $t or .bootstrap_label == $t) | .runner_label = $t | .pool_label = $t]')
            if [ "$(printf '%s' "$fleet" | jq 'length')" -ne 1 ]; then
              echo "::error::runner_label ${target} names no registered fleet endpoint"
              exit 1
            fi
            printf '### Target\n\n- dispatch restricted to `%s`; cloudcastle-ci is not required on this row\n\n' "${target}" >> "$GITHUB_STEP_SUMMARY"
          else
            # Not-yet-registered rows never join a fleet run: no runner could
            # claim them, so the run would hang on them instead of reporting.
            pending=$(printf '%s' "$fleet" | jq -r '.[] | select(.registered == false) | "- \(.label) (`\(.runner_label)`): **not scheduled** — pending native provisioning on its physical Mac; qualify it by dispatching `\(.bootstrap_label)` once registered"')
            fleet=$(printf '%s' "$fleet" | jq -c '[.[] | select(.registered != false)]')
            if [ -n "${pending}" ]; then
              printf '### Pending registration\n\n%s\n\n' "${pending}" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          emit() {
            local provision
            provision=$(printf '%s' "$1" | jq -c '[.[] | select(.provision)]')
            {
              printf 'matrix=%s\n' "$(jq -cn --argjson s "$1" '{include:$s}')"
              printf 'provision_matrix=%s\n' "$(jq -cn --argjson p "${provision}" '{include:$p}')"
              printf 'provision_count=%s\n' "$(printf '%s' "${provision}" | jq 'length')"
            } >> "$GITHUB_OUTPUT"
          }

          # Without the inventory nothing knows what is online. A row for an
          # offline endpoint never starts, so timeout-minutes never applies and
          # it waits in the queue for GitHub's 24-hour limit, holding the run
          # open. Rows for hardware that is routinely offline (the M2) are
          # therefore left out of an unconfirmed fleet run; dispatching their
          # runner_label still queues them deliberately.
          schedule_everything() {
            local skipped=''
            if [ "${target}" = all ]; then
              skipped=$(printf '%s' "$fleet" | jq -r '.[] | select(.may_be_offline) | "- \(.label) (`\(.runner_label)`): **not scheduled** — online status unknown and this endpoint is often offline; dispatch runner_label=\(.runner_label) to probe it"')
              fleet=$(printf '%s' "$fleet" | jq -c '[.[] | select(.may_be_offline | not)]')
            fi
            echo "::warning title=Fleet inventory unavailable::$1; every other selected endpoint will be queued, and an offline one waits in the queue until it returns or GitHub drops the job"
            printf '### Fleet inventory\n\n- **all %s selected endpoints queued** — %s\n' \
              "$(printf '%s' "$fleet" | jq 'length')" "$1" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${skipped}" ]; then
              printf '%s\n' "${skipped}" >> "$GITHUB_STEP_SUMMARY"
            fi
            emit "$fleet"
          }

          if [ -z "${RUNNER_ADMIN_TOKEN:-}" ]; then
            schedule_everything "CI_RUNNER_ADMIN_TOKEN is not configured on this repository, so online status cannot be confirmed"
            exit 0
          fi

          runners=$(curl -sS --fail --max-time 30 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RUNNER_ADMIN_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100") || runners=""

          if [ -z "$runners" ] || ! printf '%s' "$runners" | jq -e '.runners' >/dev/null 2>&1; then
            schedule_everything "the runners API was unavailable or the token lacks Administration:read"
            exit 0
          fi

          online=$(printf '%s' "$runners" | jq -c '[.runners[] | select(.status == "online") | .labels[].name] | unique')
          scheduled=$(printf '%s' "$fleet" | jq -c --argjson online "$online" '[.[] | select(.runner_label as $l | $online | index($l))]')
          offline=$(printf '%s' "$fleet" | jq -r --argjson online "$online" '.[] | select(.runner_label as $l | $online | index($l) | not) | .label')

          {
            echo '### Fleet inventory'
            echo
            printf '%s' "$scheduled" | jq -r '.[] | "- \(.label) (`\(.runner_label)`, \(.role)): **online, scheduled**"'
            if [ -n "$offline" ]; then
              printf '%s\n' "$offline" | while read -r name; do
                [ -n "$name" ] || continue
                echo "- ${name}: **not scheduled** — the endpoint is offline or no runner advertises its label"
                echo "::warning title=Runner offline::${name} is not online; it was reported rather than queued"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # An empty schedule means the runners API answered but nothing
          # matched: a fleet-wide outage, or the one targeted endpoint is down.
          # Either way it is not a clean run.
          if [ "$(printf '%s' "$scheduled" | jq 'length')" -eq 0 ]; then
            echo "::error::no selected endpoint is online (target: ${target})"
            exit 1
          fi

          emit "$scheduled"

  provision:
    name: Provision ${{ matrix.label }}
    # Dispatch only. The cron must stay side-effect free: a nightly job that
    # silently mutates six machines is not a probe, it is an unreviewed
    # configuration-management system. Rows come from the inventory, so an
    # offline endpoint or one outside the dispatch target is never queued.
    needs: runner-inventory
    if: ${{ (github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')) && (github.event_name == 'workflow_dispatch' && needs.runner-inventory.outputs.provision_count != '0') }}
    environment: chudware-maintenance-protected
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, "${{ matrix.runner_os }}", "${{ matrix.runner_arch }}", "${{ matrix.pool_label }}", "${{ matrix.runner_label }}"]
    timeout-minutes: 90
    strategy:
      # One endpoint that cannot be repaired must not stop the others being
      # repaired.
      fail-fast: false
      matrix: ${{ fromJSON(needs.runner-inventory.outputs.provision_matrix) }}
    env:
      # Pinned and checksum-verified, exactly like the actionlint asset in
      # ci-workflow-policy.yml: a tag can be re-pointed, a digest cannot.
      #
      # python-build-standalone rather than the python.org installer. The
      # installer was tried first and returned 0x80070005 (access denied) even
      # with InstallAllUsers=0: Windows Installer cannot run a per-user install
      # for a service account. This is a relocatable tarball -- no msiexec, no
      # registry, no elevation -- and it is the same distribution
      # actions/setup-python installs. It carries pip as a module, which is all
      # fast-gate uses (`python -m pip`, `python -m venv`).
      PYTHON_WINDOWS_VERSION: 3.13.15
      PYTHON_WINDOWS_RELEASE: '20260807'
      PYTHON_WINDOWS_SHA256: a9c1da0175c2390df2a5d9b5994cc962780f6eaa59ac6b9a832154b8862abbff
      NINJA_WINDOWS_VERSION: 1.13.2
      NINJA_WINDOWS_SHA256: 07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65
      # Homebrew formulae the macOS builders need. python@3.13 because macOS
      # ships 3.9.6 and the pinned NumPy/SciPy that scripts/check.py imports
      # require >= 3.11; opencascade because the macos-* presets configure with
      # CHUDWARE_WITH_OCCT=ON and find_package it from the brew prefix.
      MACOS_FORMULAE: cmake ninja python@3.13 opencascade
    steps:
      - name: Install missing prerequisites (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          # The Homebrew prefix belongs to the operator account. A private CI
          # test account (rows with provision:false never reach this job; this
          # is the backstop) checks it read-only and never installs or
          # upgrades into it.
          if [ "${CC_CI_LANE:-}" = test ]; then
            echo "::error::${RUNNER_NAME:-unknown} is a private CI test account ($(id -un)); it never mutates the operator-owned Homebrew prefix. Provision from the operator lane instead (runner_label=cc-mac-intel or cc-mac-arm)."
            exit 1
          fi

          if ! command -v brew >/dev/null 2>&1; then
            echo "::error::${RUNNER_NAME:-unknown} has no Homebrew; install it by hand before this job can provision anything"
            exit 1
          fi
          prefix="$(brew --prefix)"
          echo "brew=$(brew --version | head -n 1) prefix=${prefix}"

          # Idempotent by construction: an already-installed formula is left
          # exactly as it is. This job repairs a gap, it does not upgrade a
          # working builder underneath a running release.
          for formula in ${MACOS_FORMULAE}; do
            if brew list --versions "${formula}" >/dev/null 2>&1; then
              echo "present: $(brew list --versions "${formula}")"
            else
              echo "installing: ${formula}"
              brew install "${formula}"
            fi
          done

          echo '--- resulting toolchain'
          "${prefix}/bin/cmake" --version | head -n 1
          "${prefix}/bin/ninja" --version
          "${prefix}/bin/python3.13" --version
          brew list --versions opencascade

      - name: Install missing prerequisites (Windows)
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1 — these hosts have no pwsh, and `shell: bash`
        # resolves to an empty WSL shim that exits 0 without running anything.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # The runner service here is its own non-administrator virtual
          # account (NT SERVICE\actions.runner.Hunter-124-CAD.ryzen-7900x3d)
          # whose USERPROFILE is the private D:\ChudwareCI\Windows\profile. It
          # cannot write Program Files, cannot edit the machine PATH, and cannot
          # restart its own service to pick a new one up -- so an all-users
          # install is impossible and a PATH edit would not be visible until
          # the service restarts. Everything therefore lands in a profile-local
          # directory that only this account owns, and every Windows job puts
          # that directory on PATH itself.
          $tools = Join-Path $env:USERPROFILE 'chudware-ci-tools'
          $bin = Join-Path $tools 'bin'
          $pythonDir = Join-Path $tools 'python'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Write-Host "user=$env:USERNAME tools=$tools"

          function Assert-Sha256($path, $expected) {
            $actual = (Get-FileHash -Path $path -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected.ToLower()) {
              Write-Host "::error::checksum mismatch for $path -- expected $expected, got $actual; refusing to run an unverified installer"
              exit 1
            }
            Write-Host "sha256 verified: $path"
          }

          $ninjaExe = Join-Path $bin 'ninja.exe'
          if (Test-Path $ninjaExe) {
            Write-Host "present: $ninjaExe"
          } else {
            $zip = Join-Path $env:RUNNER_TEMP 'ninja-win.zip'
            Invoke-WebRequest -UseBasicParsing -OutFile $zip `
              -Uri "https://github.com/ninja-build/ninja/releases/download/v$($env:NINJA_WINDOWS_VERSION)/ninja-win.zip"
            Assert-Sha256 $zip $env:NINJA_WINDOWS_SHA256
            Expand-Archive -Path $zip -DestinationPath $bin -Force
          }
          & $ninjaExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $pythonExe = Join-Path $pythonDir 'python.exe'
          if (Test-Path $pythonExe) {
            Write-Host "present: $pythonExe"
          } else {
            $archive = Join-Path $env:RUNNER_TEMP 'cpython-windows.tar.gz'
            $asset = "cpython-$($env:PYTHON_WINDOWS_VERSION)%2B$($env:PYTHON_WINDOWS_RELEASE)-x86_64-pc-windows-msvc-install_only.tar.gz"
            Invoke-WebRequest -UseBasicParsing -OutFile $archive `
              -Uri "https://github.com/astral-sh/python-build-standalone/releases/download/$($env:PYTHON_WINDOWS_RELEASE)/$asset"
            Assert-Sha256 $archive $env:PYTHON_WINDOWS_SHA256

            # bsdtar has shipped in System32 since Windows 10 1803, so this
            # needs no unpacking tool of its own. The archive's single top
            # directory is literally "python", so extracting into $tools lands
            # the interpreter exactly at $pythonDir.
            $tarExe = Join-Path $env:SystemRoot 'System32\tar.exe'
            if (-not (Test-Path $tarExe)) {
              Write-Host "::error::$tarExe is missing; this host cannot unpack the Python distribution"
              exit 1
            }
            & $tarExe -xzf $archive -C $tools
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::unpacking the Python $($env:PYTHON_WINDOWS_VERSION) distribution failed with $LASTEXITCODE; nothing was provisioned"
              exit 1
            }
            if (-not (Test-Path $pythonExe)) {
              Write-Host "::error::the archive unpacked but $pythonExe does not exist; the asset layout changed"
              exit 1
            }
          }

          & $pythonExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Console-script launchers (python\Scripts\*.exe) embed the absolute
          # interpreter path they were generated for. A tools tree that moved
          # with its account (the NETWORK SERVICE profile copied into
          # D:\ChudwareCI\Windows\profile) keeps launchers that still point at
          # the old profile, so anything resolved by name from python\Scripts
          # would run another account's interpreter or nothing at all.
          # Reinstalling the owning distribution regenerates them for this
          # interpreter; the probe below fails on any that remain.
          $staleScript = Join-Path $env:RUNNER_TEMP 'stale-launchers.py'
          @(
            'import importlib.metadata as md, os, re, sys'
            'scripts = os.path.join(sys.prefix, "Scripts")'
            'want = os.path.normcase(os.path.abspath(sys.executable))'
            'shebang = re.compile(rb"#!\x22?([A-Za-z]:\\[^\x22\r\n]*?\\pythonw?\.exe)\x22?\r?\n")'
            'stale = {}'
            'for dist in md.distributions():'
            '    for ep in dist.entry_points:'
            '        if ep.group not in ("console_scripts", "gui_scripts"):'
            '            continue'
            '        path = os.path.join(scripts, ep.name + ".exe")'
            '        if not os.path.isfile(path):'
            '            continue'
            '        with open(path, "rb") as stream:'
            '            hits = shebang.findall(stream.read())'
            '        if hits and os.path.normcase(hits[-1].decode("mbcs", "replace")) != want:'
            '            stale[dist.metadata["Name"]] = dist.version'
            'for name, version in sorted(stale.items()):'
            '    print("%s==%s" % (name, version))'
          ) | Set-Content -LiteralPath $staleScript -Encoding Ascii
          $staleDists = @(& $pythonExe $staleScript)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($spec in $staleDists) {
            Write-Host "regenerating launchers: $spec"
            & $pythonExe -m pip install --quiet --disable-pip-version-check --force-reinstall --no-deps $spec
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          # pip and venv are what fast-gate actually uses, so prove them here
          # rather than discovering a stripped install during a gate.
          $probe = Join-Path $env:RUNNER_TEMP 'provision-venv-probe'
          & $pythonExe -m venv $probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $probe 'Scripts\python.exe') -m pip --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force $probe

          # Everything in this step is ASCII on purpose. The runner writes the
          # script as UTF-8 with no BOM and Windows PowerShell 5.1 decodes it
          # as the ANSI code page, so a UTF-8 em dash arrives as a curly
          # closing quote -- which PowerShell accepts as a string delimiter.
          # One em dash in a comment therefore ends a string three lines
          # earlier and the step dies with "missing closing '}'" before a
          # single line of it runs. scripts/verify-ci-workflows.py enforces it.
          $pythonVersion = (& $pythonExe --version 2>&1) -join ' '
          $ninjaVersion = (& $ninjaExe --version 2>&1) -join ' '
          @(
            '### ${{ matrix.label }} provisioning'
            ''
            "- tools root: ``$tools``"
            "- python: $pythonVersion"
            "- ninja: $ninjaVersion"
            "- launchers regenerated: $($staleDists.Count)"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  probe:
    name: ${{ matrix.label }} (${{ matrix.runner_label }})
    # `provision` is skipped on the cron and only covers the provisionable
    # endpoints, so this waits for it when it ran and ignores it when it did
    # not. The inventory, by contrast, is a hard prerequisite: without a matrix
    # there is nothing to probe.
    needs: [runner-inventory, provision]
    if: ${{ (github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')) && (always() && needs.runner-inventory.result == 'success') }}
    environment: chudware-maintenance-protected
    # Inventory labels only narrow this protected group; they cannot reach
    # disposable workers or enlarge server-side workflow/ref authorization.
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, "${{ matrix.runner_os }}", "${{ matrix.runner_arch }}", "${{ matrix.pool_label }}", "${{ matrix.runner_label }}"]
    timeout-minutes: 15
    strategy:
      # One dead endpoint must not cancel the probe of the others — that
      # would hide exactly the failure this workflow exists to surface.
      fail-fast: false
      matrix: ${{ fromJSON(needs.runner-inventory.outputs.matrix) }}
    steps:
      - name: Probe identity, disk, and toolchain (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ROLE: ${{ matrix.role }}
          EXPECT_USER: ${{ matrix.linux_user }}
          EXPECT_MAC_USER: ${{ matrix.mac_user }}
          EXPECT_HOME: ${{ matrix.ci_home }}
          EXPECT_RUNNER_ROOT: ${{ matrix.runner_root }}
          EXPECT_PRODUCT: ${{ matrix.product }}
        run: |
          set -euo pipefail

          echo "runner=${RUNNER_NAME:-unknown} host=$(hostname -s) user=$(id -un) role=${ROLE}"
          test "$RUNNER_OS" = "${{ matrix.runner_os }}"
          test "$RUNNER_ARCH" = "${{ matrix.runner_arch }}"
          uname -a
          echo "workspace=${GITHUB_WORKSPACE:-unset} temp=${RUNNER_TEMP:-unset}"
          df -h "${RUNNER_TEMP:-/tmp}" "$HOME"

          avail_kb="$(df -Pk "$HOME" | awk 'NR==2 {print $4}')"
          missing=()

          # Isolation contract of an endpoint that shares hardware with
          # another product's CI: its own runner account and installation, a
          # guest bound to this product, and every mutable path on the guest's
          # own ext4 root rather than a host share another guest can reach.
          if [ -n "${EXPECT_USER}" ]; then
            [ "$(id -un)" = "${EXPECT_USER}" ] || missing+=("identity (running as $(id -un), expected ${EXPECT_USER})")
            [ "$(id -u)" -ne 0 ] || missing+=("identity (runner executes as root)")
            [ -O "$HOME" ] || missing+=("private HOME (${HOME} is not owned by $(id -un))")
            case "${GITHUB_WORKSPACE:-}" in
              "${EXPECT_RUNNER_ROOT}/_work/"*) ;;
              *) missing+=("workspace (${GITHUB_WORKSPACE:-unset} is outside ${EXPECT_RUNNER_ROOT}/_work)") ;;
            esac
            bound="$(cat /etc/cloudcastle-ci/product 2>/dev/null || true)"
            [ "${bound}" = "${EXPECT_PRODUCT}" ] || missing+=("guest product binding (${bound:-none}, expected ${EXPECT_PRODUCT})")
            case "$(uname -r)" in
              *microsoft-standard-WSL2*) ;;
              *) missing+=("dedicated WSL2 utility VM kernel ($(uname -r))") ;;
            esac
            for path in / "$HOME" "${RUNNER_TEMP}" "${GITHUB_WORKSPACE}"; do
              fstype="$(findmnt -no FSTYPE -T "${path}" 2>/dev/null || echo unknown)"
              echo "  fs       ${path} -> ${fstype}"
              [ "${fstype}" = ext4 ] || missing+=("guest-local storage (${path} is ${fstype}, expected the guest ext4 root)")
            done
          fi

          # Isolation contract of a private native Mac TEST account
          # (CloudCastle-RMM/deploy/selfhost/provision-macos-test-runner.sh in
          # the CloudCastle repository): a hidden service account in the
          # 420-499 range running natively (no Rosetta, no VM) on its Mac's own
          # architecture, with its own 0700 home, runner root, temp and XDG
          # state, the product/lane identity and compiler caps its system
          # launchd daemon exports, and only read access to the Homebrew prefix
          # the operator account owns. Read-only: nothing is installed here.
          brew_fix='brew install'
          if [ -n "${EXPECT_MAC_USER}" ]; then
            case "${RUNNER_ARCH}" in
              ARM64) operator_label=cc-mac-arm ;;
              *) operator_label=cc-mac-intel ;;
            esac
            brew_fix="dispatch runner-provision.yml or this workflow for the operator lane ${operator_label}, which runs brew install"
            uid="$(id -u)"
            [ "$(id -un)" = "${EXPECT_MAC_USER}" ] || missing+=("identity (running as $(id -un), expected ${EXPECT_MAC_USER})")
            if [ "${uid}" -lt 420 ] || [ "${uid}" -gt 499 ]; then
              missing+=("hidden service uid (${uid}, expected 420-499)")
            fi
            case "${RUNNER_ARCH}:$(uname -m)" in
              X64:x86_64 | ARM64:arm64) ;;
              *) missing+=("native architecture (RUNNER_ARCH=${RUNNER_ARCH}, uname -m=$(uname -m))") ;;
            esac
            [ "$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)" = 0 ] || missing+=("native execution (running under Rosetta translation)")
            [ "$(sysctl -n kern.hv_vmm_present 2>/dev/null || echo 0)" = 0 ] || missing+=("physical Mac hardware (running in a virtual machine)")
            [ "${HOME}" = "${EXPECT_HOME}" ] || missing+=("private HOME (${HOME}, expected ${EXPECT_HOME})")
            home_mode="$(stat -f '%Lp %Su' "${EXPECT_HOME}" 2>/dev/null || echo missing)"
            [ "${home_mode}" = "700 ${EXPECT_MAC_USER}" ] || missing+=("0700 private home (${EXPECT_HOME} is ${home_mode})")
            case "${GITHUB_WORKSPACE:-}" in
              "${EXPECT_RUNNER_ROOT}/_work/"*) ;;
              *) missing+=("workspace (${GITHUB_WORKSPACE:-unset} is outside ${EXPECT_RUNNER_ROOT}/_work)") ;;
            esac
            for var in TMPDIR XDG_CACHE_HOME XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME; do
              value="$(printenv "${var}" || true)"
              case "${value}" in
                "${EXPECT_HOME}/"*) ;;
                *) missing+=("private ${var} (${value:-unset} is outside ${EXPECT_HOME})") ;;
              esac
            done
            [ "${CC_CI_PRODUCT:-}" = "${EXPECT_PRODUCT}" ] || missing+=("product identity (CC_CI_PRODUCT=${CC_CI_PRODUCT:-unset}, expected ${EXPECT_PRODUCT})")
            [ "${CC_CI_LANE:-}" = test ] || missing+=("lane identity (CC_CI_LANE=${CC_CI_LANE:-unset}, expected test)")
            for cap in CMAKE_BUILD_PARALLEL_LEVEL CC_CI_BUILD_JOBS; do
              value="$(printenv "${cap}" || true)"
              case "${value}" in
                '' | *[!0-9]* | 0) missing+=("compiler cap ${cap}=${value:-unset}") ;;
              esac
            done
            [ "${CTEST_PARALLEL_LEVEL:-}" = 1 ] || missing+=("serial ctest (CTEST_PARALLEL_LEVEL=${CTEST_PARALLEL_LEVEL:-unset})")
            brew_bin="$(command -v brew 2>/dev/null || true)"
            brew_owner="$( [ -n "${brew_bin}" ] && stat -L -f %Su "${brew_bin}" 2>/dev/null || echo none)"
            [ "${brew_owner}" != "$(id -un)" ] || missing+=("read-only Homebrew (this test account owns ${brew_bin})")
            echo "  account  $(id -un) uid=${uid} home=${HOME} (${home_mode}) brew-owner=${brew_owner} cmake-jobs=${CMAKE_BUILD_PARALLEL_LEVEL:-unset} ctest-jobs=${CTEST_PARALLEL_LEVEL:-unset}"
          fi

          # Every endpoint, whatever its role: without these it cannot check out
          # a repository or run a policy script.
          for tool in git python3; do
            if command -v "${tool}" >/dev/null 2>&1; then
              printf '  %-8s %s\n' "${tool}" "$(command -v "${tool}")"
            else
              missing+=("${tool}")
            fi
          done

          compiled='not attempted'
          if [ "${ROLE}" = "builder" ]; then
            # Free space is the failure nobody predicts: a builder with 2 GB
            # left fails a link step with an error that names the linker. A
            # control endpoint stores nothing and is not held to this.
            if [ "${avail_kb}" -lt 20971520 ]; then
              echo "::error::${RUNNER_NAME:-unknown} has $((avail_kb / 1048576)) GiB free on \$HOME; native builds need at least 20 GiB"
              exit 1
            fi

            for tool in cmake ninja ctest; do
              if command -v "${tool}" >/dev/null 2>&1; then
                printf '  %-8s %s\n' "${tool}" "$(command -v "${tool}")"
              else
                missing+=("${tool}")
              fi
            done
            command -v cmake >/dev/null 2>&1 && cmake --version | head -n 1

            # fast-gate imports the real MCP tool catalog, which pulls in the
            # pinned NumPy and SciPy, and both require Python >= 3.11. macOS
            # ships 3.9.6, so `python3 exists` is not the question.
            gate_python=''
            for candidate in python3.14 python3.13 python3.12 python3.11 python3; do
              command -v "${candidate}" >/dev/null 2>&1 || continue
              if "${candidate}" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'; then
                gate_python="$(command -v "${candidate}")"
                break
              fi
            done
            if [ -n "${gate_python}" ]; then
              echo "  gate-py  ${gate_python} ($("${gate_python}" --version 2>&1))"
            else
              missing+=("python>=3.11 (macOS: ${brew_fix} python@3.13)")
            fi

            # A version string proves nothing about headers, the linker or the
            # loader. Configure, build, run and ctest a one-file project the
            # same way native-build drives the real tree.
            if command -v cmake >/dev/null 2>&1 && command -v ninja >/dev/null 2>&1; then
              smoke="${RUNNER_TEMP}/toolchain-smoke"
              rm -rf "${smoke}"
              mkdir -p "${smoke}/src"
              printf '%s\n' \
                'cmake_minimum_required(VERSION 3.24)' \
                'project(runner_smoke CXX)' \
                'add_executable(runner_smoke main.cpp)' \
                'enable_testing()' \
                'add_test(NAME runs COMMAND runner_smoke)' > "${smoke}/src/CMakeLists.txt"
              printf '%s\n' \
                '#include <cstdio>' \
                '#include <string>' \
                'int main() { const std::string s = "runner-smoke-ok"; std::puts(s.c_str()); return 0; }' > "${smoke}/src/main.cpp"
              if cmake -S "${smoke}/src" -B "${smoke}/build" -G Ninja -DCMAKE_BUILD_TYPE=Release >"${smoke}/log" 2>&1 \
                && cmake --build "${smoke}/build" >>"${smoke}/log" 2>&1 \
                && [ "$("${smoke}/build/runner_smoke")" = runner-smoke-ok ] \
                && ctest --test-dir "${smoke}/build" --output-on-failure >>"${smoke}/log" 2>&1; then
                compiled='compiled, linked, executed and ctested'
              else
                cat "${smoke}/log"
                missing+=("working C++ toolchain (one-file cmake/ninja project failed; log above)")
                compiled='FAILED'
              fi
              rm -rf "${smoke}"
            fi
          else
            echo "  role=control — compiler, cmake, ninja and the 20 GiB build headroom are deliberately not required here"
          fi

          if [ "$RUNNER_OS" = "macOS" ]; then
            # Command Line Tools only on both Macs — no full Xcode, so nothing
            # in CI may depend on xcodebuild. Probed, not assumed.
            sw_vers
            xcode-select -p
            echo "sdk-path=$(xcrun --show-sdk-path)"
            echo "sdk-version=$(xcrun --show-sdk-version)"
            clang --version | head -n 1
            brew_prefix="$(brew --prefix 2>/dev/null || echo unavailable)"
            echo "homebrew-prefix=${brew_prefix}"
            if [ "${brew_prefix}" = "unavailable" ]; then
              missing+=("brew")
            # The macos-* presets build with CHUDWARE_WITH_OCCT=ON and, off
            # Windows, ProvisionOCCT.cmake downloads nothing — it requires a
            # system OCCT that the preset's CMAKE_PREFIX_PATH points at. A
            # missing formula only surfaces as a find_package failure deep in
            # native-build; catching it here names the machine a day earlier.
            elif ! brew list --versions opencascade >/dev/null 2>&1; then
              missing+=("opencascade (${brew_fix} opencascade)")
            else
              echo "opencascade=$(brew list --versions opencascade)"
            fi
          fi

          {
            echo '### ${{ matrix.label }}'
            echo
            echo "- host: \`$(hostname -s)\`, $(uname -s) $(uname -m), user \`$(id -un)\`, role \`${ROLE}\`"
            echo "- free on \$HOME: $((avail_kb / 1048576)) GiB"
            echo "- toolchain smoke: ${compiled}"
            [ -z "${EXPECT_USER}" ] || echo "- isolation contract: ${EXPECT_PRODUCT} guest, account \`${EXPECT_USER}\`, runner root \`${EXPECT_RUNNER_ROOT}\`"
            [ -z "${EXPECT_MAC_USER}" ] || echo "- isolation contract: ${EXPECT_PRODUCT} native Mac test account \`${EXPECT_MAC_USER}\`, home \`${EXPECT_HOME}\`, runner root \`${EXPECT_RUNNER_ROOT}\`; Homebrew checked read-only"
            if [ "${#missing[@]}" -ne 0 ]; then
              echo "- **missing: ${missing[*]}**"
            else
              echo '- toolchain: complete for its role'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::${RUNNER_NAME:-unknown} (${ROLE}) is missing: ${missing[*]}"
            exit 1
          fi

      - name: Probe identity, disk, and toolchain (Windows)
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1 — these hosts have no pwsh.
        shell: powershell
        env:
          ROLE: ${{ matrix.role }}
          EXPECT_ACCOUNT: ${{ matrix.service_account }}
          EXPECT_SID: ${{ matrix.service_sid }}
          EXPECT_CI_ROOT: ${{ matrix.ci_root }}
          SIBLING_NAMESPACES: ${{ matrix.sibling_namespaces }}
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "runner=$env:RUNNER_NAME host=$env:COMPUTERNAME user=$env:USERNAME role=$env:ROLE"
          Write-Host "powershell=$($PSVersionTable.PSVersion)"
          Write-Host (Get-CimInstance Win32_OperatingSystem).Caption
          $missing = @()

          # Private identity contract. GarrisonGamingPC also hosts the
          # CloudCastle and Chudcode runners, so this endpoint must execute as
          # its own non-administrator virtual service account with every
          # mutable path in its own D:\ChudwareCI\Windows namespace. A Windows
          # row without a declared contract is itself a finding.
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          $sid = $identity.User.Value
          Write-Host "account=$($identity.Name) sid=$sid"
          if (-not $env:EXPECT_SID -or -not $env:EXPECT_CI_ROOT) {
            $missing += 'identity contract (the fleet row declares no service_sid/ci_root)'
          } else {
            if ($sid -ne $env:EXPECT_SID) { $missing += "identity (sid $sid, expected $env:EXPECT_SID)" }
            if ($identity.Name -ne $env:EXPECT_ACCOUNT) { $missing += "identity (account $($identity.Name), expected $env:EXPECT_ACCOUNT)" }
            # WindowsIdentity.Groups omits deny-only groups, so a UAC-filtered
            # administrator token does not trip this; an enabled one does.
            $groups = @($identity.Groups | ForEach-Object { $_.Value })
            if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) -or ($groups -contains 'S-1-5-32-544')) {
              $missing += 'non-admin identity (the token carries an enabled BUILTIN\Administrators group)'
            }

            $root = $env:EXPECT_CI_ROOT.TrimEnd('\')
            $profileDir = Join-Path $root 'profile'
            $work = Join-Path $root 'w'
            $expected = [ordered]@{
              USERPROFILE = $profileDir
              HOME = $profileDir
              CARGO_HOME = (Join-Path $profileDir '.cargo')
              RUSTUP_HOME = (Join-Path $profileDir '.rustup')
              TEMP = (Join-Path $root 'tmp')
              TMP = (Join-Path $root 'tmp')
            }
            foreach ($name in $expected.Keys) {
              $actual = [Environment]::GetEnvironmentVariable($name)
              Write-Host ("  {0,-17} {1}" -f $name, $actual)
              if (-not $actual -or $actual.TrimEnd('\') -ne $expected[$name]) {
                $missing += "$name=$actual (expected $($expected[$name]))"
              }
            }
            $under = [ordered]@{
              APPDATA = $profileDir
              LOCALAPPDATA = $profileDir
              GITHUB_WORKSPACE = $work
              RUNNER_TEMP = $work
              RUNNER_TOOL_CACHE = $work
            }
            foreach ($name in $under.Keys) {
              $actual = [Environment]::GetEnvironmentVariable($name)
              Write-Host ("  {0,-17} {1}" -f $name, $actual)
              if (-not $actual -or -not $actual.StartsWith($under[$name] + '\', [StringComparison]::OrdinalIgnoreCase)) {
                $missing += "$name=$actual (expected under $($under[$name]))"
              }
            }

            # D-backed means the real directory, not a junction that lands
            # somewhere else: no reparse point anywhere on the path, and the
            # volume is the fixed disk the namespace is declared on.
            $volumeRoot = [IO.Path]::GetPathRoot($root)
            $volume = New-Object IO.DriveInfo($volumeRoot)
            Write-Host "  volume           $volumeRoot $($volume.DriveType) label=$($volume.VolumeLabel)"
            if ($volume.DriveType -ne [IO.DriveType]::Fixed) { $missing += "namespace volume $volumeRoot is $($volume.DriveType), not a fixed disk" }
            foreach ($path in @($profileDir, (Join-Path $root 'tmp'), $work, $env:CARGO_HOME, $env:RUSTUP_HOME)) {
              # Unset variables were already reported against the contract.
              if (-not $path) { continue }
              $item = Get-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
              if (-not $item) { $missing += "namespace path $path does not exist"; continue }
              if ([IO.Path]::GetPathRoot($item.FullName) -ne $volumeRoot) { $missing += "$path is not on $volumeRoot" }
              for ($node = $item; $node; $node = $node.Parent) {
                if ($node.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                  $missing += "$path crosses reparse point $($node.FullName)"
                  break
                }
              }
            }

            # The sibling products' namespaces must not even be listable by
            # this account. Read-only check: nothing is created there.
            foreach ($other in @($env:SIBLING_NAMESPACES -split ';' | Where-Object { $_ })) {
              try {
                [void][IO.Directory]::GetFileSystemEntries($other)
                $missing += "private namespace ($other is readable by this account)"
              } catch {
                $cause = $_.Exception.GetBaseException()
                if ($cause -is [UnauthorizedAccessException]) {
                  Write-Host "  denied           $other"
                } elseif ($cause -is [IO.DirectoryNotFoundException]) {
                  Write-Host "  absent           $other"
                } else {
                  $missing += "private namespace check on $other failed: $($cause.GetType().Name)"
                }
              }
            }
          }

          # The runner service account cannot edit the machine PATH and cannot
          # restart itself to pick a new one up, so the provisioning job
          # installs into this profile-local directory and every Windows job
          # puts it on PATH itself. See docs/reference/CI_RUNNERS.md.
          $tools = Join-Path $env:USERPROFILE 'chudware-ci-tools'
          foreach ($dir in @((Join-Path $tools 'bin'), (Join-Path $tools 'python'), (Join-Path $tools 'python\Scripts'))) {
            if (Test-Path $dir) {
              $env:PATH = "$dir;$env:PATH"
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "  path+            $dir"
            }
          }

          $drive = Get-PSDrive -Name ($env:USERPROFILE.Substring(0,1))
          $freeGiB = [math]::Round($drive.Free / 1GB, 1)
          Write-Host "free-on-$($drive.Name)=$freeGiB GiB"

          $required = if ($env:ROLE -eq 'builder') { @('git', 'cmake', 'ninja', 'ctest') } else { @('git') }
          foreach ($tool in $required) {
            $found = Get-Command $tool -ErrorAction SilentlyContinue
            if ($found) { Write-Host ("  {0,-8} {1}" -f $tool, $found.Source) } else { $missing += $tool }
          }

          # Python >= 3.11: fast-gate's audits import the pinned NumPy and
          # SciPy, neither of which exists for anything older.
          $gatePython = ''
          foreach ($candidate in @('python3', 'python')) {
            $found = Get-Command $candidate -ErrorAction SilentlyContinue
            if (-not $found) { continue }
            & $found.Source -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'
            if ($LASTEXITCODE -eq 0) { $gatePython = $found.Source; break }
          }
          if ($gatePython) {
            $gatePythonVersion = (& $gatePython --version 2>&1) -join ' '
            Write-Host "  gate-py  $gatePython ($gatePythonVersion)"
          } else {
            $missing += 'python>=3.11 (run this workflow with workflow_dispatch to provision it)'
          }

          # Launchers in python\Scripts carry an absolute interpreter path. One
          # that names any other interpreter (the pre-migration profile, a
          # build machine) is broken for this account; the provision job
          # regenerates them.
          $pythonExe = Join-Path $tools 'python\python.exe'
          $scriptsDir = Join-Path $tools 'python\Scripts'
          if (Test-Path $scriptsDir) {
            $shebang = '#!"?([A-Za-z]:\\[^"\r\n]*?\\pythonw?\.exe)"?\r?\n'
            foreach ($launcher in Get-ChildItem -LiteralPath $scriptsDir -Filter '*.exe' -File) {
              $text = [Text.Encoding]::Default.GetString([IO.File]::ReadAllBytes($launcher.FullName))
              $hits = [regex]::Matches($text, $shebang)
              if ($hits.Count -eq 0) { continue }
              $target = $hits[$hits.Count - 1].Groups[1].Value
              if ($target -ne $pythonExe) { $missing += "stale launcher $($launcher.Name) -> $target (dispatch this workflow to regenerate)" }
            }
          }

          $compiled = 'not attempted'
          if ($env:ROLE -eq 'builder') {
            # native-build enters the MSVC environment through vswhere, and
            # falls back to the vcvars64.bat under a Visual Studio root when
            # vswhere is absent or cannot query the setup COM class for this
            # account. The probe uses the same order so it names the machine
            # before a release leg does.
            $vsPath = $null
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -products * `
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                -property installationPath
            }
            if (-not $vsPath) {
              $vcvars = @(
                (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio'),
                (Join-Path $env:ProgramFiles 'Microsoft Visual Studio')
              ) | Where-Object { Test-Path $_ } |
                ForEach-Object { Get-ChildItem -Path $_ -Filter vcvars64.bat -File -Recurse -ErrorAction SilentlyContinue } |
                Select-Object -First 1
              if ($vcvars) { $vsPath = $vcvars.Directory.Parent.Parent.Parent.FullName }
            }
            $vcvarsPath = if ($vsPath) { Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat' } else { '' }
            if (-not $vcvarsPath -or -not (Test-Path $vcvarsPath)) {
              $missing += 'msvc-x64-toolset (no vcvars64.bat under any Visual Studio root)'
            } else {
              Write-Host "visual-studio=$vsPath"
              # A version string proves nothing about headers, the linker or
              # the loader. Configure, build, run and ctest a one-file project
              # with the same generator native-build uses, at below-normal
              # priority so a probe never competes with customer workloads.
              (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
              & cmd.exe /d /s /c "`"$vcvarsPath`" >nul && set" |
                ForEach-Object {
                  if ($_ -match '^([^=]+)=(.*)$') {
                    [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
                  }
                }
              # CMake's compiler checks build with /Zi, whose PDBs go through
              # mspdbsrv; a run-unique endpoint keeps this probe off any server
              # shared with another build on the host (as native-build does).
              $env:_MSPDBSRV_ENDPOINT_ = "chudware-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
              $smoke = Join-Path $env:RUNNER_TEMP 'toolchain-smoke'
              Remove-Item -LiteralPath $smoke -Recurse -Force -ErrorAction SilentlyContinue
              $src = Join-Path $smoke 'src'
              $build = Join-Path $smoke 'build'
              New-Item -ItemType Directory -Force -Path $src | Out-Null
              @(
                'cmake_minimum_required(VERSION 3.24)'
                'project(runner_smoke CXX)'
                'add_executable(runner_smoke main.cpp)'
                'enable_testing()'
                'add_test(NAME runs COMMAND runner_smoke)'
              ) | Set-Content -LiteralPath (Join-Path $src 'CMakeLists.txt') -Encoding Ascii
              @(
                '#include <cstdio>'
                '#include <string>'
                'int main() { const std::string s = "runner-smoke-ok"; std::puts(s.c_str()); return 0; }'
              ) | Set-Content -LiteralPath (Join-Path $src 'main.cpp') -Encoding Ascii
              $log = Join-Path $smoke 'log.txt'
              $ok = $false
              & cmd.exe /d /c "cmake -S `"$src`" -B `"$build`" -G Ninja -DCMAKE_BUILD_TYPE=Release > `"$log`" 2>&1"
              if ($LASTEXITCODE -eq 0) {
                & cmd.exe /d /c "cmake --build `"$build`" >> `"$log`" 2>&1"
                if ($LASTEXITCODE -eq 0) {
                  $output = (& (Join-Path $build 'runner_smoke.exe')) -join ''
                  if ($LASTEXITCODE -eq 0 -and $output -eq 'runner-smoke-ok') {
                    & cmd.exe /d /c "ctest --test-dir `"$build`" --output-on-failure >> `"$log`" 2>&1"
                    $ok = ($LASTEXITCODE -eq 0)
                  }
                }
              }
              if ($ok) {
                $compiled = 'compiled, linked, executed and ctested'
              } else {
                Get-Content -LiteralPath $log -ErrorAction SilentlyContinue | Write-Host
                $missing += 'working MSVC toolchain (one-file cmake/ninja project failed; log above)'
                $compiled = 'FAILED'
              }
              Remove-Item -LiteralPath $smoke -Recurse -Force -ErrorAction SilentlyContinue
            }

            if ($freeGiB -lt 20) { $missing += "disk-space (only $freeGiB GiB free)" }
          } else {
            Write-Host '  role=control -- MSVC, cmake, ninja and the 20 GiB build headroom are deliberately not required here'
          }

          $state = if ($missing.Count -eq 0) { '- toolchain: complete for its role' } else { "- **missing: $($missing -join ', ')**" }
          @(
            '### ${{ matrix.label }}'
            ''
            "- host: ``$env:COMPUTERNAME``, Windows $env:RUNNER_ARCH, account ``$($identity.Name)``, role ``$env:ROLE``"
            "- free on $($drive.Name): $freeGiB GiB"
            "- toolchain smoke: $compiled"
            $state
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($missing.Count -ne 0) {
            Write-Host "::error::$env:RUNNER_NAME ($env:ROLE) is missing: $($missing -join ', ')"
            exit 1
          }
