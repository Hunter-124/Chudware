# Build the static chudware.com site (website/) on every change and publish the
# exact build output to Cloudflare Pages on pushes to master. Pull requests
# only build; they never see the deploy credentials.
name: site-build

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/site-build.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/site-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build static site
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler pages deploy dist --project-name chudware-site --branch master
