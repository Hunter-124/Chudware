# Live Stripe sandbox verification.
#
# Every other suite in this repository proves our billing code is internally
# consistent. This one proves the assumptions it is consistent WITH are true of
# Stripe, by talking to api.stripe.com in test mode. That distinction is not
# academic -- four defects found while writing the suite were invisible to any
# mock, and one of them meant `provision_stripe.py --apply` had never once
# succeeded against real Stripe:
#
#   * httpx 0.28 silently mangles a list-of-pairs passed as `data=`, so every
#     form-encoded provisioning write died inside h11.
#   * `features.subscription_update.products` is expandable and omitted from
#     responses, so the portal reconciler reported UPDATE forever and rewrote the
#     live customer-portal configuration on every deploy.
#   * `stripe.Account.create(type="express")` is refused outright on a current
#     account; Connect had to move to Accounts v2.
#   * `StripeObject` in stripe-python 15 is not a dict and has no `.get()`.
#
# WHY THIS IS A REUSABLE WORKFLOW: Hunter asked for it to gate both website
# deploys and new releases. Those are two different files with two different
# triggers, and duplicating the venv/Postgres/secret plumbing into each is how
# the two copies drift until one of them is quietly not running.
#
# COST: one run is ~40s of network-bound test time and creates a handful of
# sandbox objects, all tagged and torn down by the suite's own fixtures. It is
# cheap enough to gate a deploy on, which is the whole reason it is inline
# rather than nightly-only.
name: stripe-sandbox

on:
  # Callers pass only STRIPE_SANDBOX_ENV; the callee also enforces the protected
  # caller ref/event and environment before executing any repository code.
  workflow_call:
    secrets:
      STRIPE_SANDBOX_ENV:
        required: false
    inputs:
      require_credentials:
        description: >-
          Fail when STRIPE_SANDBOX_ENV is absent instead of reporting the gate as
          not run. Leave false until the secret exists, or every deploy blocks on
          a credential nobody has added yet.
        type: boolean
        default: false
    outputs:
      result:
        description: passed | skipped
        value: ${{ jobs.sandbox.outputs.result }}
  # Anything that touches the billing or marketplace money paths.
  push:
    branches: [master]
    paths:
      - 'Webservice/gateway/billing.py'
      - 'Webservice/gateway/credits.py'
      - 'Webservice/gateway/plans.py'
      - 'Webservice/gateway/marketplace*.py'
      - 'Webservice/gateway/admin_billing.py'
      - 'Webservice/gateway/config.py'
      - 'Webservice/gateway/migrations/**'
      - 'Webservice/gateway/tests/test_stripe_sandbox.py'
      - 'Webservice/deploy/provision_stripe.py'
      - '.github/workflows/stripe-sandbox.yml'
  # Catalog drift is not caused by our commits. A price edited in the Stripe
  # dashboard, a webhook endpoint disabled by a bounce-back, or an expired
  # restricted key all break billing with no push to detect. 06:20 UTC daily.
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The sandbox is one shared mutable account. Two concurrent runs would both
# create customers, subscriptions and refunds against it and would race on the
# "exactly one active price per lookup_key" and "exactly one managed portal
# configuration" assertions. Serialise, never cancel: a cancelled run mid-suite
# leaves objects the teardown fixture never reached.
concurrency:
  group: stripe-sandbox
  cancel-in-progress: false

jobs:
  sandbox:
    name: Verify the live Stripe sandbox
    if: ${{ github.ref_protected && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    environment: chudware-control-protected
    # cc-linux-build, never cc-linux-livingroom. This job creates charges and
    # refunds; it has no business executing on the production gateway host, and
    # pinning it here means a future edit cannot accidentally point live billing
    # tests at prod's environment file.
    runs-on:
      group: chudware-trusted-protected
      labels: [self-hosted, Linux, X64, cloudcastle-ci, cc-linux-build]
    timeout-minutes: 20
    outputs:
      result: ${{ steps.run.outputs.result }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve sandbox credentials
        id: creds
        shell: bash
        env:
          # One secret holding the whole dotenv, not nine separate ones. The
          # price ids, the webhook secret and the account id are produced
          # together by `provision_stripe.py --apply` and are only meaningful
          # together: a run with a fresh key and a stale price id would fail in a
          # way that reads like a code defect. Mirrors
          # Webservice/secrets/stripe-sandbox.env, which is the file an operator
          # already has locally.
          STRIPE_SANDBOX_ENV: ${{ secrets.STRIPE_SANDBOX_ENV }}
        run: |
          set -euo pipefail

          if [ -z "${STRIPE_SANDBOX_ENV:-}" ]; then
            if [ "${{ inputs.require_credentials }}" = "true" ]; then
              echo "::error title=Stripe sandbox credentials missing::secrets.STRIPE_SANDBOX_ENV is not set and require_credentials=true. Add the secret with the contents of Webservice/secrets/stripe-sandbox.env."
              exit 1
            fi
            echo "::warning title=Stripe gate did not run::secrets.STRIPE_SANDBOX_ENV is not set, so live Stripe verification was skipped. This gate reports success without having verified anything. Add the secret to make it enforcing."
            echo "have_creds=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Written to the runner temp dir, which is wiped per job, rather than
          # to the workspace where a later step or a stray `git add` could see
          # it. 0600 before the content lands, not after.
          env_file="${RUNNER_TEMP}/stripe-sandbox.env"
          install -m 600 /dev/null "${env_file}"
          printf '%s\n' "${STRIPE_SANDBOX_ENV}" > "${env_file}"

          key="$(sed -n 's/^CHUDWARE_WEB_STRIPE_SECRET_KEY=//p' "${env_file}" | head -n1)"
          if [ -z "${key}" ]; then
            echo "::error title=Malformed sandbox credentials::STRIPE_SANDBOX_ENV does not define CHUDWARE_WEB_STRIPE_SECRET_KEY"
            exit 1
          fi
          # Refuse a live key here as well as in the suite's own fixture. This
          # job creates charges, subscriptions and refunds; one guard is a single
          # point of failure for real money, and this one fails before the
          # interpreter has even started.
          case "${key}" in
            sk_test_*|rk_test_*) ;;
            *)
              echo "::error title=Refusing a live Stripe key::STRIPE_SANDBOX_ENV carries a key that is not sk_test_/rk_test_. This job creates real charges and refunds and will not run against a live account."
              exit 1
              ;;
          esac

          echo "env_file=${env_file}" >> "$GITHUB_OUTPUT"
          echo "have_creds=true" >> "$GITHUB_OUTPUT"
          echo "sandbox credentials resolved; key is test mode"

      - name: Assert PostgreSQL server binaries
        if: steps.creds.outputs.have_creds == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # tests/conftest.py's autouse `pg` fixture initdbs a throwaway cluster
          # for the session. The CLIENT package (psql) is not enough -- it ships
          # no initdb -- and the failure without this check is a RuntimeError
          # carrying a long install hint, 30 seconds into collection, which reads
          # like a test defect rather than runner provisioning.
          for tool in initdb pg_ctl; do
            command -v "${tool}" >/dev/null 2>&1 && continue
            found=""
            for dir in /usr/pgsql-*/bin /usr/lib64/pgsql/postgresql-*/bin /opt/homebrew/bin /usr/local/bin; do
              [ -x "${dir}/${tool}" ] && { found="${dir}"; break; }
            done
            if [ -z "${found}" ]; then
              echo "::error title=PostgreSQL server binaries missing::${tool} not found. The gateway suite runs against a real ephemeral PostgreSQL; install postgresql-server (not just the client) on runner ${RUNNER_NAME:-unknown}, or set CHUDWARE_TEST_PG_BIN."
              exit 1
            fi
            echo "CHUDWARE_TEST_PG_BIN=${found}" >> "$GITHUB_ENV"
          done
          echo "postgres server binaries present"

      - name: Provision the gateway venv
        if: steps.creds.outputs.have_creds == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # The venv is gitignored, so on a clean checkout it never exists. Its
          # ABSENCE is a build artifact, not a provisioning fault -- treating it
          # as one would make this gate red on every fresh runner forever. Its
          # failure to build, however, is a real defect.
          venv_py="Webservice/gateway/.venv/bin/python"
          [ -x "${venv_py}" ] || python3 -m venv Webservice/gateway/.venv
          "${venv_py}" -m pip install --quiet --disable-pip-version-check --upgrade pip
          "${venv_py}" -m pip install --quiet --disable-pip-version-check \
            -r Webservice/gateway/requirements.txt
          # pytest is deliberately absent from the pinned runtime requirements,
          # which the deployment venv also installs from.
          "${venv_py}" -c 'import pytest' 2>/dev/null \
            || "${venv_py}" -m pip install --quiet pytest
          "${venv_py}" -c 'import stripe, httpx, psycopg; print("stripe", stripe.VERSION)'

      - name: Verify the Stripe catalog is not drifting
        if: steps.creds.outputs.have_creds == 'true'
        shell: bash
        env:
          ENV_FILE: ${{ steps.creds.outputs.env_file }}
        run: |
          set -euo pipefail
          set -a; . "${ENV_FILE}"; set +a
          export STRIPE_SECRET_KEY="${CHUDWARE_WEB_STRIPE_SECRET_KEY}"

          # --apply is idempotent and is the ONLY honest drift check: a read-only
          # comparison would have to reimplement the reconciler's own matching
          # rules, and the bug it would then miss is a reconciler that never
          # converges -- which is exactly the defect that shipped here. A clean
          # account reports every row NO-OP. Anything else means the live catalog
          # no longer matches CATALOG_SPEC, and the log names which row.
          log="${RUNNER_TEMP}/provision.log"
          Webservice/gateway/.venv/bin/python Webservice/deploy/provision_stripe.py \
            --apply --expect-account "${CHUDWARE_STRIPE_ACCOUNT}" 2>&1 | tee "${log}"

          if grep -qE '^(CREATE|UPDATE|REPLACE)' "${log}"; then
            echo "::warning title=Stripe catalog drifted::the provisioner had to write. Rows that were not NO-OP are listed above; a drift usually means someone edited a price, product or portal setting in the Stripe dashboard instead of in CATALOG_SPEC."
          fi

          {
            echo '## Stripe catalog reconciliation'
            echo '```text'
            sed -n '/STATUS/,/^$/p' "${log}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the live sandbox suite
        id: run
        if: always() && steps.creds.outputs.have_creds != ''
        shell: bash
        env:
          ENV_FILE: ${{ steps.creds.outputs.env_file }}
        run: |
          set -euo pipefail

          if [ "${{ steps.creds.outputs.have_creds }}" != "true" ]; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
            {
              echo '## Stripe sandbox'
              echo
              echo 'NOT RUN — `secrets.STRIPE_SANDBOX_ENV` is not configured.'
              echo
              echo 'Add a repository secret named `STRIPE_SANDBOX_ENV` whose value is the'
              echo 'contents of `Webservice/secrets/stripe-sandbox.env`, then this gate'
              echo 'becomes enforcing.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          set -a; . "${ENV_FILE}"; set +a

          log="${RUNNER_TEMP}/stripe-sandbox.log"
          status=0
          (cd Webservice/gateway && .venv/bin/python -m pytest tests/test_stripe_sandbox.py \
            -q -p no:cacheprovider) 2>&1 | tee "${log}" || status=${PIPESTATUS[0]}

          # pytest exits 5 on "no tests collected", and the whole module is
          # skipif-guarded on the secret key. A green run that collected nothing,
          # or skipped everything, is the failure mode this gate exists to
          # prevent -- it looks identical to a pass.
          if [ "${status}" -eq 5 ]; then
            echo "::error title=Stripe suite collected nothing::pytest exited 5. The suite did not run."
            exit 1
          fi
          if grep -qE '^[0-9]+ skipped' "${log}"; then
            echo "::error title=Stripe suite skipped itself::credentials were present but every test skipped, so nothing was verified. Check that CHUDWARE_WEB_STRIPE_SECRET_KEY is exported by STRIPE_SANDBOX_ENV."
            exit 1
          fi

          {
            echo '## Stripe sandbox suite'
            echo '```text'
            tail -n 25 "${log}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "result=passed" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Shred the credential file
        if: always()
        shell: bash
        run: |
          # RUNNER_TEMP is wiped between jobs, but this runner is self-hosted and
          # long-lived: an interrupted job can leave the directory in place until
          # the next one. Removing it explicitly bounds the window.
          rm -f "${RUNNER_TEMP}/stripe-sandbox.env" || true
