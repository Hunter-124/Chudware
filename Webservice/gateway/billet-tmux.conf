# billet-web shared terminal defaults.
#
# Loaded via `tmux -f` when the shared tmux server is first started, so these
# apply to the very first omp pane too (options set after new-session would miss
# it — history-limit in particular is fixed at pane creation). Later sessions
# attach to the same server and inherit these globals; _create_session also
# re-applies the dynamic ones defensively in case the server was born without us.

set -g mouse on              # wheel / two-finger swipe -> copy-mode scroll
set -g history-limit 50000   # deep scrollback for long omp runs
set -g status off            # clean full-screen omp for shared viewing
set -g destroy-unattached off  # survive zero clients (never lose work)
set -sg escape-time 10       # snappy Alt/Meta (no slow-escape ambiguity)
