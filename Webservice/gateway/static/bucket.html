<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Files — Chudware</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23090d12'/%3E%3Cg fill='none' stroke='%2342ECCE' stroke-width='1.7'%3E%3Crect x='5' y='5' width='22' height='22'/%3E%3Crect x='10.5' y='10.5' width='11' height='11'/%3E%3Cpath d='M5 5L10.5 10.5M27 5L21.5 10.5M27 27L21.5 21.5M5 27L10.5 21.5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="/portal-assets/bucket.d2f837737db5.css">
  <script src="/portal-assets/bucket.18dbf9cd99a2.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#page-title">Skip to content</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Chudware account home">
        <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3.2"><rect x="9" y="9" width="46" height="46"/><rect x="21" y="21" width="22" height="22"/><path d="M9 9l12 12M55 9L43 21M55 55L43 43M9 55l12-12"/></g></svg>
        <span>Chudware</span>
      </a>
      <span class="brand-tag">Files</span>
      <span class="topbar-spacer"></span>
      <a class="back-link" href="/#team">&larr; Team &amp; files</a>
    </header>

    <main>
      <div class="page-head">
        <div>
          <h1 id="page-title"><span id="scope-title">Files</span></h1>
          <p class="scope-context" id="scope-context">Loading destinations…</p>
        </div>
        <div class="dest-picker">
          <label for="dest-select">Destination</label>
          <select id="dest-select" aria-describedby="scope-context">
            <option value="personal">Personal — only you</option>
          </select>
        </div>
      </div>

      <p class="notice" id="notice" role="alert" hidden></p>

      <section class="card" aria-label="Files">
        <div class="toolbar">
          <nav class="crumbs" id="crumbs" aria-label="Folder path"></nav>
          <button type="button" class="btn" id="new-folder-btn">+ New folder</button>
          <button type="button" class="btn" id="upload-folder-btn">Upload folder</button>
          <button type="button" class="btn primary" id="upload-btn">Upload files</button>
          <input type="file" id="file-input" multiple hidden>
          <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
        </div>

        <div class="drop-zone" id="drop-zone">Drag &amp; drop files or folders anywhere on this page to upload them to the current folder</div>

        <div class="list" id="list" aria-busy="true"></div>

        <div class="statusbar">
          <progress id="upload-progress" aria-label="Upload progress" max="1" value="0" hidden></progress>
          <div class="status" id="status" role="status" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="input-dialog" aria-labelledby="input-dialog-title">
    <form method="dialog">
      <h2 id="input-dialog-title">Rename</h2>
      <label id="input-dialog-label" for="input-dialog-field">Name</label>
      <input type="text" id="input-dialog-field" autocomplete="off" spellcheck="false">
      <div class="dialog-actions">
        <button type="submit" class="btn primary" id="input-dialog-confirm" value="confirm">Save</button>
        <button type="submit" class="btn" value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-body">
    <form method="dialog">
      <h2 id="confirm-dialog-title">Delete</h2>
      <p id="confirm-dialog-body"></p>
      <div class="dialog-actions">
        <button type="submit" class="btn" value="cancel" autofocus>Cancel</button>
        <button type="submit" class="btn danger" id="confirm-dialog-confirm" value="confirm">Delete</button>
      </div>
    </form>
  </dialog>
</body>
</html>
