<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team Bucket — Chudware</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='none' stroke='%234f8cff' stroke-width='4' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M56.2 18 L32 4 L7.8 18 L7.8 46 L32 60 L56.2 46 Z'/%3E%3Cpath d='M32 32 L32 4 M32 32 L7.8 46 M32 32 L56.2 46'/%3E%3C/g%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0f1418;
      --bg2: #12181c;
      --panel: #161d23;
      --panel-edge: rgba(255,255,255,0.07);
      --border: #2a2e36;
      --text: #e6edf3;
      --muted: #8b93a3;
      --accent: #4f8cff;
      --accent-hi: #6fa2ff;
      --teal: #2fd4a7;
      --danger: #e07a8a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: linear-gradient(180deg, var(--bg2), var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
    }
    header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--panel-edge);
    }
    header .logo { width: 26px; height: 26px; display: block; }
    header .wordmark { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
    header .tag {
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--panel-edge); padding: 3px 8px; border-radius: 999px;
    }
    header .spacer { flex: 1; }
    header a.home-link {
      color: var(--muted); text-decoration: none; font-size: 0.85rem;
      display: inline-flex; align-items: center; gap: 6px;
    }
    header a.home-link:hover { color: var(--text); }

    main { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 20px; font-size: 0.92rem; }

    .toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .crumbs {
      flex: 1; min-width: 200px; font-size: 0.88rem; color: var(--muted);
      word-break: break-all; display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    }
    .crumbs button {
      background: none; border: none; color: var(--accent-hi); cursor: pointer;
      font-size: 0.88rem; padding: 2px 4px; border-radius: 4px;
    }
    .crumbs button:hover { background: var(--panel); }
    .crumbs .sep { color: var(--muted); }

    button.btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--panel); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 9px 14px; font-size: 0.88rem; cursor: pointer;
      min-height: 38px; touch-action: manipulation;
    }
    button.btn:hover { border-color: var(--accent); }
    button.btn.primary {
      background: linear-gradient(180deg, var(--accent-hi), var(--accent));
      border: none; color: #fff; font-weight: 600;
    }
    button.btn.danger { color: var(--danger); }
    button.btn.danger:hover { border-color: var(--danger); background: #2a1a20; }

    #drop-zone {
      border: 2px dashed var(--border); border-radius: 12px; padding: 20px;
      text-align: center; color: var(--muted); font-size: 0.88rem; margin-bottom: 16px;
      transition: border-color .12s ease, background .12s ease;
    }
    #drop-zone.drag { border-color: var(--accent); background: rgba(79,140,255,0.06); color: var(--text); }

    .list { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .row {
      display: flex; align-items: center; gap: 12px; padding: 11px 14px;
      border-bottom: 1px solid var(--panel-edge); font-size: 0.9rem;
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: var(--panel); }
    .row .icon { width: 20px; height: 20px; flex: none; color: var(--muted); }
    .row.dir .icon { color: var(--accent-hi); }
    .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row.dir .name { cursor: pointer; color: var(--text); }
    .row.dir .name:hover { color: var(--accent-hi); text-decoration: underline; }
    .row .meta { color: var(--muted); font-size: 0.78rem; flex: none; white-space: nowrap; }
    .row .actions { display: flex; gap: 6px; flex: none; }
    .row .actions a, .row .actions button {
      background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px 6px;
      border-radius: 6px; font-size: 0.78rem; text-decoration: none;
    }
    .row .actions a:hover { color: var(--accent-hi); background: rgba(79,140,255,0.08); }
    .row .actions button.del:hover { color: var(--danger); background: #2a1a20; }
    .empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 0.9rem; }

    #status {
      margin-top: 14px; font-size: 0.85rem; min-height: 1.2em;
    }
    #status.err { color: var(--danger); }
    #status.ok { color: var(--teal); }

    input[type=file] { display: none; }
  </style>
</head>
<body>
  <header>
    <svg class="logo" viewBox="0 0 64 64" aria-label="Chudware">
      <g fill="none" stroke="#4f8cff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
        <path d="M56.2 18 L32 4 L7.8 18 L7.8 46 L32 60 L56.2 46 Z"/>
        <path d="M32 32 L32 4 M32 32 L7.8 46 M32 32 L56.2 46"/>
      </g>
    </svg>
    <span class="wordmark">Chudware</span>
    <span class="tag">Bucket</span>
    <span class="spacer"></span>
    <a class="home-link" href="/">&larr; Home</a>
  </header>

  <main>
    <h1>Team Bucket</h1>
    <p class="lead">Drop files or folders here for the team. Anyone signed in can upload, organize, and download.</p>

    <div class="toolbar">
      <div class="crumbs" id="crumbs"></div>
      <button class="btn" id="new-folder-btn">+ New folder</button>
      <button class="btn" id="upload-folder-btn">Upload folder</button>
      <button class="btn primary" id="upload-btn">Upload files</button>
      <input type="file" id="file-input" multiple />
      <input type="file" id="folder-input" webkitdirectory directory multiple />
    </div>

    <div id="drop-zone">Drag &amp; drop files anywhere in this box to upload them to the current folder</div>

    <div class="list" id="list"></div>
    <div id="status"></div>
  </main>

  <script src="/static/bucket.js?v=2"></script>
</body>
</html>
