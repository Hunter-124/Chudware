<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Billet Web</title>
  <link rel="icon" type="image/png" href="/static/logo_wordmark_dark.png" />
  <link rel="stylesheet" href="/static/portal.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="/static/logo_wordmark_dark.png" alt="Billet" width="140" height="58" />
        <span class="brand-sub">web sessions</span>
      </div>
      <div class="topbar-right">
        <div id="user-chip" class="user-chip" title="">
          <span class="user-dot" aria-hidden="true"></span>
          <span id="user-name">…</span>
        </div>
        <button id="chat-toggle" class="icon-btn" type="button" title="Toggle chat" aria-label="Toggle chat">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 3v-3H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm2 4v2h12V8H6zm0 4v2h8v-2H6z"/>
          </svg>
          <span id="chat-badge" class="badge hidden">0</span>
        </button>
      </div>
    </header>

    <div class="workspace">
      <main class="main">
        <section id="session-card" class="session-card">
          <div class="session-head">
            <h1>Your session</h1>
            <span id="session-status" class="status-pill status-idle">idle</span>
          </div>
          <p class="session-blurb">
            Start a private Billet CAD seat streamed to this browser. Reconnect reattaches
            to your running container — it will not spawn a second seat.
          </p>
          <div id="session-error" class="error-panel hidden" role="alert"></div>
          <div class="session-actions">
            <button id="btn-start" class="btn primary" type="button">Start session</button>
            <button id="btn-reconnect" class="btn primary hidden" type="button">Reconnect</button>
            <button id="btn-stop" class="btn danger hidden" type="button">Stop</button>
          </div>
          <p id="session-detail" class="session-detail"></p>
        </section>

        <section id="stream-wrap" class="stream-wrap hidden">
          <div class="stream-bar">
            <span id="stream-label" class="stream-label">Session live</span>
            <div class="stream-actions">
              <button id="btn-popout" class="btn ghost" type="button" title="Open stream in new tab">Pop out</button>
              <button id="btn-stop-stream" class="btn danger" type="button">Stop</button>
            </div>
          </div>
          <iframe id="stream-frame" class="stream-frame" title="Billet session" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
        </section>
      </main>

      <aside id="chat-sidebar" class="chat-sidebar">
        <div class="chat-rail" title="Open chat">
          <button id="chat-rail-btn" class="rail-btn" type="button" aria-label="Open chat">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 3v-3H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
            </svg>
            <span id="rail-badge" class="badge hidden">0</span>
          </button>
        </div>
        <div class="chat-panel">
          <div class="chat-header">
            <div>
              <strong>Shoutbox</strong>
              <div id="presence-count" class="muted small">0 online</div>
            </div>
            <button id="chat-collapse" class="icon-btn" type="button" title="Collapse chat" aria-label="Collapse chat">‹</button>
          </div>
          <ul id="presence-list" class="presence-list" aria-label="Online users"></ul>
          <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
          <form id="chat-form" class="chat-form" autocomplete="off">
            <input id="chat-input" type="text" maxlength="2000" placeholder="Message the lab…" />
            <button class="btn primary" type="submit">Send</button>
          </form>
        </div>
      </aside>
    </div>
  </div>
  <script src="/static/portal.js" defer></script>
</body>
</html>
