<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Billet Web</title>
  <link rel="icon" type="image/png" href="/static/logo_wordmark_dark.png" />
  <link rel="stylesheet" href="/static/portal.css?v=3" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="/static/logo_wordmark_dark.png" alt="Billet" width="140" height="58" />
        <span class="brand-sub">web</span>
      </div>
    </header>
    <div class="workspace">
      <main class="main" style="display:flex;align-items:center;justify-content:center;min-height:60vh">
        <section class="session-card" style="text-align:center;max-width:420px">
          <h2 style="margin:0 0 8px">Billet</h2>
          <p style="font-size:.9rem;color:var(--muted,#8b93a3);margin:0 0 18px">
            Browser-native client on the shared team workspace. Everyone sees the
            same documents live.</p>
          <a href="/app/" style="display:inline-block;background:var(--accent,#4f8cff);color:#fff;text-decoration:none;font-weight:600;padding:12px 34px;border-radius:10px">Open Billet</a>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
