# chudware-web allowlist — TEMPLATE ONLY. This tracked file must never contain
# real accounts. The production allowlist lives OUTSIDE the repo: set
# CHUDWARE_WEB_USERS_FILE to an untracked, chmod-600 file (see
# Webservice/deploy/DEPLOYMENT.md, "Allowlist / users file").
#
# On startup, config.py seeds the runtime file from THIS template when the
# configured path does not exist — so this template intentionally grants
# NOBODY access (example.com entries are dev-only and never synced to
# Cloudflare Access). A fresh boot therefore serves /healthz but logs nobody
# in; to recover, edit the runtime users file or point
# CHUDWARE_WEB_USERS_FILE at a real one, then restart the gateway.
#
# After editing the RUNTIME allowlist, push it into the Cloudflare Access
# policy:
#   python3 Webservice/deploy/cf_provision.py --sync-users
#
# role: admin | user;  heavy: reserved entitlement flag, nothing enforces it today.
users:
  - email: demo@example.com
    display: Demo User
    role: user
    heavy: false
  # - email: admin@example.com
  #   display: Example Admin
  #   role: admin
  #   heavy: true
