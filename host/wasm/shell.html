<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Chudware</title>
  <!-- Cross-origin isolation insurance: re-adds COOP/COEP client-side if a proxy strips
       them, so SharedArrayBuffer/pthreads work. No-ops when already crossOriginIsolated. -->
  <script src="coi-serviceworker.js"></script>
  <style>
    /* Single source of truth for the brand accent on this page. The touch-HUD
       buttons below tint their border, active fill and active label from it, and
       those three rules used to hardcode it five times over in two different teals
       (rgba(66,236,206) for the resting border, rgba(48,216,190) + #42ecce for the
       pressed/active states) — proof that a recolor by hand drifts. The channel
       triple exists because rgba() needs components, not a hex, to keep the
       per-rule alpha values that give the HUD its glass look.

       Primary only, deliberately: the secondary accent is the direction cue for
       3D op icons and this page has no such cue, so a --chudware-accent-secondary
       here would be a variable nothing reads. */
    :root {
      --chudware-accent: #F28216;
      --chudware-accent-rgb: 242, 130, 22;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #12181c;
      color: #e6edf3;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Safe areas are applied exactly once, to the visual viewport surface. */
    #app-surface {
      position: fixed;
      left: calc(var(--viewport-left, 0px) + env(safe-area-inset-left, 0px));
      top: calc(var(--viewport-top, 0px) + env(safe-area-inset-top, 0px) + var(--demo-banner-h, 0px));
      width: max(1px, calc(var(--viewport-width, 100vw) - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
      height: max(1px, calc(var(--viewport-height, 100vh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--demo-banner-h, 0px)));
      overflow: hidden;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      background: #0f1418;
      outline: none;
      touch-action: none;
    }
    #status {
      position: absolute;
      left: 12px;
      bottom: 60px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
    }
    #status.error { color: #ff8a8a; }

    /* Hard-requirement failure panel. #status is a 12px corner chip with
       pointer-events:none — useless for an explanation a phone user has to read and
       act on, so a real blocking panel replaces it. Text is selectable here on
       purpose: html/body disable selection for the canvas. */
    #unsupported, #demo-ended {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: #12181c;
      padding: max(24px, env(safe-area-inset-top)) 22px
               max(24px, env(safe-area-inset-bottom)) 22px;
      box-sizing: border-box;
      -webkit-user-select: text;
      user-select: text;
      touch-action: auto;
    }
    #unsupported.visible, #demo-ended.visible { display: block; }
    #unsupported .wrap, #demo-ended .wrap { max-width: 34em; margin: 0 auto; }
    #unsupported h1, #demo-ended h1 { font-size: 19px; margin: 0 0 12px; }
    #unsupported p, #unsupported li, #demo-ended p { font-size: 15px; line-height: 1.5; margin: 0 0 10px; }
    #unsupported ol { padding-left: 1.3em; margin: 0 0 14px; }
    #unsupported code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      padding: 1px 5px;
    }
    #unsupported .why { color: #ff8a8a; }
    #unsupported .dim, #demo-ended .dim { color: #9aa7b2; font-size: 13px; }
    #demo-ended a.rejoin {
      display: inline-block;
      margin-top: 6px;
      padding: 9px 18px;
      border-radius: 8px;
      background: var(--chudware-accent);
      color: #12181c;
      font-size: 15px;
      font-weight: 650;
      text-decoration: none;
    }

    /* Demo-session strip. In flow terms it OWNS the top --demo-banner-h of the visual
       viewport: #app-surface is pushed down by the same variable, so the canvas (and the
       app's own title bar / controls) is resized, never covered. Same left/width/safe-area
       math as #app-surface. Below #demo-ended (30) so expiry always wins. */
    :root { --demo-banner-h: 0px; }
    #demo-banner {
      display: none;
      position: fixed;
      left: calc(var(--viewport-left, 0px) + env(safe-area-inset-left, 0px));
      top: calc(var(--viewport-top, 0px) + env(safe-area-inset-top, 0px));
      width: max(1px, calc(var(--viewport-width, 100vw) - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
      height: 28px;
      z-index: 25;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 10px;
      background: #1a2229;
      border-bottom: 1px solid rgba(var(--chudware-accent-rgb), 0.45);
      color: #e6edf3;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
    }
    #demo-banner.visible { display: flex; }
    #demo-banner.warn { background: #f2a516; border-bottom-color: #b97a00; color: #1b1300; }
    #demo-banner.critical { background: #c0392b; border-bottom-color: #8e2a20; color: #fff; }
    #demo-banner .msg { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #demo-banner .msg:empty { display: none; }
    #demo-banner button {
      flex-shrink: 0;
      height: 20px;
      padding: 0 10px;
      border-radius: 5px;
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    #demo-banner button:disabled { opacity: 0.6; cursor: default; }

    /* On-screen camera HUD — only shown on narrow / touch viewports. */
    #mobile-hud {
      display: none;
      position: absolute;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56px;
      padding: 4px;
      box-sizing: border-box;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      overscroll-behavior: contain;
      touch-action: pan-x;
      pointer-events: auto;
    }
    #mobile-hud.visible { display: flex; }
    #mobile-hud::-webkit-scrollbar { display: none; }
    #mobile-hud .hud-row {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      pointer-events: none;
    }
    #mobile-hud button {
      pointer-events: auto;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 14px;
      border: 1px solid rgba(var(--chudware-accent-rgb), 0.28);
      background: rgba(18, 24, 30, 0.78);
      color: #e6edf3;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.02em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    #mobile-hud button:active {
      transform: translateY(1px);
      background: rgba(var(--chudware-accent-rgb), 0.22);
      border-color: rgba(var(--chudware-accent-rgb), 0.5);
      color: var(--chudware-accent);
    }
    #mobile-hud button.active {
      background: rgba(var(--chudware-accent-rgb), 0.28);
      border-color: rgba(var(--chudware-accent-rgb), 0.55);
      color: var(--chudware-accent);
    }
    #mobile-hud button.wide {
      width: auto;
      min-width: 48px;
      padding: 0 14px;
      font-size: 12px;
    }
    #mobile-hud [hidden] { display: none; }
    #mobile-hud.text-input .camera-controls,
    #mobile-hud.text-input [data-cmd="undo"] { display: none; }
    #mobile-input {
      position: absolute;
      z-index: 19;
      width: 2px;
      min-height: 16px;
      margin: 0;
      padding: 0;
      border: 0;
      outline: none;
      resize: none;
      overflow: hidden;
      font: 16px/1 system-ui, sans-serif;
      opacity: 0.01;
      pointer-events: none;
      -webkit-user-select: text;
      user-select: text;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="app-surface">
    <canvas id="canvas" tabindex="0" aria-label="Chudware modeling workspace" oncontextmenu="event.preventDefault()"></canvas>
    <textarea id="mobile-input" aria-label="Keyboard input for the selected Chudware field"
              tabindex="-1" autocomplete="off" autocorrect="off" autocapitalize="off"
              spellcheck="false" enterkeyhint="enter"></textarea>
    <div id="status">Loading Chudware…</div>
  <div id="mobile-hud" role="toolbar" aria-label="Workspace and camera controls">
    <div class="hud-row">
      <button type="button" data-cmd="files" class="wide" title="Toggle files and feature tree">Files</button>
      <button type="button" data-cmd="chat" class="wide" title="Toggle chat">Chat</button>
      <button type="button" data-cmd="keyboard" class="wide" title="Open software keyboard" hidden>Keyboard</button>
      <button type="button" data-cmd="undo" title="Undo">↶</button>
    </div>
    <div class="hud-row camera-controls">
      <button type="button" data-cmd="orbit" class="active" title="Orbit mode">Orbit</button>
      <button type="button" data-cmd="pan" title="Pan mode">Pan</button>
    </div>
    <div class="hud-row camera-controls">
      <button type="button" data-cmd="zoom_in" title="Zoom in">＋</button>
      <button type="button" data-cmd="zoom_out" title="Zoom out">－</button>
    </div>
  </div>
  </div>
  <div id="unsupported" role="alert" aria-live="assertive"><div class="wrap"
       id="unsupported-body"></div></div>
  <!-- Public demo mode only (see the demo-session block in the script below). Both stay
       hidden unless GET /healthz answered {"demo": true}. Built/updated via textContent. -->
  <div id="demo-banner" role="status"><span class="msg" id="demo-banner-msg"></span><span
       class="msg" id="demo-banner-ai"></span><button
       type="button" id="demo-download">Download your work</button></div>
  <div id="demo-ended" role="alert" aria-live="assertive"><div class="wrap"
       id="demo-ended-body"></div></div>
  <script type="text/javascript">
    window.__chudwareLogs = [];
    function chudwareLog(kind, text) {
      try {
        window.__chudwareLogs.push(kind + ': ' + text);
        if (window.__chudwareLogs.length > 400) window.__chudwareLogs.shift();
      } catch (e) {}
      if (kind === 'err') console.error(text); else console.log(text);
    }
    var statusEl = document.getElementById('status');
    function setStatus(text, isError) {
      if (!statusEl) return;
      // A hard-requirement failure is the LAST word: the module keeps calling setStatus
      // while it fails to instantiate, and letting "Aborted: …" overwrite the real
      // diagnosis is exactly how this turned into a blank page with no explanation.
      if (window.__chudwareUnsupported) return;
      statusEl.textContent = text;
      statusEl.className = isError ? 'error' : '';
      if (isError) statusEl.style.display = 'block';
    }

    // ---- Hard-requirement preflight ---------------------------------------------
    // This build needs three things the browser either has or does not:
    //   * WebAssembly                       — it IS the application
    //   * SharedArrayBuffer + cross-origin isolation — linked -pthread with
    //     PTHREAD_POOL_SIZE=8 (host/CMakeLists.txt), so the worker pool cannot start
    //     without shared memory
    //   * WebGL2                            — MAX_WEBGL_VERSION=2, the only renderer
    // Missing capabilities can reflect browser version, security policy, extensions,
    // GPU availability or server isolation headers; detect requirements, not causes.
    (function preflight() {
      var isApple = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (/Mac/.test(navigator.userAgent) && 'ontouchend' in document);
      var missing = [];
      if (typeof WebAssembly !== 'object' || typeof WebAssembly.instantiate !== 'function')
        missing.push('WebAssembly');
      if (typeof SharedArrayBuffer !== 'function') missing.push('SharedArrayBuffer');
      // crossOriginIsolated false with SharedArrayBuffer present means COOP/COEP did not
      // survive the network path — a proxy or extension stripped them.
      var isolated = (typeof crossOriginIsolated === 'undefined') || crossOriginIsolated;
      var webgl2 = false;
      try {
        var probe = document.createElement('canvas');
        webgl2 = !!(probe.getContext('webgl2') || probe.getContext('experimental-webgl2'));
      } catch (e) {}
      if (!webgl2) missing.push('WebGL2');
      if (!missing.length && isolated) return;

      window.__chudwareUnsupported = true;
      var reason = missing.length
        ? 'This browser is missing: ' + missing.join(', ') + '.'
        : 'This page is not cross-origin isolated, so shared memory is unavailable.';
      chudwareLog('err', 'preflight: ' + reason);

      var html = '<h1>Chudware can\u2019t run in this browser</h1>' +
                 '<p class="why">' + reason + '</p>';
      if (isApple && missing.length) {
        html +=
          '<p>Chudware requires WebAssembly, shared memory and WebGL2. Use an up-to-date ' +
          'Safari and check browser or device restrictions. WebGL2 can also be unavailable ' +
          'because of GPU or browser settings.</p>' +
          '<p>If you use Lockdown Mode, its restrictions may affect these capabilities. ' +
          'Only if you trust this site and your security needs allow it, consider a per-site ' +
          'exception in Safari or Settings. This check cannot determine whether Lockdown ' +
          'Mode is enabled.</p>' +
          '<p class="dim">Shared memory also requires cross-origin isolation. Network filters ' +
          'or extensions can interfere with the required server headers.</p>';
      } else if (missing.length) {
        html +=
          '<p>Chudware runs as WebAssembly with a shared-memory worker pool and WebGL2. ' +
          'Use a current Chrome, Edge, Firefox or Safari with those enabled \u2014 or run ' +
          'the desktop app, which needs none of this.</p>';
      } else {
        html +=
          '<p>Chudware needs the <code>Cross-Origin-Opener-Policy</code> and ' +
          '<code>Cross-Origin-Embedder-Policy</code> headers this server sends. Something ' +
          'between you and it removed them \u2014 usually a corporate proxy or a browser ' +
          'extension. Try a different network, or a private window with extensions off.</p>';
      }
      html += '<p class="dim">Desktop builds: <a href="https://chudware.com/download/">chudware.com downloads' +
              '</a>.</p>';

      var panel = document.getElementById('unsupported');
      var body = document.getElementById('unsupported-body');
      if (body) body.innerHTML = html;
      if (panel) panel.className = 'visible';
      if (statusEl) statusEl.style.display = 'none';
      var c = document.getElementById('canvas');
      if (c) c.style.display = 'none';
      var hud = document.getElementById('mobile-hud');
      if (hud) hud.style.display = 'none';
    })();
    var runtimeReady = false;
    var surface = document.getElementById('app-surface');
    var hud = document.getElementById('mobile-hud');
    function mobileSurface() {
      return surface.clientWidth <= 900 || window.matchMedia('(pointer: coarse)').matches;
    }
    function refreshHudVisibility() {
      hud.classList.toggle('visible', runtimeReady && !window.__chudwareUnsupported && mobileSurface());
    }
    function syncSurface() {
      var vv = window.visualViewport;
      surface.style.setProperty('--viewport-left', (vv ? vv.offsetLeft : 0) + 'px');
      surface.style.setProperty('--viewport-top', (vv ? vv.offsetTop : 0) + 'px');
      surface.style.setProperty('--viewport-width', (vv ? vv.width : window.innerWidth) + 'px');
      surface.style.setProperty('--viewport-height', (vv ? vv.height : window.innerHeight) + 'px');
      refreshHudVisibility();
      // GLFW observes #app-surface and owns canvas backing-store changes after startup.
    }
    syncSurface();
    window.addEventListener('resize', syncSurface);
    window.addEventListener('orientationchange', syncSurface);
    window.matchMedia('(pointer: coarse)').addEventListener('change', refreshHudVisibility);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncSurface);
      window.visualViewport.addEventListener('scroll', syncSurface);
    }

    // ---- Canvas-only touch → GLFW mouse bridge ---------------------------------
    window.__chudwareTouches = [];
    (function installTouchBridge() {
      var canvas = document.getElementById('canvas');
      var ids = new Set();
      var activeId = null;
      var lastX = 0, lastY = 0, startX = 0, startY = 0;
      var pressed = false, multi = false, scrolling = false;
      var lastTouchAt = -Infinity;

      function fire(type, buttons) {
        canvas.dispatchEvent(new MouseEvent(type, {
          bubbles: true, cancelable: true, view: window,
          clientX: lastX, clientY: lastY, button: 0, buttons: buttons
        }));
      }
      function release(cancel) {
        if (pressed) {
          if (cancel) {
            var x = lastX, y = lastY;
            lastX = lastY = -10000;
            fire('mousemove', 1);
            fire('mouseup', 0);
            lastX = x; lastY = y;
          } else {
            fire('mouseup', 0);
          }
          pressed = false;
        }
      }
      function track(ev) {
        var rect = canvas.getBoundingClientRect();
        var touches = [];
        var remaining = new Set();
        for (var i = 0; i < ev.touches.length; ++i) {
          var t = ev.touches[i];
          if (!ids.has(t.identifier)) continue;
          remaining.add(t.identifier);
          touches.push({ id: t.identifier, x: t.clientX - rect.left, y: t.clientY - rect.top });
        }
        ids = remaining;
        window.__chudwareTouches = touches;
        lastTouchAt = performance.now();
        if (ev.cancelable) ev.preventDefault();
      }
      canvas.addEventListener('touchstart', function(ev) {
        for (var i = 0; i < ev.changedTouches.length; ++i)
          ids.add(ev.changedTouches[i].identifier);
        track(ev);
        if (ids.size >= 2) {
          multi = true;
          release(true);
          activeId = null;
          scrolling = false;
          return;
        }
        if (multi || activeId !== null || !runtimeReady) return;
        var t = ev.changedTouches[0];
        activeId = t.identifier;
        lastX = startX = t.clientX;
        lastY = startY = t.clientY;
        canvas.focus({ preventScroll: true });
        // contrib GLFW listens for mouse events, not PointerEvents. Position must
        // reach GLFW before the press or the click uses the previous cursor position.
        fire('mousemove', 0);
        pressed = true;
        fire('mousedown', 1);
      }, { passive: false });
      canvas.addEventListener('touchmove', function(ev) {
        track(ev);
        if (multi || activeId === null) return;
        for (var i = 0; i < ev.changedTouches.length; ++i) {
          var t = ev.changedTouches[i];
          if (t.identifier !== activeId) continue;
          var deltaY = lastY - t.clientY;
          lastX = t.clientX;
          lastY = t.clientY;
          if (!scrolling && window.__chudwareTouchScroll &&
              Math.abs(lastY - startY) > 10 && Math.abs(lastY - startY) > Math.abs(lastX - startX)) {
            scrolling = true;
            release(true);
          }
          fire('mousemove', pressed ? 1 : 0);
          if (scrolling && deltaY)
            canvas.dispatchEvent(new WheelEvent('wheel', {
              bubbles: true, cancelable: true, clientX: lastX, clientY: lastY,
              deltaY: deltaY, deltaMode: 0
            }));
          break;
        }
      }, { passive: false });
      function endTouch(ev) {
        track(ev);
        for (var i = 0; i < ev.changedTouches.length; ++i) {
          var t = ev.changedTouches[i];
          if (t.identifier !== activeId) continue;
          lastX = t.clientX;
          lastY = t.clientY;
          fire('mousemove', pressed ? 1 : 0);
          release(ev.type === 'touchcancel');
          activeId = null;
          scrolling = false;
        }
        if (ev.type === 'touchcancel') {
          release(true);
          activeId = null;
          scrolling = false;
          multi = ids.size > 0;
        }
        // A 2→1 transition never starts a fresh drag; wait for all canvas fingers up.
        if (!ids.size) {
          release();
          activeId = null;
          multi = scrolling = false;
        }
      }
      canvas.addEventListener('touchend', endTouch, { passive: false });
      canvas.addEventListener('touchcancel', endTouch, { passive: false });
      window.addEventListener('blur', function() {
        release(true);
        activeId = null;
        ids.clear();
        window.__chudwareTouches = [];
        multi = scrolling = false;
      });
      // preventDefault normally cancels compatibility mouse events. Also block
      // browsers that deliver them anyway, before GLFW's document capture listeners.
      ['mousedown', 'mouseup', 'mousemove', 'click', 'dblclick'].forEach(function(type) {
        window.addEventListener(type, function(ev) {
          if (ev.target !== canvas || !ev.isTrusted) return;
          var fromTouch = ev.sourceCapabilities ? ev.sourceCapabilities.firesTouchEvents
                                               : performance.now() - lastTouchAt < 800;
          if (fromTouch) {
            ev.preventDefault();
            ev.stopImmediatePropagation();
          }
        }, true);
      });
    })();

    // ---- Mobile HUD → WASM ccall -------------------------------------------------
    function callChudware(name, sig, args) {
      if (!runtimeReady || window.__chudwareUnsupported) return null;
      try {
        if (typeof Module !== 'undefined' && typeof Module.ccall === 'function') {
          return Module.ccall(name, null, sig || [], args || []);
        }
        // Numeric KEEPALIVE calls may use direct exports; UTF-8 strings require ccall.
        var fn = (typeof Module !== 'undefined') ? Module['_' + name] : null;
        if (typeof fn === 'function' && (!sig || sig.indexOf('string') < 0))
          return fn.apply(null, args || []);
      } catch (e) {
        chudwareLog('err', 'hud call ' + name + ': ' + e);
      }
      return null;
    }
    // The textarea is a transient IME/clipboard buffer, not a second document.
    // A sentinel gives software keyboards something to delete even between commits.
    var textInput = document.getElementById('mobile-input');
    var textInputWanted = false;
    var composing = false;
    var compositionCommit = null;
    var compositionResetTimer = 0;
    var inputSentinel = '\u200b';
    function resetTextInput() {
      textInput.value = inputSentinel;
      textInput.setSelectionRange(1, 1);
    }
    function sendInputKey(key) {
      if (textInputWanted)
        callChudware('chudware_mobile_key', ['number'], [key]);
    }
    function sendInputText(text) {
      if (!textInputWanted || !text) return;
      // A pasted newline is text, not the Enter shortcut that submits a composer.
      callChudware('chudware_mobile_text', ['string'], [text.replace(/\r\n?/g, '\n')]);
    }
    resetTextInput();
    window.chudwareTextInput = function(visible, x, y, lineHeight) {
      var wanted = !!visible && runtimeReady && mobileSurface();
      textInputWanted = wanted;
      hud.classList.toggle('text-input', wanted);
      hud.querySelector('[data-cmd="keyboard"]').hidden = !wanted;
      if (!wanted) {
        if (document.activeElement === textInput) textInput.blur();
        return;
      }
      // Keep the real focus target at the ImGui caret, inside the visible editor
      // above the reserved HUD strip. 16px font avoids Safari's focus zoom.
      var height = Math.max(16, Math.min(Number(lineHeight) || 16, 48));
      textInput.style.left = Math.max(0, Math.min(Number(x) || 0, surface.clientWidth - 2)) + 'px';
      textInput.style.top = Math.max(0, Math.min(Number(y) || 0, surface.clientHeight - 56 - height)) + 'px';
      textInput.style.height = height + 'px';

          try { sessionStorage.removeItem('chudwareGlReloads'); } catch (e) {}
        }, 30000);
      }
    };
    window.onerror = function(msg) {
      setStatus('Exception: ' + msg, true);
      chudwareLog('err', String(msg));
    };
  </script>

</body>
