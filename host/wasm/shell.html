<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Chudware</title>
  <!-- Cross-origin isolation insurance: re-adds COOP/COEP client-side if a proxy strips
       them, so SharedArrayBuffer/pthreads work. No-ops when already crossOriginIsolated. -->
  <script src="coi-serviceworker.js"></script>
  <style>
    /* Single source of truth for the brand accent on this page. The touch-HUD
       buttons below tint their border, active fill and active label from it, and
       those three rules used to hardcode it five times over in two different teals
       (rgba(66,236,206) for the resting border, rgba(48,216,190) + #42ecce for the
       pressed/active states) — proof that a recolor by hand drifts. The channel
       triple exists because rgba() needs components, not a hex, to keep the
       per-rule alpha values that give the HUD its glass look.

       Primary only, deliberately: the secondary accent is the direction cue for
       3D op icons and this page has no such cue, so a --chudware-accent-secondary
       here would be a variable nothing reads. */
    :root {
      --chudware-accent: #F28216;
      --chudware-accent-rgb: 242, 130, 22;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #12181c;
      color: #e6edf3;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      /* Safe-area for notched phones (fullscreen PWA / iOS Safari). */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      /* Fill the content box after safe-area padding so the GL surface
         doesn't sit under the notch/home indicator. */
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      background: #0f1418;
      outline: none;
      touch-action: none;
    }
    #status {
      position: fixed;
      left: max(12px, env(safe-area-inset-left));
      bottom: max(12px, env(safe-area-inset-bottom));
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
    }
    #status.error { color: #ff8a8a; }

    /* Hard-requirement failure panel. #status is a 12px corner chip with
       pointer-events:none — useless for an explanation a phone user has to read and
       act on, so a real blocking panel replaces it. Text is selectable here on
       purpose: html/body disable selection for the canvas. */
    #unsupported {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: #12181c;
      padding: max(24px, env(safe-area-inset-top)) 22px
               max(24px, env(safe-area-inset-bottom)) 22px;
      box-sizing: border-box;
      -webkit-user-select: text;
      user-select: text;
      touch-action: auto;
    }
    #unsupported.visible { display: block; }
    #unsupported .wrap { max-width: 34em; margin: 0 auto; }
    #unsupported h1 { font-size: 19px; margin: 0 0 12px; }
    #unsupported p, #unsupported li { font-size: 15px; line-height: 1.5; margin: 0 0 10px; }
    #unsupported ol { padding-left: 1.3em; margin: 0 0 14px; }
    #unsupported code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      padding: 1px 5px;
    }
    #unsupported .why { color: #ff8a8a; }
    #unsupported .dim { color: #9aa7b2; font-size: 13px; }

    /* On-screen camera HUD — only shown on narrow / touch viewports. */
    #mobile-hud {
      display: none;
      position: fixed;
      z-index: 20;
      right: max(10px, env(safe-area-inset-right));
      bottom: calc(max(16px, env(safe-area-inset-bottom)) + 32px);
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    #mobile-hud.visible { display: flex; }
    #mobile-hud .hud-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      pointer-events: none;
    }
    #mobile-hud button {
      pointer-events: auto;
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 14px;
      border: 1px solid rgba(var(--chudware-accent-rgb), 0.28);
      background: rgba(18, 24, 30, 0.78);
      color: #e6edf3;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.02em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    #mobile-hud button:active {
      transform: translateY(1px);
      background: rgba(var(--chudware-accent-rgb), 0.22);
      border-color: rgba(var(--chudware-accent-rgb), 0.5);
      color: var(--chudware-accent);
    }
    #mobile-hud button.active {
      background: rgba(var(--chudware-accent-rgb), 0.28);
      border-color: rgba(var(--chudware-accent-rgb), 0.55);
      color: var(--chudware-accent);
    }
    #mobile-hud button.wide {
      width: auto;
      min-width: 48px;
      padding: 0 14px;
      font-size: 12px;
    }
    @media (max-width: 900px), (pointer: coarse) {
      #mobile-hud { display: flex; }
    }
    @media (max-width: 900px) and (max-height: 600px) and (orientation: landscape),
           (pointer: coarse) and (max-height: 600px) and (orientation: landscape) {
      #mobile-hud {
        flex-direction: row;
        align-items: center;
        /* The compact sketch banner owns the thin strip immediately above this row.
           Sit just three pixels above the ImGui status bar at 447px-high landscape
           instead of consuming that banner strip with the taller mobile clearance. */
        bottom: calc(max(0px, env(safe-area-inset-bottom)) + 32px);
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Loading Chudware…</div>
  <div id="unsupported" role="alert" aria-live="assertive"><div class="wrap"
       id="unsupported-body"></div></div>
  <div id="mobile-hud" aria-label="Camera controls">
    <div class="hud-row">
      <button type="button" data-cmd="menu" class="wide" title="Toggle panels">Menu</button>
      <button type="button" data-cmd="undo" title="Undo">↶</button>
    </div>
    <div class="hud-row">
      <button type="button" data-cmd="orbit" class="active" title="Orbit mode">Orbit</button>
      <button type="button" data-cmd="pan" title="Pan mode">Pan</button>
    </div>
    <div class="hud-row">
      <button type="button" data-cmd="zoom_in" title="Zoom in">＋</button>
      <button type="button" data-cmd="zoom_out" title="Zoom out">－</button>
    </div>
  </div>
  <script type="text/javascript">
    window.__chudwareLogs = [];
    function chudwareLog(kind, text) {
      try {
        window.__chudwareLogs.push(kind + ': ' + text);
        if (window.__chudwareLogs.length > 400) window.__chudwareLogs.shift();
      } catch (e) {}
      if (kind === 'err') console.error(text); else console.log(text);
    }
    var statusEl = document.getElementById('status');
    function setStatus(text, isError) {
      if (!statusEl) return;
      // A hard-requirement failure is the LAST word: the module keeps calling setStatus
      // while it fails to instantiate, and letting "Aborted: …" overwrite the real
      // diagnosis is exactly how this turned into a blank page with no explanation.
      if (window.__chudwareUnsupported) return;
      statusEl.textContent = text;
      statusEl.className = isError ? 'error' : '';
      if (isError) statusEl.style.display = 'block';
    }

    // ---- Hard-requirement preflight ---------------------------------------------
    // This build needs three things the browser either has or does not:
    //   * WebAssembly                       — it IS the application
    //   * SharedArrayBuffer + cross-origin isolation — linked -pthread with
    //     PTHREAD_POOL_SIZE=8 (host/CMakeLists.txt), so the worker pool cannot start
    //     without shared memory
    //   * WebGL2                            — MAX_WEBGL_VERSION=2, the only renderer
    // Without this check a browser missing any of them downloaded ~12 MB and then sat
    // on "Loading Chudware…" or printed a raw "Exception: …", which is what an iPhone
    // in Lockdown Mode does: Lockdown Mode disables WebAssembly in Safari outright.
    // Lockdown Mode is per-site excludable, so this is an instruction, not an apology.
    (function preflight() {
      var isApple = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (/Mac/.test(navigator.userAgent) && 'ontouchend' in document);
      var missing = [];
      if (typeof WebAssembly !== 'object' || typeof WebAssembly.instantiate !== 'function')
        missing.push('WebAssembly');
      if (typeof SharedArrayBuffer !== 'function') missing.push('SharedArrayBuffer');
      // crossOriginIsolated false with SharedArrayBuffer present means COOP/COEP did not
      // survive the network path — a proxy or extension stripped them.
      var isolated = (typeof crossOriginIsolated === 'undefined') || crossOriginIsolated;
      var webgl2 = false;
      try {
        var probe = document.createElement('canvas');
        webgl2 = !!(probe.getContext('webgl2') || probe.getContext('experimental-webgl2'));
      } catch (e) {}
      if (!webgl2) missing.push('WebGL2');
      if (!missing.length && isolated) return;

      window.__chudwareUnsupported = true;
      var reason = missing.length
        ? 'This browser is missing: ' + missing.join(', ') + '.'
        : 'This page is not cross-origin isolated, so shared memory is unavailable.';
      chudwareLog('err', 'preflight: ' + reason);

      var html = '<h1>Chudware can\u2019t run in this browser</h1>' +
                 '<p class="why">' + reason + '</p>';
      // Any missing hard requirement on an Apple browser: Lockdown Mode is the cause worth
      // naming first. Newer Safari runs JIT-less Wasm under Lockdown Mode but still withholds
      // shared memory, so keying this on WebAssembly alone would send those users the generic
      // "use a current browser" text while they are already on the newest one.
      if (isApple && missing.length) {
        html +=
          '<p><strong>Lockdown Mode is the usual cause.</strong> It disables WebAssembly and ' +
          'shared memory in Safari, and WebAssembly is what Chudware is compiled to. You can ' +
          'keep Lockdown Mode on everywhere else and allow just this site:</p>' +
          '<ol>' +
          '<li>Open this page in Safari and tap <code>a\u1d00</code> in the address bar.</li>' +
          '<li>Choose <em>Turn off Lockdown Mode\u2026</em> \u2192 <em>Turn Off for This ' +
          'Website</em>, then reload.</li>' +
          '</ol>' +
          '<p class="dim">Same exclusion from Settings: <em>Privacy &amp; Security</em> ' +
          '\u2192 <em>Lockdown Mode</em> \u2192 <em>Configure Web Browsing</em> \u2192 ' +
          '<em>Excluded Safari Websites</em>.</p>' +
          '<p class="dim">If Lockdown Mode is already off for this site, the browser is ' +
          'simply too old \u2014 Chudware needs Safari 16.4 or newer.</p>';
      } else if (missing.length) {
        html +=
          '<p>Chudware runs as WebAssembly with a shared-memory worker pool and WebGL2. ' +
          'Use a current Chrome, Edge, Firefox or Safari with those enabled \u2014 or run ' +
          'the desktop app, which needs none of this.</p>';
      } else {
        html +=
          '<p>Chudware needs the <code>Cross-Origin-Opener-Policy</code> and ' +
          '<code>Cross-Origin-Embedder-Policy</code> headers this server sends. Something ' +
          'between you and it removed them \u2014 usually a corporate proxy or a browser ' +
          'extension. Try a different network, or a private window with extensions off.</p>';
      }
      html += '<p class="dim">Desktop builds: <a href="/#downloads">chudware.com downloads' +
              '</a>.</p>';

      var panel = document.getElementById('unsupported');
      var body = document.getElementById('unsupported-body');
      if (body) body.innerHTML = html;
      if (panel) panel.className = 'visible';
      if (statusEl) statusEl.style.display = 'none';
      var c = document.getElementById('canvas');
      if (c) c.style.display = 'none';
      var hud = document.getElementById('mobile-hud');
      if (hud) hud.style.display = 'none';
    })();
    // ---- DPR-aware canvas sizing helpers ----------------------------------------
    function syncCanvasBackingStore(c) {
      if (!c) return;
      try {
        var r = c.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        var w = Math.max(64, Math.floor(r.width * dpr));
        var h = Math.max(64, Math.floor(r.height * dpr));
        if (c.width !== w) c.width = w;
        if (c.height !== h) c.height = h;
      } catch (e) {}
    }

    // ---- Touch → pointer bridge for ImGui (single finger = left click/drag) ----
    // Multitouch (2+ fingers) is handled natively in app.cpp; we only synthesize
    // mouse-like pointer events for the single-finger case so ImGui receives input.
    (function installTouchBridge() {
      var canvas = document.getElementById('canvas');
      if (!canvas) return;
      var activeId = null;
      var lastX = 0, lastY = 0;
      var multi = false;

      function clientToCanvas(t) {
        var r = canvas.getBoundingClientRect();
        return {
          x: t.clientX - r.left,
          y: t.clientY - r.top,
          clientX: t.clientX,
          clientY: t.clientY
        };
      }
      function fire(type, x, y, clientX, clientY, buttons) {
        // Prefer PointerEvent so ImGui_ImplGlfw (pointer path) sees it; fall back to MouseEvent.
        var opts = {
          bubbles: true,
          cancelable: true,
          view: window,
          clientX: clientX,
          clientY: clientY,
          screenX: clientX,
          screenY: clientY,
          button: 0,
          buttons: buttons,
          pointerId: 1,
          pointerType: 'touch',
          isPrimary: true,
          width: 1,
          height: 1,
          pressure: buttons ? 0.5 : 0
        };
        try {
          if (typeof PointerEvent === 'function') {
            canvas.dispatchEvent(new PointerEvent(type, opts));
            return;
          }
        } catch (e) {}
        var mtype = type === 'pointerdown' ? 'mousedown'
                  : type === 'pointerup' || type === 'pointercancel' ? 'mouseup'
                  : 'mousemove';
        try {
          canvas.dispatchEvent(new MouseEvent(mtype, opts));
        } catch (e2) {}
      }

      canvas.addEventListener('touchstart', function(ev) {
        if (ev.touches.length >= 2) {
          // Hand multitouch to C++ (gesture); cancel any single-finger synthetic press.
          multi = true;
          if (activeId !== null) {
            fire('pointerup', lastX, lastY, lastX, lastY, 0);
            activeId = null;
          }
          // Still preventDefault so the page doesn't scroll/zoom under us.
          if (ev.cancelable) ev.preventDefault();
          return;
        }
        multi = false;
        var t = ev.changedTouches[0];
        activeId = t.identifier;
        var p = clientToCanvas(t);
        lastX = p.clientX; lastY = p.clientY;
        canvas.focus();
        fire('pointerdown', p.x, p.y, p.clientX, p.clientY, 1);
        if (ev.cancelable) ev.preventDefault();
      }, { passive: false });

      canvas.addEventListener('touchmove', function(ev) {
        if (multi || ev.touches.length >= 2) {
          multi = true;
          if (ev.cancelable) ev.preventDefault();
          return;
        }
        if (activeId === null) return;
        var t = null;
        for (var i = 0; i < ev.changedTouches.length; ++i) {
          if (ev.changedTouches[i].identifier === activeId) { t = ev.changedTouches[i]; break; }
        }
        if (!t) return;
        var p = clientToCanvas(t);
        lastX = p.clientX; lastY = p.clientY;
        fire('pointermove', p.x, p.y, p.clientX, p.clientY, 1);
        if (ev.cancelable) ev.preventDefault();
      }, { passive: false });

      function endTouch(ev) {
        if (ev.touches && ev.touches.length >= 2) {
          multi = true;
          if (ev.cancelable) ev.preventDefault();
          return;
        }
        if (activeId === null) {
          // Leaving multitouch back to zero fingers — just clear multi flag.
          if (!ev.touches || ev.touches.length === 0) multi = false;
          if (ev.cancelable) ev.preventDefault();
          return;
        }
        var t = null;
        for (var i = 0; i < ev.changedTouches.length; ++i) {
          if (ev.changedTouches[i].identifier === activeId) { t = ev.changedTouches[i]; break; }
        }
        if (!t) {
          // Another finger ended; if no fingers left, cancel synthetic press.
          if (!ev.touches || ev.touches.length === 0) {
            fire('pointerup', lastX, lastY, lastX, lastY, 0);
            activeId = null;
            multi = false;
          }
          if (ev.cancelable) ev.preventDefault();
          return;
        }
        var p = clientToCanvas(t);
        fire('pointerup', p.x, p.y, p.clientX, p.clientY, 0);
        activeId = null;
        multi = (ev.touches && ev.touches.length >= 2);
        if (ev.cancelable) ev.preventDefault();
      }
      canvas.addEventListener('touchend', endTouch, { passive: false });
      canvas.addEventListener('touchcancel', endTouch, { passive: false });
    })();

    // ---- Mobile HUD → WASM ccall -------------------------------------------------
    function callChudware(name, sig, args) {
      try {
        if (typeof Module !== 'undefined' && typeof Module.ccall === 'function') {
          return Module.ccall(name, null, sig || [], args || []);
        }
        // Fallback: direct underscore export (KEEPALIVE symbols).
        var fn = (typeof Module !== 'undefined') ? Module['_' + name] : null;
        if (typeof fn === 'function') return fn.apply(null, args || []);
      } catch (e) {
        chudwareLog('err', 'hud call ' + name + ': ' + e);
      }
      return null;
    }

    (function installHud() {
      var hud = document.getElementById('mobile-hud');
      if (!hud) return;
      function setMode(mode) {
        var orbit = hud.querySelector('[data-cmd="orbit"]');
        var pan = hud.querySelector('[data-cmd="pan"]');
        if (orbit) orbit.classList.toggle('active', mode === 0);
        if (pan) pan.classList.toggle('active', mode === 1);
      }
      // Show HUD on coarse pointer / narrow CSS width (CSS media also gates it).
      function refreshHudVisibility() {
        var narrow = window.matchMedia('(max-width: 900px)').matches;
        var coarse = window.matchMedia('(pointer: coarse)').matches;
        hud.classList.toggle('visible', narrow || coarse);
      }
      refreshHudVisibility();
      window.addEventListener('resize', refreshHudVisibility);
      window.addEventListener('orientationchange', refreshHudVisibility);

      hud.addEventListener('pointerdown', function(ev) {
        // Stop the synthetic events from also hitting the canvas underneath.
        ev.stopPropagation();
      });
      hud.addEventListener('click', function(ev) {
        var btn = ev.target.closest('button[data-cmd]');
        if (!btn) return;
        ev.preventDefault();
        ev.stopPropagation();
        var cmd = btn.getAttribute('data-cmd');
        switch (cmd) {
          case 'orbit':
            callChudware('chudware_mobile_set_drag_mode', ['number'], [0]);
            setMode(0);
            break;
          case 'pan':
            callChudware('chudware_mobile_set_drag_mode', ['number'], [1]);
            setMode(1);
            break;
          case 'zoom_in':
            callChudware('chudware_mobile_zoom_step', ['number'], [1]);
            break;
          case 'zoom_out':
            callChudware('chudware_mobile_zoom_step', ['number'], [-1]);
            break;
          case 'undo':
            callChudware('chudware_mobile_undo', [], []);
            break;
          case 'menu':
            callChudware('chudware_mobile_toggle_menu', [], []);
            break;
        }
      });
    })();

    var Module = {
      // Cache-bust wasm/data fetches so a browser never pairs a fresh Chudware.js with a
      // stale Chudware.wasm/.data (fatal LinkError). __CHUDWARE_VER__ is replaced at stage time
      // (build.sh); the script-src URLs for Chudware.js / coi-serviceworker.js are versioned there too.
      locateFile: function(path, prefix){ return prefix + path + (/\.(wasm|data)$/.test(path) ? "?v=__CHUDWARE_VER__" : ""); },
      // Preflight already decided this browser cannot run the module. Emscripten calls this
      // hook INSTEAD of fetching and instantiating Chudware.wasm itself, so returning here
      // spares an ~12 MB download that could only end in the panel already on screen.
      instantiateWasm: window.__chudwareUnsupported
          ? function() { throw new Error('unsupported browser (see preflight)'); }
          : undefined,
      canvas: (function() {
        var c = document.getElementById('canvas');
        // Size the drawing buffer to CSS × DPR before first GL frame.
        syncCanvasBackingStore(c);
        // Tab-backgrounding (or GPU memory pressure) can drop the WebGL context. preventDefault
        // lets the browser fire 'webglcontextrestored'; without a restore path the app's GL
        // resources (mesh VBOs, shaders, textures) are gone and the viewport stays blank —
        // the classic "came back to the tab and the part isn't rendered" bug.
        c.addEventListener('webglcontextlost', function(e) {
          e.preventDefault();
          setStatus('3D view suspended (tab was in the background)…', true);
          chudwareLog('err', 'webglcontextlost');
        }, false);
        // The WASM renderer cannot recreate its GL objects in place, so reboot the module.
        // Document state + recents live on the server daemon, so the session restores on reload.
        // A sessionStorage counter caps reloads so a permanently-failing GPU can't loop forever.
        c.addEventListener('webglcontextrestored', function() {
          chudwareLog('out', 'webglcontextrestored');
          var n = 0;
          try { n = parseInt(sessionStorage.getItem('chudwareGlReloads') || '0', 10) || 0; } catch (e) {}
          if (n >= 3) {
            setStatus('3D context keeps dropping — reload the page to continue.', true);
            return;
          }
          try { sessionStorage.setItem('chudwareGlReloads', String(n + 1)); } catch (e) {}
          setStatus('Restoring 3D view…');
          location.reload();
        }, false);
        return c;
      })(),
      print: function(text) {
        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
        chudwareLog('out', text);
      },
      printErr: function(text) {
        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
        chudwareLog('err', text);
      },
      setStatus: function(text) {
        if (!text) { setStatus('Running'); return; }
        setStatus(text);
      },
      monitorRunDependencies: function(left) {
        if (left > 0) setStatus('Loading… (' + left + ' remaining)');
      },
      onAbort: function(what) {
        setStatus('Aborted: ' + what, true);
        chudwareLog('err', 'abort: ' + what);
      },
      preRun: [function() { chudwareLog('out', 'preRun'); }],
      postRun: [function() { chudwareLog('out', 'postRun'); }],
      onRuntimeInitialized: function() {
        setStatus('Runtime ready');
        chudwareLog('out', 'onRuntimeInitialized');
        var c = document.getElementById('canvas');
        if (c) {
          syncCanvasBackingStore(c);
          c.focus();
        }
        // Cleared once the module has run healthily for a while, so an occasional
        // context loss later still gets its full reload budget.
        setTimeout(function() {
          try { sessionStorage.removeItem('chudwareGlReloads'); } catch (e) {}
        }, 30000);
      }
    };
    window.onerror = function(msg) {
      setStatus('Exception: ' + msg, true);
      chudwareLog('err', String(msg));
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
