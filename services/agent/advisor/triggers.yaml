  # Mirrored verbatim in advisor/triggers.py `_BUILTIN_TRIGGERS` (id: reveng_flow) — the
  # no-PyYAML fallback table. Change one, change the other; tools must match the context pack.
  - id: reveng_flow
    match:
      keywords:
        - "reverse[ -]?engineer"
        - "\\bscan\\b.*\\b(part|bracket|housing|component|to cad)\\b"
        - "\\bpoint cloud\\b"
        - "\\bmesh\\b.*\\b(part|model)"
        - "\\bphotogrammetry\\b"
        - "\\bwebcam\\b"
        - "\\bcaliper\\b"
        - "\\bcalipers\\b"
        - "\\breplacement part\\b"
        - "\\bcopy\\b.*\\b(part|bracket)\\b"
        # Bare "3d print" is NOT reverse engineering — printing is an OUTPUT of this
        # flow. Live 2026-07-30 (run-4530697933837): "fabricated with a 3D printer
        # plus Shapeoko CNC" pulled 250 tokens of scan/point-cloud/caliper guidance
        # into a from-scratch enclosure design. Require a replicate verb alongside,
        # like the neighbouring co-occurrence keys.
        - "\\b(scan|copy|replicate|duplicate|replacement|reproduce)\\b.*3d print"
        - "3d print.*\\b(scan|copy|replica|replacement|existing)\\b"
        - "\\bSTEP\\b.*\\bimport|import.*\\bSTEP\\b"
        # A generic electronics datasheet is not reverse-engineering context.
        # Require geometric extraction language in either order.
        - "\\bdatasheet\\b.*\\b(dimensions?|drawing|geometry|profile|outline)\\b"
        - "\\b(dimensions?|drawing|geometry|profile|outline)\\b.*\\bdatasheet\\b"
      tools:
        - reverse_engineer
        - compare_parts
        - reveng_status
        - reveng_start_session
        - reveng_add_images
        - reveng_ingest_datasheet
        - reveng_reconstruct
        - reveng_set_scale
        - reveng_fit_primitives
        - reveng_build_parametric
        - get_reveng_deviation
        - reveng_attach_result
      events: []
    inject:
      context_pack: reveng_flow
      prerun_calcs: []
      exemplar: "Lane A (file/doc_id): reverse_engineer -> compare_parts loop. Lane B (physical part): reveng_status -> reveng_start_session -> capture -> reveng_reconstruct -> reveng_set_scale [scale gate] -> reveng_fit_primitives -> [dim gate] -> reveng_build_parametric (reveng_flow pack)"
    budget_tokens: 250
    cooldown_turns: 8

  - id: plm_flow
