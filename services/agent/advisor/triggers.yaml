        - plm_rollback
        - plm_status
        - plm_set_ai_mode
      events: []
    inject:
      context_pack: plm_flow
      prerun_calcs: []
      exemplar: "Checkpoint before risk; where_used before release; history->restore for recovery (plm_flow pack)"
    budget_tokens: 200
    cooldown_turns: 10
