      keywords:
        - "\\bpress[ -]?fit\\b"
        - "\\binterference fit\\b"
        - "\\bknurled\\b"
        - "\\bpressed in\\b"
        - "\\bforced fit\\b"
      tools: []
      events: []
    inject:
      context_pack: press_fit
      prerun_calcs:
        - calc: fit_calc
          inputs_from: literal
          input_map:
            nominal: null
            fit: "H7/p6"
      exemplar: "H7/p6 on dia 20: min interference 0.017 mm, max 0.042 mm (ISO 286, fit_calc)"
    budget_tokens: 250
    cooldown_turns: 8

  - id: snap_fit_mention
    match:
      keywords:
        - "\\bsnap[ -]?fit\\b"
        - "\\bcantilever (?:hook|latch)\\b"
        - "\\bsnap hook\\b"
        - "\\bsnap arm\\b"
      tools: []
      events: []
    inject:
      context_pack: snap_fit
      prerun_calcs: []
      exemplar: "ABS cantilever: eps_allow ~= 0.6x(yield/E); viable if eps_root <= eps_allow (snap_fit calc)"
    budget_tokens: 250
    cooldown_turns: 8

  - id: thin_wall
    match:
      keywords:
        - "\\bthin wall\\b"
        - "\\bthin-wall\\b"
        - "\\bwall thickness\\b"
        - "\\bminimum wall\\b"
      tools:
        - wall_thickness
      events:
        - thin_wall        # geometry event: wall_thickness check flagged a wall < 2 mm
    inject:
      context_pack: thin_wall
      prerun_calcs: []
      exemplar: "FDM: min wall 1.2 mm; SLA: 0.6 mm; CNC: depends on tool; source: wall_thickness.py"
    budget_tokens: 200
    cooldown_turns: 6

  - id: fastener_pattern
    match:
      keywords:
        - "\\bbolt circle\\b"
        - "\\bbolt pattern\\b"
        - "\\bscrew pattern\\b"
        - "\\bfastener pattern\\b"
        - "\\bPCD\\b"
        - "\\bflange bolt\\b"
        - "\\bclearance hole\\b"
        - "\\bcountersink\\b"
        - "\\bcounterbore\\b"
