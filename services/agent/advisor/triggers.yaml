  # Pre-op advisory injection triggers (append-only)
  # These inject context BEFORE the model operates on geometry, so relevant
  # process/clearance facts are in context when the op executes.

  - id: interference_pre_op
    match:
      keywords:
        - "\\bassemble\\b"
        - "\\bcheck interference\\b"
        - "\\boverlap\\b"
        - "\\b(?:place|mount|mate)\\b(?:\\s+\\w+){0,3}\\s+\\b(?:part|component|body|board|assembly)\\b"
      tools:
        - part_place
        - solve_mates
        - check_interference
      events:
        - assembly_body_added
    inject:
      context_pack: interference_pre_op
      prerun_calcs: []
      exemplar: "After placing bodies run check_interference; interference > 0 mm3 is a blocker (advisor names axis + depth)"
    budget_tokens: 200
    cooldown_turns: 6

  - id: dfm_pre_op
    match:
      keywords:
        - "\\bmanufactur(?:e|ed|ing|ability|able)\\b"
        - "\\bDFM\\b"
        - "\\bdesign for manufacturability\\b"
        - "\\b3D print(?:er|ing|ed)?\\b"
        - "\\bCNC machin(?:e|ed|ing)\\b"
        - "\\binjection mold(?:ed|ing)?\\b"
      tools:
        - set_process
        - dfm_check
        - wall_thickness
        - resolve_process
      events: []
    inject:
      context_pack: dfm_pre_op
      prerun_calcs: []
      exemplar: "Run dfm_check before export; wall < process minimum and missing draft are blockers (advisor names delta + fix)"
    budget_tokens: 200
    cooldown_turns: 8

  - id: interface_check_pre_op
    match:
      keywords:
        - "\\bhole pattern\\b"
        - "\\bbolt holes\\b"
        - "\\bcoaxial\\b"
        - "\\bcontact (?:face|plane)\\b"
        - "\\bpass[ -]through\\b"
        - "\\b(?:align|mate)\\b(?:\\s+\\w+){0,3}\\s+\\b(?:part|component|face|axis|pattern)\\b"
      tools:
        - interface_check
        - part_place
        - solve_mates
      events: []
    inject:
      context_pack: interface_check_pre_op
      prerun_calcs: []
      exemplar: "interface_check catches hole-pattern offset, coaxiality error, contact-plane gap - all pass interference but are still wrong"
    budget_tokens: 200
    cooldown_turns: 8

  # Sheet-metal bend — contract design_pipeline.md §8 "helper to add".
  # Fires the bend_allowance calc so a folded flange's flat length is computed,
  # never recalled. Numbers: services/research/calcs/bend_allowance.py.
  - id: sheet_bend
    match:
      keywords:
        - "\\bbend allowance\\b"
        - "\\bbend deduction\\b"
        - "\\bsheet metal\\b"
        - "\\bsheet-metal\\b"
        - "\\bflat pattern\\b"
        - "\\bK[ -]?factor\\b"
        - "\\bbend radius\\b"
        - "\\bpress brake\\b"
      tools:
        - bend_allowance
      events: []
    inject:
      context_pack: sheet_bend
      prerun_calcs:
        - calc: bend_allowance
          inputs_from: literal
          input_map:
            thickness_mm: null    # advertise as helper; caller supplies live t/r
            inside_radius_mm: null
      exemplar: "t=2, r=2, 90 deg bend: BA=4.24 mm, BD=3.76 mm, K=0.35 (bend_allowance calc; Machinery's Handbook)"
    budget_tokens: 250
    cooldown_turns: 8

  # Molded draft — contract design_pipeline.md §8 "helper to add".
  # Fires the draft_check calc so a molded wall gets a mandatory release draft
  # sized to its draw depth. Numbers: process_profiles.py injection + draft_check.py.
  - id: molded_draft
    match:
      keywords:
