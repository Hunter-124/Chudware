# Harness effort presets — aicad.effort/1  (T-W28)
#
# Contract: contracts/advisor.md §8 (tier profiles) + 1.3 addendum (deliberation
# dial) + §8.1 effort addendum (this file's schema, documented in the 1.4→1.5
# additive bump recorded in contracts/advisor.md).
#
# WHAT THIS FILE IS
# -----------------
# The four named "AI Effort" levels shown in the settings GUI's Simple mode:
# each preset is a set of knob OVERRIDES applied on top of the SHIPPED BASELINE.
# The baseline itself is NOT duplicated here — it is derived at load time by
# services/agent/effort.py from the existing sources of truth:
#
#   tiers.yaml            deliberation, advisory_verbosity, budgets.history,
#                         context_tokens, generation_headroom (per tier)
#   ladder.py             MAX_BOUNCES = 2; ladder mandatory at deliberation=full,
#                         optional at minimal (module docstring rule)
#   councils.py           4 seats (council_seats.yaml), feature threshold 5,
#                         seat budgets: round-1 max_tokens=1500, round-2/dissent
#                         max_tokens=600
#   delegation.py         DEPTH_CAP = 3 (contract §12 hard cap); no shipped
#                         fan-out cap (0 = uncapped)
#   advisor/failures.py   _DEFAULT_BUDGETS per-class max_attempts (3/3/3/3/3/2/3/2)
#   advisor/overseer.py   audits fire at every §11 trigger point (debounced)
#   advisor/triggers.py   builtin trigger packs active, per-trigger cooldowns
#
# NUMBERS PROVENANCE: every value in this file is either an enum choice, a
# structural value (0 = uncapped, 1 = direct children only), or a number reused
# from the shipped constants listed above. Nothing here is invented.
#
# PRECEDENCE (resolved by services/agent/effort.py — the ONE resolution path,
# used by the mission pipeline, the design gym, and the GUI alike):
#   shipped baseline  <  preset.overrides.all  <  preset.overrides.<tier>  <
#   user overrides (config.json "ai_effort".overrides.<tier>)
#
# FREEDOM RULE: presets and user overrides are never clamped or blocked; absurd
# combinations produce warnings (effort.warnings_for) that say WHY, mirroring
# the routing editor's warn-never-block pattern.

schema: aicad.effort/1

presets:
  eco:
    label: Eco
    hint: "Fewest tokens: councils and trigger packs off, shallow delegation, compact context. Fastest and cheapest; less double-checking."
    overrides:
      all:
        deliberation: minimal        # dial floor (tiers.yaml enum)
        ladder: optional             # ladder.py: optional at minimal
        council: "off"
        trigger_injection: false
        context_pack_verbosity: compact   # tiers.yaml advisory_verbosity enum
        overseer_cadence: stage_exit_only
        delegation_depth: 1          # structural: orchestrator's direct children only

  standard:
    label: Standard
    hint: "Shipped defaults: full machinery on local models (their tokens are free), lean spending on paid frontier models."
    # Identity preset — the INVERTED dial from tiers.yaml is preserved untouched
    # (local = full machinery, frontier = minimal).
    overrides: {}

  deliberate:
    label: Deliberate
    hint: "More double-checking everywhere: cognition ladder and councils always on, even on paid models. Slower and costlier, more rigorous."
    overrides:
      all:
        ladder: mandatory
        council: always
      mid:
        deliberation: full           # raise mid from shipped 'standard'
      frontier:
        deliberation: standard       # raise frontier from shipped 'minimal'

  maximum:
    label: Maximum
    hint: "Everything on at full budgets on every tier, paid or not. Highest cost and latency, maximum rigor."
    overrides:
      all:
        deliberation: full
        ladder: mandatory
        council: always
        trigger_injection: true
        context_pack_verbosity: full
        overseer_cadence: every_trigger
        delegation_depth: 3          # contract §12 DEPTH_CAP (shipped hard cap)
        # Round-2 seats get the round-1 budget (1500 is the shipped round-1
        # max_tokens from councils.py; reused, not invented).
        ponder_round2_tokens: 1500
