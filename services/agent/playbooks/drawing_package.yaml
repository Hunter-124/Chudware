schema: aicad.playbook/1
id: drawing_package
stage: deliver
# Owning role: drawing_detailer. Helper tools ⊆ drawing_detailer.tool_allowlist.
steps:
  - id: coverage_plan
    goal: project the manufacturing plan into the canonical audit spec, then map every critical row to a planned on-sheet annotation
    helper_tools: [mfg_plan_get]
    checklist:
      - when a plan exists, mfg_plan_get(view="audit_spec") supplies the unchanged audit_drawing specification
      - without a plan, each critical ledger row records spec_dimension, value, tolerance and source
      - annotation_id starts null and must resolve before release
      - absent source value or geometry is blocking, never guessed
    output:
      type: object
      required: [coverage_matrix]
  - id: sheet_and_views
    goal: create the sheet with model_items=false and place the views needed by the per-feature plan
    helper_tools: [make_drawing, add_drawing_view, add_section_view]
    checklist:
      - automatic model_items disabled for shop drawings
      - base view first, then projected orthographics
      - sections expose every hidden bore, thread, pocket or weld named by the spec
      - lower-frequency view/detail controls loaded through enable_tools(categories=["drawing"]) when needed
    output:
      type: object
      required: [drawing_id, views]
  - id: dimensions_and_callouts
    goal: resolve every coverage row with a semantic, toleranced on-sheet annotation
    helper_tools: [add_dimension, add_hole_callout, add_gdt, add_datum, add_surface_finish, add_weld_symbol]
    checklist:
      - every size dimension carries the ledger tolerance at creation
      - threads and blind/counterbored/countersunk holes use semantic hole callouts
      - datum and GD&T references are valid; finishes and welds match process requirements
      - heat treat, coating, deburr and inspection notes are represented on-sheet
      - wrong callouts patched/deleted by annotation id after loading edit_drawing_annotation through enable_tools(categories=["drawing"])
      - no critical coverage row retains annotation_id null
    output:
      type: object
      required: [annotations, coverage_matrix]
  - id: titleblock
    goal: fill the controlled manufacturing title block and resolve any source-material mismatch
    helper_tools: [set_titleblock, review_drawing]
    checklist:
      - title block carries title, drawn_by, date, material, finish, scale, rev, sheet, part_number and company
      - source model material and printed material agree
    output:
      type: object
      required: [title_block]
  - id: review_audit_export
    goal: clear current layout warnings, pass the specification coverage audit, then export
    helper_tools: [review_drawing, set_titleblock, mfg_plan_get, audit_drawing, export_drawing]
    checklist:
      - review_drawing performed after the final sheet mutation and attached pixels inspected
      - no overlap, off-sheet, missing-title-field or material warning remains
      - when a plan exists, audit_drawing spec is the unchanged mfg_plan_get(view="audit_spec") projection
      - without a plan, audit_drawing uses the ledger-derived specification after the current review
      - audit verdict is release_ready and missing_critical is empty
      - export runs only after that current release_ready verdict
    output:
      type: object
      required: [export_artifact, audit_verdict, coverage_matrix]
exit_gate: [views_cover_spec, critical_rows_resolved, final_review_clean, audit_release_ready, export_or_blocked_summary]
