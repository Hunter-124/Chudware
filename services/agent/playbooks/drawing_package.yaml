schema: aicad.playbook/1
id: drawing_package
stage: deliver
# Owning role: drawing_detailer. Helper tools ⊆ drawing_detailer.tool_allowlist.
steps:
  - id: read_brief
    goal: read the brief and acceptance criteria; measure every critical size from the part BEFORE placing anything
    helper_tools: [measure_part]
    checklist:
      - acceptance criteria named from injected ledger context, not memory
      - entity ids come from injected part description; critical sizes confirmed by measure_part
    output:
      type: object
      required: [criteria, critical_dims]
  - id: sheet_and_views
    goal: create the sheet and place views in order — base, projected, then section/detail only where needed
    helper_tools: [make_drawing, add_drawing_view, add_section_view, add_detail_view]
    checklist:
      - base view first, then projected orthographics
      - section/detail only where a hidden feature or tight zone needs them
      - view set covers every feature the criteria name before dimensioning starts
    output:
      type: object
      required: [drawing_id, views]
  - id: dimension_and_callouts
    goal: dimension from measured values only; fix annotations in place; add GD&T and finish where required
    helper_tools: [add_dimension, edit_drawing_annotation, add_gdt, add_datum, add_surface_finish, set_view]
    checklist:
      - every dimension traceable to a measurement, the ledger, or an explicit user answer
      - functional/manufacturing dims preferred over redundant chains
      - wrong callouts patched/deleted by id, never left behind or worked around in prose
      - no decoration; incomplete geometry → blocked with the missing feature named
    output:
      type: object
      required: [annotations]
  - id: titleblock
    goal: fill the manufacturing title block and resolve any source-material mismatch
    helper_tools: [set_titleblock, review_drawing]
    checklist:
      - title block carries title, part number, rev, material, scale and finish
      - source model material and printed material agree
    output:
      type: object
      required: [title_block]
  - id: final_review_and_export
    goal: review after the final mutation, clear every visual/structured warning, then export
    helper_tools: [review_drawing, set_view, edit_drawing_annotation, set_titleblock, export_drawing]
    checklist:
      - attached pixels inspected after the last sheet mutation
      - no overlap, off-sheet, missing-title-field or material warning remains
      - export runs only after that clean current review
    output:
      type: object
      required: [export_artifact, review_clean]
exit_gate: [views_cover_criteria, dims_from_measurements, final_review_clean, export_or_summary]
