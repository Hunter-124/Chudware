schema: aicad.playbook/1
id: sim_study
stage: sim
# Owning role: sim_engineer. Helper tools ⊆ sim_engineer.tool_allowlist.
steps:
  - id: define_case
    goal: state the criterion, one load/excitation case, units, and pass rule
    helper_tools: [ledger_get, research_material_lookup]
    checklist:
      - material/fluid and every input unit stated
      - solver material chosen through material=; set_material not used for properties
    output:
      type: object
      required: [criterion_id, setup_summary]
  - id: anchor
    goal: record a justified independent order-of-magnitude anchor before seeing solver output
    helper_tools: [research_eng_calc, measure_part]
    checklist:
      - anchor and assumptions recorded, or "no anchor" recorded honestly
      - no pressure-to-force conversion without a measured loaded area
    output:
      type: object
      required: [anchor]
  - id: setup
    goal: match the actual tool schema and confirm every geometry reference
    helper_tools: [query_geometry, describe_part, em_status, ledger_note]
    checklist:
      - static/fatigue have mounted faces and non-zero force N or pressure MPa
      - buckling has one mount and one inward axial force N; no pressure/shear/tension
      - free-free modal uses fixtures=[] intentionally and expects six rigid modes
      - thermal/vibration/CFD/motion/EM use their excitation fields and units, not fake fixtures/loads
      - requested external backend capability checked; unavailable means SKIP
    output:
      type: object
      required: [setup_summary]
  - id: run_refine_read
    goal: run a cheap pass and a refinement, then read only completed/converged envelopes
    helper_tools: [run_fea_static, run_fea_modal, run_fea_fatigue, run_fea_frequency_response, run_fea_thermal, run_fea_buckling, run_fea_contact, run_cfd_flow, run_cfd_accurate, simulate_motion, em_eigenmode, em_driven, em_timedomain, describe_results]
    checklist:
      - one case per study; solver/backend and discretization reported
      - ok:false, skipped, failed/cancelled, converged:false, random.ok:false, and verdict:null not called PASS
      - governing value changes <10% on refinement, or independent anchor supports its order of magnitude
      - proxy/analytic-only tool limitations stated
    output:
      type: object
      required: [studies]
  - id: verdict
    goal: verdict per criterion with evidence, allowable margin, and actionable location
    helper_tools: [struct_analyze, ledger_note]
    checklist:
      - margin=yield/SF-stress; exceeding allowable is not mislabeled as yielding
      - nominal stress >= yield is yielding; fracture language only at/above ultimate
      - PASS names convergence/anchor evidence; FAIL names the face/feature or response mode
    output:
      type: object
      required: [verdicts]
exit_gate: [anchor_recorded, setup_linted, verdicts_with_margin]
