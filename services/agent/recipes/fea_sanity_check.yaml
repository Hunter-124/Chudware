schema: aicad.recipe/1
id: fea_sanity_check
title: FEA sanity check
domains: [sim]
keywords: [FEA, stress, static, mesh, fixture, anchor]
summary: Define one load case, anchor it, run two real meshes, and report a supported margin.
steps:
  - tool: research_material_lookup
    note: Choose a sourced registry material for the solver material= argument; set_material is appearance only.
  - tool: query_geometry
    note: Resolve the mounted and loaded face queries before solving.
  - tool: research_eng_calc
    note: Record a justified closed-form anchor in MPa/mm, or explicitly record no anchor.
  - tool: run_fea_static
    note: First pass; fixtures react one non-zero load (force N or pressure MPa), mesh_fineness=0.5.
  - tool: run_fea_static
    note: Refinement pass at mesh_fineness=0.75 with the identical setup.
  - tool: describe_results
    note: Compare governing stress/deflection; require <10% change or an independent anchor before PASS.
verify:
  - criterion, units, load case, and material argument recorded
  - result is ok and backend did not skip/fail
  - mesh sizes/element counts and convergence comparison recorded
  - margin uses allowable=yield/SF; no unsupported yielding/fracture claim
