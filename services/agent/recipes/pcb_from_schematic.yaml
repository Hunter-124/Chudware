schema: aicad.recipe/1
id: pcb_from_schematic
title: PCB from schematic
domains: [ecad]
keywords: [schematic, PCB, ERC, DRC, autoroute, net]
summary: Schematic place/wire, ERC, board, route, DRC.
steps:
  - tool: ecad_new_schematic
    note: New schematic doc.
  - tool: ecad_place_symbol
    note: Place verified library symbols; use ecad_find_part when needed.
  - tool: ecad_wire
    note: Connect nets and power before simulation.
  - tool: ecad_run_erc
    note: Fix all schematic errors.
  - tool: board_from_schematic
    note: Create the PCB from the clean schematic.
  - tool: ecad_autoroute
    note: Route, then fill zones or refine manually as needed.
  - tool: ecad_run_drc
    note: Fix all board-rule errors before sign-off.
verify:
  - ERC and DRC clean or blocked with named failures
