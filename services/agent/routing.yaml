schema: aicad.routing/1
# Model source registry — user-configured via the GUI settings.
# This is the ONLY place role->model bindings live. No hardcoded role->model choices
# anywhere else in the codebase (contract section 14; design decision 2026-07-04).
#
# Tiers (capability ranking — data, not code):
#   frontier     — large cloud models (Anthropic, OpenAI flagship)
#   strong       — mid-tier cloud or large local (>=70B)
#   local_large  — large local (>=30B)
#   cheap_local  — small/fast local (<=14B, lmstudio/llamacpp/ollama)
#   local        — small local (alias for cheap_local range)
#   cheap        — smallest/cheapest
#
# Availability: if the first-preference source is offline, the resolver falls
# through to the next entry. If only one source is configured, all roles collapse
# onto it and the delegation tree still functions.
#
# Source kinds (NO consumer-OAuth kinds — Pillar 12):
#   anthropic | openai | openrouter | gemini | xai | lmstudio | llamacpp | ollama | vllm

sources: []  # populated by the user via the settings GUI
  # Example entries (uncomment and fill in):
  # - id: anthropic_api
  #   kind: anthropic
  #   models:
  #     - id: claude-sonnet-4-6
  #       tier: frontier
  #     - id: claude-haiku-4-5
  #       tier: strong
  # - id: local_lmstudio
  #   kind: lmstudio
  #   models:
  #     - id: qwen3-4b
  #       tier: cheap_local

assignments:
  # Role -> ordered preference list. First available (source online, model present) wins.
  # 'strongest'/'cheapest' resolve against configured sources at runtime using the
  # tier ranking (frontier > strong > local_large > cheap_local/local > cheap).
  # 'explicit:<source_id>/<model_id>' pins a specific source+model (delegation engine).
  overseer:               [strongest]
  orchestrator:           [strongest]
  reviewer:               [strong]
  fixer:                  [strong]
  sketcher:               [cheap_local, strong]
  feature_modeler:        [cheap_local, strong]
  cam_programmer:         [cheap_local, strong]
  intake_analyst:         [strong]
  clarifier:              [cheap_local, strong]
  spec_writer:            [cheap_local, strong]
  manufacturing_planner:  [cheap_local, strong]   # 2026-08-26 mfg plan stage
  feature_architect:      [cheap_local, strong]   # design-pipeline Stage 1
  geometry_designer:      [cheap_local, strong]   # design-pipeline Stage 2
  linkage_planner:        [cheap_local, strong]   # design-pipeline Stage 3
  department_manager:     [strongest]
  # Additional roles (additive):
  layout_engineer:        [cheap_local, strong]
  sim_engineer:           [strong, cheap_local]
  assembly_fit_engineer:  [strong, cheap_local]
  design_thinker:         [strong, cheap_local]
  sourcing_specialist:    [cheap_local, strong]
  # RE-ANCHOR(reveng): reverse-engineering agent roles (RE-00/RE-18).
  re_modeler:             [cheap_local, strong]
  re_datasheet_reader:    [strong, cheap_local]
  re_geometry_verifier:   [strong, cheap_local]
  # Advisory / memory / docs + ECAD domain roles.
  advisor:                [strongest]
  memory:                 [cheap_local, strong]
  drawing_detailer:       [cheap_local, strong]
  ecad_engineer:          [strong, cheap_local]
  pcb_engineer:           [strong, cheap_local]
  firmware_engineer:      [strong, cheap_local]
  # 2D/3D split roles.
  sketch2d:               [cheap_local, strong]
  model3d:                [cheap_local, strong]
  # Universal entry surface: general_agent handles EVERY online top-level run and
  # decides inline-vs-delegate-vs-mission, so it must never fall through to the
  # `default` row (cheap_local first) the way an unlisted role does.
  general_agent:          [strongest, strong]
  # Project-admin linear surface (file/PLM organizing — needs solid tool use).
  project_organizer:      [strong, cheap_local]
  default:                [cheap_local, strong]


# Hierarchical delegation rails — no hard depth cap.
# These are advisory soft limits; reaching them emits a warning ledger event
# but the spawn still proceeds. The kill-switch (kill_delegation_tree tool or
# DelegationTree.kill()) is the human-controlled hard stop.
delegation:
  soft_depth_limit: 8   # emit delegation_depth_warning at or beyond this depth
  max_agents: 64        # emit delegation_agent_limit_warning at or beyond this count
