# Tier profiles — aicad.tier/1
# Contract: contracts/advisor.md §8 (tier budgets)
# Spec: docs/design/ADVISOR_ARCHITECTURE.md §2.9
#
# Four profiles: local-24k, local-48k, mid, frontier.
# Budget slots must satisfy: sum(slot budgets) + generation_headroom ≤ context_tokens.
# Slot assembly order follows §9.1: system → ledger → state → advisory → tools → history.
#

schema: aicad.tier/1

# Bundled local-model defaults per role shape, from the local-model throughput and
# grammar benchmark (numbers copied, never re-derived):
#   gbnf_worker: gemma3-4b-qat — 100% schema_to_gbnf grammar compliance,
#                smallest footprint (3086 MB), 332 tok/s aggregate @ N=8.
#   fanout:      qwen3-4b — fastest single-stream (175 tok/s) and best parallel
#                scaler (476 tok/s @ N=8), BUT its GBNF path is broken
#                (thinking-mode vs grammar deadlock, bench GBNF success 0.0) so
#                it must use prompted-JSON + roles.validate_handoff.
#   gemma4-e4b dropped (slower + larger than gemma3-qat, no upside);
#   DiffusionGemma NO-GO on 12 GB (26B-A4B MoE, 16 GB min quant, draft-CLI only).
# parallel_slots: recommended llama-server --parallel on the bundled CUDA
# runtime (smoke test: -np 8 -c 32768 -> ~4.8 GB VRAM, 482 tok/s).
#
# SHIPPED DEFAULTS ONLY. Per-model capability data lives in
# services/agent/model_manager._REGISTRY (structured_output / role_shape);
# actual role->model bindings live in routing.yaml (contract advisor.md §14)
# and user edits there always win (override discipline).
local_models:
  gbnf_worker: gemma3-4b-qat
  fanout: qwen3-4b
  parallel_slots: 8

# Parameterized paid tiers (gym multi-provider benchmark / leaderboard):
#   openrouter:<model-id>  e.g. openrouter:anthropic/claude-opus-4
#   openrouter:openai/gpt-4o
#   xai:<model-id>         e.g. xai:grok-4.5  (or xai:grok-4-5)
# Online provider/model selection is resolved by Chudcode. Explicit offline role
# turns use only local tier/provider mappings. Context budgets reuse the frontier
# profile (see tiers.profile_tier_for). These are NOT listed as static
# profiles below — the model id is the tier parameter.

profiles:
  local-24k:
    # Context: 24576 tokens. Layout per docs/design/ADVISOR_ARCHITECTURE.md §3 (local-24k reference).
    # Budget sum: 2500+800+1500+600+2500+8000 = 15900 slots + 8000 generation = 23900 ≤ 24576 ✓
    context_tokens: 24576
    generation_headroom: 8000
    budgets:
      system:   2500   # role system prompt (authored card; never shrunk)
      ledger:    800   # ledger_render budget (briefing, active dims, decisions)
      state:    1500   # stage state / describer outputs
      advisory:  600   # [ADVISORY] block (render_advisory budget)
      tools:    2500   # tool schema block (trimmed per role allowlist)
      history:  8000   # chat history (shrink-first slot)
    playbook_enforcement: step_locked   # one step per turn, output validated
    structured_output: gbnf             # llama.cpp GBNF grammar via schema_to_gbnf()
    advisory_verbosity: full
    max_tools_per_role: 14
    tool_schema_trim: true  # strip tool descriptions to first sentence
    capability_profile: A   # local: scaffold hard; force grounding + read-back

  local-48k:
    # Context: 49152 tokens.
    # Budget sum: 3000+1200+2000+800+3500+16000 = 26500 slots + 16000 generation = 42500 ≤ 49152 ✓
    context_tokens: 49152
    generation_headroom: 16000
    budgets:
      system:   3000
      ledger:   1200
      state:    2000
      advisory:  800
      tools:    3500
      history: 16000
    playbook_enforcement: step_locked
    structured_output: gbnf
    advisory_verbosity: full
    max_tools_per_role: 14
    tool_schema_trim: true
    capability_profile: A   # local: scaffold hard

  mid:
    # Context: 131072 tokens (128k). Generous — no aggressive trimming needed.
    # Budget sum: 4000+2000+3000+1500+6000+32000 = 48500 slots + 32000 generation = 80500 ≤ 131072 ✓
    context_tokens: 131072
    generation_headroom: 32000
    budgets:
      system:   4000
      ledger:   2000
      state:    3000
      advisory: 1500
      tools:    6000
      history: 32000
    playbook_enforcement: checklist     # full checklist injected; model may batch steps
    structured_output: json_mode        # OpenAI response_format: json_object
    advisory_verbosity: full
    max_tools_per_role: 14
    tool_schema_trim: false
    capability_profile: B               # budget: full tools + soft gates

  frontier:
    # Context: 200000 tokens (200k, e.g. Claude/GPT-4o class).
    # Budget sum: 6000+4000+6000+2000+10000+80000 = 108000 slots + 64000 generation = 172000 ≤ 200000 ✓
    context_tokens: 200000
    generation_headroom: 64000
    budgets:
      system:   6000
      ledger:   4000
      state:    6000
      advisory: 2000
      tools:   10000
      history: 80000
    playbook_enforcement: "off"         # frontier models get the playbook as compact checklist
    structured_output: free             # no grammar constraint; validate_handoff post-parse
    advisory_verbosity: compact
    max_tools_per_role: 14
    tool_schema_trim: false
    capability_profile: C               # frontier: freedom; HARD floors only
