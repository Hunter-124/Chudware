# Argilla self-hosted audit gate — T-H5
#
# Spins up Argilla + its Elasticsearch backend.
# See tools/flywheel/README.md for setup instructions.
#
# HUMAN-GATED: the hosting machine is an Erik-only decision.
# Track the provisioning ask in work/questions/T-H5.md.
#
# Argilla server licence: Apache-2.0 (server process; subprocess isolation applies).
# Argilla client licence: Apache-2.0 (in-process; see contracts/licenses.md row).
#
# Usage:
#   cp tools/flywheel/.env.argilla.example tools/flywheel/.env.argilla
#   # edit .env.argilla and set ARGILLA_API_KEY
#   docker compose -f tools/flywheel/docker-compose.argilla.yml --env-file tools/flywheel/.env.argilla up -d
#
# After start:
#   http://localhost:6900  — Argilla UI (admin / <ARGILLA_API_KEY>)
#
# Load shards:
#   ARGILLA_API_URL=http://localhost:6900 \
#   ARGILLA_API_KEY=<key> \
#   python -c "
#     from pathlib import Path
#     from tools.flywheel.argilla_loader import load_shards_to_argilla
#     shards = list(Path('training/corpus').rglob('shard_*.jsonl'))
#     result = load_shards_to_argilla(shards)
#     print(result)
#   "

version: "3.8"

services:
  argilla:
    image: argilla/argilla-server:v2
    restart: unless-stopped
    ports:
      - "6900:6900"
    environment:
      ARGILLA_HOME_PATH: /var/lib/argilla
      ARGILLA_ELASTICSEARCH: http://elasticsearch:9200
      # Set via .env.argilla — never hardcode keys here
      ARGILLA_AUTH_SECRET_KEY: "${ARGILLA_AUTH_SECRET_KEY:-changeme-in-env-argilla}"
    volumes:
      - argilla-data:/var/lib/argilla
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6900/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  argilla-data:
  elasticsearch-data:
