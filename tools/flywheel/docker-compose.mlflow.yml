# MLflow self-hosted tracking server — T-H6
# Extends tools/flywheel/docker-compose.argilla.yml (same stack, separate compose file).
# HUMAN-GATED: hosting machine is an Erik-only decision.
#
# Usage:
#   docker compose -f tools/flywheel/docker-compose.mlflow.yml up -d
# No host port is published: tracking is container-network-only.
# Shared/host access requires an explicitly configured authenticated TLS ingress.
#
# MLflow server license: Apache-2.0 (subprocess/Docker isolation).
# MLflow client: Apache-2.0 (in-process; see contracts/licenses.md).

version: "3.8"

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    restart: unless-stopped
    environment:
      MLFLOW_BACKEND_STORE_URI: "sqlite:///mlflow/mlflow.db"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "/mlflow/artifacts"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
        --host 0.0.0.0
        --port 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mlflow-data:
