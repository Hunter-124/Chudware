# TRL DPO recipe — offline VLM track leg 2 (T-H10, SCAFFOLD — never runs in CI)
# Preference-tunes the SFT checkpoint on render preference pairs (grounded claim set >
# hallucinated/miscounted claim set). No Unsloth VLM-DPO exists -> TRL DPOTrainer + PEFT
# 4-bit (VLM_OFFLINE_TRACK §2). CRITICAL: set max_length=None or image tokens truncate.
leg: dpo
framework: trl
trainer: DPOTrainer
base_model: <sft_qlora output adapter>
license: Apache-2.0
quantization: 4bit                            # PEFT 4-bit
peft: true
dpo:
  beta: 0.1
  max_length: null                            # REQUIRED for VLMs — else image tokens truncate
  max_prompt_length: null
dataset:
  corpus: training/corpora/vlm/v1
  pairs: preference                           # chosen=grounded claims, rejected=hallucinated/miscounted
  # pairs are synthesizable deterministically from the corpus (perturb a correct claim set)
train:
  epochs: 1
  lr: 5.0e-6
  batch_size: 1
  grad_accum: 8
hardware:
  min_vram_gb: 24
gate:
  precondition: sft_qlora complete AND RECOGNITION_RESIDUAL == GO
  note: "cadrille precedent — online RL (GRPO) > offline DPO given a programmatic reward;
         DPO is the cheaper warm-start, GRPO is the winner leg."
