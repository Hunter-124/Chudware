# Unsloth GRPO recipe — offline VLM track leg 3, THE WINNER LEG (T-H10, SCAFFOLD — never runs in CI)
# Online RL with a DETERMINISTIC render-grounded reward (recipes/reward.py): we know the
# geometry behind every synthetic render, so reward = F1(claims vs known_geometry) minus a
# hallucination penalty — no learned reward model. cadrille/CAD-Coder/ReCAD precedent:
# online GRPO > DPO given a programmatic reward.
leg: grpo
framework: unsloth                            # VLM GRPO/GSPO official since Aug 2025; 4-bit on 24 GB
trainer: GRPOTrainer
base_model: <dpo output adapter>              # or sft adapter directly
license: Apache-2.0
quantization: 4bit
# THE KEY CONSTRAINT (VLM_OFFLINE_TRACK §2): vLLM cannot serve LoRA on vision layers, so the
# vision tower is FROZEN during RL. It was trained in the SFT leg; here only LLM layers move.
finetune_vision_layers: false                 # FROZEN vision tower — non-negotiable for vLLM-accel GRPO
finetune_language_layers: true
vllm_accelerated: true
grpo:
  num_generations: 8
  reward_fn: tools.flywheel.vlm.recipes.reward:render_reward   # deterministic, testable offline
  reward_scale: 1.0
  kl_beta: 0.04
dataset:
  corpus: training/corpora/vlm/v1
  render_in_loop: true                         # GRPO can return an image mid-rollout (TRL multimodal tool)
train:
  max_steps: 500
  lr: 1.0e-6
  batch_size: 1
hardware:
  min_vram_gb: 24                              # DoD: GRPO leg runs on a 24 GB card
  note: "budget for VRAM-creep debugging (unsloth #3864/#3512/#3542) — 4-bit single-GPU LoRA
         VLM-RL is tool-supported but is OUR novelty; all published CAD-RL used multi-GPU full-FT."
gate:
  precondition: sft_qlora complete AND RECOGNITION_RESIDUAL == GO
  kill_switch: "must beat frontier-VLM-via-API per dollar on the frozen bench AND never lose
                to the deterministic/claims-protocol fallback (T-H10 task contract)"
