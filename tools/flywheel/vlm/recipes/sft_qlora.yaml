# QLoRA SFT recipe — offline VLM track leg 1 (T-H10, SCAFFOLD — never runs in CI)
# Trains BOTH vision and LLM LoRA layers on the synthetic corpus (renders/drawings +
# their known_geometry as targets). Vision layers ARE trained here (they are FROZEN only
# later, in the GRPO leg, because vLLM cannot serve vision-layer LoRA).
# Framework: Unsloth (the 24 GB path). Gated by recipes/guard.py.
leg: sft
framework: unsloth
base_model: Qwen/Qwen3-VL-4B-Instruct        # PRIMARY (candidates.py); swap to gguf_repo for serving
license: Apache-2.0
quantization: 4bit                            # QLoRA
finetune_vision_layers: true                  # SFT trains the tower; GRPO freezes it
finetune_language_layers: true
lora:
  r: 16
  alpha: 32
  dropout: 0.05
dataset:
  corpus: training/corpora/vlm/v1             # synthetic, provenance=synthetic, DVC-tracked
  target: known_geometry                      # ground-truth claims the render must produce
  format: coarse_claims_json
train:
  epochs: 2
  lr: 1.0e-4
  batch_size: 2
  grad_accum: 8
  max_seq_len: 2048                            # set max_length=None-equivalent so image tokens survive
hardware:
  min_vram_gb: 16                              # Unsloth 4-bit; comfortable on 24 GB
gate:
  # do NOT start until this is a real measured positive margin:
  precondition: docs/RECOGNITION_RESIDUAL.md "VLM candidate go/no-go" == GO
  success: bench_vlm_f1 > zero_shot_f1 + PRE_REGISTERED_MARGIN
