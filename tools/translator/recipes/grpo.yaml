# TRL GRPO recipe — translator Stage 2 groundedness polish (T-F11, SCAFFOLD — never runs in CI)
# Online RL with a DETERMINISTIC, multi-term, verifiable reward (recipes/../reward.py):
# groundedness + slot coverage + format, minus a hard per-hallucination penalty. No critic,
# no learned reward model (exact, free, unhackable). Gated by recipes/guard.py.
leg: grpo
framework: trl                                 # GRPOTrainer
base_model: <sft winner adapter>               # the harness-picked SFT winner
quantization: 4bit
reward_fn: tools.translator.reward:translator_reward   # deterministic, testable offline
reward_terms: [groundedness, slot_coverage, format]    # multi-term blocks reward-hacking-by-omission
grpo:
  num_generations: 8
  kl_beta: 0.04
  vllm_accelerated: true                       # 2-GPU: vLLM rollouts on card 2
train:
  max_steps: 500
  lr: 1.0e-6
  batch_size: 2
hardware:
  min_vram_gb: 24                              # 4B LoRA GRPO ~18-20 GB — fits one 24 GB card
gate:
  precondition: sft winner passes the Stage-1 ship gates
  success: "groundedness up (unsupported-claim rate down) with NO slot-coverage regression"
  kill_switch: "the translator must BEAT the raw GSL templates on DOWNSTREAM AGENT TASK
                SUCCESS while never losing to them on fidelity; if it doesn't beat templates,
                DON'T SHIP — templates are free. (This win axis is unmeasurable offline; see
                the downstream-task harness spec in docs/RECOGNITION_RESIDUAL.md.)"
