# QLoRA SFT recipe — translator Stage 1 (T-F11, SCAFFOLD — never runs in CI)
# TWO runs (one per candidate); the eval harness picks the winner. Trains a naturalizer on
# (serialized GSL state -> deterministic template caption) pairs: the deterministic teacher
# is the free, correct label source (Snorkel/DryBell distill-the-teacher pattern). Gated by
# recipes/guard.py.
leg: sft
framework: trl                                 # SFTTrainer (+ Unsloth fast path if available)
candidates:                                    # run both; harness picks winner (candidates.py)
  - qwen3_4b                                   # PRIMARY: Qwen3-4B-Instruct-2507 (Apache-2.0)
  - gemma3_4b                                  # parallel: Gemma 3 4B-it (QAT int4)
quantization: 4bit                             # QLoRA
lora:
  r: 32                                        # master plan: r=16-32
  alpha: 64
  dropout: 0.05
dataset:
  factory: tools/gsl_dataset_gen.py            # extend beyond 7 families
  input: gsl-ser/v1 serialization              # tag in every prompt (gsl_ser.SER_VERSION)
  target: deterministic template caption       # gsl_ser.render_caption — the teacher
  mix: {brep: 0.40, sketch: 0.15, ecad: 0.15, cam: 0.15, fea: 0.05, contrastive_correction: 0.10}
  filters:
    - roundtrip_verification                   # gsl_ser.roundtrip_diff == [] (drop lossy states)
    - groundedness_reverify                    # paraphrases re-checked BEFORE entering the set
  oversample: rare_feature_combos              # rare rule branches degrade first under distillation
train:
  epochs: 2                                    # 150-300k pairs ~10-21 h/epoch on one 4090
  lr: 1.0e-4
  batch_size: 4
  grad_accum: 8
  max_seq_len: 4096
hardware: {min_vram_gb: 8}                     # QLoRA r=32 ~3-6 GB
pre_flight:
  - verify_tokenizer_digit_handling            # subword tokenization degrades numeracy (master plan)
gate:
  success: "held-out fidelity >= 0.995 AND coverage >= 0.98 AND unsupported < 0.001
            (tools.translator.eval.harness), and fidelity NON-REGRESSION vs render_caption"
