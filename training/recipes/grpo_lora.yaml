# T-H6 recipe: GRPO with LoRA (TRL GRPOTrainer)
# These are configuration files — they do NOT execute training.
# Pass to runner.py via --recipe flag.
# License: this file is project-internal config (no third-party license applies).
# Dependencies: trl (Apache-2.0), peft (Apache-2.0), unsloth (Apache-2.0) — see contracts/licenses.md
# Note: reward_model seam for T-H9 — set to null until reward model is ready.

method: grpo
trainer: trl.GRPOTrainer

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, v_proj]

training:
  max_steps: 50           # smoke size; override per real job
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  warmup_steps: 5
  fp16: true
  logging_steps: 10
  save_strategy: "no"    # adapter saved by runner, not trainer

grpo:
  reward_model: null      # seam for T-H9 — wire in reward model path when available

unsloth:
  enabled: true           # set false to fall back to plain TRL
  max_seq_length: 2048
  load_in_4bit: true

output:
  # adapter_out comes from the job spec, not here
  push_to_hub: false
