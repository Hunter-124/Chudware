telemetry = false

[install]
minimumReleaseAge = 259200 # 3 days in seconds
minimumReleaseAgeExcludes = ["@oh-my-pi/hashline", "@oh-my-pi/omp-stats", "@oh-my-pi/pi-agent-core", "@oh-my-pi/pi-ai", "@oh-my-pi/pi-catalog", "@oh-my-pi/pi-coding-agent", "@oh-my-pi/pi-mnemopi", "@oh-my-pi/pi-natives", "@oh-my-pi/pi-natives-darwin-arm64", "@oh-my-pi/pi-natives-darwin-x64", "@oh-my-pi/pi-natives-linux-arm64", "@oh-my-pi/pi-natives-linux-x64", "@oh-my-pi/pi-natives-win32-arm64", "@oh-my-pi/pi-natives-win32-x64", "@oh-my-pi/pi-tui", "@oh-my-pi/pi-utils", "@oh-my-pi/pi-wire", "@oh-my-pi/snapcompact", "@types/bun", "bun-types"]
linker = "hoisted"
exact = true
saveTextLockfile = true

[loader]
".md" = "text"
".py" = "text"
".lark" = "text"

[test]
# bun test does NOT honor .gitignore; prune robomp's repo clones and
# scratch dirs so a root-level `bun test` doesn't walk into them.
pathIgnorePatterns = [
  "**/node_modules/**",
  "**/.git/**",
  "**/target/**",
  "**/dist/**",
  "python/**",
  "docs/**",
  "runs/**",
  "python/robomp/data/**",
  ".wt/**",
  ".worktrees/**",
]

[run]
bun = true
